<svg width="960" height="540" viewBox="0 0 960 540" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#064e3b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
  </defs>
  <rect width="960" height="540" rx="28" fill="url(#bg)" />
  <rect x="90" y="110" width="780" height="320" rx="24" fill="#0f172a" fill-opacity="0.75" stroke="#34d399" stroke-opacity="0.35" />
  <text x="120" y="170" fill="#d1fae5" font-size="26" font-family="Arial, sans-serif">课程路线图</text>
  <text x="120" y="210" fill="#a7f3d0" font-size="18" font-family="Arial, sans-serif">目标设定 → 超前设计 → 滞后补偿 → 验算闭环</text>
  <g fill="#6ee7b7" font-size="16" font-family="Arial, sans-serif">
    <text x="120" y="270">1. 确认相角裕度与稳态误差</text>
    <text x="120" y="305">2. 计算所需超前角与参数</text>
    <text x="120" y="340">3. 再补偿低频增益与稳态精度</text>
    <text x="120" y="375">4. Bode / 时域双重验算</text>
  </g>
</svg>
