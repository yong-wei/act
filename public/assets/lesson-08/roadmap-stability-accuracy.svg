<svg width="1200" height="675" viewBox="0 0 1200 675" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f172a" />
      <stop offset="1" stop-color="#1e293b" />
    </linearGradient>
  </defs>
  <rect width="1200" height="675" rx="32" fill="url(#bg)" />

  <text x="80" y="120" fill="#e2e8f0" font-size="36" font-family="Arial" font-weight="bold">课程路线图：稳定性 → 稳态误差</text>
  <text x="80" y="165" fill="#94a3b8" font-size="18" font-family="Arial">先保证系统稳定，再讨论精度与误差</text>

  <rect x="80" y="210" width="500" height="380" rx="22" fill="#0b1220" stroke="#1f2937" />
  <rect x="620" y="210" width="500" height="380" rx="22" fill="#0b1220" stroke="#1f2937" />

  <text x="110" y="260" fill="#38bdf8" font-size="22" font-family="Arial" font-weight="bold">稳定性主线</text>
  <text x="110" y="300" fill="#94a3b8" font-size="16" font-family="Arial">1. 稳定、临界稳定、不稳定概念</text>
  <text x="110" y="335" fill="#94a3b8" font-size="16" font-family="Arial">2. 充要条件：闭环根在左半平面</text>
  <text x="110" y="370" fill="#94a3b8" font-size="16" font-family="Arial">3. 劳斯判据与特殊情况处理</text>
  <text x="110" y="405" fill="#94a3b8" font-size="16" font-family="Arial">4. 参数稳定范围分析</text>

  <text x="650" y="260" fill="#22c55e" font-size="22" font-family="Arial" font-weight="bold">稳态误差主线</text>
  <text x="650" y="300" fill="#94a3b8" font-size="16" font-family="Arial">1. 误差来源：结构 / 输入 / 扰动</text>
  <text x="650" y="335" fill="#94a3b8" font-size="16" font-family="Arial">2. 终值定理求稳态误差</text>
  <text x="650" y="370" fill="#94a3b8" font-size="16" font-family="Arial">3. 系统型别与输入类型关系</text>
  <text x="650" y="405" fill="#94a3b8" font-size="16" font-family="Arial">4. 静态误差系数 Kp / Kv / Ka</text>

  <text x="80" y="620" fill="#64748b" font-size="14" font-family="Arial">提示：稳定性是“底线”，稳态误差是“精度尺度”。</text>
</svg>
