<svg width="1200" height="675" viewBox="0 0 1200 675" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f172a" />
      <stop offset="1" stop-color="#1e293b" />
    </linearGradient>
  </defs>
  <rect width="1200" height="675" rx="32" fill="url(#bg)" />

  <text x="80" y="110" fill="#e2e8f0" font-size="34" font-family="Arial" font-weight="bold">稳态误差计算流程</text>
  <text x="80" y="150" fill="#94a3b8" font-size="18" font-family="Arial">稳定前提 → 求误差传函 → 终值定理</text>

  <rect x="80" y="210" width="1040" height="360" rx="24" fill="#0b1220" stroke="#1f2937" />

  <rect x="140" y="270" width="260" height="120" rx="18" fill="#111827" stroke="#334155" />
  <text x="160" y="320" fill="#38bdf8" font-size="18" font-family="Arial" font-weight="bold">① 判定稳定</text>
  <text x="160" y="350" fill="#94a3b8" font-size="14" font-family="Arial">劳斯判据 / 极点位置</text>

  <rect x="470" y="270" width="260" height="120" rx="18" fill="#111827" stroke="#334155" />
  <text x="490" y="320" fill="#22c55e" font-size="18" font-family="Arial" font-weight="bold">② 求 E(s)</text>
  <text x="490" y="350" fill="#94a3b8" font-size="14" font-family="Arial">误差传递函数</text>

  <rect x="800" y="270" width="260" height="120" rx="18" fill="#111827" stroke="#334155" />
  <text x="820" y="320" fill="#f59e0b" font-size="18" font-family="Arial" font-weight="bold">③ 终值定理</text>
  <text x="820" y="350" fill="#94a3b8" font-size="14" font-family="Arial">e_ss = lim sE(s)</text>

  <line x1="400" y1="330" x2="470" y2="330" stroke="#334155" stroke-width="3" />
  <line x1="730" y1="330" x2="800" y2="330" stroke="#334155" stroke-width="3" />
  <polygon points="460,330 446,322 446,338" fill="#334155" />
  <polygon points="790,330 776,322 776,338" fill="#334155" />

  <text x="140" y="440" fill="#94a3b8" font-size="16" font-family="Arial">误差来源：结构 / 输入信号 / 外部扰动</text>
  <text x="140" y="470" fill="#94a3b8" font-size="16" font-family="Arial">静态误差系数：Kp, Kv, Ka 决定误差大小</text>

  <text x="80" y="620" fill="#64748b" font-size="14" font-family="Arial">提示：稳态误差分析只对稳定系统有意义。</text>
</svg>
