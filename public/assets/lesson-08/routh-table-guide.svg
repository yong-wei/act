<svg width="1200" height="675" viewBox="0 0 1200 675" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f172a" />
      <stop offset="1" stop-color="#1e293b" />
    </linearGradient>
  </defs>
  <rect width="1200" height="675" rx="32" fill="url(#bg)" />

  <text x="80" y="110" fill="#e2e8f0" font-size="34" font-family="Arial" font-weight="bold">劳斯表构造与判别步骤</text>
  <text x="80" y="150" fill="#94a3b8" font-size="18" font-family="Arial">首列同号 → 稳定，变号次数 → 右半平面根数</text>

  <rect x="80" y="210" width="520" height="380" rx="22" fill="#0b1220" stroke="#1f2937" />
  <rect x="650" y="210" width="470" height="380" rx="22" fill="#0b1220" stroke="#1f2937" />

  <text x="110" y="260" fill="#38bdf8" font-size="20" font-family="Arial" font-weight="bold">构造步骤</text>
  <text x="110" y="300" fill="#94a3b8" font-size="16" font-family="Arial">1. 写出特征方程 Δ(s) = 0</text>
  <text x="110" y="335" fill="#94a3b8" font-size="16" font-family="Arial">2. 前两行填入降幂系数</text>
  <text x="110" y="370" fill="#94a3b8" font-size="16" font-family="Arial">3. 按递推公式计算其余行</text>
  <text x="110" y="405" fill="#94a3b8" font-size="16" font-family="Arial">4. 统计首列符号变化</text>
  <text x="110" y="440" fill="#94a3b8" font-size="16" font-family="Arial">5. 特殊情况：0 首项 / 全零行</text>

  <text x="680" y="260" fill="#22c55e" font-size="20" font-family="Arial" font-weight="bold">劳斯表示意</text>

  <rect x="690" y="300" width="430" height="210" rx="16" fill="#111827" stroke="#334155" />
  <line x1="740" y1="300" x2="740" y2="510" stroke="#334155" stroke-width="2" />
  <line x1="860" y1="300" x2="860" y2="510" stroke="#334155" stroke-width="2" />
  <line x1="990" y1="300" x2="990" y2="510" stroke="#334155" stroke-width="2" />
  <line x1="690" y1="350" x2="1120" y2="350" stroke="#334155" stroke-width="2" />
  <line x1="690" y1="400" x2="1120" y2="400" stroke="#334155" stroke-width="2" />
  <line x1="690" y1="450" x2="1120" y2="450" stroke="#334155" stroke-width="2" />

  <text x="705" y="330" fill="#94a3b8" font-size="14" font-family="Arial">s^4</text>
  <text x="770" y="330" fill="#94a3b8" font-size="14" font-family="Arial">a4</text>
  <text x="890" y="330" fill="#94a3b8" font-size="14" font-family="Arial">a2</text>
  <text x="1015" y="330" fill="#94a3b8" font-size="14" font-family="Arial">a0</text>

  <text x="705" y="380" fill="#94a3b8" font-size="14" font-family="Arial">s^3</text>
  <text x="770" y="380" fill="#94a3b8" font-size="14" font-family="Arial">a3</text>
  <text x="890" y="380" fill="#94a3b8" font-size="14" font-family="Arial">a1</text>
  <text x="1015" y="380" fill="#94a3b8" font-size="14" font-family="Arial">0</text>

  <text x="705" y="430" fill="#94a3b8" font-size="14" font-family="Arial">s^2</text>
  <text x="770" y="430" fill="#94a3b8" font-size="14" font-family="Arial">b1</text>
  <text x="890" y="430" fill="#94a3b8" font-size="14" font-family="Arial">b2</text>
  <text x="1015" y="430" fill="#94a3b8" font-size="14" font-family="Arial">0</text>

  <text x="705" y="480" fill="#94a3b8" font-size="14" font-family="Arial">s^1</text>
  <text x="770" y="480" fill="#94a3b8" font-size="14" font-family="Arial">c1</text>
  <text x="890" y="480" fill="#94a3b8" font-size="14" font-family="Arial">0</text>
  <text x="1015" y="480" fill="#94a3b8" font-size="14" font-family="Arial">0</text>

  <text x="80" y="620" fill="#64748b" font-size="14" font-family="Arial">提示：首列出现 0 或全零行时需要按规则处理再判别。</text>
</svg>
