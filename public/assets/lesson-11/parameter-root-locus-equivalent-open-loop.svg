<svg width="1200" height="675" viewBox="0 0 1200 675" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f172a" />
      <stop offset="1" stop-color="#111827" />
    </linearGradient>
  </defs>
  <rect width="1200" height="675" rx="32" fill="url(#bg)" />

  <text x="80" y="120" fill="#e2e8f0" font-size="34" font-family="Arial" font-weight="bold">等效开环变换：参数根轨迹关键一步</text>
  <text x="80" y="165" fill="#94a3b8" font-size="18" font-family="Arial">把参数变化转换成根轨迹标准形式</text>

  <rect x="80" y="230" width="1040" height="360" rx="24" fill="#0b1220" stroke="#1f2937" />

  <text x="120" y="290" fill="#a78bfa" font-size="18" font-family="Arial">步骤 1：写出闭环特征方程</text>
  <text x="120" y="325" fill="#94a3b8" font-size="16" font-family="Arial">Δ(s, p) = 0</text>

  <text x="120" y="380" fill="#a78bfa" font-size="18" font-family="Arial">步骤 2：把参数项整理成乘法形式</text>
  <text x="120" y="415" fill="#94a3b8" font-size="16" font-family="Arial">Δ(s, p) = D(s) + p N(s)</text>

  <text x="120" y="470" fill="#a78bfa" font-size="18" font-family="Arial">步骤 3：改写为根轨迹标准式</text>
  <text x="120" y="505" fill="#94a3b8" font-size="16" font-family="Arial">1 + K_eq G_eq(s) = 0</text>

  <text x="620" y="290" fill="#38bdf8" font-size="18" font-family="Arial">等效开环定义</text>
  <text x="620" y="325" fill="#94a3b8" font-size="16" font-family="Arial">G_eq(s) = N(s) / D(s)</text>
  <text x="620" y="360" fill="#94a3b8" font-size="16" font-family="Arial">K_eq = p 或 f(p)</text>

  <text x="620" y="430" fill="#38bdf8" font-size="18" font-family="Arial">后续任务</text>
  <text x="620" y="465" fill="#94a3b8" font-size="16" font-family="Arial">- 按根轨迹规则确定稳定范围</text>
  <text x="620" y="500" fill="#94a3b8" font-size="16" font-family="Arial">- 读出 K_eq，再映射回参数 p</text>
</svg>
