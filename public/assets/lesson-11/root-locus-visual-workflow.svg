<svg width="1200" height="675" viewBox="0 0 1200 675" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f172a" />
      <stop offset="1" stop-color="#1f2937" />
    </linearGradient>
  </defs>
  <rect width="1200" height="675" rx="32" fill="url(#bg)" />

  <text x="80" y="120" fill="#e2e8f0" font-size="34" font-family="Arial" font-weight="bold">图形化思考 → 仿真验证</text>
  <text x="80" y="165" fill="#94a3b8" font-size="18" font-family="Arial">从根轨迹判断到性能验证的闭环流程</text>

  <rect x="80" y="220" width="1040" height="360" rx="24" fill="#0b1220" stroke="#1f2937" />

  <text x="120" y="280" fill="#38bdf8" font-size="18" font-family="Arial">1. 选择主导极点</text>
  <text x="120" y="312" fill="#94a3b8" font-size="15" font-family="Arial">满足阻尼比与自然频率要求</text>

  <text x="120" y="360" fill="#38bdf8" font-size="18" font-family="Arial">2. 读取 K_eq 并映射参数</text>
  <text x="120" y="392" fill="#94a3b8" font-size="15" font-family="Arial">K_eq → p 的映射决定稳定范围</text>

  <text x="120" y="440" fill="#38bdf8" font-size="18" font-family="Arial">3. Matlab/仿真验证</text>
  <text x="120" y="472" fill="#94a3b8" font-size="15" font-family="Arial">root locus → step response → 性能指标</text>

  <rect x="620" y="270" width="450" height="240" rx="18" fill="#111827" stroke="#1f2937" />
  <text x="650" y="310" fill="#e2e8f0" font-size="14" font-family="Courier New">G = zpk([], poles, K_eq);</text>
  <text x="650" y="340" fill="#e2e8f0" font-size="14" font-family="Courier New">rlocus(G);</text>
  <text x="650" y="370" fill="#e2e8f0" font-size="14" font-family="Courier New">Phi = feedback(G, 1);</text>
  <text x="650" y="400" fill="#e2e8f0" font-size="14" font-family="Courier New">[y,t] = step(Phi, 10);</text>
  <text x="650" y="430" fill="#e2e8f0" font-size="14" font-family="Courier New">plot(t, y);</text>
  <text x="650" y="465" fill="#94a3b8" font-size="13" font-family="Arial">检查超调、调节时间、稳态误差</text>
</svg>
