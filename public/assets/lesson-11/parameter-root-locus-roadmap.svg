<svg width="1200" height="675" viewBox="0 0 1200 675" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f172a" />
      <stop offset="1" stop-color="#1f2937" />
    </linearGradient>
  </defs>
  <rect width="1200" height="675" rx="32" fill="url(#bg)" />

  <text x="80" y="120" fill="#e2e8f0" font-size="36" font-family="Arial" font-weight="bold">课程路线图：参数根轨迹</text>
  <text x="80" y="165" fill="#94a3b8" font-size="18" font-family="Arial">广义定义 → 稳定范围 → 图形化思考</text>

  <rect x="80" y="220" width="500" height="360" rx="22" fill="#0b1220" stroke="#1f2937" />
  <rect x="620" y="220" width="500" height="360" rx="22" fill="#0b1220" stroke="#1f2937" />

  <text x="110" y="270" fill="#a78bfa" font-size="22" font-family="Arial" font-weight="bold">参数根轨迹主线</text>
  <text x="110" y="310" fill="#94a3b8" font-size="16" font-family="Arial">1. 参数 p 的广义定义</text>
  <text x="110" y="345" fill="#94a3b8" font-size="16" font-family="Arial">2. 等效开环传函与增益</text>
  <text x="110" y="380" fill="#94a3b8" font-size="16" font-family="Arial">3. 实轴段、渐近线、分离点</text>
  <text x="110" y="415" fill="#94a3b8" font-size="16" font-family="Arial">4. 虚轴交点与稳定范围</text>
  <text x="110" y="450" fill="#64748b" font-size="14" font-family="Arial">关键词：等效开环 / 稳定边界</text>

  <text x="650" y="270" fill="#38bdf8" font-size="22" font-family="Arial" font-weight="bold">图形化思考主线</text>
  <text x="650" y="310" fill="#94a3b8" font-size="16" font-family="Arial">1. 主导极点选择与阻尼比</text>
  <text x="650" y="345" fill="#94a3b8" font-size="16" font-family="Arial">2. 根轨迹增益到参数映射</text>
  <text x="650" y="380" fill="#94a3b8" font-size="16" font-family="Arial">3. Matlab/仿真验证响应</text>
  <text x="650" y="415" fill="#94a3b8" font-size="16" font-family="Arial">4. 工程约束与鲁棒性</text>
  <text x="650" y="450" fill="#64748b" font-size="14" font-family="Arial">关键词：主导极点 / 性能验证</text>

  <text x="80" y="615" fill="#64748b" font-size="14" font-family="Arial">目标：用根轨迹锁定参数范围，并用图形化流程验证性能。</text>
</svg>
