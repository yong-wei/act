<svg width="1200" height="675" viewBox="0 0 1200 675" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f172a" />
      <stop offset="1" stop-color="#111827" />
    </linearGradient>
  </defs>
  <rect width="1200" height="675" rx="32" fill="url(#bg)" />

  <text x="80" y="120" fill="#e2e8f0" font-size="36" font-family="Arial" font-weight="bold">课程路线图：频率响应 → 伯德图</text>
  <text x="80" y="165" fill="#94a3b8" font-size="18" font-family="Arial">从正弦稳态响应到近似叠加绘图</text>

  <rect x="80" y="210" width="500" height="380" rx="22" fill="#0b1220" stroke="#1f2937" />
  <rect x="620" y="210" width="500" height="380" rx="22" fill="#0b1220" stroke="#1f2937" />

  <text x="110" y="260" fill="#38bdf8" font-size="22" font-family="Arial" font-weight="bold">频率响应主线</text>
  <text x="110" y="300" fill="#94a3b8" font-size="16" font-family="Arial">1. 正弦输入稳态响应</text>
  <text x="110" y="335" fill="#94a3b8" font-size="16" font-family="Arial">2. 幅频/相频特性定义</text>
  <text x="110" y="370" fill="#94a3b8" font-size="16" font-family="Arial">3. 频率特性多视角表示</text>
  <text x="110" y="405" fill="#94a3b8" font-size="16" font-family="Arial">4. 典型环节幅频斜率</text>
  <text x="110" y="440" fill="#64748b" font-size="14" font-family="Arial">关键词：稳态、幅值比、相移</text>

  <text x="650" y="260" fill="#22c55e" font-size="22" font-family="Arial" font-weight="bold">伯德图主线</text>
  <text x="650" y="300" fill="#94a3b8" font-size="16" font-family="Arial">1. 化为尾 1 标准型</text>
  <text x="650" y="335" fill="#94a3b8" font-size="16" font-family="Arial">2. 列出转折频率</text>
  <text x="650" y="370" fill="#94a3b8" font-size="16" font-family="Arial">3. 确定低频特性</text>
  <text x="650" y="405" fill="#94a3b8" font-size="16" font-family="Arial">4. 斜率叠加绘图</text>
  <text x="650" y="440" fill="#94a3b8" font-size="16" font-family="Arial">5. 振荡环节修正</text>

  <text x="80" y="620" fill="#64748b" font-size="14" font-family="Arial">提示：画图之前先确定转折频率与斜率增量。</text>
</svg>
