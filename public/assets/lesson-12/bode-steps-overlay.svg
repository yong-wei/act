<svg width="1200" height="675" viewBox="0 0 1200 675" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f172a" />
      <stop offset="1" stop-color="#111827" />
    </linearGradient>
  </defs>
  <rect width="1200" height="675" rx="32" fill="url(#bg)" />

  <text x="80" y="120" fill="#e2e8f0" font-size="36" font-family="Arial" font-weight="bold">近似叠加：绘制伯德图</text>
  <text x="80" y="165" fill="#94a3b8" font-size="18" font-family="Arial">先拆环节，再叠斜率</text>

  <rect x="80" y="210" width="520" height="380" rx="22" fill="#0b1220" stroke="#1f2937" />
  <rect x="640" y="210" width="480" height="380" rx="22" fill="#0b1220" stroke="#1f2937" />

  <text x="110" y="260" fill="#38bdf8" font-size="20" font-family="Arial" font-weight="bold">绘图步骤</text>
  <text x="110" y="300" fill="#94a3b8" font-size="16" font-family="Arial">1. 化为尾 1 标准型</text>
  <text x="110" y="335" fill="#94a3b8" font-size="16" font-family="Arial">2. 顺序列出转折频率</text>
  <text x="110" y="370" fill="#94a3b8" font-size="16" font-family="Arial">3. 确定低频特性</text>
  <text x="110" y="405" fill="#94a3b8" font-size="16" font-family="Arial">4. 叠加斜率作图</text>
  <text x="110" y="440" fill="#94a3b8" font-size="16" font-family="Arial">5. 振荡环节修正</text>

  <text x="680" y="260" fill="#22c55e" font-size="20" font-family="Arial" font-weight="bold">斜率叠加示意</text>
  <line x1="700" y1="360" x2="1080" y2="360" stroke="#334155" stroke-width="2" />
  <polyline points="700,320 820,320 960,400 1080,440" fill="none" stroke="#f97316" stroke-width="4" />
  <circle cx="820" cy="320" r="6" fill="#38bdf8" />
  <circle cx="960" cy="400" r="6" fill="#38bdf8" />
  <text x="700" y="470" fill="#94a3b8" font-size="14" font-family="Arial">转折频率处斜率发生变化</text>

  <text x="80" y="620" fill="#64748b" font-size="14" font-family="Arial">提示：每个极点/零点在其转折频率后贡献 ±20 dB/dec。</text>
</svg>
