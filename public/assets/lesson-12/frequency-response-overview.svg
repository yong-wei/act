<svg width="1200" height="675" viewBox="0 0 1200 675" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f172a" />
      <stop offset="1" stop-color="#1e293b" />
    </linearGradient>
  </defs>
  <rect width="1200" height="675" rx="32" fill="url(#bg)" />

  <text x="80" y="120" fill="#e2e8f0" font-size="36" font-family="Arial" font-weight="bold">频率响应：正弦稳态的幅值与相位</text>
  <text x="80" y="165" fill="#94a3b8" font-size="18" font-family="Arial">输出对输入的幅值比与相位差随频率变化</text>

  <rect x="80" y="220" width="1040" height="360" rx="24" fill="#0b1220" stroke="#1f2937" />

  <text x="130" y="290" fill="#38bdf8" font-size="20" font-family="Arial" font-weight="bold">定义</text>
  <text x="130" y="330" fill="#94a3b8" font-size="16" font-family="Arial">输入：r(t) = A sin(ωt)</text>
  <text x="130" y="365" fill="#94a3b8" font-size="16" font-family="Arial">稳态输出：c(t) = |G(jω)| A sin(ωt + φ(ω))</text>
  <text x="130" y="400" fill="#94a3b8" font-size="16" font-family="Arial">频率响应：G(jω) = |G(jω)| ∠ φ(ω)</text>

  <text x="680" y="290" fill="#22c55e" font-size="20" font-family="Arial" font-weight="bold">关键量</text>
  <text x="680" y="330" fill="#94a3b8" font-size="16" font-family="Arial">幅频特性：|G(jω)|</text>
  <text x="680" y="365" fill="#94a3b8" font-size="16" font-family="Arial">相频特性：φ(ω)</text>
  <text x="680" y="400" fill="#94a3b8" font-size="16" font-family="Arial">多视角：Bode / Nyquist / Nichols</text>

  <text x="80" y="620" fill="#64748b" font-size="14" font-family="Arial">提示：暂态随时间衰减，频率响应只看稳态部分。</text>
</svg>
