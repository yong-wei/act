<svg width="1200" height="675" viewBox="0 0 1200 675" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f172a" />
      <stop offset="1" stop-color="#1f2937" />
    </linearGradient>
  </defs>
  <rect width="1200" height="675" rx="32" fill="url(#bg)" />

  <text x="80" y="120" fill="#e2e8f0" font-size="36" font-family="Arial" font-weight="bold">课程路线图：校正方法 → 时域综合</text>
  <text x="80" y="165" fill="#94a3b8" font-size="18" font-family="Arial">从控制手段到性能验证的完整闭环</text>

  <rect x="80" y="210" width="500" height="380" rx="22" fill="#0b1220" stroke="#1f2937" />
  <rect x="620" y="210" width="500" height="380" rx="22" fill="#0b1220" stroke="#1f2937" />

  <text x="110" y="260" fill="#38bdf8" font-size="22" font-family="Arial" font-weight="bold">校正手段主线</text>
  <text x="110" y="300" fill="#94a3b8" font-size="16" font-family="Arial">1. 串联校正：比例-微分控制 (PD)</text>
  <text x="110" y="335" fill="#94a3b8" font-size="16" font-family="Arial">2. 输出微分反馈：测速反馈增阻尼</text>
  <text x="110" y="370" fill="#94a3b8" font-size="16" font-family="Arial">3. 前馈补偿：提高稳态精度</text>
  <text x="110" y="405" fill="#94a3b8" font-size="16" font-family="Arial">4. 扰动补偿：削弱外部扰动影响</text>
  <text x="110" y="440" fill="#64748b" font-size="14" font-family="Arial">关键词：增大阻尼 / 零点 / 精度</text>

  <text x="650" y="260" fill="#22c55e" font-size="22" font-family="Arial" font-weight="bold">时域综合主线</text>
  <text x="650" y="300" fill="#94a3b8" font-size="16" font-family="Arial">1. 建模与简化：航向系统 G1/G2</text>
  <text x="650" y="335" fill="#94a3b8" font-size="16" font-family="Arial">2. 稳定范围：0 &lt; K &lt; 28.0469</text>
  <text x="650" y="370" fill="#94a3b8" font-size="16" font-family="Arial">3. 稳态误差：Kv 与斜坡误差</text>
  <text x="650" y="405" fill="#94a3b8" font-size="16" font-family="Arial">4. 扰动分析：阶跃 / 等效正弦</text>
  <text x="650" y="440" fill="#94a3b8" font-size="16" font-family="Arial">5. 性能评估：直角转向 / 回转 / 避障</text>

  <text x="80" y="620" fill="#64748b" font-size="14" font-family="Arial">提示：用校正手段“改结构”，用时域分析“验效果”。</text>
</svg>
