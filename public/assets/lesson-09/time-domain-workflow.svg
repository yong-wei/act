<svg width="1200" height="675" viewBox="0 0 1200 675" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f172a" />
      <stop offset="1" stop-color="#1f2937" />
    </linearGradient>
  </defs>
  <rect width="1200" height="675" rx="32" fill="url(#bg)" />

  <text x="80" y="115" fill="#e2e8f0" font-size="34" font-family="Arial" font-weight="bold">航向系统时域综合流程</text>
  <text x="80" y="155" fill="#94a3b8" font-size="18" font-family="Arial">用稳定性、误差与扰动响应验证校正效果</text>

  <line x1="140" y1="260" x2="1060" y2="260" stroke="#334155" stroke-width="4" />

  <circle cx="160" cy="260" r="18" fill="#38bdf8" />
  <circle cx="410" cy="260" r="18" fill="#22c55e" />
  <circle cx="660" cy="260" r="18" fill="#f97316" />
  <circle cx="910" cy="260" r="18" fill="#e879f9" />

  <text x="110" y="310" fill="#e2e8f0" font-size="18" font-family="Arial" font-weight="bold">模型与简化</text>
  <text x="110" y="335" fill="#94a3b8" font-size="14" font-family="Arial">G1(s)、G2(s) 与增益 K</text>

  <text x="360" y="310" fill="#e2e8f0" font-size="18" font-family="Arial" font-weight="bold">稳定范围</text>
  <text x="360" y="335" fill="#94a3b8" font-size="14" font-family="Arial">0 &lt; K &lt; 28.0469</text>

  <text x="610" y="310" fill="#e2e8f0" font-size="18" font-family="Arial" font-weight="bold">稳态误差</text>
  <text x="610" y="335" fill="#94a3b8" font-size="14" font-family="Arial">Kv 与斜坡误差评估</text>

  <text x="860" y="310" fill="#e2e8f0" font-size="18" font-family="Arial" font-weight="bold">扰动响应</text>
  <text x="860" y="335" fill="#94a3b8" font-size="14" font-family="Arial">阶跃与等效正弦扰动</text>

  <rect x="120" y="380" width="960" height="200" rx="18" fill="#0b1220" stroke="#1f2937" />
  <text x="160" y="430" fill="#94a3b8" font-size="16" font-family="Arial">综合性能验证</text>
  <text x="160" y="465" fill="#e2e8f0" font-size="22" font-family="Arial" font-weight="bold">直角转向 · 回转性能 · 避障性能</text>
  <text x="160" y="505" fill="#64748b" font-size="14" font-family="Arial">用场景化指标检验校正参数是否满足稳、快、准。</text>
</svg>
