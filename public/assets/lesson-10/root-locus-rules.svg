<svg width="1200" height="675" viewBox="0 0 1200 675" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f172a" />
      <stop offset="1" stop-color="#111827" />
    </linearGradient>
  </defs>
  <rect width="1200" height="675" rx="32" fill="url(#bg)" />

  <text x="80" y="120" fill="#e2e8f0" font-size="36" font-family="Arial" font-weight="bold">根轨迹基本法则</text>
  <text x="80" y="165" fill="#94a3b8" font-size="18" font-family="Arial">快速绘制根轨迹的 5 个关键步骤</text>

  <rect x="80" y="220" width="1040" height="380" rx="24" fill="#0b1220" stroke="#1f2937" />

  <text x="120" y="270" fill="#38bdf8" font-size="18" font-family="Arial">1. 分支数 = 开环极点数 n</text>
  <text x="120" y="305" fill="#94a3b8" font-size="16" font-family="Arial">2. 实轴段：右侧极点/零点数为奇数的区间</text>
  <text x="120" y="340" fill="#94a3b8" font-size="16" font-family="Arial">3. 渐近线：数量 = n - m，角度 = (2k+1) * 180deg / (n-m)</text>
  <text x="120" y="375" fill="#94a3b8" font-size="16" font-family="Arial">4. 渐近线中心：sigma_a = (sum(poles) - sum(zeros)) / (n-m)</text>
  <text x="120" y="410" fill="#94a3b8" font-size="16" font-family="Arial">5. 分离点：dK/ds = 0 且点在根轨迹上</text>

  <rect x="760" y="260" width="300" height="220" rx="18" fill="#0f172a" stroke="#1f2937" />
  <line x1="790" y1="370" x2="1030" y2="370" stroke="#334155" strokeWidth="2" />
  <circle cx="830" cy="370" r="6" fill="#f97316" />
  <circle cx="930" cy="370" r="6" fill="#f97316" />
  <circle cx="990" cy="370" r="6" fill="#38bdf8" />
  <path d="M830 370 C 870 330, 910 330, 930 370" stroke="#22c55e" strokeWidth="3" fill="none" />
  <text x="780" y="255" fill="#94a3b8" font-size="12" font-family="Arial">示意：实轴段与分支</text>

  <text x="80" y="615" fill="#64748b" font-size="14" font-family="Arial">提示：先画极点/零点，再用法则补全轨迹方向。</text>
</svg>
