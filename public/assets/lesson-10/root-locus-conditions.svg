<svg width="1200" height="675" viewBox="0 0 1200 675" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f172a" />
      <stop offset="1" stop-color="#1e293b" />
    </linearGradient>
  </defs>
  <rect width="1200" height="675" rx="32" fill="url(#bg)" />

  <text x="80" y="120" fill="#e2e8f0" font-size="36" font-family="Arial" font-weight="bold">根轨迹条件：模值 + 相角</text>
  <text x="80" y="165" fill="#94a3b8" font-size="18" font-family="Arial">只要满足两条条件，点就属于根轨迹</text>

  <rect x="80" y="230" width="500" height="320" rx="22" fill="#0b1220" stroke="#1f2937" />
  <rect x="620" y="230" width="500" height="320" rx="22" fill="#0b1220" stroke="#1f2937" />

  <text x="110" y="280" fill="#38bdf8" font-size="22" font-family="Arial" font-weight="bold">相角条件</text>
  <text x="110" y="320" fill="#94a3b8" font-size="16" font-family="Arial">sum(angle(s - z_i)) - sum(angle(s - p_i))</text>
  <text x="110" y="350" fill="#94a3b8" font-size="16" font-family="Arial">= (2k + 1) * 180deg</text>
  <text x="110" y="390" fill="#64748b" font-size="14" font-family="Arial">用于判断某点是否在轨迹上</text>

  <text x="650" y="280" fill="#22c55e" font-size="22" font-family="Arial" font-weight="bold">模值条件</text>
  <text x="650" y="320" fill="#94a3b8" font-size="16" font-family="Arial">|K * G(s)| = 1</text>
  <text x="650" y="350" fill="#94a3b8" font-size="16" font-family="Arial">K = 1 / |G(s)|</text>
  <text x="650" y="390" fill="#64748b" font-size="14" font-family="Arial">用于求取该点对应的增益 K</text>

  <text x="80" y="605" fill="#64748b" font-size="14" font-family="Arial">提示：普通根轨迹使用 K 作为参数，广义根轨迹可替换为任意可调参数。</text>
</svg>
