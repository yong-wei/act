<svg width="1200" height="675" viewBox="0 0 1200 675" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f172a" />
      <stop offset="1" stop-color="#1f2937" />
    </linearGradient>
  </defs>
  <rect width="1200" height="675" rx="32" fill="url(#bg)" />

  <text x="80" y="120" fill="#e2e8f0" font-size="36" font-family="Arial" font-weight="bold">课程路线图：根轨迹法</text>
  <text x="80" y="165" fill="#94a3b8" font-size="18" font-family="Arial">放眼大局 → 细节修正 → 设计落点</text>

  <rect x="80" y="220" width="500" height="360" rx="22" fill="#0b1220" stroke="#1f2937" />
  <rect x="620" y="220" width="500" height="360" rx="22" fill="#0b1220" stroke="#1f2937" />

  <text x="110" y="270" fill="#38bdf8" font-size="22" font-family="Arial" font-weight="bold">大局主线</text>
  <text x="110" y="310" fill="#94a3b8" font-size="16" font-family="Arial">1. 根轨迹定义：闭环极点随 K 变化</text>
  <text x="110" y="345" fill="#94a3b8" font-size="16" font-family="Arial">2. 模值/相角条件：确定轨迹上的点</text>
  <text x="110" y="380" fill="#94a3b8" font-size="16" font-family="Arial">3. 基本法则：分支数、实轴段、渐近线</text>
  <text x="110" y="415" fill="#94a3b8" font-size="16" font-family="Arial">4. 参数根轨迹：广义定义与可调参数</text>
  <text x="110" y="450" fill="#64748b" font-size="14" font-family="Arial">关键词：全局结构 / 轨迹识别</text>

  <text x="650" y="270" fill="#22c55e" font-size="22" font-family="Arial" font-weight="bold">细节修正</text>
  <text x="650" y="310" fill="#94a3b8" font-size="16" font-family="Arial">1. 分离点与再入点：dK/ds = 0</text>
  <text x="650" y="345" fill="#94a3b8" font-size="16" font-family="Arial">2. 渐近线中心与角度：sigma_a, theta_k</text>
  <text x="650" y="380" fill="#94a3b8" font-size="16" font-family="Arial">3. 出射角/入射角：复共轭分支方向</text>
  <text x="650" y="415" fill="#94a3b8" font-size="16" font-family="Arial">4. 虚轴交点：劳斯判据辅助求界</text>
  <text x="650" y="450" fill="#64748b" font-size="14" font-family="Arial">关键词：细节定位 / 稳定边界</text>

  <text x="80" y="615" fill="#64748b" font-size="14" font-family="Arial">目标：用根轨迹快速锁定稳定范围与性能落点。</text>
</svg>
