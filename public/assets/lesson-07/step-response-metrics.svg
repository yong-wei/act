<svg width="1200" height="675" viewBox="0 0 1200 675" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f172a" />
      <stop offset="1" stop-color="#111827" />
    </linearGradient>
    <linearGradient id="curve" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#38bdf8" />
      <stop offset="1" stop-color="#22d3ee" />
    </linearGradient>
  </defs>
  <rect width="1200" height="675" rx="32" fill="url(#bg)" />
  <text x="80" y="110" fill="#e2e8f0" font-size="32" font-family="Arial" font-weight="bold">单位阶跃响应与性能指标</text>
  <text x="80" y="150" fill="#94a3b8" font-size="18" font-family="Arial">关注：超调量、峰值时间、调节时间、上升时间</text>

  <rect x="80" y="190" width="1040" height="360" rx="24" fill="#0b1220" stroke="#1f2937" />

  <g>
    <line x1="140" y1="470" x2="1040" y2="470" stroke="#1f2937" stroke-width="2" />
    <line x1="140" y1="250" x2="140" y2="470" stroke="#1f2937" stroke-width="2" />
    <line x1="140" y1="330" x2="1040" y2="330" stroke="#334155" stroke-dasharray="6 6" />
    <path d="M 140 470 C 220 300, 300 250, 360 320 C 420 390, 500 430, 600 410 C 700 390, 820 385, 1040 380" stroke="url(#curve)" stroke-width="4" fill="none" />
    <line x1="360" y1="330" x2="360" y2="250" stroke="#f97316" stroke-width="3" />
    <circle cx="360" cy="250" r="6" fill="#f97316" />
    <line x1="520" y1="470" x2="520" y2="330" stroke="#22c55e" stroke-width="3" />
    <line x1="780" y1="470" x2="780" y2="330" stroke="#22c55e" stroke-width="3" />
  </g>

  <g>
    <text x="160" y="240" fill="#f97316" font-size="14" font-family="Arial">峰值时间 tp</text>
    <text x="520" y="520" fill="#22c55e" font-size="14" font-family="Arial">调节时间 ts</text>
    <text x="190" y="520" fill="#38bdf8" font-size="14" font-family="Arial">上升时间 tr</text>
    <text x="420" y="290" fill="#f97316" font-size="14" font-family="Arial">超调量 Mp</text>
  </g>

  <g>
    <rect x="80" y="560" width="1040" height="80" rx="18" fill="#0f172a" stroke="#1f2937" />
    <text x="110" y="595" fill="#94a3b8" font-size="14" font-family="Arial">常用近似：</text>
    <text x="240" y="595" fill="#e2e8f0" font-size="14" font-family="Arial">ts ≈ 4 / (zeta * wn)</text>
    <text x="520" y="595" fill="#e2e8f0" font-size="14" font-family="Arial">tp = pi / wd</text>
    <text x="700" y="595" fill="#e2e8f0" font-size="14" font-family="Arial">Mp = exp(-zeta*pi/sqrt(1-zeta^2))</text>
  </g>
</svg>
