name: Layered quality gates

on:
  pull_request:
    branches:
      - integration
  push:
    branches:
      - integration
  schedule:
    - cron: '17 2 * * *'
  workflow_dispatch:
    inputs:
      layer:
        description: 'Layer to execute manually'
        required: true
        default: nightly
        type: choice
        options:
          - nightly

permissions:
  contents: read

concurrency:
  group: quality-gates-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  pr:
    name: PR / layered quality gates
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Validate gate registry
        run: npm run quality-gates:validate
      - name: Execute PR gate registry
        run: npm run quality-gates:run -- --layer pr

  integration:
    name: Integration / layered quality gates
    if: github.event_name == 'push' && github.ref == 'refs/heads/integration'
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Validate gate registry
        run: npm run quality-gates:validate
      - name: Execute integration gate registry
        run: npm run quality-gates:run -- --layer integration

  nightly:
    name: Nightly / breadth quality gates
    if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.layer == 'nightly')
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Validate gate registry
        run: npm run quality-gates:validate
      - name: Execute nightly breadth registry
        run: npm run quality-gates:run -- --layer nightly
