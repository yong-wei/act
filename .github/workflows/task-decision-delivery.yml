name: Task Decision Delivery

on:
  pull_request:
    paths:
      - '.agents/**'
      - '.github/**'
      - 'package.json'
      - 'package-lock.json'
      - 'prisma/**'
      - 'rust/**'
      - 'scripts/**'
      - 'src/**'

jobs:
  verify:
    name: Verify task decision delivery
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Verify decision records cover implementation
        run: node scripts/governance/verify-task-decision-delivery.mjs --base "origin/${{ github.base_ref }}"
