name: CI

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  model-assets:
    name: Produce optimized GLB assets
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: tools/glb-model-optimizer/package-lock.json

      - name: Install model producer dependencies
        run: npm ci --prefix tools/glb-model-optimizer

      - name: Produce optimized models
        run: npm run produce --prefix tools/glb-model-optimizer

      - name: Validate optimized models
        run: node scripts/assets/validate-optimized-models.mjs --source-root public/assets --optimized-root public/assets/models-opt

      - name: Upload optimized models
        uses: actions/upload-artifact@v4
        with:
          name: optimized-model-assets-${{ github.sha }}
          path: public/assets/models-opt
          if-no-files-found: error
          retention-days: 1

  quality:
    name: Lint, Test, Build
    runs-on: ubuntu-latest
    needs: model-assets

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download optimized models
        uses: actions/download-artifact@v4
        with:
          name: optimized-model-assets-${{ github.sha }}
          path: public/assets/models-opt

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Install wasm-pack
        run: cargo install wasm-pack --locked --version 0.15.0

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Build control engine WASM
        run: npm run wasm:build:control-engine

      - name: Lint
        run: npm run lint

      - name: PR test contract
        run: npm run test

      - name: Build
        env:
          NODE_MAX_OLD_SPACE_SIZE: 12288
        run: npm run build
