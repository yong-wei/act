[package]
name = "control_engine"
version = "0.1.0"
edition = "2024"

[features]
default = ["full-wasm"]
full-wasm = []

[dependencies]
num-complex = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["float_roundtrip"] }
wasm-bindgen = "0.2"

[lib]
crate-type = ["cdylib", "rlib"]
