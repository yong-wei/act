<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>海洋工程控制系统仿真</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/3.7.1/chart.min.js"></script>
    <style>
        body {
            font-family: 'Microsoft YaHei', Arial, sans-serif;
            margin: 0;
            padding: 0;
            background-color: #f0f2f5;
            color: #333;
        }
        .container {
            width: 100%;
            max-width: 1600px;
            margin: 0 auto;
            padding: 20px;
        }
        .header {
            text-align: center;
            padding: 10px;
            margin-bottom: 20px;
        }
        .model-buttons {
            display: flex;
            justify-content: space-around;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }
        .model-button {
            padding: 10px 20px;
            margin: 5px;
            font-size: 16px;
            border: none;
            border-radius: 4px;
            background-color: #e6e6e6;
            cursor: pointer;
            transition: background-color 0.3s;
        }
        .model-button:hover {
            background-color: #d4d4d4;
        }
        .model-button.active {
            background-color: #1890ff;
            color: white;
        }
        .content-area {
            display: flex;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }
        .visualization-panel, .plot-panel {
            flex: 1;
            min-width: 300px;
            height: 400px;
            margin: 10px;
            background-color: white;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
            overflow: hidden;
        }
        .control-panel {
            background-color: white;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
        }
        .parameter-row {
            display: flex;
            justify-content: space-between;
            margin-bottom: 15px;
            flex-wrap: wrap;
        }
        .parameter-group {
            flex: 1;
            min-width: 200px;
            margin: 10px;
        }
        .parameter-title {
            font-weight: bold;
            margin-bottom: 10px;
        }
        .parameter-input {
            display: flex;
            align-items: center;
            margin-bottom: 5px;
        }
        .parameter-input label {
            width: 120px;
        }
        .parameter-input input, .parameter-input select {
            flex: 1;
            padding: 5px;
            border: 1px solid #d9d9d9;
            border-radius: 4px;
        }
        .simulation-controls {
            display: flex;
            justify-content: center;
            margin-top: 20px;
        }
        .start-button, .stop-button {
            padding: 12px 30px;
            font-size: 18px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            margin: 0 10px;
            transition: background-color 0.3s;
        }
        .start-button {
            background-color: #52c41a;
            color: white;
        }
        .start-button:hover {
            background-color: #73d13d;
        }
        .stop-button {
            background-color: #ff4d4f;
            color: white;
        }
        .stop-button:hover {
            background-color: #ff7875;
        }
        .hidden {
            display: none;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>海洋工程控制系统仿真</h1>
        </div>
        
        <div class="model-buttons">
            <button class="model-button active" data-model="ship">船舶航向调节</button>
            <button class="model-button" data-model="motor">电动机速度调节</button>
            <button class="model-button" data-model="auv">水下无人艇</button>
            <button class="model-button" data-model="dp">船舶动力定位</button>
            <button class="model-button" data-model="dredger">挖泥船动力分配</button>
            <button class="model-button" data-model="fin">减摇鳍调节</button>
        </div>
        
        <div class="content-area">
            <div class="visualization-panel" id="visualization">
                <!-- Three.js 3D visualization will be rendered here -->
            </div>
            <div class="plot-panel" id="plot-container">
                <canvas id="response-plot"></canvas>
            </div>
        </div>
        
        <div class="control-panel">
            <div class="parameter-row">
                <div class="parameter-group">
                    <div class="parameter-title">仿真参数</div>
                    <div class="parameter-input">
                        <label for="time-step">时间步长 (秒):</label>
                        <input type="number" id="time-step" value="0.01" min="0.001" max="1" step="0.001">
                    </div>
                    <div class="parameter-input">
                        <label for="speed-factor">加速系数:</label>
                        <input type="number" id="speed-factor" value="1" min="0.1" max="100" step="0.1">
                    </div>
                </div>
                
                <div class="parameter-group">
                    <div class="parameter-title">给定信号</div>
                    <div class="parameter-input">
                        <label for="signal-type">信号类型:</label>
                        <select id="signal-type">
                            <option value="step">阶跃信号</option>
                            <option value="impulse">脉冲信号</option>
                            <option value="ramp">斜坡信号</option>
                            <option value="acceleration">加速度信号</option>
                        </select>
                    </div>
                    <div class="parameter-input">
                        <label for="signal-amplitude">信号强度:</label>
                        <input type="number" id="signal-amplitude" value="1" min="0" max="100" step="0.1">
                    </div>
                </div>
            </div>
            
            <div class="parameter-row">
                <div class="parameter-group">
                    <div class="parameter-title">PID控制器参数</div>
                    <div class="parameter-input">
                        <label for="pid-p">比例增益 (P):</label>
                        <input type="number" id="pid-p" value="1" min="0" max="100" step="0.01">
                    </div>
                    <div class="parameter-input">
                        <label for="pid-i">积分增益 (I):</label>
                        <input type="number" id="pid-i" value="0.1" min="0" max="100" step="0.01">
                    </div>
                    <div class="parameter-input">
                        <label for="pid-d">微分增益 (D):</label>
                        <input type="number" id="pid-d" value="0.01" min="0" max="100" step="0.001">
                    </div>
                </div>
                
                <div class="parameter-group" id="model-specific-params">
                    <div class="parameter-title">船舶模型参数</div>
                    <div class="parameter-input">
                        <label for="ship-mass">船舶质量 (吨):</label>
                        <input type="number" id="ship-mass" value="1000" min="10" max="100000" step="10">
                    </div>
                    <div class="parameter-input">
                        <label for="ship-length">船舶长度 (米):</label>
                        <input type="number" id="ship-length" value="50" min="1" max="500" step="1">
                    </div>
                    <div class="parameter-input">
                        <label for="ship-inertia">惯性力矩:</label>
                        <input type="number" id="ship-inertia" value="5e5" min="1e3" max="1e9" step="1e3">
                    </div>
                </div>
            </div>
            
            <div class="simulation-controls">
                <button class="start-button" id="start-button">开始仿真</button>
                <button class="stop-button hidden" id="stop-button">停止仿真</button>
            </div>
        </div>
    </div>
    
    <script>
        // 全局变量
        let currentModel = 'ship';
        let isSimulationRunning = false;
        let simulationInterval;
        let simulationTime = 0;
        let chart;
        let responseData = [];
        let scene, camera, renderer, ship;
        let errorSum = 0;  // 累计误差（用于积分项）
        let lastError = 0; // 上一次误差（用于微分项）
        
        // 模型状态空间参数
        const models = {
            ship: {
                name: '船舶航向调节',
                // 状态空间矩阵
                A: [[0, 1], [-0.1, -0.5]],
                B: [[0], [1]],
                C: [[1, 0]],
                D: [[0]],
                // 状态变量
                state: [0, 0],
                // 模型具体参数
                parameters: {
                    mass: 1000,
                    length: 50,
                    inertia: 5e5
                },
                updateModelParameters: function() {
                    this.parameters.mass = parseFloat(document.getElementById('ship-mass').value);
                    this.parameters.length = parseFloat(document.getElementById('ship-length').value);
                    this.parameters.inertia = parseFloat(document.getElementById('ship-inertia').value);
                    
                    // 更新状态空间矩阵
                    this.A[1][0] = -0.1 * (1000 / this.parameters.mass);
                    this.A[1][1] = -0.5 * (50 / this.parameters.length);
                    this.B[1][0] = 1 * (5e5 / this.parameters.inertia);
                },
                createModel: function() {
                    // 创建船体
                    const shipGeometry = new THREE.BoxGeometry(
                        this.parameters.length * 0.02, 
                        this.parameters.length * 0.01, 
                        this.parameters.length * 0.04
                    );
                    const shipMaterial = new THREE.MeshPhongMaterial({ color: 0x0055aa });
                    ship = new THREE.Mesh(shipGeometry, shipMaterial);
                    
                    // 创建船的上层建筑
                    const cabinGeometry = new THREE.BoxGeometry(
                        this.parameters.length * 0.015, 
                        this.parameters.length * 0.015, 
                        this.parameters.length * 0.02
                    );
                    const cabinMaterial = new THREE.MeshPhongMaterial({ color: 0xaaaaaa });
                    const cabin = new THREE.Mesh(cabinGeometry, cabinMaterial);
                    cabin.position.set(0, this.parameters.length * 0.0125, 0);
                    ship.add(cabin);
                    
                    return ship;
                }
            },
            motor: {
                name: '电动机速度调节',
                // 电动机模型 - 简化后的状态空间表达
                A: [[-5, 0], [1, 0]],
                B: [[1], [0]],
                C: [[0, 1]],
                D: [[0]],
                state: [0, 0],
                parameters: {
                    resistance: 2,
                    inductance: 0.5,
                    inertia: 0.01
                },
                updateModelParameters: function() {
                    this.parameters.resistance = parseFloat(document.getElementById('motor-resistance').value);
                    this.parameters.inductance = parseFloat(document.getElementById('motor-inductance').value);
                    this.parameters.inertia = parseFloat(document.getElementById('motor-inertia').value);
                    
                    // 更新状态空间矩阵
                    this.A[0][0] = -this.parameters.resistance / this.parameters.inductance;
                    this.A[1][0] = 1 / this.parameters.inertia;
                    this.B[0][0] = 1 / this.parameters.inductance;
                },
                createModel: function() {
                    // 创建电机模型
                    const motorGroup = new THREE.Group();
                    
                    // 电机主体
                    const motorBody = new THREE.CylinderGeometry(1, 1, 2, 32);
                    const motorMaterial = new THREE.MeshPhongMaterial({ color: 0x888888 });
                    const motor = new THREE.Mesh(motorBody, motorMaterial);
                    motor.rotation.x = Math.PI / 2;
                    motorGroup.add(motor);
                    
                    // 电机轴
                    const shaftGeometry = new THREE.CylinderGeometry(0.2, 0.2, 3, 16);
                    const shaftMaterial = new THREE.MeshPhongMaterial({ color: 0xdddddd });
                    const shaft = new THREE.Mesh(shaftGeometry, shaftMaterial);
                    shaft.rotation.z = Math.PI / 2;
                    shaft.position.set(0, 0, 0);
                    motorGroup.add(shaft);
                    
                    // 转子（显示旋转部分）
                    const rotorGeometry = new THREE.BoxGeometry(0.2, 0.2, 2);
                    const rotorMaterial = new THREE.MeshPhongMaterial({ color: 0xff0000 });
                    const rotor = new THREE.Mesh(rotorGeometry, rotorMaterial);
                    rotor.position.set(0, 0, 0);
                    motorGroup.add(rotor);
                    
                    return motorGroup;
                }
            },
            auv: {
                name: '水下无人艇',
                // 简化的水下无人艇模型
                A: [[-0.2, 0], [1, -0.3]],
                B: [[1], [0]],
                C: [[0, 1]],
                D: [[0]],
                state: [0, 0],
                parameters: {
                    mass: 100,
                    drag: 0.2,
                    thrust: 1
                },
                updateModelParameters: function() {
                    this.parameters.mass = parseFloat(document.getElementById('auv-mass').value);
                    this.parameters.drag = parseFloat(document.getElementById('auv-drag').value);
                    this.parameters.thrust = parseFloat(document.getElementById('auv-thrust').value);
                    
                    // 更新状态空间矩阵
                    this.A[0][0] = -this.parameters.drag;
                    this.A[1][1] = -this.parameters.drag * 1.5;
                    this.B[0][0] = this.parameters.thrust / this.parameters.mass;
                },
                createModel: function() {
                    // 创建水下无人艇模型
                    const auvGroup = new THREE.Group();
                    
                    // 主体
                    const bodyGeometry = new THREE.CylinderGeometry(0.5, 0.8, 4, 32);
                    const bodyMaterial = new THREE.MeshPhongMaterial({ color: 0xffff00 });
                    const body = new THREE.Mesh(bodyGeometry, bodyMaterial);
                    body.rotation.z = Math.PI / 2;
                    auvGroup.add(body);
                    
                    // 垂直鳍
                    const finGeometry = new THREE.BoxGeometry(0.1, 1, 1);
                    const finMaterial = new THREE.MeshPhongMaterial({ color: 0xffff00 });
                    
                    const topFin = new THREE.Mesh(finGeometry, finMaterial);
                    topFin.position.set(0, 0.5, 0);
                    auvGroup.add(topFin);
                    
                    const bottomFin = new THREE.Mesh(finGeometry, finMaterial);
                    bottomFin.position.set(0, -0.5, 0);
                    auvGroup.add(bottomFin);
                    
                    // 水平鳍
                    const hFinGeometry = new THREE.BoxGeometry(0.1, 1, 1);
                    const hFinMaterial = new THREE.MeshPhongMaterial({ color: 0xffff00 });
                    
                    const leftFin = new THREE.Mesh(hFinGeometry, hFinMaterial);
                    leftFin.rotation.z = Math.PI / 2;
                    leftFin.position.set(0, 0, 0.5);
                    auvGroup.add(leftFin);
                    
                    const rightFin = new THREE.Mesh(hFinGeometry, hFinMaterial);
                    rightFin.rotation.z = Math.PI / 2;
                    rightFin.position.set(0, 0, -0.5);
                    auvGroup.add(rightFin);
                    
                    return auvGroup;
                }
            },
            dp: {
                name: '船舶动力定位',
                // 动力定位系统 - 三维状态空间模型（x, y, yaw）
                A: [[0, 1, 0], [0, 0, 1], [-0.1, -0.5, -0.2]],
                B: [[0], [0], [1]],
                C: [[1, 0, 0]],
                D: [[0]],
                state: [0, 0, 0],
                parameters: {
                    mass: 2000,
                    wind: 0.5,
                    current: 0.3
                },
                updateModelParameters: function() {
                    this.parameters.mass = parseFloat(document.getElementById('dp-mass').value);
                    this.parameters.wind = parseFloat(document.getElementById('dp-wind').value);
                    this.parameters.current = parseFloat(document.getElementById('dp-current').value);
                    
                    // 更新状态空间矩阵
                    this.A[2][0] = -0.1 * (1 + this.parameters.current);
                    this.A[2][1] = -0.5 * (1 + this.parameters.wind);
                    this.A[2][2] = -0.2 * (2000 / this.parameters.mass);
                },
                createModel: function() {
                    // 创建带有多个推进器的DP船舶模型
                    const dpShipGroup = new THREE.Group();
                    
                    // 船体
                    const hullGeometry = new THREE.BoxGeometry(3, 0.5, 6);
                    const hullMaterial = new THREE.MeshPhongMaterial({ color: 0x0077cc });
                    const hull = new THREE.Mesh(hullGeometry, hullMaterial);
                    dpShipGroup.add(hull);
                    
                    // 上层建筑
                    const deckGeometry = new THREE.BoxGeometry(2, 1, 3);
                    const deckMaterial = new THREE.MeshPhongMaterial({ color: 0xaaaaaa });
                    const deck = new THREE.Mesh(deckGeometry, deckMaterial);
                    deck.position.set(0, 0.75, 0);
                    dpShipGroup.add(deck);
                    
                    // 添加推进器标记
                    const thrusterGeometry = new THREE.CylinderGeometry(0.2, 0.2, 0.3, 16);
                    const thrusterMaterial = new THREE.MeshPhongMaterial({ color: 0xff6600 });
                    
                    // 艏侧推进器
                    const bowThruster = new THREE.Mesh(thrusterGeometry, thrusterMaterial);
                    bowThruster.position.set(0, 0, -2.5);
                    bowThruster.rotation.x = Math.PI / 2;
                    dpShipGroup.add(bowThruster);
                    
                    // 艉侧推进器
                    const sternThruster = new THREE.Mesh(thrusterGeometry, thrusterMaterial);
                    sternThruster.position.set(0, 0, 2.5);
                    sternThruster.rotation.x = Math.PI / 2;
                    dpShipGroup.add(sternThruster);
                    
                    // 主推进器（左右各一个）
                    const mainThrusterLeft = new THREE.Mesh(thrusterGeometry, thrusterMaterial);
                    mainThrusterLeft.position.set(-1.3, -0.1, 2.8);
                    mainThrusterLeft.rotation.z = Math.PI / 2;
                    dpShipGroup.add(mainThrusterLeft);
                    
                    const mainThrusterRight = new THREE.Mesh(thrusterGeometry, thrusterMaterial);
                    mainThrusterRight.position.set(1.3, -0.1, 2.8);
                    mainThrusterRight.rotation.z = Math.PI / 2;
                    dpShipGroup.add(mainThrusterRight);
                    
                    return dpShipGroup;
                }
            },
            dredger: {
                name: '挖泥船动力分配',
                // 挖泥船模型
                A: [[0, 1], [-0.2, -0.1]],
                B: [[0], [1]],
                C: [[1, 0]],
                D: [[0]],
                state: [0, 0],
                parameters: {
                    thrust: 4,
                    maxPower: 1000,
                    efficiency: 0.8
                },
                updateModelParameters: function() {
                    this.parameters.thrust = parseFloat(document.getElementById('dredger-thrust').value);
                    this.parameters.maxPower = parseFloat(document.getElementById('dredger-max-power').value);
                    this.parameters.efficiency = parseFloat(document.getElementById('dredger-efficiency').value);
                    
                    // 更新状态空间矩阵
                    const powerFactor = this.parameters.maxPower / 1000;
                    this.A[1][0] = -0.2 * powerFactor * this.parameters.efficiency;
                    this.A[1][1] = -0.1 * (4 / this.parameters.thrust);
                    this.B[1][0] = powerFactor;
                },
                createModel: function() {
                    // 创建挖泥船模型
                    const dredgerGroup = new THREE.Group();
                    
                    // 船体
                    const hullGeometry = new THREE.BoxGeometry(4, 0.8, 7);
                    const hullMaterial = new THREE.MeshPhongMaterial({ color: 0x996633 });
                    const hull = new THREE.Mesh(hullGeometry, hullMaterial);
                    dredgerGroup.add(hull);
                    
                    // 上层建筑
                    const deckGeometry = new THREE.BoxGeometry(2.5, 1.5, 4);
                    const deckMaterial = new THREE.MeshPhongMaterial({ color: 0xaaaaaa });
                    const deck = new THREE.Mesh(deckGeometry, deckMaterial);
                    deck.position.set(0, 1.15, 1);
                    dredgerGroup.add(deck);
                    
                    // 挖泥臂
                    const armGeometry = new THREE.CylinderGeometry(0.2, 0.2, 8, 16);
                    const armMaterial = new THREE.MeshPhongMaterial({ color: 0x777777 });
                    const arm = new THREE.Mesh(armGeometry, armMaterial);
                    arm.position.set(0, 0.5, -4);
                    arm.rotation.x = Math.PI / 4;
                    dredgerGroup.add(arm);
                    
                    // 挖泥头
                    const headGeometry = new THREE.SphereGeometry(0.5, 16, 16);
                    const headMaterial = new THREE.MeshPhongMaterial({ color: 0x444444 });
                    const head = new THREE.Mesh(headGeometry, headMaterial);
                    head.position.set(0, 2.5, -7);
                    dredgerGroup.add(head);
                    
                    return dredgerGroup;
                }
            },
            fin: {
                name: '减摇鳍调节',
                // 减摇鳍模型
                A: [[0, 1], [-0.4, -0.3]],
                B: [[0], [0.5]],
                C: [[1, 0]],
                D: [[0]],
                state: [0, 0],
                parameters: {
                    area: 2,
                    range: 30,
                    damping: 0.4
                },
                updateModelParameters: function() {
                    this.parameters.area = parseFloat(document.getElementById('fin-area').value);
                    this.parameters.range = parseFloat(document.getElementById('fin-range').value);
                    this.parameters.damping = parseFloat(document.getElementById('fin-damping').value);
                    
                    // 更新状态空间矩阵
                    this.A[1][0] = -0.4 * (this.parameters.area / 2);
                    this.A[1][1] = -this.parameters.damping;
                    this.B[1][0] = 0.5 * (this.parameters.range / 30);
                },
                createModel: function() {
                    // 创建带减摇鳍的船舶模型
                    const finShipGroup = new THREE.Group();
                    
                    // 船体
                    const hullGeometry = new THREE.BoxGeometry(2.5, 1.5, 8);
                    const hullMaterial = new THREE.MeshPhongMaterial({ color: 0x2277aa });
                    const hull = new THREE.Mesh(hullGeometry, hullMaterial);
                    finShipGroup.add(hull);
                    
                    // 上层建筑
                    const deckGeometry = new THREE.BoxGeometry(2, 1.5, 5);
                    const deckMaterial = new THREE.MeshPhongMaterial({ color: 0xaaaaaa });
                    const deck = new THREE.Mesh(deckGeometry, deckMaterial);
                    deck.position.set(0, 1.5, 0);
                    finShipGroup.add(deck);
                    
                    // 减摇鳍（左右两侧）
                    const finGeometry = new THREE.BoxGeometry(3, 0.1, 1);
                    const finMaterial = new THREE.MeshPhongMaterial({ color: 0x0099ff });
                    
                    const leftFin = new THREE.Mesh(finGeometry, finMaterial);
                    leftFin.position.set(-2.7, -0.2, 0);
                    leftFin.name = "leftFin";
                    finShipGroup.add(leftFin);
                    
                    const rightFin = new THREE.Mesh(finGeometry, finMaterial);
                    rightFin.position.set(2.7, -0.2, 0);
                    rightFin.name = "rightFin";
                    finShipGroup.add(rightFin);
                    
                    return finShipGroup;
                }
            }
        };
        
        // 初始化
        document.addEventListener('DOMContentLoaded', function() {
            setupEventListeners();
            initThreeJS();
            initChart();
            updateModelSpecificParams();
        });
        
        // 设置事件监听器
        function setupEventListeners() {
            // 模型切换按钮
            document.querySelectorAll('.model-button').forEach(button => {
                button.addEventListener('click', function() {
                    if (isSimulationRunning) {
                        stopSimulation();
                    }
                    
                    document.querySelectorAll('.model-button').forEach(btn => {
                        btn.classList.remove('active');
                    });
                    this.classList.add('active');
                    currentModel = this.getAttribute('data-model');
                    updateModelSpecificParams();
                    resetSimulation();
                    update3DModel();
                });
            });
            
            // 开始仿真按钮
            document.getElementById('start-button').addEventListener('click', function() {
                if (!isSimulationRunning) {
                    startSimulation();
                }
            });
            
            // 停止仿真按钮
            document.getElementById('stop-button').addEventListener('click', function() {
                if (isSimulationRunning) {
                    stopSimulation();
                }
            });
            
            // 参数更改时更新模型
            document.querySelectorAll('.parameter-input input').forEach(input => {
                input.addEventListener('change', function() {
                    if (!isSimulationRunning && this.id.startsWith(currentModel)) {
                        models[currentModel].updateModelParameters();
                        update3DModel();
                    }
                });
            });
        }
        
        // 初始化Three.js
        function initThreeJS() {
            // 创建场景
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0xf0f0f0);
            
            // 创建相机
            camera = new THREE.PerspectiveCamera(75, 1, 0.1, 1000);
            camera.position.set(0, 5, 10);
            camera.lookAt(0, 0, 0);
            
            // 创建渲染器
            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(document.getElementById('visualization').clientWidth, 
                             document.getElementById('visualization').clientHeight);
            document.getElementById('visualization').appendChild(renderer.domElement);
            
            // 添加光源
            const ambientLight = new THREE.AmbientLight(0x404040);
            scene.add(ambientLight);
            
            const directionalLight = new THREE.DirectionalLight(0xffffff, 0.5);
            directionalLight.position.set(1, 1, 1);
            scene.add(directionalLight);
            
            // 添加网格地面
            const gridHelper = new THREE.GridHelper(20, 20);
            scene.add(gridHelper);
            
            // 添加坐标轴
            const axesHelper = new THREE.AxesHelper(5);
            scene.add(axesHelper);
            
            // 创建初始模型
            update3DModel();
            
            // 窗口大小调整
            window.addEventListener('resize', onWindowResize);
            
            // 渲染
            animate();
        }
        
        // 窗口大小调整函数
        function onWindowResize() {
            const width = document.getElementById('visualization').clientWidth;
            const height = document.getElementById('visualization').clientHeight;
            
            camera.aspect = width / height;
            camera.updateProjectionMatrix();
            
            renderer.setSize(width, height);
        }
        
        // 渲染循环
        function animate() {
            requestAnimationFrame(animate);
            renderer.render(scene, camera);
        }
        
        // 初始化图表
        function initChart() {
            const ctx = document.getElementById('response-plot').getContext('2d');
            
            chart = new Chart(ctx, {
                type: 'line',
                data: {
                    labels: [],
                    datasets: [
                        {
                            label: '参考信号',
                            borderColor: 'rgb(255, 99, 132)',
                            backgroundColor: 'rgba(255, 99, 132, 0.1)',
                            data: [],
                            fill: false
                        },
                        {
                            label: '系统响应',
                            borderColor: 'rgb(54, 162, 235)',
                            backgroundColor: 'rgba(54, 162, 235, 0.1)',
                            data: [],
                            fill: false
                        }
                    ]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    scales: {
                        x: {
                            display: true,
                            title: {
                                display: true,
                                text: '时间 (秒)'
                            }
                        },
                        y: {
                            display: true,
                            title: {
                                display: true,
                                text: '幅值'
                            }
                        }
                    }
                }
            });
        }
        
        // 更新特定模型参数
        function updateModelSpecificParams() {
            const modelParamsDiv = document.getElementById('model-specific-params');
            const currentModelData = models[currentModel];
            
            // 清空当前内容
            modelParamsDiv.innerHTML = '';
            
            // 设置标题
            const titleDiv = document.createElement('div');
            titleDiv.className = 'parameter-title';
            titleDiv.textContent = currentModelData.name + '参数';
            modelParamsDiv.appendChild(titleDiv);
            
            // 根据当前模型添加特定参数
            if (currentModel === 'ship') {
                addParameterInput(modelParamsDiv, 'ship-mass', '船舶质量 (吨):', 1000, 10, 100000, 10);
                addParameterInput(modelParamsDiv, 'ship-length', '船舶长度 (米):', 50, 1, 500, 1);
                addParameterInput(modelParamsDiv, 'ship-inertia', '惯性力矩:', 5e5, 1e3, 1e9, 1e3);
            } else if (currentModel === 'motor') {
                addParameterInput(modelParamsDiv, 'motor-resistance', '电机电阻 (Ω):', 2, 0.1, 100, 0.1);
                addParameterInput(modelParamsDiv, 'motor-inductance', '电机电感 (H):', 0.5, 0.01, 10, 0.01);
                addParameterInput(modelParamsDiv, 'motor-inertia', '转子惯量:', 0.01, 0.001, 1, 0.001);
            } else if (currentModel === 'auv') {
                addParameterInput(modelParamsDiv, 'auv-mass', '无人艇质量 (kg):', 100, 1, 1000, 1);
                addParameterInput(modelParamsDiv, 'auv-drag', '阻力系数:', 0.2, 0.01, 10, 0.01);
                addParameterInput(modelParamsDiv, 'auv-thrust', '推力系数:', 1, 0.1, 10, 0.1);
            } else if (currentModel === 'dp') {
                addParameterInput(modelParamsDiv, 'dp-mass', '船舶质量 (吨):', 2000, 100, 100000, 100);
                addParameterInput(modelParamsDiv, 'dp-wind', '风力系数:', 0.5, 0.1, 10, 0.1);
                addParameterInput(modelParamsDiv, 'dp-current', '水流系数:', 0.3, 0.1, 10, 0.1);
            } else if (currentModel === 'dredger') {
                addParameterInput(modelParamsDiv, 'dredger-thrust', '推进器数量:', 4, 1, 8, 1);
                addParameterInput(modelParamsDiv, 'dredger-max-power', '最大功率 (kW):', 1000, 100, 10000, 100);
                addParameterInput(modelParamsDiv, 'dredger-efficiency', '效率系数:', 0.8, 0.1, 1, 0.01);
            } else if (currentModel === 'fin') {
                addParameterInput(modelParamsDiv, 'fin-area', '鳍面积 (m²):', 2, 0.1, 10, 0.1);
                addParameterInput(modelParamsDiv, 'fin-range', '最大摆角 (°):', 30, 5, 45, 1);
                addParameterInput(modelParamsDiv, 'fin-damping', '阻尼系数:', 0.4, 0.1, 1, 0.01);
            }
        }
        
        // 添加参数输入控件
        function addParameterInput(container, id, label, value, min, max, step) {
            const div = document.createElement('div');
            div.className = 'parameter-input';
            
            const labelElement = document.createElement('label');
            labelElement.htmlFor = id;
            labelElement.textContent = label;
            
            const input = document.createElement('input');
            input.type = 'number';
            input.id = id;
            input.value = value;
            input.min = min;
            input.max = max;
            input.step = step;
            
            div.appendChild(labelElement);
            div.appendChild(input);
            container.appendChild(div);
        }
        
        // 开始仿真
        function startSimulation() {
            isSimulationRunning = true;
            document.getElementById('start-button').classList.add('hidden');
            document.getElementById('stop-button').classList.remove('hidden');
            
            // 更新模型参数
            models[currentModel].updateModelParameters();
            
            // 重置状态和数据
            resetSimulation();
            
            // 获取仿真参数
            const timeStep = parseFloat(document.getElementById('time-step').value);
            const speedFactor = parseFloat(document.getElementById('speed-factor').value);
            
            // 清空累计误差
            errorSum = 0;
            lastError = 0;
            
            // 开始仿真循环
            simulationInterval = setInterval(function() {
                simulationStep(timeStep);
            }, timeStep * 1000 / speedFactor);
        }
        
        // 停止仿真
        function stopSimulation() {
            isSimulationRunning = false;
            document.getElementById('start-button').classList.remove('hidden');
            document.getElementById('stop-button').classList.add('hidden');
            
            if (simulationInterval) {
                clearInterval(simulationInterval);
            }
        }
        
        // 重置仿真
        function resetSimulation() {
            simulationTime = 0;
            models[currentModel].state = new Array(models[currentModel].A.length).fill(0);
            
            // 重置图表数据
            chart.data.labels = [];
            chart.data.datasets[0].data = [];
            chart.data.datasets[1].data = [];
            chart.update();
            
            // 重置3D模型位置
            update3DModel();
        }
        
        // 仿真步进
        function simulationStep(timeStep) {
            simulationTime += timeStep;
            
            // 获取控制器参数
            const kp = parseFloat(document.getElementById('pid-p').value);
            const ki = parseFloat(document.getElementById('pid-i').value);
            const kd = parseFloat(document.getElementById('pid-d').value);
            
            // 获取信号类型和强度
            const signalType = document.getElementById('signal-type').value;
            const signalAmplitude = parseFloat(document.getElementById('signal-amplitude').value);
            
            // 计算参考信号
            const reference = calculateReference(signalType, signalAmplitude, simulationTime);
            
            // 获取当前模型和状态
            const model = models[currentModel];
            const currentState = model.state;
            
            // 计算系统输出
            let output = 0;
            for (let i = 0; i < model.C.length; i++) {
                for (let j = 0; j < currentState.length; j++) {
                    output += model.C[i][j] * currentState[j];
                }
            }
            
            // 计算误差
            const error = reference - output;
            
            // 更新累计误差（积分项）
            errorSum += error * timeStep;
            
            // 计算误差变化率（微分项）
            const errorRate = (error - lastError) / timeStep;
            lastError = error;
            
            // PID控制
            const control = kp * error + ki * errorSum + kd * errorRate;
            
            // 状态空间更新
            const nextState = new Array(currentState.length).fill(0);
            
            // x' = Ax + Bu
            for (let i = 0; i < model.A.length; i++) {
                for (let j = 0; j < model.A[i].length; j++) {
                    nextState[i] += model.A[i][j] * currentState[j];
                }
                
                for (let j = 0; j < model.B[i].length; j++) {
                    nextState[i] += model.B[i][j] * control;
                }
            }
            
            // 使用欧拉方法更新状态
            for (let i = 0; i < currentState.length; i++) {
                model.state[i] += nextState[i] * timeStep;
            }
            
            // 更新图表
            if (simulationTime % 0.1 < timeStep) {  // 每0.1秒更新一次图表，减少性能负担
                updateChart(reference, output);
            }
            
            // 更新3D模型
            update3DModel();
        }
        
        // 计算参考信号
        function calculateReference(type, amplitude, time) {
            switch(type) {
                case 'step':
                    return time > 1 ? amplitude : 0;
                case 'impulse':
                    return (time > 1 && time < 1.2) ? amplitude : 0;
                case 'ramp':
                    return time > 1 ? amplitude * (time - 1) * 0.1 : 0;
                case 'acceleration':
                    return time > 1 ? amplitude * Math.pow(time - 1, 2) * 0.01 : 0;
                default:
                    return 0;
            }
        }
        
        // 更新图表
        function updateChart(reference, output) {
            const timeLabel = simulationTime.toFixed(1);
            
            chart.data.labels.push(timeLabel);
            chart.data.datasets[0].data.push(reference);
            chart.data.datasets[1].data.push(output);
            
            // 限制数据点数量，保持最近的100个点
            if (chart.data.labels.length > 100) {
                chart.data.labels.shift();
                chart.data.datasets[0].data.shift();
                chart.data.datasets[1].data.shift();
            }
            
            chart.update();
        }
        
        // 更新3D模型
        function update3DModel() {
            const model = models[currentModel];
            
            // 移除旧的模型
            if (ship) {
                scene.remove(ship);
            }
            
            // 创建新的模型
            ship = model.createModel();
            scene.add(ship);
            
            // 根据当前状态更新模型
            if (ship) {
                switch(currentModel) {
                    case 'ship':
                        // 船舶航向调节：使用第一个状态变量作为航向角
                        ship.rotation.y = model.state[0];
                        break;
                    case 'motor':
                        // 电动机速度调节：使用第二个状态变量作为转速
                        const rotor = ship.children[2]; // 转子部分
                        if (rotor) {
                            rotor.rotation.x = simulationTime * model.state[1] * 5;
                        }
                        break;
                    case 'auv':
                        // 水下无人艇：使用状态变量控制位置
                        ship.position.x = model.state[1] * 3;
                        ship.rotation.y = Math.atan2(model.state[0], 1) * 0.3;
                        break;
                    case 'dp':
                        // 动力定位：更复杂的位置和姿态控制
                        ship.position.x = model.state[0] * 2;
                        ship.position.z = model.state[1] * 2;
                        ship.rotation.y = model.state[2];
                        break;
                    case 'dredger':
                        // 挖泥船：状态变量控制挖泥臂的角度
                        const arm = ship.children[2]; // 挖泥臂
                        if (arm) {
                            arm.rotation.x = Math.PI / 4 + model.state[0] * 0.2;
                        }
                        break;
                    case 'fin':
                        // 减摇鳍：状态变量控制船的横摇和鳍的角度
                        ship.rotation.z = model.state[0] * 0.2; // 船体横摇
                        
                        // 更新减摇鳍的角度，与船体的摇摆方向相反以提供稳定性
                        const leftFin = ship.getObjectByName("leftFin");
                        const rightFin = ship.getObjectByName("rightFin");
                        
                        if (leftFin && rightFin) {
                            const finAngle = -model.state[0] * 0.5;
                            leftFin.rotation.z = finAngle;
                            rightFin.rotation.z = -finAngle;
                        }
                        break;
                }
            }
        }
    </script>
