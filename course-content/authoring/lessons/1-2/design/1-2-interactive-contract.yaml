          }
        }
      ],
      "content_blocks": [
        {
          "id": "laplace-rules",
          "type": "table",
          "title": "拉氏变换基本规则",
          "columns": [
            "f(t)",
            "F(s)",
            "说明"
          ],
          "rows": [
            [
              "$1(t)$（单位阶跃）",
              "$\\frac{1}{s}$",
              "常数 1 的变换"
            ],
            [
              "$\\dot f(t)$",
              "$sF(s)-f(0)$",
              "一阶导 $\\rightarrow \\times s$"
            ],
            [
              "$\\ddot f(t)$",
              "$s^2F(s)-sf(0)-\\dot f(0)$",
              "二阶导 $\\rightarrow \\times s^2$"
            ]
          ],
          "footer": "核心规律：对 $t$ 求一次导 $\\rightarrow$ 在 $s$ 域多乘一个 $s$"
        },
        {
          "id": "tf-reveal",
          "type": "reveal_chain",
          "title": "三步法推导（船舶 Jθ̈+Bθ̇=Ku，零初值）",
          "static_hint": "写微分方程 → 拉氏变换 → 提取比值。三步得到 G(s)。",
          "layers": [
            {
              "layer": 1,
              "label": "第一步：拉氏变换",
              "content": "$\\mathcal{L}\\{J\\ddot{\\theta}\\}=Js^2\\Theta, \\mathcal{L}\\{B\\dot{\\theta}\\}=Bs\\Theta, \\mathcal{L}\\{Ku\\}=KU \\rightarrow Js^2\\Theta+Bs\\Theta=KU$"
            },
            {
              "layer": 2,
              "label": "第二步：提取公因子",
              "content": "$\\Theta(Js^2+Bs)=KU$"
            },
            {
              "layer": 3,
              "label": "第三步：写出比值",
              "content": "$G(s)=\\frac{\\Theta}{U}=\\frac{K}{Js^2+Bs}$"
            },
            {
              "layer": 4,
              "label": "分解分母",
              "content": "$G(s)=\\frac{K/J}{s(s+B/J)}$——$s$：积分效应；$s+B/J$：阻尼决定的衰减因素",
              "media": "1-2-fig-04-transform-chain.png"
            }
          ]
        },
        {
          "id": "transform-chain-img",
          "type": "media",
          "asset": "1-2-fig-04-transform-chain.png",
          "caption": "三列并排——时域 DE → s 域代数方程 → G(s)。三步走完，二阶微分方程压缩为代数分式。"
        },
        {
          "id": "tf-meanings",
          "type": "bullet_list",
          "title": "传递函数的两个核心含义",
          "items": [
            "G(s) 描述系统本身固有的 I/O 关系——同一 G(s)，配阶跃得阶跃响应，配正弦得频率响应",
            "分母结构暴露内在信息——分子和分母是极点、零点、型别、阻尼比的共同源头"
          ]
        }
      ],
      "interaction_spec": {
