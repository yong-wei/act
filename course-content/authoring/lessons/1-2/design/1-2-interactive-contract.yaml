          "region": "main",
          "kind": "visual.derivationStage",
          "must_be_visible": true,
          "title": "微分方程如何给出一次具体响应",
          "payload": {
            "stageId": "ship-equation-derivation",
            "aspectRatio": "16:9",
            "releaseState": "released",
            "activeRevealStepId": "physical-terms",
            "subtitle": "从舵角产生力矩，到航向角响应，逐步看直接求解的成本。",
            "formulas": [
              {
                "id": "ship-equation",
                "title": "船舶航向方程",
                "latex": "J\\ddot{\\theta}(t)+B\\dot{\\theta}(t)=Ku(t)",
                "region": {
                  "x": 0.5,
                  "y": 0.1,
                  "width": 0.38,
                  "height": 0.18
                },
                "blocks": [
                  {
