      ],
      "content_blocks": [
        {
          "id": "pole-origin-text",
          "type": "plain_text",
          "body": "极点名称来自几何直观——传递函数 G(s) 是复变函数。以 s 平面为底，|G(s)| 为高画成三维曲面，在分母根处 |G(s)|→∞，曲面竖起「极柱」。\n\n船舶 G(s)=(K/J)/[s(s+B/J)]，分母根：s=0，s=−B/J。这两个点就是系统的极点。"
        },
        {
          "id": "magnitude-surface",
          "type": "compute_spec",
          "spec_key": "pole_magnitude_3d",
          "description": "船舶 G(s) 对数幅值曲面 20log₁₀|G(s)| 在 s 平面上的三维图。s 平面为底（横 σ，纵 jω），高度=对数幅值(dB)。s=0 和 s=−B/J 处高峰（截顶处理）。",
          "default_view": "MATLAB 默认视角（方位角约 -37.5°、俯仰角约 30°），可看到两根极柱",
          "controls": [
            "水平拖拽绕垂直幅值轴旋转",
            "滚轮缩放",
            "俯视按钮（切换顶视图，查看极点红色标记与标签）",
            "自动旋转按钮（动态展示曲面与两根极柱的空间关系）"
          ],
          "reading_instruction": "找最高两根柱 → 切换俯视 → 看到两个 × 的坐标：s=0（原点，虚轴上），s=−B/J（左半平面实轴上）",
          "default_params": {
            "K": 5,
            "J": 1,
            "B": 2
          }
        },
        {
          "id": "phase-surface-ref",
          "type": "media",
          "asset": "1-2-fig-09-phase-surface.png",
          "caption": "相位方向函数 sin(arg G(s)) 随 s 平面位置改变，用来补充幅值曲面只显示极柱高度的局限；本页只观察方向变化，不展开复变函数主值分支。"
        },
        {
          "id": "pole-summary",
          "type": "bullet_list",
          "title": "极点两个属性",
          "items": [
            "极点位置由系统参数决定——J 和 B 决定 −B/J 在实轴的位置",
            "极点位置反过来决定系统行为——|G(s)| 的「柱」在哪里，响应就被哪里左右"
          ]
        }
      ],
