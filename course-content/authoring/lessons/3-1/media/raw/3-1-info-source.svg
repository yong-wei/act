<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="900" viewBox="0 0 1400 900">
  <rect width="1400" height="900" fill="#f8fafc"/>
  <text x="700" y="85" text-anchor="middle" font-size="42" font-family="PingFang SC, Microsoft YaHei, sans-serif" fill="#123a63" font-weight="700">3-1 核心主线总结</text>
  <g font-family="PingFang SC, Microsoft YaHei, sans-serif">
    <rect x="90" y="160" width="280" height="160" rx="24" fill="#e0f2fe" stroke="#38bdf8" stroke-width="3"/>
    <text x="230" y="220" text-anchor="middle" font-size="28" fill="#0f172a" font-weight="700">闭环特征方程</text>
    <text x="230" y="265" text-anchor="middle" font-size="21" fill="#334155">先找到闭环极点</text>
    <text x="230" y="300" text-anchor="middle" font-size="21" fill="#334155">再谈系统会怎样动</text>

    <rect x="420" y="160" width="280" height="160" rx="24" fill="#dcfce7" stroke="#22c55e" stroke-width="3"/>
    <text x="560" y="220" text-anchor="middle" font-size="28" fill="#0f172a" font-weight="700">稳定底线</text>
    <text x="560" y="265" text-anchor="middle" font-size="21" fill="#334155">左半平面衰减</text>
    <text x="560" y="300" text-anchor="middle" font-size="21" fill="#334155">右半平面放大</text>

    <rect x="750" y="160" width="280" height="160" rx="24" fill="#fef3c7" stroke="#f59e0b" stroke-width="3"/>
    <text x="890" y="220" text-anchor="middle" font-size="28" fill="#0f172a" font-weight="700">模态语言</text>
    <text x="890" y="265" text-anchor="middle" font-size="21" fill="#334155">实部看衰减快慢</text>
    <text x="890" y="300" text-anchor="middle" font-size="21" fill="#334155">虚部看振荡节奏</text>

    <rect x="1080" y="160" width="230" height="160" rx="24" fill="#ede9fe" stroke="#8b5cf6" stroke-width="3"/>
    <text x="1195" y="220" text-anchor="middle" font-size="28" fill="#0f172a" font-weight="700">主导极点</text>
    <text x="1195" y="265" text-anchor="middle" font-size="21" fill="#334155">靠近虚轴</text>
    <text x="1195" y="300" text-anchor="middle" font-size="21" fill="#334155">衰减最慢</text>

    <line x1="370" y1="240" x2="420" y2="240" stroke="#94a3b8" stroke-width="4"/>
    <line x1="700" y1="240" x2="750" y2="240" stroke="#94a3b8" stroke-width="4"/>
    <line x1="1030" y1="240" x2="1080" y2="240" stroke="#94a3b8" stroke-width="4"/>
  </g>
  <g font-family="PingFang SC, Microsoft YaHei, sans-serif">
    <rect x="170" y="470" width="1060" height="250" rx="26" fill="#ffffff" stroke="#cbd5e1" stroke-width="3"/>
    <text x="700" y="540" text-anchor="middle" font-size="30" fill="#123a63" font-weight="700">一句话收束</text>
    <text x="700" y="605" text-anchor="middle" font-size="26" fill="#0f172a">高阶系统并没有脱离前面学过的低阶语言</text>
    <text x="700" y="650" text-anchor="middle" font-size="24" fill="#334155">它只是把若干模态叠加在一起</text>
    <text x="700" y="695" text-anchor="middle" font-size="24" fill="#334155">多数时候，最靠近虚轴的少数极点决定主要动态</text>
  </g>
</svg>
