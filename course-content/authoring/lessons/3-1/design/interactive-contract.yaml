contract_version: '2.2'
lesson_id: '3-1'
course_title: '3-1：纯极点视角下的稳定、模态与双域近似'
course_route_segment: 'unit-3-1-pure-pole-stability-and-dynamics'
design_acceptance_focus:
  - '学生脱离讲稿后，仍能基于当前页面理解知识对象、判断动作和主线位置。'
  - '逐步显影只隐藏步骤，不隐藏题面、对象、目标问题与结论桥接。'
  - '主导极点近似必须同时保留时域证据与频域证据，不能退化为一句经验话。'
preview_mode:
  default_entry: 'student_demo'
  student_demo_base_path: '/interactive-learning/courses/unit-3-1-pure-pole-stability-and-dynamics/student/demo'
  teacher_preview_panel_note: '教师预览只检查课堂骨架；默认预览路径仍以学生演示页为准。'
telemetry_strategy: 'step_level_learning_evidence'
teacher_insight_strategy: 'misconception_and_progress_dual_track'
required_step_fields:
  - 'layout'
  - 'modules'
  - 'content_blocks'
  - 'evidence_sequence'
  - 'interaction_spec'
  - 'teacher_controls'
  - 'student_access'
  - 'telemetry_spec'
  - 'teacher_insight_spec'
  - 'ai_context_spec'
  - 'preview_contract'
  - 'acceptance_checks'
steps:
  step-01:
    title: '回到路径：从模块 2 的低阶直觉走向模块 3 的极点语言'
    layout:
      template: 'map_hero_slide'
      regions:
        - id: 'header'
          width: 'full'
          order: 1
        - id: 'lead'
          width: 'full'
          order: 2
        - id: 'summary'
          width: 'full'
          order: 3
    modules:
      - id: 'stage-map'
        region: 'lead'
        kind: 'stage-map'
        must_be_visible: true
      - id: 'today-task-card'
        region: 'lead'
        kind: 'question-card'
        must_be_visible: true
      - id: 'boundary-card'
        region: 'summary'
        kind: 'boundary-card'
        must_be_visible: true
    content_blocks:
      - id: 'path'
        type: 'plain_text'
        title: '路径定位'
        body: '固定高亮 2-4 -> 3-1 -> 3-2 -> 3-3，并写清 3-1 负责把模块 2 的低阶直觉推进到极点统领双域行为的语言。'
      - id: 'question'
        type: 'plain_text'
        title: '主问题'
        body: '高阶系统为什么仍常能用低阶模型解释主要动态。'
      - id: 'boundary'
        type: 'bullet_list'
        title: '边界'
        items:
          - '只讨论纯极点系统。'
          - '不进入劳斯判据、根轨迹、Nyquist/Bode 判稳与校正设计。'
    evidence_sequence:
      - '路径图'
      - '主问题卡'
      - '边界卡'
    interaction_spec:
      interaction_kind: 'none'
      student_task: '只阅读，不提交。'
      step_reveal_policy:
        mode: 'none'
    teacher_controls:
      release_activity: 'not_applicable'
      open_browse: 'not_applicable'
      teacher_step_reveal: 'not_applicable'
      reveal_reference_answer: 'not_applicable'
      instructor_demo_tools:
        - 'highlight_path_node'
    student_access:
      default_visibility: 'visible'
      release_required: false
      browse_required: false
      can_view_problem_statement: true
      can_view_derivation_steps: true
      can_submit_without_browse: true
    telemetry_spec:
      summary_fields:
        - 'viewed'
        - 'timeOnStep'
        - 'teacherFollowSync'
      result_policy: 'no_submission'
    teacher_insight_spec:
      widgets:
        - 'view_count'
        - 'sync_status'
      aggregation: 'step_level'
    ai_context_spec:
      page_goal: '标定本课在模块 3 中的入口位置。'
      allowed_scope:
        - '课程路径'
        - '模块 2 到模块 3 的切换'
      forbidden_scope:
        - '提前解释例题'
        - '提前给近似结论'
      canonical_facts:
        - '3-1 不是重复二阶指标。'
        - '3-1 负责建立极点语言。'
    preview_contract:
      route_kind: 'student_demo'
      demo_path: '/interactive-learning/courses/unit-3-1-pure-pole-stability-and-dynamics/student/demo?step=step-01'
      must_match_student_page: true
    acceptance_checks:
      - '首屏必须同时看到路径图、主问题卡和边界卡。'
      - '学生不看讲稿也能说出 3-1 为什么会出现在 2-4 之后。'

  step-02:
    title: '情境引入：同主导极点，为什么响应仍会分家'
    layout:
      template: 'triple_model_conflict'
      regions:
        - id: 'formula-strip'
          width: 'full'
          order: 1
        - id: 'media'
          width: 'full'
          order: 2
        - id: 'interaction'
          width: 'full'
          order: 3
    modules:
      - id: 'model-formula-row'
        region: 'formula-strip'
        kind: 'formula-card-row'
        must_be_visible: true
      - id: 'dominant-pole-note'
        region: 'formula-strip'
        kind: 'notice-card'
        must_be_visible: true
      - id: 'response-compare-figure'
        region: 'media'
        kind: 'comparison-graphic'
        must_be_visible: true
      - id: 'binary-vote'
        region: 'interaction'
        kind: 'binary-choice'
        must_be_visible: true
    content_blocks:
      - id: 'models'
        type: 'plain_text'
        title: '三模型'
        body: 'G_ref、G_A、G_B 共享同一对主导共轭极点 -0.8 ± j1.6，区别只在附加极点位置。'
      - id: 'conflict'
        type: 'plain_text'
        title: '冲突问题'
        body: '同主导极点是否足以保证主要响应接近。'
    evidence_sequence:
      - '三模型公式条'
      - '同主导极点附注'
      - '阶跃响应对照图'
      - '二选一判断'
    interaction_spec:
      interaction_kind: 'binary_choice'
      student_task: '判断是否还必须看附加模态退场快慢。'
      correct_answer: 'B'
      options:
        A: '只要主导极点相同，主要响应就应基本一致。'
        B: '还必须检查附加模态的退场快慢和时间尺度。'
      failure_feedback: '只提示“同主导极点并不自动等于同响应”。'
      answer_reveal: 'teacher_toggle'
    teacher_controls:
      release_activity: 'page_load_open'
      open_browse: 'not_applicable'
      teacher_step_reveal: 'not_applicable'
      reveal_reference_answer: 'teacher_toggle'
      instructor_demo_tools:
        - 'show_class_distribution'
    student_access:
      default_visibility: 'visible'
      release_required: false
      browse_required: false
      can_view_problem_statement: true
      can_view_derivation_steps: true
      can_submit_without_browse: true
    telemetry_spec:
      summary_fields:
        - 'selectedOption'
        - 'resultState'
        - 'teacherRevealSeen'
      result_policy: 'store_choice'
    teacher_insight_spec:
      widgets:
        - 'option_distribution'
        - 'misconception_rate'
      aggregation: 'step_level'
    ai_context_spec:
      page_goal: '压实时域主问题，不提前给出完整近似准则。'
      allowed_scope:
        - '主导极点'
        - '附加极点'
        - '响应差异'
      forbidden_scope:
        - '直接展开时域与频域全部规则'
      canonical_facts:
        - '主导极点重要，但不是唯一证据。'
    preview_contract:
      route_kind: 'student_demo'
      demo_path: '/interactive-learning/courses/unit-3-1-pure-pole-stability-and-dynamics/student/demo?step=step-02'
      must_match_student_page: true
    acceptance_checks:
      - '学生在未作答前必须看到三模型和阶跃响应对照图。'
      - '错误反馈不得提前给出完整近似准则。'

  step-03:
    title: '学习目标与课堂边界：本课负责什么，不负责什么'
    layout:
      template: 'goal_boundary_slide'
      regions:
        - id: 'goals'
          width: 'full'
          order: 1
        - id: 'chain'
          width: 'full'
          order: 2
        - id: 'boundary'
          width: 'full'
          order: 3
    modules:
      - id: 'goal-card-row'
        region: 'goals'
        kind: 'goal-card-row'
        must_be_visible: true
      - id: 'main-chain-card'
        region: 'chain'
        kind: 'formula-chain'
        must_be_visible: true
      - id: 'boundary-table'
        region: 'boundary'
        kind: 'comparison-table'
        must_be_visible: true
    content_blocks:
      - id: 'goals'
        type: 'bullet_list'
        title: '四项目标'
        items:
          - '会判稳定底线。'
          - '会把极点翻译成模态。'
          - '会用时域证据筛选近似。'
          - '会用频域证据复核近似。'
      - id: 'chain'
        type: 'plain_text'
        title: '主线'
        body: '稳定底线 -> 模态语言 -> 时域筛选 -> 频域复核 -> 卷积收束。'
      - id: 'boundary'
        type: 'table'
        title: '边界表'
        body: '不进入劳斯判据、根轨迹、Nyquist/Bode 判稳和校正设计。'
    evidence_sequence:
      - '四项目标'
      - '主线链'
      - '边界表'
    interaction_spec:
      interaction_kind: 'none'
      student_task: '只建立课程边界。'
      step_reveal_policy:
        mode: 'none'
    teacher_controls:
      release_activity: 'not_applicable'
      open_browse: 'not_applicable'
      teacher_step_reveal: 'not_applicable'
      reveal_reference_answer: 'not_applicable'
      instructor_demo_tools:
        - 'highlight_goal'
        - 'highlight_boundary_row'
    student_access:
      default_visibility: 'visible'
      release_required: false
      browse_required: false
      can_view_problem_statement: true
      can_view_derivation_steps: true
      can_submit_without_browse: true
    telemetry_spec:
      summary_fields:
        - 'viewed'
        - 'timeOnStep'
      result_policy: 'no_submission'
    teacher_insight_spec:
      widgets:
        - 'view_count'
      aggregation: 'step_level'
    ai_context_spec:
      page_goal: '建立本课任务边界。'
      allowed_scope:
        - '课程目标'
        - '本课负责'
        - '本课不负责'
      forbidden_scope:
        - '提前进入下一课方法'
      canonical_facts:
        - '3-1 只建立纯极点语言。'
    preview_contract:
      route_kind: 'student_demo'
      demo_path: '/interactive-learning/courses/unit-3-1-pure-pole-stability-and-dynamics/student/demo?step=step-03'
      must_match_student_page: true
    acceptance_checks:
      - '目标、主线和边界必须同屏。'
      - '学生不看讲稿也能说出本课不负责哪些内容。'

  step-04:
    title: '前测：稳定、主导极点与“可忽略”直觉判断'
    layout:
      template: 'question_stack'
      regions:
        - id: 'prompt'
          width: 'full'
          order: 1
        - id: 'questions'
          width: 'full'
          order: 2
        - id: 'notes'
          width: 'full'
          order: 3
    modules:
      - id: 'misconception-note'
        region: 'prompt'
        kind: 'bullet-card'
        must_be_visible: true
      - id: 'pretest-card-group'
        region: 'questions'
        kind: 'quiz-group'
        must_be_visible: true
      - id: 'reason-reminder'
        region: 'notes'
        kind: 'notice-card'
        must_be_visible: true
    content_blocks:
      - id: 'misconceptions'
        type: 'bullet_list'
        title: '常见混淆'
        items:
          - '稳定不等于表现已经够好。'
          - '同主导极点不等于同响应。'
          - '更靠左不是无条件可忽略。'
      - id: 'reason'
        type: 'plain_text'
        title: '理由要求'
        body: '每题都要写一句为什么。'
    evidence_sequence:
      - '常见混淆'
      - '三道题面'
      - '理由提示'
    interaction_spec:
      interaction_kind: 'quiz_group'
      student_task: '完成三道前测题。'
      attempt_model: '允许重提一次，教师端区分首答与重提。'
      activity_cards:
        - id: 'pretest-q1'
          prompt: '稳定的系统是否就代表它的动态表现已经足够好。'
          response_kind: 'single_choice'
          submit_scope: 'per_card'
          layout_span: 'full'
        - id: 'pretest-q2'
          prompt: '两个系统若拥有同一对主导共轭极点，单位阶跃响应是否就会几乎一样。'
          response_kind: 'single_choice'
          submit_scope: 'per_card'
          layout_span: 'full'
        - id: 'pretest-q3'
          prompt: '附加极点位于 -5 与 -1.4 时，哪一个更可能被忽略，并说明理由。'
          response_kind: 'fill_text'
          submit_scope: 'per_card'
          layout_span: 'full'
      answer_reveal: 'teacher_toggle'
    teacher_controls:
      release_activity: 'teacher_toggle'
      open_browse: 'not_applicable'
      teacher_step_reveal: 'not_applicable'
      reveal_reference_answer: 'teacher_toggle'
      instructor_demo_tools:
        - 'show_question_distribution'
        - 'show_top_misconceptions'
    student_access:
      default_visibility: 'hidden'
      release_required: true
      browse_required: false
      can_view_problem_statement: true
      can_view_derivation_steps: true
      can_submit_without_browse: true
    telemetry_spec:
      summary_fields:
        - 'attemptCount'
        - 'resultState'
        - 'errorBucket'
      misconception_tags:
        - 'stable_not_equal_good'
        - 'same_dominant_not_same_response'
        - 'left_more_not_absolute'
    teacher_insight_spec:
      widgets:
        - 'question_distribution'
        - 'top_misconceptions'
      aggregation: 'step_level'
    ai_context_spec:
      page_goal: '暴露起点误区。'
      allowed_scope:
        - '错因归类'
        - '术语纠偏'
      forbidden_scope:
        - '代替作答'
      canonical_facts:
        - '前测用于暴露误区，不用于直接给结论。'
    preview_contract:
      route_kind: 'student_demo'
      demo_path: '/interactive-learning/courses/unit-3-1-pure-pole-stability-and-dynamics/student/demo?step=step-04'
      must_match_student_page: true
    acceptance_checks:
      - '题组释放后，三道题面必须完整可见。'
      - '教师端必须能看到三类错因的聚合。'

  step-05:
    title: '稳定底线：先回答“能不能谈近似”'
    layout:
      template: 'formula_plane_reason'
      regions:
        - id: 'formula'
          width: 'full'
          order: 1
        - id: 'media'
          width: 'full'
          order: 2
        - id: 'interaction'
          width: 'full'
          order: 3
    modules:
      - id: 'characteristic-equation-card'
        region: 'formula'
        kind: 'formula-card'
        must_be_visible: true
      - id: 'stability-rule-list'
        region: 'formula'
        kind: 'bullet-card'
        must_be_visible: true
      - id: 'half-plane-figure'
        region: 'media'
        kind: 'illustration'
        must_be_visible: true
      - id: 'reason-check-card'
        region: 'interaction'
        kind: 'reason-check'
        must_be_visible: true
    content_blocks:
      - id: 'formula'
        type: 'formula'
        title: '稳定起点'
        value: 'D(s)=0'
      - id: 'rules'
        type: 'bullet_list'
        title: '三种情况'
        items:
          - '全部极点实部小于 0：渐近稳定。'
          - '虚轴极点且右半平面无极点：临界稳定。'
          - '出现右半平面极点：存在发散模态。'
      - id: 'figure-note'
        type: 'plain_text'
        title: '判断任务'
        body: '先判断能不能谈近似，再谈近似如何做。'
    evidence_sequence:
      - '特征方程卡'
      - '稳定规则'
      - '半平面图'
      - '判断卡'
    interaction_spec:
      interaction_kind: 'reason_check'
      student_task: '判断若存在虚轴根或右半平面根，是否还能直接谈高阶近似。'
      response_kind: 'fill_text'
      answer_reveal: 'teacher_toggle'
    teacher_controls:
      release_activity: 'teacher_toggle'
      open_browse: 'not_applicable'
      teacher_step_reveal: 'not_applicable'
      reveal_reference_answer: 'teacher_toggle'
      instructor_demo_tools:
        - 'highlight_half_plane_region'
    student_access:
      default_visibility: 'hidden'
      release_required: true
      browse_required: false
      can_view_problem_statement: true
      can_view_derivation_steps: true
      can_submit_without_browse: true
    telemetry_spec:
      summary_fields:
        - 'predictionSubmitted'
        - 'reasonLength'
        - 'teacherRevealSeen'
      result_policy: 'store_reason'
    teacher_insight_spec:
      widgets:
        - 'prediction_distribution'
        - 'reason_tag_cloud'
      aggregation: 'step_level'
    ai_context_spec:
      page_goal: '立住稳定底线。'
      allowed_scope:
        - '特征方程'
        - '半平面'
        - '稳定语言'
      forbidden_scope:
        - '劳斯表与参数可行域'
      canonical_facts:
        - '稳定判定先回答是否会失控。'
        - '本页还不讨论动态品质。'
    preview_contract:
      route_kind: 'student_demo'
      demo_path: '/interactive-learning/courses/unit-3-1-pure-pole-stability-and-dynamics/student/demo?step=step-05'
      must_match_student_page: true
    acceptance_checks:
      - '特征方程、规则和半平面图必须在未作答状态下完整可见。'
      - '判断卡不能取代静态规则区。'

  step-06:
    title: '从极点到模态：极点为什么会直接写进响应'
    layout:
      template: 'formula_story_board'
      regions:
        - id: 'decomposition'
          width: 'full'
          order: 1
        - id: 'response'
          width: 'full'
          order: 2
        - id: 'meaning'
          width: 'full'
          order: 3
        - id: 'interaction'
          width: 'full'
          order: 4
    modules:
      - id: 'partial-fraction-card'
        region: 'decomposition'
        kind: 'formula-card'
        must_be_visible: true
      - id: 'impulse-response-card'
        region: 'response'
        kind: 'formula-card'
        must_be_visible: true
      - id: 'meaning-table'
        region: 'meaning'
        kind: 'comparison-table'
        must_be_visible: true
      - id: 'triple-match'
        region: 'interaction'
        kind: 'triple-match'
        must_be_visible: true
    content_blocks:
      - id: 'decomposition'
        type: 'formula'
        title: '部分分式'
        value: 'G(s)=\\sum_{i=1}^{m}\\sum_{r=1}^{q_i}\\frac{A_{i,r}}{(s-p_i)^r}'
      - id: 'response'
        type: 'formula'
        title: '脉冲响应'
        value: 'g(t)=\\sum_{i=1}^{m}\\sum_{r=1}^{q_i}\\frac{A_{i,r}}{(r-1)!}t^{r-1}e^{p_i t}'
      - id: 'meaning'
        type: 'bullet_list'
        title: '含义对照'
        items:
          - '实部决定衰减或增长速度。'
          - '虚部决定振荡频率。'
          - '重数引入 t、t^2 等多项式因子。'
          - '留数决定模态权重和方向。'
    evidence_sequence:
      - '部分分式'
      - '脉冲响应'
      - '含义表'
      - '配对区'
    interaction_spec:
      interaction_kind: 'triple_match'
      student_task: '把实部、虚部、重数、留数与它们控制的响应特征对应起来。'
      answer_reveal: 'instant_feedback'
    teacher_controls:
      release_activity: 'page_load_open'
      open_browse: 'not_applicable'
      teacher_step_reveal: 'not_applicable'
      reveal_reference_answer: 'teacher_toggle'
      instructor_demo_tools:
        - 'reset_match'
    student_access:
      default_visibility: 'visible'
      release_required: false
      browse_required: false
      can_view_problem_statement: true
      can_view_derivation_steps: true
      can_submit_without_browse: true
    telemetry_spec:
      summary_fields:
        - 'matchAttempted'
        - 'matchCorrected'
        - 'timeOnStep'
      result_policy: 'store_match_result'
    teacher_insight_spec:
      widgets:
        - 'common_mismatch_pairs'
        - 'completion_rate'
      aggregation: 'step_level'
    ai_context_spec:
      page_goal: '把极点和响应式直接连接起来。'
      allowed_scope:
        - '部分分式'
        - '脉冲响应'
        - '模态含义'
      forbidden_scope:
        - '提前进入主导极点近似结论'
      canonical_facts:
        - '极点不是抽象标签，而是运动模态。'
    preview_contract:
      route_kind: 'student_demo'
      demo_path: '/interactive-learning/courses/unit-3-1-pure-pole-stability-and-dynamics/student/demo?step=step-06'
      must_match_student_page: true
    acceptance_checks:
      - '两条公式必须在首屏完整出现。'
      - '配对区只强化含义，不得替代公式和表。'

  step-07:
