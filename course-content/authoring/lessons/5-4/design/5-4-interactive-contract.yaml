        - { id: 'mpc-elements', title: 'MPC 三要素', prompt: 'MPC 的三个核心要素是什么？', response_kind: 'multi_select', submit_scope: 'per_card', layout_span: 'half', options: ['模型预测', '优化权衡', '显式约束', '取消模型'], reference_answer: ['模型预测', '优化权衡', '显式约束'] }
    teacher_controls: *quiz_controls
    student_access: *released_activity_access
    telemetry_spec: { summary_fields: ['cardSubmitted', 'timeOnStep'], misconception_tags: ['mpc_as_solver_only'] }
    teacher_insight_spec: { widgets: ['choice_distribution', 'completion_rate'], aggregation: 'step_level' }
    ai_context_spec: { delivery_mode: 'hidden_page_context', page_goal: '解释 MPC 的模型预测、优化和约束结构。' }
