contract_version: '2.2'
lesson_id: '5-4'
course_title: '5-4：从模型驱动到数据驱动'
course_route_segment: 'unit-5-4-data-driven-mpc-transition'
preview_mode:
  default_entry: 'student_demo'
  student_demo_base_path: '/interactive-learning/courses/unit-5-4-data-driven-mpc-transition/student/demo'
media_policy:
  runtime_only: true
  runtime_media_base: '/course-runtime/lessons/5-4/media'
telemetry_strategy: 'step_level_learning_evidence'
teacher_insight_strategy: 'step_level_aggregation_only'
required_step_fields: [layout, modules, content_blocks, evidence_sequence, interaction_spec, teacher_controls, student_access, telemetry_spec, teacher_insight_spec, ai_context_spec, preview_contract, acceptance_checks]

steps:
  step-01:
    title: '模型预测偏离真实对象的导入场景'
    layout: { template: 'intro_comic_problem_board', regions: [{ id: 'problem', width: 'full', order: 1 }, { id: 'media', width: 'full', order: 2 }, { id: 'summary', width: 'full', order: 3 }] }
    modules:
      - { id: 'entry-problem', title: '迁移问题入口', region: 'problem', kind: 'summary-card', must_be_visible: true, payload: { block_key: 'problem' } }
      - { id: 'cover-comic', title: '导入漫画', region: 'media', kind: 'image-panel', must_be_visible: true, payload: { src: '/course-runtime/lessons/5-4/media/5-4-cover-comic.png', caption_key: 'cover_caption' } }
      - { id: 'entry-summary', title: '证据责任收束', region: 'summary', kind: 'summary-card', must_be_visible: true, payload: { block_key: 'summary' } }
    content_blocks:
      problem: { type: 'plain_text', body: '一艘自主船在近岸航道中航行，名义模型仍能解释船体运动，但载荷、海况、横流和规划参考不断变化。控制系统应继续完全相信原模型、直接交给数据驱动，还是先判断模型和数据各自承担什么责任。' }
      cover_caption: '传统模型设计台上的预测轨迹与真实对象逐渐分离，MPC 位于模型驱动和数据驱动之间，数据样本、算力消耗、泛化风险和验证工序依次出现。'
      summary: { type: 'plain_text', body: '本课讨论的不是模型和数据二选一，而是在同一闭环中重新分配模型、数据、优化和安全保护的证据责任。' }
    evidence_sequence: ['迁移问题句', '封面漫画', '证据责任收束']
    interaction_spec: { interaction_kind: 'none', student_task: '阅读导入场景，不提交。', activity_cards: [] }
    teacher_controls: &no_controls { release_activity: 'not_applicable', open_browse: 'page_load_open', teacher_step_reveal: 'not_applicable', reveal_reference_answer: 'not_applicable' }
    student_access: &visible_access { default_visibility: 'visible', activity_visibility: 'hidden', release_required: false, browse_required: false, can_view_problem_statement: true, can_view_derivation_steps: true, can_submit_without_browse: false }
    telemetry_spec: { summary_fields: ['viewed', 'timeOnStep'], result_policy: 'no_submission' }
    teacher_insight_spec: { widgets: ['view_count'], aggregation: 'step_level' }
    ai_context_spec: { delivery_mode: 'hidden_page_context', page_goal: '从模型预测偏离真实对象的场景进入方法迁移判断。' }
    preview_contract: { route_kind: 'student_demo', demo_path: '/interactive-learning/courses/unit-5-4-data-driven-mpc-transition/student/demo?step=step-01', must_match_student_page: true }
    acceptance_checks: ['导入页不设置作答题；漫画必须提出模型、数据和工程责任问题。']

  step-02:
    title: '本次课程目标'
    layout: { template: 'goal_statement_board', regions: [{ id: 'goals', width: 'full', order: 1 }] }
    modules:
      - { id: 'goal-list', title: '完成本次课程后，学习者能够', region: 'goals', kind: 'objective-list', must_be_visible: true, payload: { block_key: 'goals' } }
    content_blocks:
      goals: { type: 'bullet_list', items: ['解释模型驱动控制依赖对象关系、参数可信度和约束表达的原因。', '比较传统固定控制、名义模型 MPC 与数据驱动模型 MPC 在预测、优化和约束处理上的差异。', '判断数据驱动方法进入闭环前必须满足的数据、算力、验证和泛化条件。', '评估复杂自主航行任务中哪些关系应继续由模型承担，哪些关系可以由数据补足。'] }
    evidence_sequence: ['布鲁姆能力目标单列表']
    interaction_spec: { interaction_kind: 'none', student_task: '阅读本次课程目标。', activity_cards: [] }
    teacher_controls: *no_controls
    student_access: *visible_access
    telemetry_spec: { summary_fields: ['viewed', 'timeOnStep'], result_policy: 'no_submission' }
    teacher_insight_spec: { widgets: ['view_count'], aggregation: 'step_level' }
    ai_context_spec: { delivery_mode: 'hidden_page_context', page_goal: '呈现 5-4 的四项能力目标。' }
    preview_contract: { route_kind: 'student_demo', demo_path: '/interactive-learning/courses/unit-5-4-data-driven-mpc-transition/student/demo?step=step-02', must_match_student_page: true }
    acceptance_checks: ['目标页只出现本次课程目标。']

  step-03:
    title: '前置基础快测'
    layout: { template: 'quiz_group_board', regions: [{ id: 'quiz', width: 'full', order: 1 }] }
    modules:
      - { id: 'pretest-quiz', title: '预备知识题组', region: 'quiz', kind: 'quiz-group', must_be_visible: false, payload: { activity_card_ids: ['first-order-parameter', 'closed-loop-error', 'rudder-limit'] } }
    content_blocks: {}
    evidence_sequence: ['三道客观题']
    interaction_spec:
      interaction_kind: 'quiz_group'
      student_task: '完成三道预备知识题。'
      activity_cards:
        - { id: 'first-order-parameter', title: '一阶对象参数影响', prompt: '一阶对象 $G(s)=K/(Ts+1)$ 中，若 $K$ 变小且 $T$ 变大，在相同阶跃输入下，输出响应最可能表现为：', response_kind: 'single_choice', submit_scope: 'per_card', layout_span: 'one_third', options: ['稳态变化幅度变小且响应变慢', '稳态变化幅度变大且响应变快', '输出不受参数变化影响'], reference_answer: '稳态变化幅度变小且响应变慢' }
        - { id: 'closed-loop-error', title: '闭环误差含义', prompt: '闭环跟踪问题中，$e(t)=r(t)-y(t)$ 的含义是：', response_kind: 'single_choice', submit_scope: 'per_card', layout_span: 'one_third', options: ['参考输入与实际输出之间的误差', '执行器允许的最大输入', '对象模型的时间常数'], reference_answer: '参考输入与实际输出之间的误差' }
        - { id: 'rudder-limit', title: '执行限幅含义', prompt: '舵角限制 $|\delta|\le 12^\circ$ 的直接含义是：', response_kind: 'single_choice', submit_scope: 'per_card', layout_span: 'one_third', options: ['控制指令超过边界时实际舵角仍被限制', '船舶一定没有稳态误差', '模型参数不会漂移'], reference_answer: '控制指令超过边界时实际舵角仍被限制' }
    teacher_controls: &quiz_controls { release_activity: 'teacher_toggle', open_browse: 'page_load_open', teacher_step_reveal: 'not_applicable', reveal_reference_answer: 'teacher_toggle' }
    student_access: &released_activity_access { default_visibility: 'visible', activity_visibility: 'hidden', release_required: true, browse_required: false, can_view_problem_statement: true, can_view_derivation_steps: true, can_submit_without_browse: true }
    telemetry_spec: { summary_fields: ['quizSubmitted', 'cardSubmitted', 'timeOnStep'], misconception_tags: ['parameter_effect_error', 'closed_loop_error_error', 'limit_meaning_error'] }
    teacher_insight_spec: { widgets: ['quiz_completion_rate', 'choice_distribution'], aggregation: 'step_level' }
    ai_context_spec: { delivery_mode: 'hidden_page_context', page_goal: '考察知识点：一阶对象 $G(s)=K/(Ts+1)$ 的参数影响、闭环误差 $e(t)=r(t)-y(t)$、执行限幅 $|\delta|\le 12^\circ$。' }
    preview_contract: { route_kind: 'student_demo', demo_path: '/interactive-learning/courses/unit-5-4-data-driven-mpc-transition/student/demo?step=step-03', must_match_student_page: true }
    acceptance_checks: ['前测全部为客观题，不提前考察本课后续方法迁移判断。']

  step-04:
    title: '模型驱动控制的可解释关系'
    layout: { template: 'formula_concept_board', regions: [{ id: 'formula', width: 'full', order: 1 }, { id: 'activity', width: 'full', order: 2 }] }
    modules:
      - { id: 'model-formula', title: '离散对象关系', region: 'formula', kind: 'formula-card', must_be_visible: true, payload: { block_key: 'formula_block' } }
      - { id: 'model-activity', title: '模型关系判断', region: 'activity', kind: 'activity-card-set', must_be_visible: false, payload: { activity_card_ids: ['model-advantage', 'model-evidence'] } }
    content_blocks:
      formula_block: { type: 'formula_group', formulas: ['x_{k+1}=f(x_k,u_k,p_k)', 'y_k=h(x_k,u_k)'], symbols: [{ symbol: 'x_k', meaning: '状态' }, { symbol: 'u_k', meaning: '控制输入' }, { symbol: 'y_k', meaning: '输出' }, { symbol: 'p_k', meaning: '参数或外部条件' }, { symbol: 'f(\cdot)', meaning: '状态更新关系' }, { symbol: 'h(\cdot)', meaning: '输出关系' }], explanation: '若 $f(\cdot)$ 和 $h(\cdot)$ 的结构可信，就能追踪输入、状态、输出和参数变化之间的关系。' }
    evidence_sequence: ['离散模型公式', '符号说明', '两张判断卡']
    interaction_spec:
      interaction_kind: 'activity_card_set'
      student_task: '判断模型驱动控制的证据来源。'
      activity_cards:
        - { id: 'model-advantage', title: '模型驱动优势来源', prompt: '模型驱动控制的优势主要来自什么？', response_kind: 'single_choice', submit_scope: 'per_card', layout_span: 'half', options: ['可追溯的对象关系', '页面图像数量', '样本越多越安全'], reference_answer: '可追溯的对象关系' }
        - { id: 'model-evidence', title: '模型结构可信后的证据', prompt: '模型结构可信时，哪些判断更容易建立证据？', response_kind: 'multi_select', submit_scope: 'per_card', layout_span: 'half', options: ['稳定性', '性能', '约束影响', '不需要验证'], reference_answer: ['稳定性', '性能', '约束影响'] }
    teacher_controls: *quiz_controls
    student_access: *released_activity_access
    telemetry_spec: { summary_fields: ['cardSubmitted', 'timeOnStep'], misconception_tags: ['model_explainability_ignored'] }
    teacher_insight_spec: { widgets: ['card_completion_rate', 'choice_distribution'], aggregation: 'step_level' }
    ai_context_spec: { delivery_mode: 'hidden_page_context', page_goal: '模型驱动控制先把对象动态关系写清楚，再根据这个关系分析稳定性、性能和约束。' }
    preview_contract: { route_kind: 'student_demo', demo_path: '/interactive-learning/courses/unit-5-4-data-driven-mpc-transition/student/demo?step=step-04', must_match_student_page: true }
    acceptance_checks: ['公式、符号说明和模型驱动优势必须同页出现。']

  step-05:
    title: '单一模型在复杂链路中的压力'
    layout: { template: 'pressure_table_board', regions: [{ id: 'table', width: 'full', order: 1 }, { id: 'activity', width: 'full', order: 2 }] }
    modules:
      - { id: 'pressure-table', title: '单一模型压力表', region: 'table', kind: 'native-table', must_be_visible: true, payload: { block_key: 'pressure_table' } }
      - { id: 'pressure-match', title: '压力来源匹配', region: 'activity', kind: 'activity-card', must_be_visible: false, payload: { activity_card_ids: ['pressure-match'] } }
    content_blocks:
      pressure_table: { type: 'native_table', columns: ['压力来源', '表现', '设计风险'], rows: [['参数难以固定', '同一控制律在不同载荷、速度或海况下表现差异明显', '设计点附近有效，迁移到其他工况后性能下降'], ['约束不断进入闭环', '舵角、舵速、推进器功率或安全距离约束反复生效', '无约束设计给出的控制动作不可执行'], ['链路输入质量变化', '感知误差、估计延迟和规划调整改变控制参考', '控制器修正的对象不再等同于设计时的对象']] }
    evidence_sequence: ['三类压力表', '完整现象匹配题']
    interaction_spec:
      interaction_kind: 'drag_match'
      student_task: '把三个完整现象匹配到三类模型压力。'
      activity_cards:
        - id: 'pressure-match'
          title: '复杂链路压力来源匹配'
          prompt: '将左侧完整现象匹配到右侧压力类别。'
          response_kind: 'drag_match'
          submit_scope: 'per_card'
          layout_span: 'full'
          match_items:
            - { value: 'load-change', label: '同一套控制律在空载试验中响应合适，但船舶满载后航向变化明显变慢，原设计点附近得到的参数不再代表当前工况。' }
            - { value: 'rudder-boundary', label: '控制器计算出的修正舵角多次超过舵角或舵速上限，实际执行器只能按边界输出，控制动作无法按无约束计算结果落地。' }
            - { value: 'chain-input', label: '上游感知误差、估计延迟或规划模块突然改写参考航向，使控制器接收到的参考和反馈不再等同于设计时的单一对象输入。' }
          match_options:
            - { value: 'parameter-drift', label: '参数难以固定：载荷、速度、海况或对象有效参数变化，使同一模型只在局部工况内可信。' }
            - { value: 'active-constraints', label: '约束不断进入闭环：舵角、舵速、推进器功率或安全距离限制反复生效，使无约束设计给出的动作不可执行。' }
            - { value: 'chain-input-quality', label: '链路输入质量变化：感知、估计和规划环节改变控制参考或反馈质量，使控制器面对的对象不再等同于设计对象。' }
          reference_matches:
            - { item: 'load-change', option: 'parameter-drift' }
            - { item: 'rudder-boundary', option: 'active-constraints' }
            - { item: 'chain-input', option: 'chain-input-quality' }
          options:
            - { value: 'parameter-drift', label: '参数难以固定：载荷、速度、海况或对象有效参数变化，使同一模型只在局部工况内可信。' }
            - { value: 'active-constraints', label: '约束不断进入闭环：舵角、舵速、推进器功率或安全距离限制反复生效，使无约束设计给出的动作不可执行。' }
            - { value: 'chain-input-quality', label: '链路输入质量变化：感知、估计和规划环节改变控制参考或反馈质量，使控制器面对的对象不再等同于设计对象。' }
          reference_answer: '现象 1 -> 参数难以固定；现象 2 -> 约束不断进入闭环；现象 3 -> 链路输入质量变化。'
    teacher_controls: *quiz_controls
    student_access: *released_activity_access
    telemetry_spec: { summary_fields: ['cardSubmitted', 'timeOnStep'], misconception_tags: ['pressure_source_mismatch'] }
    teacher_insight_spec: { widgets: ['match_distribution', 'completion_rate'], aggregation: 'step_level' }
    ai_context_spec: { delivery_mode: 'hidden_page_context', page_goal: '模型压力来自模型独自承担的任务过重，而不是模型失去价值。' }
    preview_contract: { route_kind: 'student_demo', demo_path: '/interactive-learning/courses/unit-5-4-data-driven-mpc-transition/student/demo?step=step-05', must_match_student_page: true }
    acceptance_checks: ['匹配题必须使用完整现象和完整类别表述。']

  step-06:
    title: '名义航向模型预测偏差读图'
    layout: { template: 'prediction_error_figure_board', regions: [{ id: 'problem', width: 'full', order: 1 }, { id: 'panel', width: 'full', order: 2 }, { id: 'activity', width: 'full', order: 3 }] }
    modules:
      - { id: 'prediction-problem', title: '航向模型题面', region: 'problem', kind: 'summary-card', must_be_visible: true, payload: { block_key: 'problem' } }
      - { id: 'prediction-panel', title: '预测偏差读图面板', region: 'panel', kind: 'interactive-figure-panel', must_be_visible: true, payload: { panel_id: 'rust_prediction_error_panel', fallback_image: '/course-runtime/lessons/5-4/media/5-4-model-mismatch-prediction.png', block_key: 'figure_reading' } }
      - { id: 'prediction-submit', title: '观察记录提交', region: 'activity', kind: 'activity-card', must_be_visible: false, payload: { activity_card_ids: ['prediction-observation'] } }
    content_blocks:
      problem: { type: 'plain_text', body: '名义模型 $K_m=0.18$，$T_m=8.0\ \mathrm{s}$，真实对象 $K_a=0.125$，$T_a=11.5\ \mathrm{s}$。同一舵角序列输入后，名义模型预测更快转向，真实对象转向较慢。' }
      figure_reading: { type: 'plain_text', body: '先看红色名义预测和黑色真实对象的后段分离，再读最大预测误差约 $14.04^\circ$；最后看蓝色数据修正曲线把最大误差降至约 $5.48^\circ$。数据修正改善了当前预测，但还不能证明后段工况一定可信。' }
    evidence_sequence: ['完整题面', '三曲线读图', '误差读数', '观察提交']
    interactive_figure_spec:
      kind: 'rust_prediction_error_panel'
      baseline_media: '/course-runtime/lessons/5-4/media/5-4-model-mismatch-prediction.png'
      feasible_region_policy: 'not_applicable'
      parameter_controls: [{ id: 'series_visibility', label: '曲线显隐', options: ['名义预测', '真实对象', '数据修正预测'] }, { id: 'error_marker', label: '误差标注', options: ['最大误差', '早段误差', '后段误差'] }, { id: 'time_window', label: '观察区间', options: ['早段', '后段', '全段'] }]
      parameter_submit_spec: { submit_fields: ['time_window', 'max_error_reading', 'observation_text'] }
    interaction_spec:
      interaction_kind: 'interactive_figure_submit'
      student_task: '提交曲线观察区间、最大误差读数和一句判断。'
      activity_cards:
        - { id: 'prediction-observation', title: '预测偏差观察记录', prompt: '记录一个观察区间、一个最大误差读数，并说明预测误差下降说明什么、还不能说明什么。', response_kind: 'observation_text', submit_scope: 'per_card', layout_span: 'full', reference_answer: '预测误差下降说明当前数据修正能改善预测；还不能证明后段工况覆盖充分或闭环安全已经成立。' }
    teacher_controls: *quiz_controls
    student_access: *released_activity_access
    telemetry_spec: { summary_fields: ['figureSubmitted', 'timeOnStep'], misconception_tags: ['prediction_improvement_overclaim'] }
    teacher_insight_spec: { widgets: ['observation_keywords', 'submission_rate'], aggregation: 'step_level' }
    ai_context_spec: { delivery_mode: 'hidden_page_context', page_goal: '用三曲线读图区分预测改善和闭环安全证据。' }
    preview_contract: { route_kind: 'student_demo', demo_path: '/interactive-learning/courses/unit-5-4-data-driven-mpc-transition/student/demo?step=step-06', must_match_student_page: true }
    acceptance_checks: ['题面和三曲线含义常显；互动图形不加入可行域；不另设普通问答题。']

  step-07:
    title: 'MPC 的滚动预测与约束优化结构'
    layout: { template: 'mpc_formula_structure_board', regions: [{ id: 'media', width: 'full', order: 1 }, { id: 'formula', width: 'full', order: 2 }, { id: 'activity', width: 'full', order: 3 }] }
    modules:
      - { id: 'mpc-image', title: 'MPC 滚动优化原理框图', region: 'media', kind: 'image-panel', must_be_visible: true, payload: { src: '/course-runtime/lessons/5-4/media/5-4-mpc-principle-block.png', caption_key: 'caption' } }
      - { id: 'mpc-formula', title: '目标函数与约束', region: 'formula', kind: 'formula-card', must_be_visible: true, payload: { block_key: 'formula_block' } }
      - { id: 'mpc-activity', title: 'MPC 结构判断', region: 'activity', kind: 'activity-card-set', must_be_visible: false, payload: { activity_card_ids: ['first-action', 'mpc-elements'] } }
    content_blocks:
      caption: 'MPC 在每个采样时刻预测未来一段时间，求解带约束优化问题，只执行当前第一步控制动作。'
      formula_block: { type: 'formula_group', formulas: ['\min_{u_0,\ldots,u_{N-1}} \sum_{i=0}^{N-1}\left(\left\|y_{k+i}-r_{k+i}\right\|_Q^2+\left\|u_{k+i}\right\|_R^2\right)', 'x_{k+i+1}=f(x_{k+i},u_{k+i}),\quad y_{k+i}=h(x_{k+i}),\quad u_{\min}\le u_{k+i}\le u_{\max}'], symbols: [{ symbol: 'N', meaning: '预测时域' }, { symbol: 'r_{k+i}', meaning: '参考轨迹' }, { symbol: 'Q', meaning: '跟踪误差权重' }, { symbol: 'R', meaning: '控制代价权重' }, { symbol: 'u_{k+i}', meaning: '预测时域内第 $i$ 步控制输入' }, { symbol: 'u_{\min}', meaning: '控制输入下界' }, { symbol: 'u_{\max}', meaning: '控制输入上界' }], explanation: '预测一段、执行一步、再预测，是 MPC 在约束下处理动态变化的关键。' }
    evidence_sequence: ['MPC 框图', '目标函数', '约束式', '符号说明', '两张判断卡']
    interaction_spec:
