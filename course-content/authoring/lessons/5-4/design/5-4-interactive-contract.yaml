  step-10:
    title: '在线辨识与数据驱动 MPC 局部责任'
    layout: { template: 'online_update_reveal_board', regions: [{ id: 'intro', width: 'full', order: 1 }, { id: 'media', width: 'full', order: 2 }, { id: 'reveal', width: 'full', order: 3 }] }
    modules:
      - { id: 'online-intro', title: '局部责任说明', region: 'intro', kind: 'summary-card', must_be_visible: true, payload: { block_key: 'intro' } }
      - { id: 'online-image', title: '数据驱动 MPC 在线模型更新链路', region: 'media', kind: 'image-panel', must_be_visible: true, payload: { src: '/course-runtime/lessons/5-4/media/5-4-data-driven-mpc-block.png', caption_key: 'caption' } }
      - { id: 'online-reveal', title: '在线模型更新显影链', region: 'reveal', kind: 'step-reveal', must_be_visible: true, payload: { block_key: 'reveal_chain' } }
    content_blocks:
      intro: { type: 'plain_text', body: '把数据驱动放入 MPC 的保守做法，是保持控制目标、舵角约束和滚动优化结构不变，只改变预测模型的来源。' }
      caption: '数据模块从最近一段闭环数据中估计有效模型参数，再把结果交给 MPC 的预测模型；它不替代目标函数、约束和安全边界。'
      reveal_chain:
        type: 'reveal_chain'
        static_hint: '当前正在做什么：从闭环数据中更新预测模型，而不是重新发明控制目标。'
        items:
          - { title: '离散模型', body: '使用离散模型 $r_{j+1}=a r_j+b\delta_j+c$，其中本页的 $r_j$ 表示航向角速度，不表示参考轨迹；$\delta_j$ 是舵角，$c$ 吸收短时扰动偏置。' }
          - title: '参数换算'
            body: '估计得到 $\hat a_k,\hat b_k,\hat c_k$ 后，换算连续对象有效参数。'
            formula: '\hat T_k=\frac{\Delta t}{1-\hat a_k},\qquad \hat K_k=\frac{\hat b_k\hat T_k}{\Delta t},\qquad \hat d_k=\frac{\hat c_k}{\Delta t}'
          - { title: '激励不足', body: '闭环数据的激励可能不足，估计值会受到参考变化、舵角饱和和扰动共同影响。' }
          - { title: '工程保护', body: '工程上需要参数投影、平滑和保守预测，避免短时数据让模型突然跳到不合理范围。' }
          - { title: '局部责任', body: '本页结论是数据承担“更新预测模型”的局部职责，不替代 MPC 的目标函数、约束和安全边界。' }
    evidence_sequence: ['局部责任说明', '在线更新框图', '五层显影链']
    interaction_spec: { interaction_kind: 'step_reveal', student_task: '按教师节奏阅读在线模型更新链。', step_reveal_policy: { default_state: 'collapsed', teacher_step_reveal: true, open_browse_required: true }, activity_cards: [] }
    teacher_controls: &reveal_controls { release_activity: 'not_applicable', open_browse: 'teacher_toggle', teacher_step_reveal: 'teacher_controlled', reveal_reference_answer: 'not_applicable' }
    student_access: &reveal_access { default_visibility: 'visible', activity_visibility: 'hidden', release_required: false, browse_required: true, can_view_problem_statement: true, can_view_derivation_steps: false, can_submit_without_browse: false }
    telemetry_spec: { summary_fields: ['revealedSteps', 'timeOnStep'], result_policy: 'no_submission' }
    teacher_insight_spec: { widgets: ['reveal_progress', 'view_count'], aggregation: 'step_level' }
    ai_context_spec: { delivery_mode: 'hidden_page_context', page_goal: '说明在线辨识在数据驱动 MPC 中只承担局部预测模型更新责任。' }
    preview_contract: { route_kind: 'student_demo', demo_path: '/interactive-learning/courses/unit-5-4-data-driven-mpc-transition/student/demo?step=step-10', must_match_student_page: true }
    acceptance_checks: ['题面、框图和静态提示常显；显影链不能省略公式和工程保护。']

