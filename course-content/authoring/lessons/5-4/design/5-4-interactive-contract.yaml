      - { id: 'route-table', title: '三路线建模与控制信息', region: 'routes', kind: 'native-table', must_be_visible: true, payload: { block_key: 'route_table' } }
      - { id: 'route-match', title: '路线信息匹配', region: 'activity', kind: 'activity-card', must_be_visible: false, payload: { activity_card_ids: ['route-match'] } }
    content_blocks:
      problem: { type: 'plain_text', body: '名义模型 $G_m(s)=K_m/(T_m s+1)$，$K_m=0.18$，$T_m=8.0\ \mathrm{s}$。真实对象从 $K=0.18,T=8.0\ \mathrm{s}$ 漂移到 $K=0.065,T=18.0\ \mathrm{s}$；漂移从 $t=28\ \mathrm{s}$ 到 $t=108\ \mathrm{s}$，横流扰动从 $t=34\ \mathrm{s}$ 附近进入，规划参考在 $t=45\ \mathrm{s}$、$78\ \mathrm{s}$、$122\ \mathrm{s}$ 和 $152\ \mathrm{s}$ 调整。' }
      route_table: { type: 'native_table', columns: ['路线', '控制方式', '使用的模型与信息', '主要局限'], rows: [['传统固定控制', '基于名义模型整定的固定 PI/PID 航向控制', '只使用名义参数和当前误差', '不能显式处理预测窗口和约束'], ['名义模型 MPC', '滚动预测并显式限制舵角', '使用名义模型预测未来', '预测仍按旧对象进行'], ['数据驱动模型 MPC', '在同一 MPC 框架中使用运行数据修正有效模型', '估计有效增益、时间常数和扰动偏置', '需要数据覆盖、在线更新和额外验证']] }
    evidence_sequence: ['任务条件', '名义模型', '漂移范围', '三路线表', '路线匹配题']
    interaction_spec:
      interaction_kind: 'drag_match'
      student_task: '把三路线匹配到其使用信息和主要局限。'
      activity_cards:
        - { id: 'route-match', title: '三路线匹配', prompt: '将传统固定控制、名义模型 MPC、数据驱动模型 MPC 匹配到对应信息来源和主要局限。', response_kind: 'drag_match', submit_scope: 'per_card', layout_span: 'full', options: [{ value: 'fixed', label: '传统固定控制 -> 只使用名义参数和当前误差；不能显式处理预测窗口和约束' }, { value: 'nominal-mpc', label: '名义模型 MPC -> 使用名义模型预测未来；预测仍按旧对象进行' }, { value: 'data-mpc', label: '数据驱动模型 MPC -> 估计有效模型参数；需要数据覆盖、在线更新和额外验证' }], reference_answer: '三路线按表格信息匹配。' }
    teacher_controls: *quiz_controls
    student_access: *released_activity_access
    telemetry_spec: { summary_fields: ['cardSubmitted', 'timeOnStep'], misconception_tags: ['route_name_only_judgment'] }
    teacher_insight_spec: { widgets: ['match_distribution', 'completion_rate'], aggregation: 'step_level' }
    ai_context_spec: { delivery_mode: 'hidden_page_context', page_goal: '让学生在同一任务条件下比较三条控制路线。' }
    preview_contract: { route_kind: 'student_demo', demo_path: '/interactive-learning/courses/unit-5-4-data-driven-mpc-transition/student/demo?step=step-13', must_match_student_page: true }
    acceptance_checks: ['任务条件和三路线表必须常显，不能只给方法名称。']

  step-14:
    title: '三路线仿真结果与指标比较'
    layout: { template: 'three_route_rust_compare_board', regions: [{ id: 'intro', width: 'full', order: 1 }, { id: 'panel', width: 'full', order: 2 }, { id: 'activity', width: 'full', order: 3 }] }
    modules:
      - { id: 'route-compare-intro', title: '比较任务说明', region: 'intro', kind: 'summary-card', must_be_visible: true, payload: { block_key: 'intro' } }
      - { id: 'route-compare-panel', title: '三路线仿真比较面板', region: 'panel', kind: 'interactive-figure-panel', must_be_visible: true, payload: { panel_id: 'rust_three_route_compare_panel', fallback_images: ['/course-runtime/lessons/5-4/media/5-4-model-parameter-drift.png', '/course-runtime/lessons/5-4/media/5-4-mpc-drift-comparison.png'], block_key: 'metrics' } }
      - { id: 'route-observation', title: '收益与代价观察', region: 'activity', kind: 'activity-card', must_be_visible: false, payload: { activity_card_ids: ['route-observation'] } }
    content_blocks:
      intro: { type: 'plain_text', body: '本页比较性能收益和新增代价，不按单一指标给出方法排名。' }
      metrics: { type: 'native_table', columns: ['路线', '最大绝对误差', '累计绝对误差 IAE', '平均绝对误差', '舵角触边比例', '环境变化后平均绝对误差'], rows: [['传统固定控制', '25.41°', '1976.45 deg·s', '10.97°', '46.61%', '12.07°'], ['名义模型 MPC', '16.39°', '859.80 deg·s', '4.77°', '12.99%', '4.98°'], ['数据驱动模型 MPC', '12.19°', '622.52 deg·s', '3.45°', '19.31%', '3.45°']] }
    evidence_sequence: ['比较任务说明', '参数漂移图', '闭环航向图', '指标表', '观察提交']
    interactive_figure_spec:
      kind: 'rust_three_route_compare_panel'
      baseline_media: ['/course-runtime/lessons/5-4/media/5-4-model-parameter-drift.png', '/course-runtime/lessons/5-4/media/5-4-mpc-drift-comparison.png']
      feasible_region_policy: 'not_applicable'
      parameter_controls: [{ id: 'route_visibility', label: '路线显隐', options: ['传统固定控制', '名义模型 MPC', '数据驱动模型 MPC'] }, { id: 'metric_focus', label: '指标高亮', options: ['累计绝对误差 IAE', '最大误差', '舵角触边比例'] }, { id: 'time_window', label: '时间区间', options: ['漂移前', '漂移中', '漂移后', '全段'] }]
      parameter_submit_spec: { submit_fields: ['route', 'time_window', 'benefit', 'cost'] }
    interaction_spec:
      interaction_kind: 'interactive_figure_submit'
      student_task: '提交一个性能收益和一个新增代价。'
      activity_cards:
        - { id: 'route-observation', title: '性能收益与新增代价', prompt: '选择一条路线和一个观察区间，写出一个性能收益和一个新增代价。', response_kind: 'observation_text', submit_scope: 'per_card', layout_span: 'full', reference_answer: '数据驱动模型 MPC 可降低累计绝对误差 IAE，但舵角触边比例升高，需要数据覆盖、在线辨识稳定性和约束监控。' }
    teacher_controls: *quiz_controls
    student_access: *released_activity_access
    telemetry_spec: { summary_fields: ['figureSubmitted', 'timeOnStep'], misconception_tags: ['single_metric_ranking'] }
    teacher_insight_spec: { widgets: ['observation_keywords', 'submission_rate'], aggregation: 'step_level' }
    ai_context_spec: { delivery_mode: 'hidden_page_context', page_goal: '让学生同时报告三路线比较中的收益和代价。' }
    preview_contract: { route_kind: 'student_demo', demo_path: '/interactive-learning/courses/unit-5-4-data-driven-mpc-transition/student/demo?step=step-14', must_match_student_page: true }
    acceptance_checks: ['两张仿真图和指标表必须可见；不允许只按累计绝对误差 IAE 排名；不另设普通问答题。']

  step-15:
    title: '模型数据责任分配与边界情况'
    layout: { template: 'responsibility_boundary_board', regions: [{ id: 'table', width: 'full', order: 1 }, { id: 'boundary', width: 'full', order: 2 }, { id: 'activity', width: 'full', order: 3 }] }
    modules:
      - { id: 'responsibility-table', title: '复杂航行任务中的方法分配', region: 'table', kind: 'native-table', must_be_visible: true, payload: { block_key: 'responsibility_table' } }
      - { id: 'boundary-cases', title: '数据驱动控制的边界情况', region: 'boundary', kind: 'summary-card-grid', must_be_visible: true, payload: { block_key: 'boundary_cases' } }
      - { id: 'responsibility-activity', title: '责任分配判断', region: 'activity', kind: 'activity-card-set', must_be_visible: false, payload: { activity_card_ids: ['no-whole-switch', 'simulation-validation'] } }
    content_blocks:
      responsibility_table: { type: 'native_table', columns: ['关系对象', '优先方法', '数据驱动的合理作用'], rows: [['船体低速操纵动态', '模型驱动', '用数据更新参数或残差项'], ['舵角、舵速、功率约束', 'MPC / 约束优化', '估计约束触碰概率，但不能替代约束本身'], ['风浪流扰动', '模型 + 数据补偿', '预测短时扰动趋势'], ['感知误差分布', '数据统计与监控', '估计不同水域密度下的误差范围'], ['避碰参考轨迹变化', '规划与控制协同', '评估轨迹变化对控制负担的影响']] }
      boundary_cases: { type: 'card_grid', items: ['数据量大但覆盖不足：优先补边界样本和故障注入测试。', '模型很粗但责任仍要保留：舵角、功率和安全距离不能由学习器自行突破。', '在线计算无法满足采样周期：控制动作会滞后。', '仿真数据仍需真实验证：传感器、执行器和扰动分布差异必须检查。'] }
    evidence_sequence: ['方法分配表', '边界情况四格', '两张判断卡']
    interaction_spec:
      interaction_kind: 'activity_card_set'
      student_task: '判断模型、数据、优化和安全保护的分工。'
      activity_cards:
        - { id: 'no-whole-switch', title: '整体切换风险', prompt: '看到模型失配时，为什么不应整体切换到数据驱动？', response_kind: 'single_choice', submit_scope: 'per_card', layout_span: 'half', options: ['会丢失可解释性和安全边界，应先分配责任', '数据越多越不需要模型', '只要累计绝对误差 IAE 下降就可以部署'], reference_answer: '会丢失可解释性和安全边界，应先分配责任' }
        - { id: 'simulation-validation', title: '仿真数据真实验证', prompt: '仿真数据表现良好时，部署前仍需检查什么？', response_kind: 'multi_select', submit_scope: 'per_card', layout_span: 'half', options: ['真实对象差异', '传感器噪声', '执行器滞后', '扰动分布和异常工况'], reference_answer: ['真实对象差异', '传感器噪声', '执行器滞后', '扰动分布和异常工况'] }
    teacher_controls: *quiz_controls
    student_access: *released_activity_access
    telemetry_spec: { summary_fields: ['cardSubmitted', 'timeOnStep'], misconception_tags: ['model_data_binary_choice'] }
    teacher_insight_spec: { widgets: ['choice_distribution', 'completion_rate'], aggregation: 'step_level' }
    ai_context_spec: { delivery_mode: 'hidden_page_context', page_goal: '把数据驱动放回模型、优化和安全保护的证据责任链中。' }
    preview_contract: { route_kind: 'student_demo', demo_path: '/interactive-learning/courses/unit-5-4-data-driven-mpc-transition/student/demo?step=step-15', must_match_student_page: true }
    acceptance_checks: ['方法分配表和边界四格必须同页出现；不能把模型与数据写成二选一。']

  step-16:
    title: '后测：迁移条件与责任判断'
    layout: { template: 'posttest_board', regions: [{ id: 'header', width: 'full', order: 1 }, { id: 'quiz', width: 'full', order: 2 }] }
    modules:
      - { id: 'posttest-note', title: '后测说明', region: 'header', kind: 'summary-card', must_be_visible: true, payload: { block_key: 'note' } }
      - { id: 'posttest-quiz', title: '后测题组', region: 'quiz', kind: 'quiz-group', must_be_visible: false, payload: { activity_card_ids: ['error-reduction', 'closed-loop-evidence', 'local-duty'] } }
    content_blocks:
      note: { type: 'plain_text', body: '本页检查模型依赖松动、MPC 再定位、数据驱动进入条件和责任分配判断是否形成。' }
    evidence_sequence: ['后测说明', '三题题组', '提交反馈']
    interaction_spec:
      interaction_kind: 'quiz_group'
      student_task: '完成三题后测。'
      activity_cards:
        - { id: 'error-reduction', title: '误差降低比例', prompt: '某数据修正模型把最大预测误差从 9.6° 降到 4.8°，误差降低比例是多少？', response_kind: 'single_choice', submit_scope: 'per_card', layout_span: 'one_third', options: ['50%', '25%', '100%'], reference_answer: '50%' }
        - { id: 'closed-loop-evidence', title: '闭环证据补充', prompt: '误差降低后，仍需补充哪些闭环证据？', response_kind: 'multi_select', submit_scope: 'per_card', layout_span: 'one_third', options: ['数据覆盖', '闭环稳定性', '约束满足', '极端扰动表现', '模型过期识别'], reference_answer: ['数据覆盖', '闭环稳定性', '约束满足', '极端扰动表现', '模型过期识别'] }
        - { id: 'local-duty', title: '局部责任短答', prompt: '船体模型可靠，但感知误差随水域密度变化明显。写出一项数据驱动局部职责和一项必须保留的模型或规则职责。', response_kind: 'fill_text', submit_scope: 'per_card', layout_span: 'one_third', reference_answer: '数据可估计不同水域密度下的感知误差范围并转化为安全距离裕度；船体模型、执行器约束和安全保护仍需显式保留。' }
    teacher_controls: *quiz_controls
    student_access: *released_activity_access
    telemetry_spec: { summary_fields: ['quizSubmitted', 'cardSubmitted', 'timeOnStep'], misconception_tags: ['evidence_gap_ignored', 'local_duty_missing'] }
    teacher_insight_spec: { widgets: ['quiz_completion_rate', 'choice_distribution', 'short_answer_keywords'], aggregation: 'step_level' }
    ai_context_spec: { delivery_mode: 'hidden_page_context', page_goal: '检查迁移条件和责任分配判断是否形成。' }
    preview_contract: { route_kind: 'student_demo', demo_path: '/interactive-learning/courses/unit-5-4-data-driven-mpc-transition/student/demo?step=step-16', must_match_student_page: true }
    acceptance_checks: ['后测独立成页；题目不超过 3 题，最多一题短答。']

  step-17:
    title: '总结：数据驱动方法的收益与代价'
    layout: { template: 'summary_infograph_board', regions: [{ id: 'media', width: 'full', order: 1 }, { id: 'summary', width: 'full', order: 2 }, { id: 'stats', width: 'full', order: 3 }] }
    modules:
      - { id: 'info-image', title: '信息图总结', region: 'media', kind: 'image-panel', must_be_visible: true, payload: { src: '/course-runtime/lessons/5-4/media/5-4-info.png', caption_key: 'caption' } }
      - { id: 'summary-content', title: '收益、代价与边界', region: 'summary', kind: 'summary-card', must_be_visible: true, payload: { block_key: 'summary' } }
      - { id: 'learning-stats', title: '课堂表现统计', region: 'stats', kind: 'learning-stat-panel', must_be_visible: true, payload: { block_key: 'stats' } }
    content_blocks:
      caption: '信息图回看模型依赖松动、MPC 中间位置、数据驱动进入条件和责任分配。'
      summary: { type: 'section_list', sections: [{ title: '主要内容', body: '模型驱动的价值在于可解释对象关系、稳定性分析和约束表达；MPC 仍依赖模型，但把滚动预测和显式约束放入闭环核心；数据驱动能补足参数漂移、扰动模式和局部经验规律。' }, { title: '局限', body: '数据驱动不能取消目标、约束、安全保护和工程验证；预测误差下降不等于闭环部署已经安全。' }, { title: '重点难点', body: '区分模型失配和模型无用；区分数据覆盖和样本总量；区分性能收益和约束触边代价；区分局部数据补偿和整体黑箱替代。' }, { title: '拓展思考', body: '当模型预测误差下降但边界工况尚未覆盖时，保护策略如何设置；若数据模块只负责扰动预测，哪些稳定性和约束证据仍由模型主干提供；什么条件会让方法继续从数据驱动走向策略学习。' }] }
      stats: { type: 'stat_panel', student_fields: ['已浏览页面', '已提交互动', '前后测完成情况', '曲线观察提交次数', '关键误判标签'], teacher_fields: ['班级提交率', '前后测正确率', '三路线比较观察分布', '数据进入条件漏选项', '责任分配常见误判'] }
    evidence_sequence: ['信息图', '主要内容', '局限', '重点难点', '拓展思考', '表现统计']
    interaction_spec: { interaction_kind: 'none', student_task: '阅读总结并查看课堂表现统计。', activity_cards: [] }
    teacher_controls: *no_controls
    student_access: *visible_access
    telemetry_spec: { summary_fields: ['viewed', 'timeOnStep'], result_policy: 'no_submission' }
    teacher_insight_spec: { widgets: ['class_summary_stats', 'misconception_tags'], aggregation: 'lesson_level' }
    ai_context_spec: { delivery_mode: 'hidden_page_context', page_goal: '收束模型、数据、优化和安全保护的责任分配。' }
    preview_contract: { route_kind: 'student_demo', demo_path: '/interactive-learning/courses/unit-5-4-data-driven-mpc-transition/student/demo?step=step-17', must_match_student_page: true }
    acceptance_checks: ['总结页顶部必须显示信息图；后测与总结不得合并；学生端和教师端统计口径必须分开。']
