      compare_table: { type: 'native_table', columns: ['比较维度', '模型驱动', '数据驱动'], rows: [['主要依据', '物理关系、结构方程、传递函数、状态空间模型', '实验数据、运行数据、仿真数据、在线反馈'], ['解释路径', '从对象机理推导性能和稳定性', '从样本规律推断可用动作或预测关系'], ['优势', '可解释性较高，边界明确', '能吸收复杂对象和复杂环境中的经验规律'], ['代价', '建模成本高，模型失配会削弱可靠性', '数据质量、覆盖范围、泛化和验证成本更高'], ['风险', '过度相信简化模型', '过度相信样本规律']] }
