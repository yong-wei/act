        rows:
          - ['任务目标', '更快跟踪给定航向', '压低横摇角与扰动放大']
          - ['主要读数', '调节时间、ITAE、ITSE', 'RMS(φ)、扰动通道峰值、RMS(u)']
          - ['输入特征', '给定变化主导', '波浪扰动主导']
      rms_explanation:
        text: 'RMS 记录的是整体强度，而不是某一瞬间的极值。任务通道一变，读数语言也必须跟着变。'
      task_card:
        title: '为什么不能直接照搬'
