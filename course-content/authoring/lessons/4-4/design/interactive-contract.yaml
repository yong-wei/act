  step-09:
    title: '最小例题：展示解为什么不等于单列最优'
    layout:
      template: 'comparison_decision_board'
      regions:
        - { id: 'problem', width: 'full', order: 1 }
        - { id: 'interaction', width: 'full', order: 2 }
        - { id: 'reference', width: 'full', order: 3 }
    modules:
      - { id: 'mini-problem', region: 'problem', kind: 'problem-statement', must_be_visible: true }
      - { id: 'pareto-choice', region: 'interaction', kind: 'single-choice-card', must_be_visible: true }
      - { id: 'reference-explanation', region: 'reference', kind: 'summary-card', must_be_visible: true }
    content_blocks:
      problem_statement:
        prompt: '三版候选里，一版更快、一版更平衡、一版动作最省。若当前更看重速度与拖尾的综合收益，哪一版更适合暂作展示解？'
        options:
          - 'A：时间最快，但动作代价明显更高'
          - 'B：时间与拖尾都较好，动作代价中等'
          - 'C：动作代价最低，但时间与拖尾改善有限'
      reference_explanation:
        text: '展示解依赖偏好，不能只看某一列最小。这里保留的是一版暂时最符合当前偏好的候选，而不是脱离偏好的绝对最优。'
    evidence_sequence: ['完整题面', '单选判断', '参考解释']
    interaction_spec:
      interaction_kind: 'single_choice'
      student_task: '根据给定偏好选择展示解。'
      activity_cards:
        - { id: 'pareto-display', prompt: '若当前更看重速度与拖尾的综合收益，哪一版更适合作为展示解？', response_kind: 'single_choice', submit_scope: 'per_card', layout_span: 'full' }
