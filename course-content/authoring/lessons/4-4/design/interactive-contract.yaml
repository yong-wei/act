    telemetry_spec: { summary_fields: ['attemptCount', 'resultState', 'errorBucket'], misconception_tags: ['single_column_best', 'display_equals_absolute_best'] }
    ai_context_spec: { page_goal: '用最小例题固定“展示解依赖偏好”的判断。' }
    preview_contract: { demo_path: '/interactive-learning/courses/unit-4-4-fixed-structure-optimization-modeling/student/demo?step=step-09' }
    acceptance_checks: ['题面完整可见。', '参考解释必须写出“展示解依赖偏好”。']

  step-10:
    title: '边界案例入口：任务一变，自由目标语言就得换'
    layout:
      template: 'boundary_case_board'
      regions:
        - { id: 'comparison', width: 'full', order: 1 }
        - { id: 'explanation', width: 'full', order: 2 }
        - { id: 'interaction', width: 'full', order: 3 }
    modules:
