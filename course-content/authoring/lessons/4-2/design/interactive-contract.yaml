contract_version: '2.1'
lesson_id: '4-2'
course_title: '4-2：控制器选型原理：不同控制结构为何适合不同任务'
course_route_segment: 'unit-4-2-controller-selection-first-start'
preview_mode:
  default_entry: 'student_demo'
  student_demo_base_path: '/interactive-learning/courses/unit-4-2-controller-selection-first-start/student/demo'
  teacher_preview_panel_note: '教师端只查看步骤骨架、聚合结果与同步状态；默认预览必须打开学生演示页。'
telemetry_strategy: 'lightweight_high_value'
teacher_insight_strategy: 'step_level_aggregation_only'
required_step_fields:
  - 'layout'
  - 'modules'
  - 'content_blocks'
  - 'evidence_sequence'
  - 'interaction_spec'
  - 'teacher_controls'
  - 'student_access'
  - 'telemetry_spec'
  - 'teacher_insight_spec'
  - 'ai_context_spec'
  - 'preview_contract'
  - 'acceptance_checks'
steps:
  step-01:
    title: '回到地图：4-1 的任务表达卡如何接到 4-2 的结构起步判断'
    layout:
      template: 'map_goal_boundary_slide'
      regions:
        - { id: 'header', width: 'full', order: 1 }
        - { id: 'lead', width: 'full', order: 2 }
        - { id: 'summary', width: 'full', order: 3 }
    modules:
      - { id: 'stage-map', region: 'lead', kind: 'stage-map', must_be_visible: true }
      - { id: 'core-question-card', region: 'lead', kind: 'question-card', must_be_visible: true }
      - { id: 'goal-cards', region: 'summary', kind: 'goal-card-row', must_be_visible: true }
      - { id: 'boundary-card', region: 'summary', kind: 'boundary-card', must_be_visible: true }
    content_blocks:
      - id: 'question'
        type: 'bullet_list'
        title: '主问题'
        items:
          - '任务已经写清，为什么第一步仍不能直接喊 PID。'
          - '控制器名称只是判断链的中间结果，不是设计答案。'
      - id: 'goals'
        type: 'bullet_list'
        title: '四项目标'
        items:
          - '判断主矛盾落在低频、中频还是通道补偿。'
          - '把控制结构重组为任务工具箱。'
          - '写出参数先朝哪个方向起。'
          - '说明前馈为何进入候选但不能替代反馈。'
      - id: 'boundary'
        type: 'bullet_list'
        title: '本课边界'
        items:
          - '不做完整参数整定'
          - '不做复合结构骨架'
          - '不做多目标优化'
    evidence_sequence:
      - '先呈现路径图与主问题卡。'
      - '再呈现四项目标卡。'
      - '最后呈现边界卡。'
    interaction_spec:
      interaction_kind: 'none'
      student_task: '只阅读路径、目标与边界。'
      answer_reveal: 'none'
    teacher_controls:
      release_activity: 'not_applicable'
      open_browse: 'not_applicable'
      teacher_step_reveal: 'not_applicable'
      reveal_reference_answer: 'not_applicable'
    student_access:
      default_visibility: 'visible'
      release_required: false
      browse_required: false
      can_view_problem_statement: true
      can_view_derivation_steps: false
      can_submit_without_browse: false
    telemetry_spec:
      summary_fields: ['viewed', 'timeOnStep', 'teacherFollowSync']
      result_policy: 'no_submission'
    teacher_insight_spec:
      widgets: ['view_count', 'sync_status']
      aggregation: 'step_level'
    ai_context_spec:
      page_goal: '固定 4-2 的角色是单结构首轮起步判断。'
      allowed_scope: ['路径定位', '课程边界', '4-1 与 4-3 衔接']
      forbidden_scope: ['完整整定方案', '复合结构细节']
      canonical_facts:
        - '4-2 先做单结构起步判断。'
    preview_contract:
      route_kind: 'student_demo'
      demo_path: '/interactive-learning/courses/unit-4-2-controller-selection-first-start/student/demo?step=step-01'
      must_match_student_page: true
    acceptance_checks:
      - '主问题卡、目标卡和边界卡必须首屏可见。'
      - '本页无作答区。'

  step-02:
    title: '前测：结构名字为什么不是答案'
    layout:
      template: 'question_stack'
      regions:
        - { id: 'question-stack', width: 'full', order: 1 }
        - { id: 'summary', width: 'full', order: 2 }
        - { id: 'submit-bar', width: 'full', order: 3 }
    modules:
      - { id: 'pretest-q1', region: 'question-stack', kind: 'single-choice-card', must_be_visible: true }
      - { id: 'pretest-q2', region: 'question-stack', kind: 'single-choice-card', must_be_visible: true }
      - { id: 'pretest-q3', region: 'question-stack', kind: 'single-choice-card', must_be_visible: true }
      - { id: 'misconception-card', region: 'summary', kind: 'summary-card', must_be_visible: true }
    content_blocks:
      - id: 'misconceptions'
        type: 'bullet_list'
        title: '误区提醒'
        items:
          - '结构名称不是答案'
          - '前馈不是反馈替代品'
          - '更快不等于更适合当前任务'
    evidence_sequence:
      - '先完整呈现三道前测题干。'
      - '再呈现误区提醒卡。'
      - '最后呈现提交条。'
    interaction_spec:
      interaction_kind: 'quiz_group'
      student_task: '完成三道前测题。'
      attempt_model: '允许重提一次，教师端区分首答与重提。'
      answer_reveal: 'teacher_toggle'
    teacher_controls:
      release_activity: 'page_load_open'
      open_browse: 'not_applicable'
      teacher_step_reveal: 'not_applicable'
      reveal_reference_answer: 'teacher_toggle'
    student_access:
      default_visibility: 'visible'
      release_required: false
      browse_required: false
      can_view_problem_statement: true
      can_view_derivation_steps: false
      can_submit_without_browse: true
    telemetry_spec:
      summary_fields: ['attemptCount', 'resultState', 'errorBucket']
      misconception_tags:
        - 'pid_as_default'
        - 'feedforward_replaces_feedback'
        - 'faster_always_better'
    teacher_insight_spec:
      widgets: ['question_distribution', 'top_misconceptions']
      aggregation: 'step_level'
    ai_context_spec:
      page_goal: '暴露入口误区。'
      allowed_scope: ['术语纠偏', '错因标签']
      forbidden_scope: ['AI 直接代答']
      canonical_facts:
        - '结构名字不是设计答案。'
    preview_contract:
      route_kind: 'student_demo'
      demo_path: '/interactive-learning/courses/unit-4-2-controller-selection-first-start/student/demo?step=step-02'
      must_match_student_page: true
    acceptance_checks:
      - '未作答状态下三题题干完整可见。'
      - '教师端可看到误区分布。'

  step-03:
    title: '单结构判断链：主矛盾先行，结构名称压后出现'
    layout:
      template: 'formula_table_reasoning'
      regions:
        - { id: 'formula', width: 'full', order: 1 }
        - { id: 'table', width: 'full', order: 2 }
        - { id: 'interaction', width: 'full', order: 3 }
    modules:
      - { id: 'loop-formula-card', region: 'formula', kind: 'formula-card', must_be_visible: true }
      - { id: 'reasoning-chain-table', region: 'table', kind: 'comparison-table', must_be_visible: true }
      - { id: 'direction-hint-card', region: 'table', kind: 'summary-card', must_be_visible: true }
      - { id: 'reasoning-cards', region: 'interaction', kind: 'activity-card-set', must_be_visible: true }
    content_blocks:
      - id: 'formula'
        type: 'formula_list'
        title: '开环表达'
        items:
          - 'L(s)=C(s)P(s)'
      - id: 'chain'
        type: 'bullet_list'
        title: '六步判断链'
        items:
          - '当前最紧的矛盾是什么'
          - '矛盾落在哪段频率或哪条通道'
          - '哪类单结构更直接'
          - '参数先朝哪个方向起'
          - '最先想验证什么改善'
          - '最可能先透支什么代价'
      - id: 'direction'
        type: 'bullet_list'
        title: '参数方向句式'
        items:
          - '先补低频，让低频增益向更能托住精度的方向移动'
          - '先整理中频，让截止频率附近的相位与阻尼更可控'
          - '先打开补偿通道，让误差尽量少形成'
    evidence_sequence:
      - '先呈现开环公式与六步判断链表。'
      - '再呈现参数方向句式提示。'
      - '最后呈现两张作答卡。'
    interaction_spec:
      interaction_kind: 'activity_card_set'
      student_task: '完成主矛盾落点与参数方向两张作答卡。'
      activity_cards:
        - { id: 'reasoning-main-contradiction', prompt: '写出当前任务的主矛盾落点。', response_kind: 'fill_text', submit_scope: 'per_card', layout_span: 'half' }
        - { id: 'reasoning-direction', prompt: '补出一条参数先朝哪个方向起的句子。', response_kind: 'fill_text', submit_scope: 'per_card', layout_span: 'half' }
      answer_reveal: 'teacher_toggle'
    teacher_controls:
      release_activity: 'teacher_toggle'
      open_browse: 'page_load_open'
      teacher_step_reveal: 'not_applicable'
      reveal_reference_answer: 'teacher_toggle'
    student_access:
      default_visibility: 'hidden'
      release_required: true
      browse_required: false
      can_view_problem_statement: true
      can_view_derivation_steps: false
      can_submit_without_browse: true
    telemetry_spec:
      summary_fields: ['cardSubmitted', 'completionRate', 'timeOnStep']
      misconception_tags:
        - 'name_before_reason'
        - 'missing_direction'
    teacher_insight_spec:
      widgets: ['card_completion_rate', 'common_reasoning_errors']
      aggregation: 'step_level'
    ai_context_spec:
      page_goal: '固定结构名称之前还有六步判断链。'
      allowed_scope: ['主矛盾', '参数方向', '代价提醒']
      forbidden_scope: ['跳过判断链直接报结构']
      canonical_facts:
        - '结构名称只是判断链的中间结果。'
    preview_contract:
      route_kind: 'student_demo'
      demo_path: '/interactive-learning/courses/unit-4-2-controller-selection-first-start/student/demo?step=step-03'
      must_match_student_page: true
    acceptance_checks:
      - '开环公式、六步链表与两张作答卡必须同页。'
      - '学生端不能先看到参考表达。'

  step-04:
    title: '控制结构工具箱：按作用机制重组，而不是按名字平铺'
    layout:
      template: 'formula_table_match'
      regions:
        - { id: 'table', width: 'full', order: 1 }
        - { id: 'summary', width: 'full', order: 2 }
        - { id: 'interaction', width: 'full', order: 3 }
    modules:
      - { id: 'toolbox-table', region: 'table', kind: 'comparison-table', must_be_visible: true }
      - { id: 'semantic-summary-card', region: 'summary', kind: 'summary-card-row', must_be_visible: true }
      - { id: 'pid-boundary-card', region: 'summary', kind: 'summary-card', must_be_visible: true }
      - { id: 'toolbox-match-zone', region: 'interaction', kind: 'triple-match', must_be_visible: true }
    content_blocks:
      - id: 'semantics'
        type: 'bullet_list'
        title: '四类最小语义'
        items:
          - '建立基本闭环'
          - '补低频能力'
          - '改中频动态品质'
          - '隔离给定/扰动通道'
      - id: 'pid_conditions'
        type: 'bullet_list'
        title: 'PID 压后条件'
        items:
          - '低频精度问题确实明显存在'
          - '中频动态品质或储备问题也同样紧迫'
          - '单一结构已经无法解释当前任务'
    evidence_sequence:
      - '先呈现结构工具箱总表。'
      - '再呈现四类语义卡与 PID 压后原则卡。'
      - '最后呈现结构语义配对区。'
    interaction_spec:
      interaction_kind: 'triple_match'
      student_task: '把结构卡拖入对应语义区，并标记哪些应压后到 4-3。'
      answer_reveal: 'instant_feedback'
    teacher_controls:
      release_activity: 'page_load_open'
      open_browse: 'not_applicable'
      teacher_step_reveal: 'not_applicable'
      reveal_reference_answer: 'teacher_toggle'
    student_access:
      default_visibility: 'visible'
      release_required: false
      browse_required: false
      can_view_problem_statement: true
      can_view_derivation_steps: false
      can_submit_without_browse: true
    telemetry_spec:
      summary_fields: ['matchAttempted', 'matchCorrected', 'timeOnStep']
      misconception_tags:
        - 'toolbox_by_name_only'
        - 'pid_everywhere'
    teacher_insight_spec:
      widgets: ['common_mismatch_pairs', 'completion_rate']
      aggregation: 'step_level'
    ai_context_spec:
      page_goal: '把结构按作用机制重新组织。'
      allowed_scope: ['工具箱总表', '语义分区', 'PID 压后原则']
      forbidden_scope: ['直接输出具体起步卡']
      canonical_facts:
        - '先选语义，再选结构。'
    preview_contract:
      route_kind: 'student_demo'
      demo_path: '/interactive-learning/courses/unit-4-2-controller-selection-first-start/student/demo?step=step-04'
      must_match_student_page: true
    acceptance_checks:
      - '工具箱总表必须先于互动区出现。'
      - 'PID 压后条件必须静态可见。'

  step-05:
    title: '三频段职责与代价链：结构先动哪里，代价就先从哪里冒出来'
    layout:
      template: 'formula_media_compare'
      regions:
        - { id: 'summary', width: 'full', order: 1 }
        - { id: 'media', width: 'full', order: 2 }
        - { id: 'interaction', width: 'full', order: 3 }
    modules:
      - { id: 'band-duty-cards', region: 'summary', kind: 'rule-card-row', must_be_visible: true }
      - { id: 'core-rule-card', region: 'summary', kind: 'summary-card', must_be_visible: true }
      - { id: 'info-graphic', region: 'media', kind: 'comparison-graphic', must_be_visible: true }
      - { id: 'cost-reasoning-zone', region: 'interaction', kind: 'structured-compare', must_be_visible: true }
    content_blocks:
      - id: 'bands'
        type: 'bullet_list'
        title: '三频段职责'
        items:
          - '低频：稳态误差、慢扰动抑制、长期保持精度'
          - '中频：截止频率、相角裕度、阻尼与超调'
          - '高频：噪声放大与执行器负担'
      - id: 'core_rule'
        type: 'plain_text'
        title: '核心判断'
        body: '结构先动哪里，代价就先从哪里冒出来。'
      - id: 'media'
        type: 'media_ref'
        title: '信息图'
        body: '../media/processed/4-2-info.png'
    evidence_sequence:
      - '先呈现三频段职责卡。'
      - '再呈现信息图与核心判断句。'
      - '最后呈现代价归因互动区。'
    interaction_spec:
      interaction_kind: 'structured_compare'
      student_task: '给三条只有收益没有代价的句子补出缺失代价。'
      answer_reveal: 'instant_feedback'
    teacher_controls:
      release_activity: 'page_load_open'
      open_browse: 'not_applicable'
      teacher_step_reveal: 'not_applicable'
      reveal_reference_answer: 'teacher_toggle'
    student_access:
      default_visibility: 'visible'
      release_required: false
      browse_required: false
      can_view_problem_statement: true
      can_view_derivation_steps: false
      can_submit_without_browse: true
    telemetry_spec:
      summary_fields: ['submissionCount', 'errorBucket', 'timeOnStep']
      misconception_tags:
        - 'benefit_without_cost'
        - 'band_duty_mixup'
    teacher_insight_spec:
      widgets: ['error_bucket_distribution', 'completion_rate']
      aggregation: 'step_level'
    ai_context_spec:
      page_goal: '把收益与代价写成一条链。'
      allowed_scope: ['三频段职责', '代价来源']
      forbidden_scope: ['单向度口号式推荐']
      canonical_facts:
        - '收益句后必须补代价句。'
    preview_contract:
      route_kind: 'student_demo'
      demo_path: '/interactive-learning/courses/unit-4-2-controller-selection-first-start/student/demo?step=step-05'
      must_match_student_page: true
    acceptance_checks:
      - '信息图与三频段职责卡必须同屏。'
      - '核心判断句不得隐藏。'

  step-06:
    title: '案例 A 入口：客船航向保持先看低频保持能力，而不是先追更快'
    layout:
      template: 'case_evidence_board'
      regions:
        - { id: 'case', width: 'full', order: 1 }
        - { id: 'media', width: 'full', order: 2 }
        - { id: 'interaction', width: 'full', order: 3 }
    modules:
      - { id: 'ship-task-card', region: 'case', kind: 'task-card', must_be_visible: true }
      - { id: 'ship-formula-card', region: 'case', kind: 'formula-card', must_be_visible: true }
      - { id: 'ship-quad-graphic', region: 'media', kind: 'comparison-graphic', must_be_visible: true }
      - { id: 'ship-evidence-card', region: 'media', kind: 'summary-card', must_be_visible: true }
      - { id: 'ship-entry-cards', region: 'interaction', kind: 'activity-card-set', must_be_visible: true }
    content_blocks:
      - id: 'formula'
        type: 'formula_list'
        title: '客船公式'
        items:
          - 'P_h(s)=0.01715/[s(s+0.1)(s+2.14375)]'
          - 'C_0(s)=K_h=2.25'
          - 'L_h(s)=0.0385875/[s(s+0.1)(s+2.14375)]'
      - id: 'task'
        type: 'bullet_list'
        title: '客船任务卡'
        items:
          - '当前任务：在风浪扰动下完成航向修正并保持平顺'
          - '最紧矛盾：低频保持能力与慢扰动抑制不足'
          - '当前不是先比谁更快，而是先看谁更能托住长期保持'
      - id: 'evidence'
        type: 'bullet_list'
        title: '证据摘录'
        items:
          - '超调约 32.01%'
          - '调节时间约 83.24s'
          - '截止频率约 0.1169rad/s'
          - '相角裕度约 37.43°'
    evidence_sequence:
      - '先呈现任务卡与公式卡。'
      - '再呈现跨域图与证据摘录卡。'
      - '最后呈现两张判断卡。'
    interaction_spec:
      interaction_kind: 'activity_card_set'
      student_task: '完成主矛盾与第一条代价判断两张作答卡。'
      activity_cards:
        - { id: 'ship-main-contradiction', prompt: '补出客船当前主矛盾为何属于低频问题。', response_kind: 'fill_text', submit_scope: 'per_card', layout_span: 'half' }
        - { id: 'ship-first-cost', prompt: '写出客船首轮最先需要警惕的代价。', response_kind: 'fill_text', submit_scope: 'per_card', layout_span: 'half' }
      answer_reveal: 'teacher_toggle'
    teacher_controls:
      release_activity: 'teacher_toggle'
      open_browse: 'page_load_open'
      teacher_step_reveal: 'not_applicable'
      reveal_reference_answer: 'teacher_toggle'
    student_access:
      default_visibility: 'hidden'
      release_required: true
      browse_required: false
      can_view_problem_statement: true
      can_view_derivation_steps: false
      can_submit_without_browse: true
    telemetry_spec:
      summary_fields: ['cardSubmitted', 'errorBucket', 'timeOnStep']
      misconception_tags:
        - 'ship_speed_first'
        - 'ship_cost_missing'
    teacher_insight_spec:
      widgets: ['error_bucket_distribution', 'card_completion_rate']
      aggregation: 'step_level'
    ai_context_spec:
      page_goal: '固定客船案例的低频主矛盾。'
      allowed_scope: ['客船任务卡', '跨域证据', '低频保持能力']
      forbidden_scope: ['直接跳到复合结构']
      canonical_facts:
        - '客船当前更像先补低频。'
    preview_contract:
      route_kind: 'student_demo'
      demo_path: '/interactive-learning/courses/unit-4-2-controller-selection-first-start/student/demo?step=step-06'
      must_match_student_page: true
    acceptance_checks:
      - '任务卡、公式卡、跨域图与证据摘录卡必须同页。'
      - '学生端不能先看到参考判断。'

  step-07:
    title: '案例 A 展开：为什么客船首轮更像 PI/滞后，而不是先上 PD'
    layout:
      template: 'worked_example_compare'
      regions:
        - { id: 'problem', width: 'full', order: 1 }
        - { id: 'comparison', width: 'full', order: 2 }
        - { id: 'worked-example', width: 'full', order: 3 }
        - { id: 'interaction', width: 'full', order: 4 }
    modules:
      - { id: 'ship-example-problem-card', region: 'problem', kind: 'problem-card', must_be_visible: true }
      - { id: 'ship-pi-pd-compare-table', region: 'comparison', kind: 'comparison-table', must_be_visible: true }
      - { id: 'lag-candidate-card', region: 'comparison', kind: 'summary-card', must_be_visible: true }
      - { id: 'ship-worked-steps', region: 'worked-example', kind: 'worked-example-reveal', must_be_visible: true }
