      controller_toolbox:
        required_columns: ['结构', '数学表达式', '最小作用语义', '首轮使用边界']
        required_formulas:
          - 'C_P(s)=K_p'
          - 'C_{PI}(s)=K_p+\dfrac{K_i}{s}'
          - 'C_{PD}(s)=K_p+K_d s'
          - 'C_{PID}(s)=K_p+\dfrac{K_i}{s}+K_d s'
          - 'C_{lead}(s)=K\dfrac{Ts+1}{\alpha Ts+1}, 0<\alpha<1'
          - 'C_{lag}(s)=K\dfrac{Ts+1}{\beta Ts+1}, \beta>1'
          - 'u(s)=C(s)(r(s)-y(s))+F(s)r(s)'
    interaction_spec: { interaction_kind: 'multi_select_matrix' }
    teacher_controls:
      release_activity: 'page_load_open'
      open_browse: 'not_applicable'
      teacher_step_reveal: 'not_applicable'
      reveal_reference_answer: 'teacher_toggle'
