contract_version: "2.1"
lesson_id: "3-7"
course_title: "3-7：型别、积分环节与稳态改善——PI 与滞后校正的低频补偿机理"
course_route_segment: "unit-3-7-steady-error-low-frequency-compensation"
preview_mode:
  default_entry: "student_demo"
  student_demo_base_path: "/interactive-learning/courses/unit-3-7-steady-error-low-frequency-compensation/student/demo"
  teacher_preview_panel_note: "教师端模板弹窗只用于查看课堂骨架；默认页面预览必须打开学生演示页。"
telemetry_strategy: "lightweight_high_value"
teacher_insight_strategy: "step_level_aggregation_only"
required_step_fields:
  - "layout"
  - "modules"
  - "content_blocks"
  - "evidence_sequence"
  - "interaction_spec"
  - "teacher_controls"
  - "telemetry_spec"
  - "teacher_insight_spec"
  - "ai_context_spec"
  - "preview_contract"
  - "acceptance_checks"
steps:
  step-01:
    title: "回到地图：为什么动态改善之后还可能不够准"
    layout:
      template: "map_hero_slide"
      regions:
        - { id: "header", width: "full", order: 1 }
        - { id: "lead", width: "full", order: 2 }
        - { id: "summary", width: "full", order: 3 }
    modules:
      - { id: "stage-map", region: "lead", kind: "stage-map", must_be_visible: true }
      - { id: "core-question-card", region: "lead", kind: "question-card", must_be_visible: true }
      - { id: "boundary-card", region: "summary", kind: "boundary-card", must_be_visible: true }
    content_blocks:
      - id: "path"
        type: "plain_text"
        title: "路径定位"
        body: "固定高亮 3-6 -> 3-7 -> 3-8。"
      - id: "question"
        type: "bullet_list"
        title: "主问题"
        items:
          - "系统稳定了，为什么误差还可能留在比较点上？"
          - "为什么更快更稳不等于已经更准？"
      - id: "boundary"
        type: "plain_text"
        title: "边界卡"
        body: "本课先解决误差通道、稳态误差求解与低频补偿路径，不进入完整频域整定。"
    evidence_sequence:
      - "先呈现 3-6 -> 3-7 -> 3-8 路径。"
      - "再呈现主问题卡。"
      - "最后呈现边界卡。"
    interaction_spec:
      interaction_kind: "none"
      student_task: "只阅读，不提交。"
      answer_reveal: "none"
    teacher_controls:
      release_activity: "not_applicable"
      open_browse: "not_applicable"
      teacher_step_reveal: "not_applicable"
      reveal_reference_answer: "not_applicable"
    telemetry_spec:
      summary_fields: ["viewed", "timeOnStep", "teacherFollowSync"]
      result_policy: "no_submission"
    teacher_insight_spec:
      widgets: ["view_count", "sync_status"]
      aggregation: "step_level"
    ai_context_spec:
      page_goal: "标定 3-7 位于模块 3 的误差分析总入口位置。"
      allowed_scope: ["课程路径", "动态改善线与误差分析主线的区别"]
      forbidden_scope: ["例题参数", "补偿器整定"]
      canonical_facts:
        - "3-6 解决怎样更快更稳。"
        - "3-7 继续回答为什么还能更准。"
        - "3-8 将把低频收益与中频代价翻译成统一频域语言。"
    preview_contract:
      route_kind: "student_demo"
      demo_path: "/interactive-learning/courses/unit-3-7-steady-error-low-frequency-compensation/student/demo?step=step-01"
      must_match_student_page: true
    acceptance_checks:
      - "首屏能看到路径图、主问题卡和边界卡。"
      - "本页没有作答区。"

  step-02:
    title: "学习目标与边界：本课先回答“为什么更准”"
    layout:
      template: "goal_boundary_slide"
      regions:
        - { id: "goals", width: "full", order: 1 }
        - { id: "boundary", width: "full", order: 2 }
    modules:
      - { id: "goal-cards", region: "goals", kind: "goal-card-row", must_be_visible: true }
      - { id: "boundary-table", region: "boundary", kind: "comparison-table", must_be_visible: true }
    content_blocks:
      - id: "goals"
        type: "bullet_list"
        title: "四项目标"
        items:
          - "会分给定通道与扰动通道。"
          - "会在直接求与快速判之间选路径。"
          - "会区分增益变大与型别提高。"
          - "会比较 PI 与滞后两条低频补偿路径。"
      - id: "boundary"
        type: "table"
        title: "本课边界"
        body: "负责误差通道、稳态误差求解与低频补偿；不负责 Nyquist 判据与完整整定。"
    evidence_sequence:
      - "先呈现四项目标卡。"
      - "再呈现负责 / 不负责边界表。"
    interaction_spec:
      interaction_kind: "none"
      student_task: "只建立目标与边界。"
      answer_reveal: "none"
    teacher_controls:
      release_activity: "not_applicable"
      open_browse: "not_applicable"
      teacher_step_reveal: "not_applicable"
      reveal_reference_answer: "not_applicable"
    telemetry_spec:
      summary_fields: ["viewed", "timeOnStep"]
      result_policy: "no_submission"
    teacher_insight_spec:
      widgets: ["view_count"]
      aggregation: "step_level"
    ai_context_spec:
      page_goal: "建立明确的课堂边界。"
      allowed_scope: ["目标卡", "边界表"]
      forbidden_scope: ["后续模块内容"]
      canonical_facts:
        - "本课不进入 Nyquist 判据。"
        - "本课不进入模块 4 的完整整定。"
    preview_contract:
      route_kind: "student_demo"
      demo_path: "/interactive-learning/courses/unit-3-7-steady-error-low-frequency-compensation/student/demo?step=step-02"
      must_match_student_page: true
    acceptance_checks:
      - "目标卡和边界表必须同屏。"
      - "本页无提交区。"

  step-03:
    title: "前测：给定、扰动、型别三类混淆"
    layout:
      template: "question_stack"
      regions:
        - { id: "question-stack", width: "full", order: 1 }
        - { id: "submit-bar", width: "full", order: 2 }
    modules:
      - { id: "pretest-q1", region: "question-stack", kind: "single-choice-card", must_be_visible: true }
      - { id: "pretest-q2", region: "question-stack", kind: "single-choice-card", must_be_visible: true }
      - { id: "pretest-q3", region: "question-stack", kind: "single-choice-card", must_be_visible: true }
      - { id: "misconception-note", region: "submit-bar", kind: "misconception-note", must_be_visible: true }
    content_blocks:
      - id: "misconception-note"
        type: "bullet_list"
        title: "常见混淆"
        items:
          - "扰动不是另一种输入型别。"
          - "增益变大不等于型别提高。"
          - "滞后不是更弱积分。"
    evidence_sequence:
      - "先完整呈现三道前测题干。"
      - "再呈现误区标签。"
      - "最后呈现提交条。"
    interaction_spec:
      interaction_kind: "quiz_group"
      student_task: "完成三道前测题。"
      attempt_model: "允许重提一次，教师端区分首答与重提。"
      answer_reveal: "teacher_toggle"
      student_access:
        default_visibility: "visible"
        release_required: false
        browse_required: false
        can_view_problem_statement: true
        can_view_derivation_steps: false
        can_submit_without_browse: true
    teacher_controls:
      release_activity: "page_load_open"
      open_browse: "not_applicable"
      teacher_step_reveal: "not_applicable"
      reveal_reference_answer: "teacher_toggle"
    telemetry_spec:
      summary_fields: ["attemptCount", "resultState", "errorBucket"]
      misconception_tags:
        - "disturbance_is_input_type"
        - "gain_equals_type_raise"
        - "lag_is_weaker_integral"
    teacher_insight_spec:
      widgets: ["question_distribution", "top_misconceptions"]
      aggregation: "step_level"
    ai_context_spec:
      page_goal: "暴露三类起点误区。"
      allowed_scope: ["错因归类", "术语纠偏"]
      forbidden_scope: ["直接代答"]
      canonical_facts:
        - "前测用于暴露判断链断点。"
    preview_contract:
      route_kind: "student_demo"
      demo_path: "/interactive-learning/courses/unit-3-7-steady-error-low-frequency-compensation/student/demo?step=step-03"
      must_match_student_page: true
    acceptance_checks:
      - "未作答状态下三题全部可见。"
      - "教师端能看到错误分布。"

  step-04:
    title: "双通道骨架：四类传函分卡命名"
    layout:
      template: "formula_media_compare"
      regions:
        - { id: "media", width: "full", order: 1 }
        - { id: "formula", width: "full", order: 2 }
        - { id: "interaction", width: "full", order: 3 }
    modules:
      - { id: "dual-channel-figure", region: "media", kind: "figure", must_be_visible: true }
      - { id: "formula-card-1", region: "formula", kind: "formula-card", must_be_visible: true }
      - { id: "formula-card-2", region: "formula", kind: "formula-card", must_be_visible: true }
      - { id: "formula-card-3", region: "formula", kind: "formula-card", must_be_visible: true }
      - { id: "formula-card-4", region: "formula", kind: "formula-card", must_be_visible: true }
      - { id: "channel-sum-card", region: "formula", kind: "formula-card", must_be_visible: true }
      - { id: "channel-choice-card-1", region: "interaction", kind: "single-choice-card", must_be_visible: true }
      - { id: "channel-choice-card-2", region: "interaction", kind: "single-choice-card", must_be_visible: true }
    content_blocks:
      - id: "figure-ref"
        type: "plain_text"
        title: "主图"
        body: "固定使用 3-7-error-dual-channel.png。"
      - id: "formula-summary"
        type: "bullet_list"
        title: "命名公式卡"
        items:
          - "给定到输出：Φr(s)=C(s)/R(s)"
          - "扰动到输出：Φd(s)=C(s)/D(s)"
          - "给定到误差：Er(s)/R(s)"
          - "扰动到误差：Ed(s)/D(s)"
          - "总输出与总误差：C(s)=Φr(s)R(s)+Φd(s)D(s)，E(s)=Er(s)+Ed(s)"
      - id: "core-judgement"
        type: "plain_text"
        title: "核心判断"
        body: "分母相同反映结构，分子不同反映通道。"
    evidence_sequence:
      - "先出现双通道结构图。"
      - "再出现四个命名公式卡与总输出/总误差结论。"
      - "最后出现两张独立勾选提交卡。"
    interaction_spec:
      interaction_kind: "activity_card_set"
      student_task: "先阅读双通道结构与四类命名传函，再完成两道勾选提交题。"
      answer_reveal: "teacher_toggle"
      student_access:
        default_visibility: "visible"
        release_required: false
        browse_required: false
        can_view_problem_statement: true
        can_view_derivation_steps: false
        can_submit_without_browse: true
    teacher_controls:
      release_activity: "page_load_open"
      open_browse: "not_applicable"
      teacher_step_reveal: "not_applicable"
      reveal_reference_answer: "teacher_toggle"
    telemetry_spec:
      summary_fields: ["attemptCount", "completedCards", "resultState"]
      result_policy: "store_best_attempt"
    teacher_insight_spec:
      widgets: ["option_distribution", "channel_confusion_rate"]
      aggregation: "step_level"
    ai_context_spec:
      page_goal: "固定先分结构、后分通道的读法。"
      allowed_scope: ["结构图", "四类传函", "总输出", "总误差"]
      forbidden_scope: ["跳过通道直接套表"]
      canonical_facts:
        - "四类传函分母相同。"
        - "总输出与总误差必须分别写出。"
    preview_contract:
      route_kind: "student_demo"
      demo_path: "/interactive-learning/courses/unit-3-7-steady-error-low-frequency-compensation/student/demo?step=step-04"
      must_match_student_page: true
    acceptance_checks:
      - "结构图、四个命名公式卡和总结论必须先于互动出现。"
      - "互动区必须是两张独立勾选卡，且每卡单独提交。"

  step-05:
    title: "终值定理直接求：原理模块与例题 1 分离"
    layout:
      template: "worked_example_workspace"
      regions:
        - { id: "principle", width: "full", order: 1 }
        - { id: "problem", width: "full", order: 2 }
        - { id: "derivation", width: "full", order: 3 }
        - { id: "activity", width: "full", order: 4 }
    modules:
      - { id: "principle-card", region: "principle", kind: "principle-card", must_be_visible: true }
      - { id: "example-1-problem", region: "problem", kind: "example-card", must_be_visible: true }
      - { id: "example-1-derivation", region: "derivation", kind: "step-reveal-list", must_be_visible: true }
      - { id: "activity-card-row", region: "activity", kind: "activity-card-set", must_be_visible: true }
    content_blocks:
      - id: "principle"
        type: "bullet_list"
        title: "终值定理三步法"
        items:
          - "先判闭环稳定。"
          - "再写所关心通道的误差传递函数。"
          - "最后用 e_ss=lim(s→0)sE(s) 求极限。"
      - id: "problem"
        type: "formula_list"
        title: "例题 1 完整题面"
        items:
          - "G(s)=K/[s^2(0.5s+1)]"
          - "r(t)=3+2t+0.5t^2"
          - "R(s)=3/s+2/s^2+1/s^3"
          - "求稳态误差"
      - id: "result"
        type: "plain_text"
        title: "结果摘要"
        body: "本题最终稳态误差为 1/K。"
    evidence_sequence:
      - "先出现原理模块。"
      - "再出现例题 1 完整题面。"
      - "最后出现逐步显影步骤与作答卡。"
    interaction_spec:
      interaction_kind: "worked_example_workspace"
      student_task: "完成例题 1 的关键步骤判断与补全。"
      step_reveal_policy: "teacher_or_browse_gate"
      activity_cards:
        - { id: "ex1-card-1", prompt: "第一步应先写什么？", response_kind: "single_choice", submit_scope: "per_card", layout_span: "one_third" }
        - { id: "ex1-card-2", prompt: "为什么最终只剩 1/K？", response_kind: "fill_text", submit_scope: "per_card", layout_span: "one_third" }
      answer_reveal: "teacher_toggle"
      student_access:
        default_visibility: "hidden"
        release_required: true
        browse_required: true
        can_view_problem_statement: true
        can_view_derivation_steps: false
        can_submit_without_browse: true
    teacher_controls:
      release_activity: "default_closed"
      open_browse: "default_closed"
      teacher_step_reveal: "independent"
      reveal_reference_answer: "teacher_toggle"
    telemetry_spec:
      summary_fields: ["attemptCount", "stepRevealCount", "completedCards"]
      result_policy: "store_latest_attempt"
    teacher_insight_spec:
      widgets: ["activity_completion_rate", "top_missing_steps"]
      aggregation: "step_level"
    ai_context_spec:
      page_goal: "把通用三步法与完整题面绑定。"
      allowed_scope: ["终值定理", "题面", "求解顺序"]
      forbidden_scope: ["只给最终答案"]
      canonical_facts:
        - "原理模块与例题模块必须分离。"
        - "逐步显影只能隐藏步骤，不能隐藏题面。"
    preview_contract:
      route_kind: "student_demo"
      demo_path: "/interactive-learning/courses/unit-3-7-steady-error-low-frequency-compensation/student/demo?step=step-05"
      must_match_student_page: true
    acceptance_checks:
      - "学生默认能看到原理模块和完整题面。"
      - "学生默认不能展开步骤，作答区默认隐藏。"

  step-06:
    title: "型别与静态误差系数：双表并排快判"
    layout:
      template: "formula_table_workspace"
      regions:
        - { id: "formula-groups", width: "full", order: 1 }
        - { id: "tables", width: "full", order: 2 }
        - { id: "activity", width: "full", order: 3 }
    modules:
      - { id: "type-definition-card", region: "formula-groups", kind: "formula-card", must_be_visible: true }
      - { id: "static-error-constants-card", region: "formula-groups", kind: "formula-card", must_be_visible: true }
      - { id: "steady-error-formulas-card", region: "formula-groups", kind: "formula-card", must_be_visible: true }
      - { id: "constants-table", region: "tables", kind: "table", must_be_visible: true }
      - { id: "steady-error-table", region: "tables", kind: "table", must_be_visible: true }
      - { id: "boundary-note", region: "tables", kind: "note-card", must_be_visible: true }
      - { id: "example-1-quick-judge-cards", region: "activity", kind: "activity-card-set", must_be_visible: true }
    content_blocks:
      - id: "formula-groups"
        type: "formula_list"
        title: "命名公式"
        items:
          - "型别定义：G(s)H(s)=K0/s^v·G0(s)"
          - "静态误差系数：Kp、Kv、Ka"
          - "典型输入稳态误差：e_ss,step / e_ss,ramp / e_ss,para"
      - id: "tables"
        type: "bullet_list"
        title: "并排双表要求"
        items:
          - "表 2：各型别系统的静态误差系数。"
          - "表 3：各型别系统对典型输入的稳态误差。"
      - id: "boundary-note"
        type: "plain_text"
        title: "适用边界"
        body: "标准给定输入可先快判；显式扰动问题必须优先列式。"
    evidence_sequence:
      - "先出现命名公式组。"
      - "再出现两张并排表格与边界说明。"
      - "最后出现例题 1 快判作答卡。"
    interaction_spec:
      interaction_kind: "activity_card_set"
      student_task: "回到例题 1，完成系统型别与误差结论快判。"
      activity_cards:
        - { id: "type-card-1", prompt: "判断系统型别。", response_kind: "single_choice", submit_scope: "per_card", layout_span: "one_third" }
        - { id: "type-card-2", prompt: "如果要判断是否必须引入积分，第一步该看什么？", response_kind: "fill_text", submit_scope: "per_card", layout_span: "one_third" }
      answer_reveal: "teacher_toggle"
      student_access:
        default_visibility: "hidden"
        release_required: true
        browse_required: false
        can_view_problem_statement: true
        can_view_derivation_steps: true
        can_submit_without_browse: true
    teacher_controls:
      release_activity: "default_closed"
      open_browse: "not_applicable"
      teacher_step_reveal: "not_applicable"
      reveal_reference_answer: "teacher_toggle"
    telemetry_spec:
      summary_fields: ["attemptCount", "completedCards", "errorBucket"]
      result_policy: "store_latest_attempt"
    teacher_insight_spec:
      widgets: ["table_match_distribution", "top_confusions"]
      aggregation: "step_level"
    ai_context_spec:
      page_goal: "把型别定义、误差系数和快判边界绑到同一页。"
      allowed_scope: ["型别", "Kp/Kv/Ka", "典型输入误差"]
      forbidden_scope: ["把扰动问题偷换成给定输入快判"]
      canonical_facts:
        - "双表必须先于作答区出现。"
        - "快判只是直接求的加速版，不是替代版。"
    preview_contract:
      route_kind: "student_demo"
      demo_path: "/interactive-learning/courses/unit-3-7-steady-error-low-frequency-compensation/student/demo?step=step-06"
      must_match_student_page: true
    acceptance_checks:
      - "公式组、双表和边界说明始终可见。"
      - "作答区默认隐藏。"

  step-07:
    title: "复合例题：给定与扰动共同作用时为什么不能只套表"
    layout:
      template: "worked_example_workspace"
      regions:
        - { id: "principle", width: "full", order: 1 }
        - { id: "problem", width: "full", order: 2 }
        - { id: "derivation", width: "full", order: 3 }
        - { id: "activity", width: "full", order: 4 }
    modules:
      - { id: "principle-card", region: "principle", kind: "principle-card", must_be_visible: true }
      - { id: "example-2-problem", region: "problem", kind: "example-card", must_be_visible: true }
      - { id: "example-2-figure", region: "problem", kind: "figure", must_be_visible: true }
      - { id: "example-2-derivation", region: "derivation", kind: "step-reveal-list", must_be_visible: true }
      - { id: "activity-card-row", region: "activity", kind: "activity-card-set", must_be_visible: true }
    content_blocks:
      - id: "principle"
        type: "plain_text"
        title: "双通道求解原则"
        body: "先写总输出，再写总误差，最后做终值极限。"
      - id: "problem"
        type: "bullet_list"
        title: "例题 2 完整题面"
        items:
