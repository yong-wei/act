      - { id: 'summary-blocks', region: 'summary', kind: 'summary-card', must_be_visible: true, payload: { title: 'MASS 链路责任边界', text: 'MASS 把经典控制问题放进感知、估计、规划、控制、执行和监督组成的链路；控制仍承担稳定、跟踪和抗扰职责，但依赖上游信息质量，也受下游执行约束限制。' } }
