contract_version: '2.1'
lesson_id: '5-3'
course_title: '5-3：从单回路控制到复杂自主系统链路'
course_route_segment: 'unit-5-3-mass-coordination-chain'
preview_mode:
  default_entry: 'student_demo'
  student_demo_base_path: '/interactive-learning/courses/unit-5-3-mass-coordination-chain/student/demo'
media_policy:
  runtime_only: true
  runtime_export_required: true
  runtime_media_base: '/course-runtime/lessons/5-3/media'
telemetry_strategy: 'lightweight_high_value'
teacher_insight_strategy: 'step_level_aggregation_only'
required_step_fields: [layout, modules, content_blocks, interaction_spec, teacher_controls, telemetry_spec, teacher_insight_spec, ai_context_spec, preview_contract, acceptance_checks]

steps:
  step-01:
    title: '复杂自主系统链路中的控制位置'
    layout: { template: 'intro_comic_chain_board', regions: [{ id: 'intro', width: 'full', order: 1 }, { id: 'media', width: 'full', order: 2 }, { id: 'summary', width: 'full', order: 3 }] }
    modules:
      - { id: 'problem', region: 'intro', kind: 'summary-card', must_be_visible: true, payload: { title: '链路责任入口', text: '一艘自主船避碰失败，末端航迹偏离规划路径，责任是否一定在控制器参数。' } }
      - { id: 'cover-comic', region: 'media', kind: 'image-panel', must_be_visible: true, payload: { title: '复杂自主系统中的控制位置', src: '/course-runtime/lessons/5-3/media/5-3-cover-comic.png' } }
      - { id: 'entry-summary', region: 'summary', kind: 'summary-card', must_be_visible: true, payload: { text: '单回路仍在工作，但它已经嵌入更长的感知、估计、规划、控制、执行和监督链路。' } }
    content_blocks: { conclusion: '本课从单回路语言出发，训练沿链路寻找证据，而不是把所有偏差直接归因给控制器。' }
    evidence_sequence: ['标题问题', '封面漫画', '链路入口解释', '收束句']
    interaction_spec: { interaction_kind: 'none', student_task: '只阅读，不提交。' }
    teacher_controls: &controls_none { release_activity: 'not_applicable', open_browse: 'not_applicable', teacher_step_reveal: 'not_applicable', reveal_reference_answer: 'not_applicable' }
    student_access: &access_visible { default_visibility: 'visible', release_required: false, browse_required: false, can_view_problem_statement: true, can_view_derivation_steps: true, can_submit_without_browse: false }
    teacher_insight_spec: { widgets: ['view_count', 'sync_status'] }
    telemetry_spec: { summary_fields: ['viewed', 'timeOnStep'], misconception_tags: [] }
    ai_context_spec: { page_goal: '建立复杂自主系统中的控制位置与责任链问题。' }
    preview_contract: { demo_path: '/interactive-learning/courses/unit-5-3-mass-coordination-chain/student/demo?step=step-01' }
    acceptance_checks: ['使用封面漫画提出链路责任问题。', '本页不设置作答区。']

  step-02:
    title: '本次课程目标'
    layout: { template: 'goal_statement_board', regions: [{ id: 'goals', width: 'full', order: 1 }] }
    modules:
      - { id: 'goal-list', region: 'goals', kind: 'goal-card-row', must_be_visible: true, payload: { intro: '完成本次课程后，学习者能够：', goals: ['解释 MASS 中感知、估计、规划、控制、执行和监督的基本信息流。', '指出经典闭环控制在复杂自主系统链路中的位置。', '根据图像、表格和日志证据判断偏差可能来自哪个链路环节。', '计算避碰转弯半径案例中的舵角需求和最小可实现半径。', '评价自动化等级描述与技术链路诊断之间的关系。'] } }
    content_blocks: { intro: '完成本次课程后，学习者能够：', goal_cards: ['解释 MASS 中感知、估计、规划、控制、执行和监督的基本信息流。', '指出经典闭环控制在复杂自主系统链路中的位置。', '根据图像、表格和日志证据判断偏差可能来自哪个链路环节。', '计算避碰转弯半径案例中的舵角需求和最小可实现半径。', '评价自动化等级描述与技术链路诊断之间的关系。'] }
    evidence_sequence: ['引导句', '五项目标']
    interaction_spec: { interaction_kind: 'none', student_task: '阅读目标。' }
    teacher_controls: *controls_none
    student_access: *access_visible
    teacher_insight_spec: { widgets: ['view_count'] }
    telemetry_spec: { summary_fields: ['viewed', 'timeOnStep'], misconception_tags: [] }
    ai_context_spec: { page_goal: '只呈现本次课程能力目标。' }
    preview_contract: { demo_path: '/interactive-learning/courses/unit-5-3-mass-coordination-chain/student/demo?step=step-02' }
    acceptance_checks: ['不得提前出现链路诊断表、转弯半径公式或自动化等级图。']

  step-03:
    title: '前置基础快测'
    layout: { template: 'quiz_group_board', regions: [{ id: 'intro', width: 'full', order: 1 }, { id: 'quiz', width: 'full', order: 2 }] }
    modules:
      - { id: 'pretest-note', region: 'intro', kind: 'summary-card', must_be_visible: true, payload: { title: '前置知识点', text: '本页考察闭环误差、反馈质量和执行器限幅三类基础知识。' } }
      - { id: 'pretest', region: 'quiz', kind: 'quiz-group', must_be_visible: true }
    content_blocks: { note: '本页考察闭环误差、反馈质量和执行器限幅三类基础知识。' }
    evidence_sequence: ['前测说明', '三题客观题组']
    interaction_spec:
      interaction_kind: 'quiz_group'
      student_task: '完成三题基础概念快测。'
      activity_cards:
        - { id: 'closed-loop-error', prompt: '闭环控制中 e(t)=r(t)-y(t) 的含义是什么？', response_kind: 'single_choice', options: ['参考输入与输出反馈之间的误差', '规划层给出的完整任务路径', '执行器的最大舵角'], reference_answer: '参考输入与输出反馈之间的误差', submit_scope: 'per_card', layout_span: 'full' }
        - { id: 'feedback-quality', prompt: '反馈量若带有噪声或延迟，控制器接收到的误差就可能偏离真实状态。', response_kind: 'binary_choice', options: ['正确', '错误'], reference_answer: '正确', submit_scope: 'per_card', layout_span: 'full' }
        - { id: 'actuator-limit', prompt: '执行器幅值上限的直接含义是什么？', response_kind: 'single_choice', options: ['控制指令超过边界时，实际执行量会被截断', '规划路径一定最短', '传感器不会产生延迟'], reference_answer: '控制指令超过边界时，实际执行量会被截断', submit_scope: 'per_card', layout_span: 'full' }
    teacher_controls: &controls_quiz { release_activity: 'teacher_toggle', open_browse: 'not_applicable', teacher_step_reveal: 'not_applicable', reveal_reference_answer: 'teacher_toggle' }
    student_access: &access_hidden { default_visibility: 'hidden', release_required: true, browse_required: false, can_view_problem_statement: true, can_view_derivation_steps: true, can_submit_without_browse: true }
    teacher_insight_spec: { widgets: ['question_distribution', 'completion_rate'] }
    telemetry_spec: { summary_fields: ['attemptCount', 'resultState', 'cardSubmitted'], misconception_tags: ['error_signal_confusion', 'feedback_quality_ignored', 'actuator_limit_ignored'] }
    ai_context_spec: { page_goal: '只诊断闭环误差、反馈质量和执行约束基础。' }
    preview_contract: { demo_path: '/interactive-learning/courses/unit-5-3-mass-coordination-chain/student/demo?step=step-03' }
    acceptance_checks: ['前测题组聚焦闭环误差、反馈质量和执行器限幅。']

  step-04:
    title: 'MASS 协同链路与责任流'
    layout: { template: 'chain_role_match_board', regions: [{ id: 'concept', width: 'full', order: 1 }, { id: 'media', width: 'full', order: 2 }, { id: 'activity', width: 'full', order: 3 }] }
    modules:
      - { id: 'mass-definition', region: 'concept', kind: 'summary-card', must_be_visible: true, payload: { title: 'MASS 协同链路', text: 'MASS 需要把环境感知、状态估计、行动规划、运动控制、执行机构和安全监督连成责任链。' } }
      - { id: 'chain-formula', region: 'concept', kind: 'formula-card', must_be_visible: true, payload: { title: 'MASS 六环节责任链', formulas: ['\mathrm{MASS}=\text{感知}+\text{估计}+\text{规划}+\text{控制}+\text{执行}+\text{监督}'], text: '公式把 MASS 链路写成六个责任环节的组合，重点是信息和责任的传递关系。' } }
      - { id: 'chain-image', region: 'media', kind: 'image-panel', must_be_visible: true, payload: { title: 'MASS 感知到监督的协同链路', src: '/course-runtime/lessons/5-3/media/5-3-mass-coordination-chain.png', caption: '图中从环境输入到监督接管依次标出感知、估计、规划、控制、执行和监督。', explanation: '读图时先沿信息流确认上游给出什么，再确认控制层把参考转成运动指令，最后看执行和监督怎样把风险反馈回链路。' } }
      - { id: 'role-match', region: 'activity', kind: 'activity-card-set', must_be_visible: true }
    content_blocks: { roles: ['感知回答系统看到了什么。', '估计把不完整观测整理为状态。', '规划形成行动意图。', '控制把行动意图转为运动指令。', '执行器和船体产生真实运动。', '监督处理风险、降级和接管。'] }
    evidence_sequence: ['MASS 定义', '链路公式', '协同链路图', '六环节职责条', '角色匹配题']
    interaction_spec:
      interaction_kind: 'drag_match'
      student_task: '把典型动作匹配到 MASS 链路环节。'
      activity_cards:
        - { id: 'role-match', prompt: '将六个典型动作分别放入感知、估计、规划、控制、执行和监督环节。', response_kind: 'drag_match', match_items: [{ value: 'target-outline', label: '目标船轮廓识别' }, { value: 'target-speed', label: '目标船速度估计' }, { value: 'avoidance-path', label: '避碰路径生成' }, { value: 'heading-to-rudder', label: '期望航向转舵角' }, { value: 'rudder-motion', label: '舵机动作' }, { value: 'risk-takeover', label: '风险超限接管' }], match_options: [{ value: 'perception', label: '感知' }, { value: 'estimation', label: '估计' }, { value: 'planning', label: '规划' }, { value: 'control', label: '控制' }, { value: 'actuation', label: '执行' }, { value: 'supervision', label: '监督' }], reference_matches: [{ item: 'target-outline', option: 'perception' }, { item: 'target-speed', option: 'estimation' }, { item: 'avoidance-path', option: 'planning' }, { item: 'heading-to-rudder', option: 'control' }, { item: 'rudder-motion', option: 'actuation' }, { item: 'risk-takeover', option: 'supervision' }], reference_answer: '目标船轮廓识别属于感知；目标船速度估计属于估计；避碰路径生成属于规划；期望航向转舵角属于控制；舵机动作属于执行；风险超限接管属于监督。', submit_scope: 'per_card', layout_span: 'full' }
    teacher_controls: *controls_quiz
    student_access: *access_hidden
    teacher_insight_spec: { widgets: ['match_distribution', 'completion_rate'] }
    telemetry_spec: { summary_fields: ['cardSubmitted', 'resultState'], misconception_tags: ['chain_role_confusion'] }
    ai_context_spec: { page_goal: '建立感知到监督的基本信息流。' }
    preview_contract: { demo_path: '/interactive-learning/courses/unit-5-3-mass-coordination-chain/student/demo?step=step-04' }
    acceptance_checks: ['链路图后必须有六环节职责条。', '角色匹配题必须单卡提交。']

  step-05:
    title: '单回路控制在自主系统链路中的位置'
    layout: { template: 'formula_chain_position_board', regions: [{ id: 'formula', width: 'full', order: 1 }, { id: 'media', width: 'full', order: 2 }, { id: 'activity', width: 'full', order: 3 }] }
    modules:
      - { id: 'closed-loop-formula', region: 'formula', kind: 'formula-card', must_be_visible: true, payload: { title: '闭环控制的输入、控制律与对象输出', formulas: ['e(t)=r(t)-y(t)', 'u(t)=C(e(t))', 'y(t)=P(u(t),d(t))'], text: '三条关系分别固定误差来源、控制器动作和对象响应，使控制层的责任边界可见。' } }
      - { id: 'control-position-image', region: 'media', kind: 'image-panel', must_be_visible: true, payload: { title: '控制层在自主系统链路中的位置', src: '/course-runtime/lessons/5-3/media/5-3-control-position-in-chain.png', caption: '规划参考和估计状态进入控制层，控制输出进入舵、推进或姿态执行器。', explanation: '本图用于区分控制层能直接承担的运动落地任务，以及它必须依赖的上游信息质量和下游执行约束。' } }
      - { id: 'control-position-tasks', region: 'activity', kind: 'activity-card-set', must_be_visible: true }
    content_blocks: { symbols: ['r(t) 是上游给出的参考。', 'y(t) 是反馈输出。', 'u(t) 是控制输入。', 'P 表示对象与执行机构。', 'd(t) 表示扰动。'], duties: ['跟踪参考。', '处理局部扰动和模型误差。', '尊重执行器和船体约束。'] }
    evidence_sequence: ['闭环公式', '符号说明', '控制位置图', '三类职责', '两张作答卡']
    interaction_spec:
      interaction_kind: 'activity_card_set'
      activity_cards:
        - { id: 'control-duty', prompt: '规划层给出期望航迹后，控制层最直接承担什么任务？', response_kind: 'single_choice', options: ['把参考转化为可反馈、可约束的运动指令', '保证感知信息完整', '直接裁决自动化等级'], reference_answer: '把参考转化为可反馈、可约束的运动指令', submit_scope: 'per_card', layout_span: 'half' }
        - { id: 'control-boundary', prompt: '控制层能独自保证感知信息完整和规划目标合理。', response_kind: 'binary_choice', options: ['正确', '错误'], reference_answer: '错误', submit_scope: 'per_card', layout_span: 'half' }
    teacher_controls: *controls_quiz
    student_access: *access_hidden
    teacher_insight_spec: { widgets: ['question_distribution', 'completion_rate'] }
    telemetry_spec: { summary_fields: ['cardSubmitted', 'resultState'], misconception_tags: ['controller_as_whole_system'] }
    ai_context_spec: { page_goal: '固定控制层在自主系统链路中的输入、输出和责任边界。' }
    preview_contract: { demo_path: '/interactive-learning/courses/unit-5-3-mass-coordination-chain/student/demo?step=step-05' }
    acceptance_checks: ['闭环公式、符号来源和控制层职责必须同页出现。']

  step-06:
    title: '上游信息质量与反馈可信度'
    layout: { template: 'evidence_compare_board', regions: [{ id: 'table', width: 'full', order: 1 }, { id: 'media', width: 'full', order: 2 }, { id: 'activity', width: 'full', order: 3 }] }
    modules:
      - { id: 'info-quality-table', region: 'table', kind: 'native-table', must_be_visible: true, payload: { title: '上游信息质量对控制判断的影响', text: '表格按“上游问题 -> 控制层看到的表现 -> 后果 -> 优先检查对象”阅读，避免把所有偏差直接归因给控制器参数。', columns: ['上游问题', '控制层接收到的表现', '可能后果', '优先检查对象'], rows: [['传感器噪声增大', '反馈量高频抖动', '控制指令频繁变化', '量测滤波、传感器健康、采样同步'], ['目标状态估计滞后', '参考误差反应过慢', '避碰动作滞后', '目标跟踪模型、估计延迟'], ['环境遮挡或丢帧', '状态短时缺失', '保守模式或保持上一指令', '感知冗余、置信度阈值'], ['坐标系或时间戳不一致', '误差方向或大小异常', '控制方向错误或响应不稳定', '坐标转换、时间同步、接口协议']] } }
      - { id: 'feedback-measurement-formula', region: 'table', kind: 'formula-card', must_be_visible: true, payload: { title: '反馈测量含延迟和噪声', formulas: ['y_m(t)=y(t-\tau)+n(t)'], text: '控制器接收到的是测量反馈 y_m(t)，它可能同时包含时间滞后和噪声扰动。' } }
      - { id: 'noise-image', region: 'media', kind: 'image-panel', must_be_visible: true, payload: { title: '噪声沿闭环链路传播与滤波缓解', src: '/course-runtime/lessons/5-3/media/5-3-sensor-noise-filter-chain.png', caption: '无滤波时噪声进入误差信号并放大控制输出的高频负担。', explanation: '读图顺序是测量反馈、误差信号、控制器输出、执行器动作；加入滤波后再观察高频负担和相位滞后的取舍。' } }
      - { id: 'noise-figure-explanation', region: 'media', kind: 'summary-card', must_be_visible: true, payload: { block_key: 'noise_figure_explanation', title: '噪声与滤波代价' } }
      - { id: 'delay-image', region: 'media', kind: 'image-panel', must_be_visible: true, payload: { title: '测量延迟造成航向滞后与航迹偏移', src: '/course-runtime/lessons/5-3/media/5-3-sensor-delay-heading-track.png', caption: '同一控制器在测量延迟存在时会更晚修正航向。', explanation: '读图时比较无延迟和有延迟两条航向与航迹，判断偏差是否由反馈时间滞后放大。' } }
      - { id: 'delay-figure-explanation', region: 'media', kind: 'summary-card', must_be_visible: true, payload: { block_key: 'delay_figure_explanation', title: '测量延迟诊断链' } }
      - { id: 'info-quality-tasks', region: 'activity', kind: 'activity-card-set', must_be_visible: true }
    content_blocks: { formula: 'y_m(t)=y(t-\tau)+n(t)', reading_order: ['先看测量反馈。', '再看误差信号和控制器输出。', '最后看执行器动作是否出现高频负担。'], noise_figure_explanation: { text: '无滤波时，噪声从反馈测量进入误差信号，控制器输出和执行机构动作都出现高频负担；加入一阶滤波后，高频成分降低，但滤波会引入相位滞后，过强滤波可能降低闭环响应速度。' }, delay_figure_explanation: { text: '同一控制器参数保持不变，只把反馈测量换成带延迟的航向测量后，航向修正滞后、避障后横向偏差增大；这条对照证据把问题指向反馈测量时间滞后，而不是直接指向控制器增益不足。' } }
    evidence_sequence: ['反馈可信度说明', '信息质量表', '反馈测量公式', '噪声传播图', '噪声滤波解释', '延迟航迹图', '延迟诊断解释', '两张诊断卡']
    interaction_spec:
      interaction_kind: 'activity_card_set'
      activity_cards:
        - { id: 'noise-diagnosis', prompt: '日志显示控制输出频繁小幅抖动，同时反馈测量含高频噪声，优先检查对象是什么？', response_kind: 'single_choice', options: ['传感器健康、量测滤波和采样同步', '自动化等级', '只提高控制增益'], reference_answer: '传感器健康、量测滤波和采样同步', submit_scope: 'per_card', layout_span: 'half' }
        - { id: 'delay-diagnosis', prompt: '同一控制器在测量延迟存在时避障后留下更大横向偏差，首要证据指向什么？', response_kind: 'single_choice', options: ['反馈状态的时间滞后', '障碍物半径为零', '控制器已经失效'], reference_answer: '反馈状态的时间滞后', submit_scope: 'per_card', layout_span: 'half' }
    teacher_controls: *controls_quiz
    student_access: *access_hidden
    teacher_insight_spec: { widgets: ['question_distribution', 'completion_rate'] }
    telemetry_spec: { summary_fields: ['cardSubmitted', 'resultState'], misconception_tags: ['noise_as_gain_problem', 'delay_as_gain_problem'] }
    ai_context_spec: { page_goal: '用表格和两张固定日志图判断反馈状态是否可信。' }
    preview_contract: { demo_path: '/interactive-learning/courses/unit-5-3-mass-coordination-chain/student/demo?step=step-06' }
    acceptance_checks: ['噪声和延迟必须分开判断。', '图像不升级为参数探索面板。']

  step-07:
    title: '规划参考可实现性'
    layout: { template: 'planning_reference_compare_board', regions: [{ id: 'concept', width: 'full', order: 1 }, { id: 'media', width: 'full', order: 2 }, { id: 'activity', width: 'full', order: 3 }] }
    modules:
      - { id: 'planning-note', region: 'concept', kind: 'summary-card', must_be_visible: true, payload: { text: '规划层面对任务空间，控制层拿到的是参考航迹、航向或速度剖面。' } }
      - { id: 'planning-compare-image', region: 'media', kind: 'image-panel', must_be_visible: true, payload: { title: '规划航迹到实际舵角的对比证据', src: '/course-runtime/lessons/5-3/media/5-3-planning-path-control-comparison.png', caption: '三类规划路径对应不同的航向参考、控制器输出和实际舵角负担。', explanation: '读图时从几何路径进入航向参考，再看控制输出和实际舵角是否在约束边界附近反复切换。' } }
      - { id: 'planning-question', region: 'activity', kind: 'single-choice-card', must_be_visible: true }
    content_blocks: { constraints: ['最大舵角 δmax。', '最大舵角速率 dδmax。', '允许横向加速度。', '最小转弯半径。', '跟踪误差上界。'], reading: ['最短折线路径把折点翻译成航向阶跃。', '频繁重规划路径造成航向参考反复摆动。', '平滑可行路径让舵角输出留有余量。'] }
    evidence_sequence: ['规划参考说明', '控制可行域反馈句', '三路径对比图', '三行图后解释', '单选题']
    interaction_spec:
      interaction_kind: 'single_choice'
      activity_cards:
        - { id: 'zigzag-saturation', prompt: '三类路径中哪一类最容易造成舵角在正负最大值之间频繁切换？', response_kind: 'single_choice', options: ['频繁重规划路径', '平滑可行路径', '静止障碍物本身'], reference_answer: '频繁重规划路径', submit_scope: 'per_card', layout_span: 'full' }
    teacher_controls: *controls_quiz
    student_access: *access_hidden
    teacher_insight_spec: { widgets: ['question_distribution'] }
    telemetry_spec: { summary_fields: ['cardSubmitted', 'resultState'], misconception_tags: ['shortest_path_as_best_reference'] }
    ai_context_spec: { page_goal: '把几何路径、航向参考、控制输出和实际舵角连成证据链。' }
