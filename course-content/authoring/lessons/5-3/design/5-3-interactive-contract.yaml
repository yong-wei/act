    acceptance_checks: ['本页训练读图，不训练重规划算法。']

  step-08:
    title: '执行约束与可实现反馈'
    layout: { template: 'actuator_constraint_evidence_board', regions: [{ id: 'formula', width: 'full', order: 1 }, { id: 'media', width: 'full', order: 2 }, { id: 'activity', width: 'full', order: 3 }] }
    modules:
      - { id: 'actuator-formula', region: 'formula', kind: 'formula-card', must_be_visible: true, payload: { title: '执行器幅值和变化率约束', formulas: ['\left|u(t)\right|\le u_{\max}', '\left|\frac{du(t)}{dt}\right|\le \dot{u}_{\max}'], text: '幅值边界限制控制量大小，变化率边界限制控制量变化速度，两者都会改变真实运动。' } }
      - { id: 'actuator-image', region: 'media', kind: 'image-panel', must_be_visible: true, payload: { title: '执行器约束改变控制量、响应和航迹', src: '/course-runtime/lessons/5-3/media/5-3-actuator-limits-response-track.png', caption: '幅值饱和截断峰值，速率限制减慢实际舵角上升和回落。', explanation: '读图时依次比较理想控制量、限幅后的实际舵角、阶跃响应和右侧真实航迹。' } }
      - { id: 'actuator-figure-explanation', region: 'media', kind: 'summary-card', must_be_visible: true, payload: { block_key: 'actuator_figure_explanation', title: '幅值、舵速与航迹三联证据' } }
      - { id: 'actuator-tasks', region: 'activity', kind: 'activity-card-set', must_be_visible: true }
    content_blocks: { explanation: '幅值限制截断峰值，速率限制减慢上升和回落；这会改变阶跃响应和船体航迹。', actuator_figure_explanation: { text: '左侧曲线先把同一个理想控制量经过 ±16° 舵角边界截断，再叠加 5°/s 舵速限制；实际舵角不仅峰值被截断，上升和回落也明显变慢。中间阶跃响应显示同一控制律在执行约束下响应速度改变，右侧航迹显示船体真实路径随之偏离规划意图。' } }
    evidence_sequence: ['执行约束说明', '幅值和速率公式', '控制量与航迹图', '图后解释', '两张作答卡']
    interaction_spec:
      interaction_kind: 'activity_card_set'
      activity_cards:
        - { id: 'saturation-evidence', prompt: '若日志中实际舵角长时间贴着上限，最直接的证据类型是什么？', response_kind: 'single_choice', options: ['执行器幅值约束触边', '自动化等级提高', '目标船完全消失'], reference_answer: '执行器幅值约束触边', submit_scope: 'per_card', layout_span: 'half' }
        - { id: 'constraint-motion', prompt: '执行约束只是控制信号显示前的后处理，不会影响真实运动路径。', response_kind: 'binary_choice', options: ['正确', '错误'], reference_answer: '错误', submit_scope: 'per_card', layout_span: 'half' }
    teacher_controls: *controls_quiz
    student_access: *access_hidden
    teacher_insight_spec: { widgets: ['question_distribution', 'completion_rate'] }
    telemetry_spec: { summary_fields: ['cardSubmitted', 'resultState'], misconception_tags: ['actuator_limit_as_display_only'] }
    ai_context_spec: { page_goal: '说明执行约束会改变真实运动并反馈给规划与控制。' }
    preview_contract: { demo_path: '/interactive-learning/courses/unit-5-3-mass-coordination-chain/student/demo?step=step-08' }
    acceptance_checks: ['执行约束不能写成末端显示修饰。']

  step-09:
    title: '链路责任诊断顺序'
    layout: { template: 'diagnostic_sequence_board', regions: [{ id: 'table', width: 'full', order: 1 }, { id: 'media', width: 'full', order: 2 }, { id: 'activity', width: 'full', order: 3 }] }
    modules:
      - { id: 'diagnostic-table', region: 'table', kind: 'native-table', must_be_visible: true, payload: { title: 'MASS 链路诊断的责任分层', text: '诊断顺序先看信息是否可信，再看参考是否可执行，随后判断控制、执行和监督边界。', columns: ['诊断层', '核心问题', '典型证据', '可能处理方向'], rows: [['感知层', '原始环境与目标信息是否可靠', '丢帧、误检、漏检、噪声异常', '冗余感知、阈值修正、置信度输出'], ['估计层', '状态是否可信并带有不确定性', '估计滞后、轨迹跳变、协方差异常', '滤波模型修正、时间同步、异常剔除'], ['规划层', '参考是否满足规则和可实现性', '轨迹过急、安全距离不足、频繁重规划', '可行域约束、风险代价、路径平滑'], ['控制层', '跟踪律是否稳定并具备鲁棒性', '超调过大、振荡、稳态误差、裕度不足', '参数修正、结构调整、抗扰设计'], ['执行层', '指令是否被物理约束截断', '饱和、速率限制、能耗过高、故障告警', '控制分配、限幅处理、执行器健康管理'], ['监督层', '系统是否需要降级或接管', '置信度过低、规则冲突、风险超限', '安全模式、远程接管、人机协同']] } }
      - { id: 'diagnostic-image', region: 'media', kind: 'image-panel', must_be_visible: true, payload: { title: 'MASS 链路诊断顺序', src: '/course-runtime/lessons/5-3/media/5-3-diagnostic-sequence-infographic.png', caption: '图中把感知、估计、规划、控制、执行和监督组织成优先检查顺序。', explanation: '读图时不要从控制器参数开始，而是先确认原始信息、状态估计和规划参考是否已经给出可信输入。' } }
      - { id: 'diagnostic-sort', region: 'activity', kind: 'activity-card-set', must_be_visible: true }
    content_blocks: { diagnostic_order: '感知 -> 估计 -> 规划 -> 控制 -> 执行 -> 监督' }
    evidence_sequence: ['诊断原则', '责任分层表', '诊断顺序信息图', '混合日志排序题']
    interaction_spec:
      interaction_kind: 'activity_card_set'
      interaction_archetype: 'drag_sort'
      activity_cards:
        - { id: 'diagnostic-order-sort', prompt: '给出目标船丢帧、估计滞后、规划急转、舵角饱和、轨迹偏移、风险超限六条证据，按优先检查顺序排序。', response_kind: 'drag_sort', options: ['目标船丢帧', '估计滞后', '规划急转', '轨迹偏移', '舵角饱和', '风险超限'], reference_answer: ['目标船丢帧', '估计滞后', '规划急转', '轨迹偏移', '舵角饱和', '风险超限'], submit_scope: 'per_card', layout_span: 'full' }
    teacher_controls: *controls_quiz
    student_access: *access_hidden
    teacher_insight_spec: { widgets: ['sort_order_distribution', 'completion_rate'] }
    telemetry_spec: { summary_fields: ['cardSubmitted', 'sortOrder'], misconception_tags: ['controller_first_diagnosis'] }
    ai_context_spec: { page_goal: '建立从信息到监督的链路诊断顺序。' }
    preview_contract: { demo_path: '/interactive-learning/courses/unit-5-3-mass-coordination-chain/student/demo?step=step-09' }
    acceptance_checks: ['必须给出完整诊断表和排序题。']

  step-10:
    title: '自主避碰中的偏差传播场景'
    layout: { template: 'avoidance_scene_evidence_board', regions: [{ id: 'problem', width: 'full', order: 1 }, { id: 'media', width: 'full', order: 2 }, { id: 'activity', width: 'full', order: 3 }] }
    modules:
      - { id: 'avoidance-problem', region: 'problem', kind: 'summary-card', must_be_visible: true, payload: { title: '自主避碰任务书', text: '一艘自主水面船在狭窄航道保持计划航线，并遇到横穿目标船，需要完成安全避让。' } }
      - { id: 'avoidance-image', region: 'media', kind: 'image-panel', must_be_visible: true, payload: { title: '自主避碰中的偏差传播场景', src: '/course-runtime/lessons/5-3/media/5-3-autonomous-avoidance-scene.png', caption: '图中同时呈现横穿目标船、蓝色规划路径、橙色实际航迹和偏差来源。', explanation: '蓝色规划路径和橙色实际航迹之间的间隔，可能由延迟、约束和控制误差共同留下。' } }
      - { id: 'avoidance-tasks', region: 'activity', kind: 'activity-card-set', must_be_visible: true }
    content_blocks: { chain_questions: ['感知是否识别目标船、岸线、浮标和禁航区域。', '估计是否给出速度、方位、风险和置信度。', '规划是否满足规则、安全距离和操纵能力。', '控制是否跟踪参考并抑制扰动。', '执行层是否有舵角、舵速和推进余量。'] }
    evidence_sequence: ['场景任务书', '五层问题链', '避碰场景图及图内说明', '两张作答卡']
    interaction_spec:
      interaction_kind: 'activity_card_set'
      activity_cards:
        - { id: 'occlusion-layer', prompt: '目标船被短时遮挡后，估计层保持上一速度值，这条证据首先进入哪个诊断层？', response_kind: 'single_choice', options: ['感知层和估计层', '执行层', '自动化等级'], reference_answer: '感知层和估计层', submit_scope: 'per_card', layout_span: 'half' }
        - { id: 'path-gap-checks', prompt: '橙色航迹未贴住蓝色规划路径时，需要同步检查哪些对象？', response_kind: 'multi_choice', options: ['规划参考是否过急', '反馈状态是否滞后', '执行器是否触边', '控制器是否具备足够鲁棒性', '是否只需要更换术语'], reference_answer: ['规划参考是否过急', '反馈状态是否滞后', '执行器是否触边', '控制器是否具备足够鲁棒性'], submit_scope: 'per_card', layout_span: 'half' }
    teacher_controls: *controls_quiz
    student_access: *access_hidden
    teacher_insight_spec: { widgets: ['question_distribution', 'completion_rate'] }
    telemetry_spec: { summary_fields: ['cardSubmitted', 'resultState'], misconception_tags: ['path_gap_as_controller_only'] }
    ai_context_spec: { page_goal: '把避碰偏差分解为信息、参考、控制和执行证据。' }
    preview_contract: { demo_path: '/interactive-learning/courses/unit-5-3-mass-coordination-chain/student/demo?step=step-10' }
    acceptance_checks: ['场景题面、问题链和场景图必须同页常显。']

  step-11:
    title: '避碰转弯半径与舵角可行域分析'
    layout: { template: 'turning_radius_rust_panel_board', regions: [{ id: 'problem', width: 'full', order: 1 }, { id: 'formula', width: 'full', order: 2 }, { id: 'panel', width: 'full', order: 3 }, { id: 'activity', width: 'full', order: 4 }] }
    modules:
      - { id: 'turning-problem', region: 'problem', kind: 'summary-card', must_be_visible: true, payload: { title: '避碰转弯半径题面', text: '自主船以 $v=4\,\mathrm{m/s}$ 接近障碍物，障碍物等效半径 $r_o=25\,\mathrm{m}$，安全裕量 $m=16\,\mathrm{m}$，等效船长 $L=34\,\mathrm{m}$，舵角边界 $\delta_{\max}=18^\circ$。' } }
      - { id: 'turning-formulas', region: 'formula', kind: 'formula-card', must_be_visible: true, payload: { title: '避障启动距离、舵角需求与最小半径', formulas: ['d_{\mathrm{start}}\approx\sqrt{(r_o+m)(2R+r_o+m)}', '\delta_d\approx\tan^{-1}(L/R)', 'R_{\min}\approx L/\tan(\delta_{\max})'], text: '三条公式分别给出何时开始转弯、当前半径需要多大舵角，以及舵角上限反推的最小可行半径。' } }
      - { id: 'turning-diagnostic-reveal', region: 'formula', kind: 'step-reveal-chain', must_be_visible: true, payload: { block_key: 'turning_diagnostic_reveal', title: '四步链路定位显影' } }
      - { id: 'turning-rust-panel', region: 'panel', kind: 'interactive-figure-panel', must_be_visible: true, payload: { panel_id: 'rust_turning_radius_panel', title: '规划半径、舵角饱和与安全边界联动面板' } }
      - { id: 'turning-submit', region: 'activity', kind: 'activity-card-set', must_be_visible: true }
    content_blocks: { symbols: ['R 为规划假定转弯半径。', 'd_start 为避障启动距离。', 'L 为等效船长。', 'δd 为名义舵角。', 'δmax 为舵角边界。'], turning_diagnostic_reveal: { layers: [{ title: '第一步：检查上游输入', body: '感知层已经识别障碍物，估计层给出了相对位置和速度；若没有目标状态完全错误的证据，不能先把偏差归因给感知失效。' }, { title: '第二步：检查规划参考', body: '规划层按当前半径 R 计算启动圈，船舶进入虚线圆后才开始避障；半径越小，启动圈越靠近障碍物，若该半径不可实现，系统会在过近位置才发现自己转不过去。' }, { title: '第三步：检查控制与执行', body: '由 δd≈arctan(L/R) 可知，小半径会要求超过 18° 的名义舵角；控制器强行跟踪时，舵角被饱和截断，航向响应滞后，横向位移来得更晚。' }, { title: '第四步：形成链路修正', body: '规划层应把最小转弯半径、最大艏向角速度、舵角限幅和安全距离纳入可行域；控制层给出的物理能力边界需要回流到规划层。' }] }, conclusion: '规划参考需要吸收控制与执行约束，学生应使用调节出的半径和最大舵角支撑结论。' }
    interactive_figure_spec:
      kind: 'rust_turning_radius_panel'
      required: true
      fallback_allowed: false
      baseline_media: '/course-runtime/lessons/5-3/media/5-3-turning-radius-saturation-comparison.png'
      default_state: { R_m: 140, v_mps: 4, obstacle_radius_m: 25, safety_margin_m: 16, ship_length_m: 34, delta_max_deg: 18 }
      layout: { left_panel: 'rudder_command', right_panel: 'avoidance_scene', controls_position: 'below_figure' }
      displayed_cases_policy: 'single_current_radius_only'
      controls:
        - { id: 'R_m', label: '规划半径 R', min: 35, max: 160, default: 140, step: 5, unit: 'm' }
      dynamic_outputs: ['d_start_m', 'delta_d_deg', 'max_delta_deg', 'saturation_active', 'min_distance_m', 'collision_active', 'safety_constraint_satisfied']
      left_panel_curves: ['estimated_rudder_command', 'actual_limited_rudder']
      right_panel_overlays: ['obstacle', 'safety_margin_circle', 'dynamic_start_circle', 'planned_path', 'actual_path']
      behavior_rules: ['左侧只显示当前半径下的估计舵角指令虚线和限幅后的实际舵角信号实线。', '名义舵角超过 18° 时体现舵角饱和。', '右侧保留障碍物、安全边界、规划航迹与实际航迹。', '右侧虚线启动圈随规划半径动态调整。']
    evidence_sequence: ['完整题面', '启动距离公式', '舵角需求公式', '最小可实现半径公式', '四步链路定位显影', '互动面板', '规划半径控件', '参数提交', '责任结论']
    interaction_spec:
      interaction_kind: 'activity_card_set'
      interaction_archetype: 'rust_turning_radius_panel'
      student_task: '调节规划半径，提交满足安全约束的最新规划半径以及对应最大舵角。'
      activity_cards:
        - { id: 'turning-radius-submit', prompt: '提交当前选择的规划半径 R、对应最大舵角、名义舵角、是否触发舵角饱和、是否满足安全约束，以及一句链路判断。', response_kind: 'fill_text', structured_fields: ['R_m', 'max_delta_deg', 'delta_d_deg', 'saturation_active', 'safety_constraint_satisfied', 'chain_judgment'], reference_answer: '半径应不小于 R_min≈34/tan18°≈105 m，并结合右侧航迹确认未触碰障碍物安全边界。', submit_scope: 'per_card', layout_span: 'full' }
    teacher_controls: *controls_quiz
    student_access: *access_hidden
    teacher_insight_spec: { widgets: ['parameter_submission_distribution', 'safety_constraint_rate', 'completion_rate'] }
    telemetry_spec: { summary_fields: ['R_m', 'maxDeltaDeg', 'deltaDdeg', 'safetyConstraintSatisfied', 'cardSubmitted'], misconception_tags: ['radius_below_feasible_limit', 'ignores_saturation'] }
    ai_context_spec: { page_goal: '通过单情形互动面板判断规划半径、舵角上限和安全约束之间的联动。' }
    preview_contract: { demo_path: '/interactive-learning/courses/unit-5-3-mass-coordination-chain/student/demo?step=step-11' }
    acceptance_checks: ['互动面板不可降级为静态图。', '同一时刻只显示一种规划半径情形。', '左侧舵角曲线和右侧虚线启动圈必须随 R 动态更新。', '控件只开放规划半径 R。']

  step-12:
    title: 'MASS 自动化等级与责任边界'
    layout: { template: 'automation_responsibility_board', regions: [{ id: 'concept', width: 'full', order: 1 }, { id: 'media', width: 'full', order: 2 }, { id: 'activity', width: 'full', order: 3 }] }
    modules:
      - { id: 'automation-note', region: 'concept', kind: 'summary-card', must_be_visible: true, payload: { text: '自动化等级描述运行形态和责任主体差异，但技术诊断仍需回到链路证据。' } }
      - { id: 'automation-image', region: 'media', kind: 'image-panel', must_be_visible: true, payload: { src: '/course-runtime/lessons/5-3/media/5-3-automation-levels-scene.png', caption: 'MASS 四类自动化程度的场景对比' } }
      - { id: 'automation-question', region: 'activity', kind: 'single-choice-card', must_be_visible: true }
