  step-13:
    title: '链路阅读的最小方法'
    layout: { template: 'five_question_diagnostic_board', regions: [{ id: 'method', width: 'full', order: 1 }, { id: 'activity', width: 'full', order: 2 }] }
    modules:
      - { id: 'five-questions', region: 'method', kind: 'bullet-list-card', must_be_visible: true, payload: { bullets: ['任务目标是什么。', '状态从哪里来。', '参考怎样生成。', '控制怎样落地。', '责任怎样分界。'] } }
      - { id: 'evidence-match', region: 'activity', kind: 'activity-card-set', must_be_visible: true }
    content_blocks: { responsibility_rule: '若偏差来自上游状态错误，先修正感知和估计；若来自参考不可实现，先修正规划约束；若来自闭环振荡，再回到控制结构、参数和裕度；若来自执行饱和，控制分配和执行器健康管理优先进入分析；若风险超过自动系统可信范围，监督层应触发降级或接管。' }
    evidence_sequence: ['五问路径', '证据匹配表', '责任边界句', '匹配题']
    interaction_spec:
      interaction_kind: 'drag_match'
      activity_cards:
        - { id: 'minimal-method-match', prompt: '将状态跳变、频繁重规划、舵角贴边、裕度不足、远程接管匹配到估计层、规划层、执行层、控制层、监督层。', response_kind: 'drag_match', options: [{ value: 'estimation', label: '状态跳变 -> 估计层' }, { value: 'planning', label: '频繁重规划 -> 规划层' }, { value: 'actuation', label: '舵角贴边 -> 执行层' }, { value: 'control', label: '裕度不足 -> 控制层' }, { value: 'supervision', label: '远程接管 -> 监督层' }], reference_answer: '状态跳变->估计层；频繁重规划->规划层；舵角贴边->执行层；裕度不足->控制层；远程接管->监督层。', submit_scope: 'per_card', layout_span: 'full' }
    teacher_controls: *controls_quiz
    student_access: *access_hidden
    teacher_insight_spec: { widgets: ['match_distribution', 'completion_rate'] }
    telemetry_spec: { summary_fields: ['cardSubmitted', 'resultState'], misconception_tags: ['evidence_layer_confusion'] }
    ai_context_spec: { page_goal: '用五问路径阅读新的复杂自主系统日志。' }
    preview_contract: { demo_path: '/interactive-learning/courses/unit-5-3-mass-coordination-chain/student/demo?step=step-13' }
    acceptance_checks: ['五问路径和责任边界句必须常显。']

  step-14:
    title: '后测：链路诊断与可行性判断'
    layout: { template: 'posttest_board', regions: [{ id: 'intro', width: 'full', order: 1 }, { id: 'quiz', width: 'full', order: 2 }] }
    modules:
      - { id: 'posttest-note', region: 'intro', kind: 'summary-card', must_be_visible: true, payload: { text: '本页检查是否已经形成链路诊断、可实现性判断和责任边界意识。' } }
      - { id: 'posttest', region: 'quiz', kind: 'quiz-group', must_be_visible: true }
    content_blocks: { note: '后测题目呼应目标页，不设计大段综合推导。' }
    evidence_sequence: ['后测说明', '三题题组']
    interaction_spec:
      interaction_kind: 'quiz_group'
      activity_cards:
        - { id: 'posttest-order', prompt: '日志显示目标船短时遮挡、估计层保持上一速度值、规划层给出急转参考、舵角达到 18° 上限。请按优先检查顺序排列：感知、估计、规划、执行。', response_kind: 'drag_sort', options: ['感知', '估计', '规划', '执行'], reference_answer: ['感知', '估计', '规划', '执行'], submit_scope: 'per_card', layout_span: 'full' }
        - { id: 'posttest-feasible-reference', prompt: '若规划半径对应名义舵角超过执行器上限，最合理的链路结论是什么？', response_kind: 'single_choice', options: ['规划参考没有吸收控制与执行约束', '自动化等级太低', '只需要提高控制增益'], reference_answer: '规划参考没有吸收控制与执行约束', submit_scope: 'per_card', layout_span: 'full' }
        - { id: 'posttest-why-not-gain', prompt: '用一句话说明为什么不能先只调控制器增益。', response_kind: 'fill_text', reference_answer: '因为信息质量、参考可实现性和执行触边证据尚未排除，直接增益调整不能解释完整偏差链。', submit_scope: 'per_card', layout_span: 'full' }
    teacher_controls: *controls_quiz
    student_access: *access_hidden
    teacher_insight_spec: { widgets: ['question_distribution', 'keyword_cloud', 'completion_rate'] }
    telemetry_spec: { summary_fields: ['attemptCount', 'resultState', 'cardSubmitted'], misconception_tags: ['controller_first_diagnosis', 'feasibility_ignored'] }
    ai_context_spec: { page_goal: '检查链路诊断、可实现性判断和责任边界意识。' }
    preview_contract: { demo_path: '/interactive-learning/courses/unit-5-3-mass-coordination-chain/student/demo?step=step-14' }
    acceptance_checks: ['后测不超过三题。', '后测与总结必须分离。']

