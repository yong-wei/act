        - { id: "chain", width: "full", order: 2 }
    modules:
      - { id: "goal-cards", region: "goals", kind: "goal-card-row", must_be_visible: true }
      - { id: "main-chain", region: "chain", kind: "formula-chain", must_be_visible: true }
    content_blocks:
      - id: "goals"
        type: "bullet_list"
        title: "课程目标"
        items: ["说明根轨迹研究的是闭环极点迁移。", "用相角条件判断资格，用幅值条件回算参数。", "按层次使用九项法则。", "把图形翻译回系统动态趋势。"]
      - { id: "main-chain", type: "formula", title: "本课主线", value: "\\text{参数变化} \\rightarrow \\text{闭环极点迁移} \\rightarrow \\text{轨迹条件} \\rightarrow \\text{完整法则} \\rightarrow \\text{动态判断}" }
    evidence_sequence: ["先课程目标，再主线链。"]
    interaction_spec: { interaction_kind: "none", student_task: "建立整体预期", answer_reveal: "none" }
    teacher_controls: { release_activity: "not_applicable", open_browse: "not_applicable", teacher_step_reveal: "not_applicable", reveal_reference_answer: "not_applicable" }
