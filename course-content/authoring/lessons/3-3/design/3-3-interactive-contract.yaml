      - { id: "question-list", region: "questions", kind: "question-list", must_be_visible: true }
      - { id: "binary-choice", region: "interaction", kind: "binary-choice", must_be_visible: true }
    content_blocks:
      - { id: "figure", type: "media", asset: "3-3-pp-04-complete-rules-example.svg" }
      - id: "questions"
        type: "bullet_list"
        title: "本页四问"
        items: ["极点先往哪走。", "什么时候更振荡。", "什么时候触碰稳定边界。", "参数应朝哪个方向调整。"]
      - { id: "takeaway", type: "plain_text", title: "本页结论", body: "只知道边界点不能解释极点怎样一路走过去。" }
    evidence_sequence: ["先主图，再四问，最后进入判断区。"]
    interaction_spec:
      interaction_kind: "binary_choice"
      student_task: "判断只知道稳定区间是否足以解释整条迁移路径。"
      prompt: "只知道稳定区间，是否已经足够解释整条极点迁移路径。"
      options: { A: "已经足够", B: "仍需整条迁移路径" }
