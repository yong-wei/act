      allowed_scope: ["课程目标", "主线链"]
      forbidden_scope: ["边界表", "控制器设计"]
      canonical_facts: ["本页不展示边界表。"]
    preview_contract: { route_kind: "student_demo", demo_path: "/interactive-learning/courses/unit-3-3-root-locus-rules/student/demo?step=step-03", must_match_student_page: true }
    acceptance_checks: ["本页只呈现目标卡与主线链。"]

  step-04:
    title: "根轨迹定义与两大条件：从闭环方程到资格与参数"
    layout:
      template: "definition_derivation_board"
      regions:
        - { id: "definition", width: "full", order: 1 }
        - { id: "derivation", width: "full", order: 2 }
        - { id: "conclusion", width: "full", order: 3 }
    modules:
      - { id: "definition-card", region: "definition", kind: "definition-card", must_be_visible: true }
      - { id: "equation-chain", region: "derivation", kind: "equation-chain", must_be_visible: true }
      - { id: "angle-condition-card", region: "conclusion", kind: "formula-card", must_be_visible: true }
      - { id: "magnitude-condition-card", region: "conclusion", kind: "formula-card", must_be_visible: true }
    content_blocks:
      - { id: "definition", type: "plain_text", title: "普通根轨迹定义", body: "当 K 从 0 连续变化到 +∞ 时，闭环特征方程全部根在 s 平面形成的轨迹集合。" }
      - { id: "equation_chain", type: "formula", title: "入口方程", value: "1+L(s)=0 \\rightarrow L(s)=-1" }
      - { id: "angle_condition", type: "formula", title: "相角条件", value: "\\angle G_0(s_0)H(s_0)=(2\\ell+1)\\pi" }
      - { id: "magnitude_condition", type: "formula", title: "幅值条件", value: "K=1/|G_0(s_0)H(s_0)|" }
      - { id: "role_split", type: "plain_text", title: "角色拆分", body: "相角条件先判资格，幅值条件再定参数。" }
    evidence_sequence: ["先定义，再方程链，再两大条件与角色拆分。"]
    interaction_spec: { interaction_kind: "none", student_task: "阅读推导链", answer_reveal: "none" }
    teacher_controls: { release_activity: "not_applicable", open_browse: "not_applicable", teacher_step_reveal: "not_applicable", reveal_reference_answer: "not_applicable" }
    student_access: { default_visibility: "visible", release_required: false, browse_required: false, can_view_problem_statement: true, can_view_derivation_steps: true, can_submit_without_browse: "not_applicable" }
    telemetry_spec: { summary_fields: ["viewed", "timeOnStep"], result_policy: "no_submission" }
    teacher_insight_spec: { widgets: ["view_count"], aggregation: "step_level" }
    ai_context_spec:
      page_goal: "把定义、方程链、两大条件放到同一页讲清。"
      allowed_scope: ["根轨迹定义", "L(s)=-1", "相角条件", "幅值条件"]
      forbidden_scope: ["二阶冗余例子", "独立作答区"]
      canonical_facts: ["本页不再保留二阶冗余例子。"]
    preview_contract: { route_kind: "student_demo", demo_path: "/interactive-learning/courses/unit-3-3-root-locus-rules/student/demo?step=step-04", must_match_student_page: true }
    acceptance_checks: ["定义、方程链、两大条件必须同页完整出现。"]

