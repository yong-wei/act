      - { id: "asymptote_formula", type: "formula", title: "渐近线", value: "\\sigma_a=(\\sum p_i-\\sum z_i)/(n-m),\\ \\phi_q=(2q+1)\\pi/(n-m)" }
      - id: "svg_steps"
        type: "bullet_list"
        title: "显影顺序"
        items: ["空白坐标轴", "列出极点", "绘制实轴根轨迹", "绘制渐近线", "绘制完整轨迹"]
    evidence_sequence: ["先法则卡，再 SVG 分步显影。"]
    interaction_spec: { interaction_kind: "comparison_workspace", student_task: "按顺序观察骨架形成", answer_reveal: "inline_progression" }
    teacher_controls: { release_activity: "not_applicable", open_browse: "not_applicable", teacher_step_reveal: "not_applicable", reveal_reference_answer: "not_applicable" }
    student_access: { default_visibility: "visible", release_required: false, browse_required: false, can_view_problem_statement: true, can_view_derivation_steps: true, can_submit_without_browse: "not_applicable" }
    telemetry_spec: { summary_fields: ["progressionStep", "timeOnStep"], result_policy: "interaction_only" }
    teacher_insight_spec: { widgets: ["progression_completion"], aggregation: "step_level" }
    ai_context_spec:
      page_goal: "先用骨架法则搭出整张图的大势。"
      allowed_scope: ["起点终点", "实轴区段", "渐近线"]
      forbidden_scope: ["图内长文案", "关键节点"]
      canonical_facts: ["图内说明文字已移到外部模块。"]
    preview_contract: { route_kind: "student_demo", demo_path: "/interactive-learning/courses/unit-3-3-root-locus-rules/student/demo?step=step-06", must_match_student_page: true }
    acceptance_checks: ["SVG 显影顺序固定为五步。", "图内不嵌长文案。"]

