    student_access: { default_visibility: "hidden", release_required: true, browse_required: false, can_view_problem_statement: true, can_view_derivation_steps: "not_applicable", can_submit_without_browse: true }
    telemetry_spec: { summary_fields: ["selectedOption", "resultState", "teacherRevealSeen", "timeOnStep"], misconception_tags: ["boundary_is_enough"] }
    teacher_insight_spec: { widgets: ["option_distribution", "reveal_correction_rate"], aggregation: "step_level" }
    ai_context_spec:
      page_goal: "暴露边界判断不能替代迁移机制。"
      allowed_scope: ["边界", "趋势", "振荡变化"]
      forbidden_scope: ["提前展开完整法则"]
      canonical_facts: ["根轨迹研究的是整条变化路径。"]
    preview_contract: { route_kind: "student_demo", demo_path: "/interactive-learning/courses/unit-3-3-root-locus-rules/student/demo?step=step-02", must_match_student_page: true }
    acceptance_checks: ["主图、四问与判断区同页可见。"]

  step-03:
