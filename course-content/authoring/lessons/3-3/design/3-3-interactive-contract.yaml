      - { id: "root-locus-svg", region: "workspace", kind: "native-svg", must_be_visible: true }
      - { id: "condition-breakdown", region: "workspace", kind: "condition-breakdown", must_be_visible: true }
    content_blocks:
      - { id: "formula_strip", type: "plain_text", title: "顶部常显", body: "相角条件与幅值条件表达式始终固定在屏幕上方。" }
      - { id: "workspace_rule", type: "plain_text", title: "左右结构", body: "左侧拖动单色虚线根轨迹上的 s0，右侧动态列出每个极点/零点对相角和幅值的贡献。" }
    evidence_sequence: ["先顶部条件，再左拖右算。"]
    interaction_spec:
      interaction_kind: "parameter_workspace"
      student_task: "拖动 s0，检查当前点是否满足相角条件以及对应增益。"
      answer_reveal: "inline_dynamic"
    teacher_controls: { release_activity: "not_applicable", open_browse: "not_applicable", teacher_step_reveal: "not_applicable", reveal_reference_answer: "not_applicable" }
    student_access: { default_visibility: "visible", release_required: false, browse_required: false, can_view_problem_statement: true, can_view_derivation_steps: true, can_submit_without_browse: "not_applicable" }
    telemetry_spec: { summary_fields: ["dragCount", "selectedPoint", "angleSatisfied", "gainValue"], result_policy: "interaction_only" }
    teacher_insight_spec: { widgets: ["interaction_heatmap"], aggregation: "step_level" }
    ai_context_spec:
      page_goal: "把先资格后参数做成可操作判断。"
      allowed_scope: ["相角贡献", "模值贡献", "资格结论", "参数回算"]
      forbidden_scope: ["页内 AI 提示块"]
      canonical_facts: ["拖点后右侧实时更新相角和幅值各项贡献。"]
    preview_contract: { route_kind: "student_demo", demo_path: "/interactive-learning/courses/unit-3-3-root-locus-rules/student/demo?step=step-05", must_match_student_page: true }
    acceptance_checks: ["顶部条件表达式常显。", "左拖右算实时联动。"]

  step-06:
    title: "骨架法则：起点终点、实轴区段与渐近线"
    layout:
      template: "svg_rule_progression"
      regions:
        - { id: "rules", width: "full", order: 1 }
        - { id: "svg", width: "full", order: 2 }
        - { id: "legend", width: "full", order: 3 }
    modules:
      - { id: "rule-cards", region: "rules", kind: "rule-cards", must_be_visible: true }
      - { id: "progressive-svg", region: "svg", kind: "native-svg", must_be_visible: true }
      - { id: "reading-cue", region: "legend", kind: "reading-cue", must_be_visible: true }
    content_blocks:
