course_route_segment: "unit-3-3-root-locus-rules"
preview_mode:
  default_entry: "student_demo"
  student_demo_base_path: "/interactive-learning/courses/unit-3-3-root-locus-rules/student/demo"
  teacher_preview_panel_note: "教师端模板弹窗只用于查看课堂骨架；默认页面预览必须打开学生演示页。"
telemetry_strategy: "lightweight_high_value"
teacher_insight_strategy: "step_level_aggregation_only"
required_step_fields:
  - "layout"
  - "modules"
  - "content_blocks"
  - "evidence_sequence"
  - "interaction_spec"
  - "teacher_controls"
  - "student_access"
  - "telemetry_spec"
  - "teacher_insight_spec"
  - "ai_context_spec"
  - "preview_contract"
  - "acceptance_checks"
steps:
  step-01:
    title: "回到地图：为什么稳定边界还不等于迁移机制"
    layout:
      template: "map_hero_slide"
      regions:
        - { id: "header", width: "full", order: 1 }
        - { id: "lead", width: "full", order: 2 }
        - { id: "summary", width: "full", order: 3 }
    modules:
      - { id: "stage-map", region: "lead", kind: "stage-map", must_be_visible: true }
      - { id: "core-question-card", region: "lead", kind: "question-card", must_be_visible: true }
      - { id: "boundary-card", region: "summary", kind: "boundary-card", must_be_visible: true }
    content_blocks:
      - id: "path"
        type: "plain_text"
        title: "路径定位"
        body: "固定高亮 3-2 -> 3-3 -> 3-4。"
      - id: "question"
        type: "plain_text"
        title: "主问题"
        body: "参数连续变化时，闭环极点究竟沿什么路径移动。"
      - id: "boundary"
        type: "plain_text"
        title: "本课边界"
        body: "本课先解决根轨迹的形成、法则与读法，不进入控制器设计。"
    evidence_sequence:
      - "先呈现路径图。"
      - "再呈现主问题卡。"
      - "最后呈现边界卡。"
    interaction_spec:
      interaction_kind: "none"
      student_task: "只阅读，不提交。"
      answer_reveal: "none"
    teacher_controls:
      release_activity: "not_applicable"
      open_browse: "not_applicable"
      teacher_step_reveal: "not_applicable"
      reveal_reference_answer: "not_applicable"
    student_access:
      default_visibility: "visible"
      release_required: false
      browse_required: false
      can_view_problem_statement: true
      can_view_derivation_steps: true
      can_submit_without_browse: "not_applicable"
    telemetry_spec:
      summary_fields: ["viewed", "timeOnStep", "teacherFollowSync"]
      result_policy: "no_submission"
    teacher_insight_spec:
      widgets: ["view_count", "sync_status"]
      aggregation: "step_level"
    ai_context_spec:
      page_goal: "标定 3-3 位于模块 3 的位置。"
      allowed_scope: ["课程路径", "稳定边界到迁移机制的切换"]
      forbidden_scope: ["完整法则细节", "例题计算"]
      canonical_facts:
        - "3-2 解决稳定边界。"
        - "3-3 解决迁移机制与法则。"
        - "3-4 将把法则用于读图判断。"
    preview_contract:
      route_kind: "student_demo"
      demo_path: "/interactive-learning/courses/unit-3-3-root-locus-rules/student/demo?step=step-01"
      must_match_student_page: true
    acceptance_checks:
      - "首屏能看到路径图、主问题卡和边界卡。"
      - "本页没有作答区。"

  step-02:
    title: "问题引入：知道稳定区间为什么仍然不够"
    layout:
      template: "figure_question_vote"
      regions:
        - { id: "figure", width: "full", order: 1 }
        - { id: "questions", width: "full", order: 2 }
        - { id: "interaction", width: "full", order: 3 }
    modules:
      - { id: "main-figure", region: "figure", kind: "image-card", must_be_visible: true }
      - { id: "question-list", region: "questions", kind: "question-list", must_be_visible: true }
      - { id: "binary-choice", region: "interaction", kind: "binary-choice", must_be_visible: true }
    content_blocks:
      - id: "orientation"
        type: "plain_text"
        title: "页面定向"
        body: "同一闭环系统中，参数连续变化时，极点会沿一条完整路径迁移；这一页先回答为什么只知道稳定区间还不够。"
      - id: "figure"
        type: "media"
        asset: "3-3-pp-04-complete-rules-example.svg"
      - id: "figure_reading_cue"
        type: "bullet_list"
        title: "读图口令"
        items:
          - "先看极点从哪里出发、先往哪走。"
          - "再看它何时逼近或触碰稳定边界。"
      - id: "questions"
        type: "bullet_list"
        title: "本页四问"
        items:
          - "极点先往哪走。"
          - "什么时候开始更振荡。"
          - "什么时候触碰稳定边界。"
          - "参数应朝哪个方向调整。"
      - id: "takeaway"
        type: "plain_text"
        title: "本页结论"
        body: "知道边界点只能回答会不会失稳，不能回答极点怎样一路走过去。"
    evidence_sequence:
      - "先呈现页面定向句。"
      - "再呈现主图与读图口令。"
      - "随后呈现四个追问和本页结论。"
      - "最后呈现二选一判断区。"
    interaction_spec:
      interaction_kind: "binary_choice"
      student_task: "判断仅知道稳定区间是否足以解释整条迁移路径。"
      prompt: "只知道稳定区间，是否已经足够解释整条极点迁移路径。"
      options:
        A: "已经足够"
        B: "仍需整条迁移路径"
      correct_answer: "B"
      failure_feedback: "只提示边界判断不能替代迁移机制。"
      answer_reveal: "teacher_toggle"
    teacher_controls:
      release_activity: "separate_toggle"
      open_browse: "not_applicable"
      teacher_step_reveal: "not_applicable"
      reveal_reference_answer: "separate_toggle"
    student_access:
      default_visibility: "hidden"
      release_required: true
      browse_required: false
      can_view_problem_statement: true
      can_view_derivation_steps: "not_applicable"
      can_submit_without_browse: true
    telemetry_spec:
      summary_fields: ["selectedOption", "resultState", "teacherRevealSeen", "timeOnStep"]
      misconception_tags: ["boundary_is_enough"]
    teacher_insight_spec:
      widgets: ["option_distribution", "reveal_correction_rate"]
      aggregation: "step_level"
    ai_context_spec:
      page_goal: "暴露“边界点已足够”的误判。"
      allowed_scope: ["边界", "趋势", "振荡变化"]
      forbidden_scope: ["提前展开完整法则"]
      canonical_facts:
        - "根轨迹研究的是整条变化路径。"
    preview_contract:
      route_kind: "student_demo"
      demo_path: "/interactive-learning/courses/unit-3-3-root-locus-rules/student/demo?step=step-02"
      must_match_student_page: true
    acceptance_checks:
      - "主图、四问与判断区同页可见。"
      - "错误反馈不提前泄露后续法则。"

  step-03:
    title: "本课目标与研究对象：我们要跟踪的是谁"
    layout:
      template: "goal_boundary_slide"
      regions:
        - { id: "goals", width: "full", order: 1 }
        - { id: "chain", width: "full", order: 2 }
        - { id: "boundary", width: "full", order: 3 }
    modules:
      - { id: "goal-cards", region: "goals", kind: "goal-card-row", must_be_visible: true }
      - { id: "main-chain", region: "chain", kind: "formula-chain", must_be_visible: true }
      - { id: "boundary-table", region: "boundary", kind: "comparison-table", must_be_visible: true }
    content_blocks:
      - id: "goals"
        type: "bullet_list"
        title: "四项目标"
        items:
          - "说清根轨迹研究的是闭环极点迁移。"
          - "先用相角条件再用幅值条件。"
          - "按层次使用完整法则。"
          - "把图形翻回动态语言。"
      - id: "main-chain"
        type: "formula"
        title: "本课主线"
        value: "\\text{参数变化} \\rightarrow \\text{闭环极点迁移} \\rightarrow \\text{轨迹条件} \\rightarrow \\text{完整法则} \\rightarrow \\text{动态翻译}"
      - id: "boundary"
        type: "plain_text"
        title: "本课边界"
        body: "本课不做完整手工作图训练，也不进入控制器整定。"
    evidence_sequence:
      - "先呈现目标卡。"
      - "再呈现主线链。"
      - "最后呈现边界表。"
    interaction_spec:
      interaction_kind: "none"
      student_task: "只建立整体预期。"
      answer_reveal: "none"
    teacher_controls:
      release_activity: "not_applicable"
      open_browse: "not_applicable"
      teacher_step_reveal: "not_applicable"
      reveal_reference_answer: "not_applicable"
    student_access:
      default_visibility: "visible"
      release_required: false
      browse_required: false
      can_view_problem_statement: true
      can_view_derivation_steps: true
      can_submit_without_browse: "not_applicable"
    telemetry_spec:
      summary_fields: ["viewed", "timeOnStep"]
      result_policy: "no_submission"
    teacher_insight_spec:
      widgets: ["view_count"]
      aggregation: "step_level"
    ai_context_spec:
      page_goal: "建立明确的课堂目标与边界。"
      allowed_scope: ["目标卡", "主线链", "负责与不负责范围"]
      forbidden_scope: ["提前展开例题细节"]
      canonical_facts:
        - "本课先搭机制，再做读图判断。"
    preview_contract:
      route_kind: "student_demo"
      demo_path: "/interactive-learning/courses/unit-3-3-root-locus-rules/student/demo?step=step-03"
      must_match_student_page: true
    acceptance_checks:
      - "目标卡、主线链和边界表必须同屏。"
      - "本页无作答区。"

  step-04:
    title: "根轨迹定义：参数变化下的闭环根集合"
    layout:
      template: "definition_formula_figure"
      regions:
        - { id: "definition", width: "full", order: 1 }
        - { id: "example", width: "full", order: 2 }
        - { id: "reflection", width: "full", order: 3 }
    modules:
      - { id: "definition-card", region: "definition", kind: "definition-card", must_be_visible: true }
      - { id: "second-order-example", region: "example", kind: "formula-card", must_be_visible: true }
      - { id: "short-response", region: "reflection", kind: "short-response", must_be_visible: true }
    content_blocks:
      - id: "definition"
        type: "plain_text"
        title: "根轨迹定义"
        body: "当 K 从 0 连续变化到 +∞ 时，闭环特征方程全部根在 s 平面上形成的轨迹集合。"
      - id: "definition_bridge"
        type: "plain_text"
        title: "定义回扣"
        body: "根轨迹研究的不是某一个 K 下的一个根，而是 K 连续变化时全部闭环根在 s 平面的轨迹集合。"
      - id: "entry-formula"
        type: "formula_group"
        title: "起始方程"
        items:
          - "1+L(s)=0"
          - "L(s)=K G_0(s)H(s)"
      - id: "example"
        type: "formula_group"
        title: "二阶对象"
        items:
          - "G(s)=\\frac{K^\\ast}{s(s+2)}"
          - "\\lambda_{1,2}=-1\\pm\\sqrt{1-K^\\ast}"
      - id: "example_takeaway"
        type: "plain_text"
        title: "示例回扣"
        body: "若只取某一个 K，只能得到一个时刻的根位置，无法看到整条迁移过程。"
      - id: "reflection_prompt"
        type: "plain_text"
        title: "反思题面"
        body: "为什么单点求根不足以替代根轨迹。"
      - id: "closing_takeaway"
        type: "plain_text"
        title: "本页收束"
        body: "因此，单点求根只能回答此刻根在哪里，根轨迹才回答参数连续变化时根怎样一路迁移。"
    evidence_sequence:
      - "先呈现定义卡与定义回扣句。"
      - "再呈现起始方程、二阶对象与示例回扣句。"
      - "随后呈现反思题面。"
      - "最后呈现本页收束句。"
    interaction_spec:
      interaction_kind: "short_response"
      student_task: "补写一句“为什么单点求根不足以替代根轨迹”。"
      prompt: "为什么单点求根不足以替代根轨迹。"
      answer_reveal: "none"
    teacher_controls:
      release_activity: "separate_toggle"
      open_browse: "not_applicable"
      teacher_step_reveal: "not_applicable"
      reveal_reference_answer: "not_applicable"
    student_access:
      default_visibility: "hidden"
      release_required: true
      browse_required: false
      can_view_problem_statement: true
      can_view_derivation_steps: "not_applicable"
      can_submit_without_browse: true
    telemetry_spec:
      summary_fields: ["responseSubmitted", "responseLength", "timeOnStep"]
      result_policy: "open_response"
    teacher_insight_spec:
      widgets: ["response_word_cloud", "common_reason_tags"]
      aggregation: "step_level"
    ai_context_spec:
      page_goal: "建立“集合而不是单点”的视角。"
      allowed_scope: ["闭环根集合", "单点求根局限", "二阶对象示例"]
      forbidden_scope: ["替学生生成标准短答"]
      canonical_facts:
        - "根轨迹首先研究的是闭环极点的连续迁移。"
    preview_contract:
      route_kind: "student_demo"
      demo_path: "/interactive-learning/courses/unit-3-3-root-locus-rules/student/demo?step=step-04"
      must_match_student_page: true
    acceptance_checks:
      - "定义卡先于短答区落页。"
      - "二阶对象公式完整可见。"

  step-05:
    title: "从 `1+L(s)=0` 到相角条件与幅值条件"
    layout:
      template: "equation_condition_workspace"
      regions:
        - { id: "equation", width: "full", order: 1 }
        - { id: "geometry", width: "full", order: 2 }
        - { id: "interaction", width: "full", order: 3 }
    modules:
      - { id: "equation-chain", region: "equation", kind: "formula-chain", must_be_visible: true }
      - { id: "geometry-figure", region: "geometry", kind: "image-card", must_be_visible: true }
      - { id: "condition-cards", region: "geometry", kind: "formula-card-group", must_be_visible: true }
      - { id: "reason-check", region: "interaction", kind: "reason-check", must_be_visible: true }
    content_blocks:
      - id: "equation-chain"
        type: "formula_group"
        title: "方程链"
        items:
          - "1+L(s)=0"
          - "L(s)=-1"
      - id: "equation_to_role_bridge"
        type: "plain_text"
        title: "桥接语"
        body: "把闭环方程改写成 L(s)=-1 后，问题分成两步：先判某点有没有资格在根轨迹上，再由参数确定它对应哪一个增益。"
      - id: "geometry-figure"
        type: "media"
        asset: "3-3-pp-03-angle-and-magnitude-geometry.svg"
      - id: "conditions"
        type: "formula_group"
        title: "两大判据"
        items:
          - "\\angle G_0(s)H(s)=(2\\ell+1)\\pi"
          - "K=\\frac{1}{|G_0(s)H(s)|}"
      - id: "sequence_judgement_prompt"
        type: "plain_text"
        title: "顺序判断题面"
        body: "相角条件与幅值条件，谁先决定资格，谁再决定参数。"
    evidence_sequence:
      - "先呈现方程链与桥接语。"
      - "再呈现几何图与两条判据。"
      - "最后呈现顺序判断区。"
    interaction_spec:
      interaction_kind: "reason_check"
      student_task: "判断“先资格、后参数”的使用顺序。"
      prompt: "相角条件与幅值条件，谁先决定资格，谁再决定参数。"
      target_takeaway: "相角条件先做资格判断，幅值条件再把轨迹点对应到具体增益。"
      answer_reveal: "teacher_toggle"
    teacher_controls:
      release_activity: "separate_toggle"
      open_browse: "not_applicable"
      teacher_step_reveal: "not_applicable"
      reveal_reference_answer: "separate_toggle"
    student_access:
      default_visibility: "hidden"
      release_required: true
      browse_required: false
      can_view_problem_statement: true
      can_view_derivation_steps: "not_applicable"
      can_submit_without_browse: true
    telemetry_spec:
      summary_fields: ["selectedReason", "attemptCount", "teacherRevealSeen"]
      misconception_tags: ["magnitude_before_angle"]
    teacher_insight_spec:
      widgets: ["reason_distribution"]
      aggregation: "step_level"
    ai_context_spec:
      page_goal: "稳住两大判据的使用顺序。"
      allowed_scope: ["角度", "模值", "资格判断", "参数回算"]
      forbidden_scope: ["替学生先做判断"]
      canonical_facts:
        - "相角条件先判断某点能不能在轨迹上。"
        - "幅值条件再把轨迹点对应到具体增益。"
    preview_contract:
      route_kind: "student_demo"
      demo_path: "/interactive-learning/courses/unit-3-3-root-locus-rules/student/demo?step=step-05"
      must_match_student_page: true
    acceptance_checks:
      - "公式链、几何图和两条判据同页。"
      - "学生演示页不能退化为纯文字问答。"

  step-06:
    title: "骨架法则板：起点终点、实轴区段与渐近线"
    layout:
      template: "rules_overview_board"
      regions:
        - { id: "main-figure", width: "full", order: 1 }
        - { id: "rule-cards", width: "full", order: 2 }
        - { id: "interaction", width: "full", order: 3 }
    modules:
      - { id: "main-figure", region: "main-figure", kind: "image-card", must_be_visible: true }
      - { id: "real-axis-figure", region: "main-figure", kind: "image-card", must_be_visible: true }
      - { id: "skeleton-rule-cards", region: "rule-cards", kind: "rule-card-row", must_be_visible: true }
      - { id: "region-highlight", region: "interaction", kind: "region-highlight", must_be_visible: true }
    content_blocks:
      - id: "main-figure"
        type: "media"
        asset: "3-3-pp-04-complete-rules-example.svg"
      - id: "real-axis-figure"
        type: "media"
        asset: "3-3-pp-05-real-axis-parity.svg"
      - id: "rules"
        type: "bullet_list"
        title: "骨架法则"
        items:
          - "起点与终点。"
          - "分支数、连续性与实轴对称。"
          - "实轴某点右侧的开环实极点与开环实零点总数为奇数，则该段属于根轨迹。"
          - "渐近线条数、重心与角度。"
      - id: "figure_reading_cue"
        type: "bullet_list"
        title: "读图口令"
        items:
          - "先找起点终点与分支数。"
          - "再判实轴哪些区段属于根轨迹。"
          - "最后用渐近线补出远端走向。"
      - id: "highlight_prompt"
        type: "plain_text"
        title: "高亮题面"
        body: "请在实轴上标出属于根轨迹的区段，并说明依据是右侧奇偶判据。"
      - id: "closing_takeaway"
        type: "plain_text"
        title: "本页收束"
        body: "普通根轨迹先靠这些法则搭出整体骨架，再去判断分离点、虚轴交点和局部方向。"
    evidence_sequence:
      - "先呈现骨架法则卡与本页收束句。"
      - "再呈现主图、实轴补图与读图口令。"
      - "最后呈现区段高亮区。"
    interaction_spec:
      interaction_kind: "region_highlight"
      student_task: "在实轴上标出属于根轨迹的区段，并说明依据是右侧奇偶判据。"
      prompt: "请在实轴上标出属于根轨迹的区段，并说明依据是右侧奇偶判据。"
      target_takeaway: "骨架法则先帮助我们搭出整张图的大势，再进入关键节点与局部方向。"
      answer_reveal: "teacher_toggle"
    teacher_controls:
      release_activity: "separate_toggle"
      open_browse: "not_applicable"
      teacher_step_reveal: "not_applicable"
      reveal_reference_answer: "separate_toggle"
    student_access:
      default_visibility: "hidden"
      release_required: true
      browse_required: false
      can_view_problem_statement: true
      can_view_derivation_steps: "not_applicable"
      can_submit_without_browse: true
    telemetry_spec:
      summary_fields: ["highlightChoice", "resultState", "teacherRevealSeen"]
      misconception_tags: ["jump_to_keypoints_too_early"]
    teacher_insight_spec:
      widgets: ["rule_confusion_heatmap"]
