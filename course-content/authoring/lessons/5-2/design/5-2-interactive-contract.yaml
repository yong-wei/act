      - { id: 'nonlinear-source', title: '非线性来源', region: 'source', kind: 'content.table', must_be_visible: true, payload: { legacyKind: 'native-table', presentation: 'single',  title: '非线性来源', columns: ['来源', '表现', '工程含义'], rows: [['放大器或阀驱动电压限幅', '存在 ±10V 限幅', '大幅航向修正时有效控制能力下降'], ['阀芯搭接、摩擦和启动压力', '微小电压不能立即产生液压流量', '小幅稳态修正时死区吞掉细微动作']] } }
      - { id: 'rudder-source-task', title: '死区来源判断', region: 'activity', kind: 'activity.panel', must_be_visible: true , payload: { legacyKind: 'single-choice-card', presentation: 'single', interactionKind: 'single-choice', responseKind: 'choice.single' }}
    content_blocks: { case_focus: '执行器结构决定死区与饱和来自哪里。' }
    evidence_sequence: ['执行器结构图', '执行器链条', '非线性来源表', '单选题']
