    preview_contract: { demo_path: '/interactive-learning/courses/unit-5-2-nonlinear-analysis-entry/student/demo?step=step-09' }
    acceptance_checks: ['Rust 面板不可降级。', '滞环和间隙必须显示路径相关回线。', '公式必须完整呈现。']

