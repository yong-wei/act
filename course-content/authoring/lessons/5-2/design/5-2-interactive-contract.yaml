  step-08:
    title: '饱和、死区与死区饱和的描述函数'
    layout: { template: 'nonlinear_characteristic_rust_tabs_board', regions: [{ id: 'panel', width: 'full', order: 1 }, { id: 'controls', width: 'full', order: 2 }, { id: 'formulas', width: 'full', order: 3 }, { id: 'activity', width: 'full', order: 4 }] }
    modules:
      - { id: 'memoryless-rust-panel', title: '无记忆非线性特性面板', region: 'panel', kind: 'compute.panel', must_be_visible: true, payload: { legacyKind: 'interactive-figure-panel', presentation: 'single', semanticRole: 'media', capabilityRef: 'interactive-figure',  title: '无记忆非线性特性面板', panel_id: 'rust_memoryless_nonlinearity_tabs', text: '饱和、死区、死区饱和输入输出特性面板。' } }
      - { id: 'memoryless-controls', title: '参数控件', region: 'controls', kind: 'content.cardSet', must_be_visible: true, payload: { legacyKind: 'summary-card', presentation: 'single', semanticRole: 'summary',  title: '参数控件', text: '控件随标签变化：饱和调节 $k,a,A$；死区调节 $k,\\Delta,A$；死区饱和调节 $k,\\Delta,a,A$。' } }
      - { id: 'memoryless-formulas', title: '无记忆环节描述函数', region: 'formulas', kind: 'content.formula', must_be_visible: true, payload: { legacyKind: 'native-formula-table', presentation: 'single',  title: '无记忆环节描述函数', columns: ['对象', '公式'], rows: [['饱和', '$N(A)=k,\ 0<A\le a;\quad N(A)=\dfrac{2k}{\pi}\left[\sin^{-1}\dfrac{a}{A}+\dfrac{a}{A}\sqrt{1-\left(\dfrac{a}{A}\right)^2}\right],\ A>a$'], ['死区', '$N(A)=0,\ 0<A\le \Delta;\quad N(A)=\dfrac{2k}{\pi}\left[\dfrac{\pi}{2}-\sin^{-1}\dfrac{\Delta}{A}-\dfrac{\Delta}{A}\sqrt{1-\left(\dfrac{\Delta}{A}\right)^2}\right],\ A>\Delta$'], ['死区饱和', '$N(A)=0,\ 0<A\le \Delta;\quad N(A)=\dfrac{2k}{\pi}\left[\dfrac{\pi}{2}-\sin^{-1}\dfrac{\Delta}{A}-\dfrac{\Delta}{A}\sqrt{1-\left(\dfrac{\Delta}{A}\right)^2}\right],\ \Delta<A\le a;\quad N(A)=\dfrac{2k}{\pi}\left[\sin^{-1}\dfrac{a}{A}-\sin^{-1}\dfrac{\Delta}{A}+\dfrac{a}{A}\sqrt{1-\left(\dfrac{a}{A}\right)^2}-\dfrac{\Delta}{A}\sqrt{1-\left(\dfrac{\Delta}{A}\right)^2}\right],\ A>a$']] } }
      - { id: 'memoryless-observation', title: '无记忆环节观察提交', region: 'activity', kind: 'activity.panel', must_be_visible: true , payload: { legacyKind: 'activity-card-set', presentation: 'single' }}
    content_blocks:
      formulas:
        saturation: '$N(A)=k,\ 0<A\le a;\quad N(A)=\dfrac{2k}{\pi}\left[\sin^{-1}\dfrac{a}{A}+\dfrac{a}{A}\sqrt{1-\left(\dfrac{a}{A}\right)^2}\right],\ A>a;\quad k>0,\ a>0,\ A>0.$'
        deadzone: '$N(A)=0,\ 0<A\le \Delta;\quad N(A)=\dfrac{2k}{\pi}\left[\dfrac{\pi}{2}-\sin^{-1}\dfrac{\Delta}{A}-\dfrac{\Delta}{A}\sqrt{1-\left(\dfrac{\Delta}{A}\right)^2}\right],\ A>\Delta;\quad k>0,\ \Delta>0,\ A>0.$'
        deadzone_saturation: '$N(A)=0,\ 0<A\le \Delta;\quad N(A)=\dfrac{2k}{\pi}\left[\dfrac{\pi}{2}-\sin^{-1}\dfrac{\Delta}{A}-\dfrac{\Delta}{A}\sqrt{1-\left(\dfrac{\Delta}{A}\right)^2}\right],\ \Delta<A\le a;\quad N(A)=\dfrac{2k}{\pi}\left[\sin^{-1}\dfrac{a}{A}-\sin^{-1}\dfrac{\Delta}{A}+\dfrac{a}{A}\sqrt{1-\left(\dfrac{a}{A}\right)^2}-\dfrac{\Delta}{A}\sqrt{1-\left(\dfrac{\Delta}{A}\right)^2}\right],\ A>a.$'
    interactive_figure_spec:
      kind: 'rust_nonlinearity_characteristic_tabs'
      required: true
      fallback_allowed: false
      layout: { graph_region: 'left_relation_right_signal', controls_region: 'bottom' }
      tabs:
        - id: 'saturation'
          label: '饱和'
          formula_key: 'saturation'
          controls:
            - { id: 'k', label: '斜率 k', min: 0.2, max: 5, default: 1, step: 0.1, domain_constraint: 'k>0' }
            - { id: 'a', label: '饱和阈值 a', min: 0.2, max: 5, default: 1, step: 0.1, domain_constraint: 'a>0' }
            - { id: 'A', label: '输入幅值 A', min: 0.05, max: 8, default: 2, step: 0.05, domain_constraint: 'A>0' }
        - id: 'deadzone'
          label: '死区'
          formula_key: 'deadzone'
          controls:
            - { id: 'k', label: '斜率 k', min: 0.2, max: 5, default: 1, step: 0.1, domain_constraint: 'k>0' }
            - { id: 'Delta', label: '死区宽度 Δ', min: 0.1, max: 3, default: 0.5, step: 0.05, domain_constraint: 'Delta>0' }
            - { id: 'A', label: '输入幅值 A', min: 0.05, max: 8, default: 2, step: 0.05, domain_constraint: 'A>0' }
        - id: 'deadzone_saturation'
          label: '死区饱和'
          formula_key: 'deadzone_saturation'
          controls:
            - { id: 'k', label: '斜率 k', min: 0.2, max: 5, default: 1, step: 0.1, domain_constraint: 'k>0' }
            - { id: 'Delta', label: '死区宽度 Δ', min: 0.1, max: 3, default: 0.5, step: 0.05, domain_constraint: '0<Delta<a' }
            - { id: 'a', label: '饱和阈值 a', min: 0.2, max: 5, default: 2, step: 0.05, domain_constraint: 'a>Delta' }
            - { id: 'A', label: '输入幅值 A', min: 0.05, max: 8, default: 3, step: 0.05, domain_constraint: 'A>0' }
      graph_requirements: ['显示输入输出曲线', '显示正弦输入幅值边界', '标注关键参数关系']
    evidence_sequence: ['左侧输入输出关系', '右侧输入正弦与输出对比', '底部参数控件', '完整公式与参数范围', '观察提交']
    interaction_spec:
      interaction_kind: 'activity_card_set'
      student_task: '调节当前非线性环节参数，提交参数组和图形变化观察。'
      activity_cards:
        - { id: 'memoryless-observation-submit', prompt: '请选择一个非线性标签，调节参数，并说明输入输出图形哪一段发生变化。', response_kind: 'text.short', reference_answer: '应同时写出标签、参数组和对应的死区段、线性段或饱和段变化。', submit_scope: 'per_card', layout_span: 'full' }
    teacher_controls: *controls_quiz
    student_access: *access_hidden
    teacher_insight_spec: { widgets: ['parameter_distribution', 'observation_keywords'] }
    telemetry_spec: { summary_fields: ['tabId', 'parameters', 'cardSubmitted'], misconception_tags: ['formula_without_range'] }
    ai_context_spec: { page_goal: '将无记忆非线性输入输出形态、参数和描述函数公式绑定。' }
