contract_version: '2.1'
lesson_id: '5-2'
course_title: '5-2：非线性系统的最小分析入口'
course_route_segment: 'unit-5-2-nonlinear-analysis-entry'
preview_mode:
  default_entry: 'student_demo'
  student_demo_base_path: '/interactive-learning/courses/unit-5-2-nonlinear-analysis-entry/student/demo'
media_policy:
  runtime_only: true
  runtime_export_required: true
  runtime_media_base: '/course-runtime/lessons/5-2/media'
telemetry_strategy: 'lightweight_high_value'
teacher_insight_strategy: 'step_level_aggregation_only'
required_step_fields:
  - layout
  - modules
  - content_blocks
  - interaction_spec
  - teacher_controls
  - telemetry_spec
  - teacher_insight_spec
  - ai_context_spec
  - preview_contract
  - acceptance_checks
steps:
  step-01:
    title: '非线性边界现象与三种观察工具'
    layout: { template: 'intro_comic_problem_board', regions: [{ id: 'intro', width: 'full', order: 1 }, { id: 'media', width: 'full', order: 2 }, { id: 'summary', width: 'full', order: 3 }] }
    modules:
      - { id: 'problem', region: 'intro', kind: 'content.cardSet', must_be_visible: true, payload: { legacyKind: 'summary-card', presentation: 'single', semanticRole: 'summary',  title: '非线性边界问题', text: '同一控制回路为什么在小幅输入下像线性模型，大幅输入下却可能触碰饱和并产生周期摆动。' } }
      - { id: 'cover', region: 'media', kind: 'content.figure', must_be_visible: true, payload: { legacyKind: 'image-panel', presentation: 'single', semanticRole: 'media',  src: '/course-runtime/lessons/5-2/media/5-2-cover-comic.png', caption: '封面漫画：非线性边界中的控制回路' } }
      - { id: 'tool-map', region: 'media', kind: 'content.figure', must_be_visible: true, payload: { legacyKind: 'image-panel', presentation: 'single', semanticRole: 'media',  src: '/course-runtime/lessons/5-2/media/5-2-nonlinear-tool-comparison.png', caption: '三种非线性边界工具看到的对象不同' } }
      - { id: 'tool-summary', title: '三种观察工具', region: 'summary', kind: 'content.cardSet', must_be_visible: true, payload: { legacyKind: 'bullet-list-card', presentation: 'single',  title: '三种观察工具', bullets: ['局部线性化看工作点附近的小扰动。', '相平面看二阶状态轨迹。', '描述函数看正弦基波近似下的自振边界。'] } }
    content_blocks: { conclusion: '三种工具不是谁替代谁，而是在非线性边界下回答不同证据问题。' }
    evidence_sequence: ['标题问题', '封面漫画', '三工具对照图', '三工具对照条', '收束句']
    interaction_spec: { interaction_kind: 'none', student_task: '只阅读，不提交。' }
    teacher_controls: &controls_none { release_activity: 'not_applicable', open_browse: 'not_applicable', teacher_step_reveal: 'not_applicable', reveal_reference_answer: 'not_applicable' }
    student_access: &access_visible { default_visibility: 'visible', release_required: false, browse_required: false, can_view_problem_statement: true, can_view_derivation_steps: true, can_submit_without_browse: false }
    teacher_insight_spec: { widgets: ['view_count', 'sync_status'] }
    telemetry_spec: { summary_fields: ['viewed', 'timeOnStep'], misconception_tags: [] }
    ai_context_spec: { page_goal: '建立非线性边界下三种观察工具的分工。' }
    preview_contract: { demo_path: '/interactive-learning/courses/unit-5-2-nonlinear-analysis-entry/student/demo?step=step-01' }
    acceptance_checks: ['封面漫画先于三工具对照图出现。', '本页不设置作答区。']

  step-02:
    title: '本次课程目标'
    layout: { template: 'goal_statement_board', regions: [{ id: 'goals', width: 'full', order: 1 }] }
    modules:
      - { id: 'goal-list', title: '本次课程目标', region: 'goals', kind: 'content.cardSet', must_be_visible: true, payload: { legacyKind: 'goal-card-row', presentation: 'row', semanticRole: 'goal',  intro: '完成本次课程后，学习者能够：', goals: ['解释局部线性化的工作点、增量变量和适用范围。', '计算一元非线性关系在给定工作点附近的一阶线性化模型。', '识别相平面中平衡点、轨迹方向、吸引行为和周期运动。', '写出主要非线性环节的描述函数及参数范围。', '使用负倒描述函数和微小扰动法判断候选自振点。', '结合执行器结构、仿真响应和工程后果提出整改方向。'] } }
    content_blocks:
      intro: '完成本次课程后，学习者能够：'
      goal_cards:
        - '解释局部线性化的工作点、增量变量和适用范围。'
        - '计算一元非线性关系在给定工作点附近的一阶线性化模型。'
        - '识别相平面中平衡点、轨迹方向、吸引行为和周期运动。'
        - '写出主要非线性环节的描述函数及参数范围。'
        - '使用负倒描述函数和微小扰动法判断候选自振点。'
        - '结合执行器结构、仿真响应和工程后果提出整改方向。'
    evidence_sequence: ['引导句', '六项目标']
    interaction_spec: { interaction_kind: 'none', student_task: '阅读目标。' }
    teacher_controls: *controls_none
    student_access: *access_visible
    teacher_insight_spec: { widgets: ['view_count'] }
    telemetry_spec: { summary_fields: ['viewed', 'timeOnStep'], misconception_tags: [] }
    ai_context_spec: { page_goal: '只呈现本次课程能力目标。' }
    preview_contract: { demo_path: '/interactive-learning/courses/unit-5-2-nonlinear-analysis-entry/student/demo?step=step-02' }
    acceptance_checks: ['不得提前出现公式、表格、例题或案例图。']

  step-03:
    title: '前置基础快测'
    layout: { template: 'quiz_group_board', regions: [{ id: 'intro', width: 'full', order: 1 }, { id: 'quiz', width: 'full', order: 2 }] }
    modules:
      - { id: 'foundation-scope', title: '基础知识点', region: 'intro', kind: 'content.cardSet', must_be_visible: true, payload: { legacyKind: 'summary-card', presentation: 'single', semanticRole: 'summary',  title: '基础知识点', text: '本页检查状态变量、正弦信号和低通滤波三个基础概念。' } }
      - { id: 'pretest', title: '基础概念快测', region: 'quiz', kind: 'activity.panel', must_be_visible: true , payload: { legacyKind: 'quiz-group', presentation: 'single', interactionKind: 'quiz' }}
    content_blocks: { note: '这些题只检查学习本页所需的基础概念。' }
    evidence_sequence: ['基础知识点', '三题客观题组']
    interaction_spec:
      interaction_kind: 'quiz_group'
      student_task: '完成三题基础概念快测。'
      activity_cards:
        - { id: 'state-point', prompt: '二阶运动对象常用状态变量 $x_1=x$、$x_2=\dot{x}$ 表示。若给出初始点 $(x_1(0),x_2(0))$，它描述的是哪一类信息？', response_kind: 'choice.single', options: ['系统从某个位置和速度出发的状态', '系统的频率响应', '控制器的传递函数'], reference_answer: '系统从某个位置和速度出发的状态', submit_scope: 'per_card', layout_span: 'full' }
        - { id: 'sine-meaning', prompt: '正弦信号 $e(t)=A\sin(\omega t)$ 中，$A$ 与 $\omega$ 分别表示什么？', response_kind: 'choice.single', options: ['幅值和角频率', '相位和阻尼比', '时间常数和增益'], reference_answer: '幅值和角频率', submit_scope: 'per_card', layout_span: 'full' }
        - { id: 'low-pass', prompt: '低通滤波环节通常更容易保留低频成分，并衰减较高频率成分。', response_kind: 'choice.binary', options: ['正确', '错误'], reference_answer: '正确', submit_scope: 'per_card', layout_span: 'full' }
    teacher_controls: &controls_quiz { release_activity: 'teacher_toggle', open_browse: 'not_applicable', teacher_step_reveal: 'not_applicable', reveal_reference_answer: 'teacher_toggle' }
    student_access: &access_hidden { default_visibility: 'hidden', release_required: true, browse_required: false, can_view_problem_statement: true, can_view_derivation_steps: true, can_submit_without_browse: true }
    teacher_insight_spec: { widgets: ['question_distribution', 'completion_rate'] }
    telemetry_spec: { summary_fields: ['attemptCount', 'resultState', 'cardSubmitted'], misconception_tags: ['state_point_confusion', 'sine_parameter_confusion', 'low_pass_confusion'] }
    ai_context_spec: { page_goal: '诊断状态变量、正弦信号和低通滤波基础概念。' }
    preview_contract: { demo_path: '/interactive-learning/courses/unit-5-2-nonlinear-analysis-entry/student/demo?step=step-03' }
    acceptance_checks: ['题目不得考察局部线性化、描述函数公式或微小扰动法。']

  step-04:
    title: '工作点附近的局部线性化'
    layout: { template: 'formula_example_board', regions: [{ id: 'formula', width: 'full', order: 1 }, { id: 'table', width: 'full', order: 2 }, { id: 'activity', width: 'full', order: 3 }] }
    modules:
      - { id: 'linearization-formula', title: '局部线性化公式', region: 'formula', kind: 'content.formula', must_be_visible: true, payload: { legacyKind: 'formula-card', presentation: 'single',  title: '局部线性化公式', formulas: ['$y \\approx f(x_0)+f''(x_0)(x-x_0)$', '$\\Delta x=x-x_0,\\ \\Delta y=y-f(x_0)$', '$\\Delta y \\approx f''(x_0)\\Delta x$'] } }
      - { id: 'tanh-table', title: 'tanh x 两个工作点对比', region: 'table', kind: 'content.table', must_be_visible: true, payload: { legacyKind: 'native-table', presentation: 'single',  title: 'tanh x 两个工作点对比', columns: ['工作点', '$f(x_0)$', '$f''(x_0)$', '线性化模型', '适用读法'], rows: [['$x_0=0$', '0', '1', '$\\Delta y \\approx \\Delta x$', '原点附近小扰动'], ['$x_0=1$', '约 0.762', '约 0.420', '$y \\approx 0.762+0.420(x-1)$', '$x=1$ 附近小扰动']] } }
      - { id: 'local-tasks', title: '局部线性化判断', region: 'activity', kind: 'activity.panel', must_be_visible: true , payload: { legacyKind: 'activity-card-set', presentation: 'single' }}
    content_blocks: { warning: 'f''(x0) 是工作点附近的小信号增益，不是全局比例系数。' }
    evidence_sequence: ['泰勒展开', '增量变量', 'tanh x 两工作点对比表', '两张作答卡']
    interaction_spec:
      interaction_kind: 'activity_card_set'
      activity_cards:
        - { id: 'gain-meaning', prompt: '哪个量表示工作点附近的小信号增益？', response_kind: 'choice.single', options: ['$f''(x_0)$', '$f(x_0)$', '$x-x_0$'], reference_answer: '$f''(x_0)$', submit_scope: 'per_card', layout_span: 'half' }
        - { id: 'global-risk', prompt: '$f''(0)=1$ 是否可直接用于 $x=3$ 附近的大幅输入？', response_kind: 'choice.binary', options: ['不能', '能'], reference_answer: '不能', submit_scope: 'per_card', layout_span: 'half' }
    teacher_controls: *controls_quiz
    student_access: *access_hidden
    teacher_insight_spec: { widgets: ['question_distribution', 'completion_rate'] }
    telemetry_spec: { summary_fields: ['cardSubmitted', 'resultState'], misconception_tags: ['slope_as_global_gain'] }
    ai_context_spec: { page_goal: '固定工作点、小扰动和局部模型边界。' }
    preview_contract: { demo_path: '/interactive-learning/courses/unit-5-2-nonlinear-analysis-entry/student/demo?step=step-04' }
    acceptance_checks: ['工作点和扰动范围必须同页出现。', '两题单独提交。']

  step-05:
    title: '动态系统线性化与局部结论'
    layout: { template: 'formula_table_board', regions: [{ id: 'formula', width: 'full', order: 1 }, { id: 'table', width: 'full', order: 2 }, { id: 'activity', width: 'full', order: 3 }] }
    modules:
      - { id: 'jacobian-formula', title: '动态线性化公式', region: 'formula', kind: 'content.formula', must_be_visible: true, payload: { legacyKind: 'formula-card', presentation: 'single',  title: '动态线性化公式', formulas: ['$\\dot{x}_1=x_2,\\ \\dot{x}_2=f(x_1,x_2)$', '$x_2=0,\\ f(x_1,0)=0$', '$\\Delta \\dot{x}=A\\Delta x$'] } }
      - { id: 'applicability-table', title: '局部模型适用条件', region: 'table', kind: 'content.table', must_be_visible: true, payload: { legacyKind: 'native-table', presentation: 'single',  title: '局部模型适用条件', columns: ['观察条件', '可用性判断', '典型证据'], rows: [['非线性关系在工作点附近可导', '通常可用', '曲线平滑，有明确斜率'], ['扰动幅值很小且未触碰边界', '通常可用', '小输入响应与线性预测接近'], ['工作点改变', '需要重新线性化', '不同工况小信号增益不同'], ['轨迹远离工作点或穿过阈值', '单一线性模型不足', '大输入响应与线性预测分离'], ['继电、滞回、间隙主导响应', '不能直接等价为传递函数', '同一输入值对应不同输出状态']] } }
      - { id: 'local-conclusion-task', title: '局部结论判断', region: 'activity', kind: 'activity.panel', must_be_visible: true , payload: { legacyKind: 'single-choice-card', presentation: 'single', interactionKind: 'single-choice', responseKind: 'choice.single' }}
    content_blocks: { note: '雅可比矩阵特征值只说明平衡点附近的小扰动趋势。' }
    evidence_sequence: ['状态方程', '平衡条件', '雅可比增量模型', '适用条件表', '单选题']
    interaction_spec:
      interaction_kind: 'single_choice'
      activity_cards:
        - { id: 'local-result', prompt: '若雅可比矩阵特征值均在左半平面，最稳妥的结论是什么？', response_kind: 'choice.single', options: ['平衡点附近足够小的扰动会衰减，但不能保证远处轨迹也衰减', '系统全局稳定', '系统必然形成稳定自振'], reference_answer: '平衡点附近足够小的扰动会衰减，但不能保证远处轨迹也衰减', submit_scope: 'per_card', layout_span: 'full' }
    teacher_controls: *controls_quiz
    student_access: *access_hidden
    teacher_insight_spec: { widgets: ['question_distribution'] }
    telemetry_spec: { summary_fields: ['cardSubmitted', 'resultState'], misconception_tags: ['local_as_global'] }
    ai_context_spec: { page_goal: '把动态线性化与局部结论边界绑定。' }
    preview_contract: { demo_path: '/interactive-learning/courses/unit-5-2-nonlinear-analysis-entry/student/demo?step=step-05' }
    acceptance_checks: ['必须明确局部结论不能推出全局稳定。']

  step-06:
    title: '相平面中的状态轨迹与周期行为'
    layout: { template: 'phase_plane_rust_tabs_board', regions: [{ id: 'formula', width: 'full', order: 1 }, { id: 'panel', width: 'full', order: 2 }, { id: 'reading', width: 'full', order: 3 }, { id: 'activity', width: 'full', order: 4 }] }
    modules:
      - { id: 'phase-formula', title: '相平面阅读公式', region: 'formula', kind: 'content.formula', must_be_visible: true, payload: { legacyKind: 'formula-card', presentation: 'single',  title: '相平面阅读公式', formulas: ['$\\dot{x}_1=x_2$', '$\\dot{x}_2=f(x_1,x_2)$', '$\\dfrac{dx_2}{dx_1}=\\dfrac{f(x_1,x_2)}{x_2}$'] } }
      - { id: 'phase-rust-tabs', title: '相平面轨迹面板', region: 'panel', kind: 'compute.panel', must_be_visible: true, payload: { legacyKind: 'interactive-figure-panel', presentation: 'single', semanticRole: 'media', capabilityRef: 'interactive-figure',  title: '相平面轨迹面板', panel_id: 'rust_phase_plane_tabs', text: '三标签 Rust 相平面面板。' } }
      - { id: 'phase-reading-table', title: '相平面读图对象', region: 'reading', kind: 'content.table', must_be_visible: true, payload: { legacyKind: 'native-table', presentation: 'single',  title: '相平面读图对象', columns: ['阅读对象', '能提供的信息'], rows: [['平衡点', '系统可能停在哪里'], ['方向场', '各状态处的运动趋势'], ['闭合轨道', '可能存在周期行为'], ['多条初始轨迹', '吸引行为和初值敏感性']] } }
      - { id: 'phase-observation', title: '相轨迹观察提交', region: 'activity', kind: 'activity.panel', must_be_visible: true , payload: { legacyKind: 'activity-card-set', presentation: 'single' }}
    content_blocks:
      explanation: '图中的每个点表示系统状态，不是时间轴上的采样点；从不同初始点生成的轨迹揭示运动方向、吸引行为和周期行为。'
    interactive_figure_spec:
      kind: 'rust_phase_plane_tabs'
      required: true
      fallback_allowed: false
      tabs:
        - { id: 'van_der_pol', label: 'Van der Pol 振子', equations: ['xdot1=x2', 'xdot2=(1-x1^2)x2-x1'], purpose: '观察不同初始条件趋向共同闭合轨道。' }
        - { id: 'damped_second_order', label: '阻尼二阶系统', equations: ['xdot1=x2', 'xdot2=-2*zeta*omega_n*x2-omega_n^2*x1'], default_parameters: { zeta: 0.35, omega_n: 1 }, purpose: '观察阻尼二阶轨迹逐步收敛到原点。' }
        - { id: 'stable_focus', label: '稳定焦点系统', equations: ['xdot1=-alpha*x1-beta*x2', 'xdot2=beta*x1-alpha*x2'], default_parameters: { alpha: 0.25, beta: 1.2 }, purpose: '观察稳定焦点轨迹螺旋收敛到原点。' }
      interaction: { click_initial_point: true, clear_previous_on_next_click: true, fixed_step_integration: true, show_vector_field_toggle: true }
      submit_fields: ['tab_id', 'initial_point', 'trajectory_outcome', 'observation_note']
    evidence_sequence: ['状态方程', '方向场公式', '三标签 Rust 相平面面板', '阅读对象表', '观察提交']
    interaction_spec:
      interaction_kind: 'parameter_slider'
      student_task: '点击方向场初始点，观察轨迹并提交当前标签、初始点和最终形态。'
      activity_cards:
        - { id: 'phase-observation-submit', prompt: '请选择一个标签并点击初始点，记录初始点坐标、轨迹最终形态和观察结论。', response_kind: 'text.short', reference_answer: '应说明所选标签、初始点和轨迹是否趋向闭合轨道、保持速度或速度衰减停留。', submit_scope: 'per_card', layout_span: 'full' }
    teacher_controls: *controls_quiz
    student_access: *access_hidden
    teacher_insight_spec: { widgets: ['initial_point_cloud', 'trajectory_outcome_distribution', 'completion_rate'] }
    telemetry_spec: { summary_fields: ['tabId', 'initialPoint', 'trajectoryOutcome', 'cardSubmitted'], misconception_tags: ['phase_point_as_time_sample'] }
    ai_context_spec: { page_goal: '用三类二阶模型说明相平面轨迹由状态方程和初始点决定。' }
    preview_contract: { demo_path: '/interactive-learning/courses/unit-5-2-nonlinear-analysis-entry/student/demo?step=step-06' }
    acceptance_checks: ['Rust 面板不可降级。', '再次点击必须清空旧轨迹。', '三个标签交互逻辑必须一致。']

  step-07:
    title: '描述函数的基波近似'
    layout: { template: 'describing_function_harmonic_panel_board', regions: [{ id: 'formula', width: 'full', order: 1 }, { id: 'panel', width: 'full', order: 2 }, { id: 'activity', width: 'full', order: 3 }] }
    modules:
      - { id: 'df-definition', title: '描述函数定义', region: 'formula', kind: 'content.formula', must_be_visible: true, payload: { legacyKind: 'formula-card', presentation: 'single',  title: '描述函数定义', formulas: ['$e(t)=A\\sin(\\omega t)$', '$N(A)=\\dfrac{\\text{输出基波复幅值}}{\\text{输入正弦幅值}}$'] } }
      - { id: 'harmonic-rust-panel', title: '基波近似观察面板', region: 'panel', kind: 'compute.panel', must_be_visible: true, payload: { legacyKind: 'interactive-figure-panel', presentation: 'single', semanticRole: 'media', capabilityRef: 'interactive-figure',  title: '基波近似观察面板', panel_id: 'rust_harmonic_lowpass_panel', text: '正弦输入、继电输出频谱、低通滤波与描述函数近似对比面板。' } }
      - { id: 'lowpass-question', title: '低通条件判断', region: 'activity', kind: 'activity.panel', must_be_visible: true , payload: { legacyKind: 'single-choice-card', presentation: 'single', interactionKind: 'single-choice', responseKind: 'choice.single' }}
    content_blocks:
      panel_reading: '输入正弦经过继电后会产生高次谐波；低通截止频率越低，高次谐波越难通过，实际输出越接近只保留基波的描述函数近似。'
      approximation_condition: '非线性基波代表主要输出成分，线性部分能明显衰减高次谐波。'
    interactive_figure_spec:
      kind: 'rust_harmonic_lowpass_panel'
      required: true
      fallback_allowed: false
      panels: ['输入正弦波', '固定继电器特性图', '继电器输出频率分解', '线性低通环节', '实际输出与描述函数近似输出对比']
      fixed_nonlinearity: { type: 'ideal_relay', output_amplitude_M: 1, relation: 'u=M sgn(e)' }
      controls: [{ id: 'A', label: '正弦幅值' }, { id: 'omega', label: '角频率' }, { id: 'omega_c', label: '低通滤波截止频率' }]
