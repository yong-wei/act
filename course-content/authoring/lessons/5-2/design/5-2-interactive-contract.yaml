      - { id: 'relay-controls', region: 'controls', kind: 'content.cardSet', must_be_visible: true, payload: { legacyKind: 'summary-card', presentation: 'single', semanticRole: 'summary',  title: '参数控件', text: '控件随标签变化：理想继电调节 M,A；死区继电调节 M,d,A；滞环继电调节 M,h,A；间隙调节 k,b,A。' } }
      - { id: 'relay-formulas', title: '继电与间隙描述函数', region: 'formulas', kind: 'content.formula', must_be_visible: true, payload: { legacyKind: 'native-formula-table', presentation: 'single',  title: '继电与间隙描述函数', columns: ['对象', '公式'], rows: [['理想继电', '$N(A)=\dfrac{4M}{\pi A}$'], ['死区继电', '$N(A)=0,\ 0<A\le d;\quad N(A)=\dfrac{4M}{\pi A}\sqrt{1-\left(\dfrac{d}{A}\right)^2},\ A>d$'], ['滞环继电', '$N(A)=\dfrac{4M}{\pi A}\left[\sqrt{1-\left(\dfrac{h}{A}\right)^2}-j\dfrac{h}{A}\right],\ A>h$'], ['间隙', '$N(A)=\dfrac{k}{\pi}\left[\dfrac{\pi}{2}+\sin^{-1}\left(1-\dfrac{2b}{A}\right)+2\left(1-\dfrac{2b}{A}\right)\sqrt{\dfrac{b}{A}\left(1-\dfrac{b}{A}\right)}\right]+j\dfrac{4kb}{\pi A}\left(\dfrac{b}{A}-1\right)$']] } }
      - { id: 'relay-observation', title: '继电与间隙观察提交', region: 'activity', kind: 'activity.panel', must_be_visible: true , payload: { legacyKind: 'activity-card-set', presentation: 'single' }}
    content_blocks:
      formulas:
        relay: '$N(A)=\dfrac{4M}{\pi A},\quad M>0,\ A>0.$'
        deadzone_relay: '$N(A)=0,\ 0<A\le d;\quad N(A)=\dfrac{4M}{\pi A}\sqrt{1-\left(\dfrac{d}{A}\right)^2},\ A>d;\quad M>0,\ d>0,\ A>0.$'
        hysteresis_relay: '$N(A)=\dfrac{4M}{\pi A}\left[\sqrt{1-\left(\dfrac{h}{A}\right)^2}-j\dfrac{h}{A}\right],\quad A>h,\ M>0,\ h>0.$'
        backlash: '$N(A)=\dfrac{k}{\pi}\left[\dfrac{\pi}{2}+\sin^{-1}\left(1-\dfrac{2b}{A}\right)+2\left(1-\dfrac{2b}{A}\right)\sqrt{\dfrac{b}{A}\left(1-\dfrac{b}{A}\right)}\right]+j\dfrac{4kb}{\pi A}\left(\dfrac{b}{A}-1\right),\quad A>b,\ k>0,\ b>0.$'
    interactive_figure_spec:
      kind: 'rust_nonlinearity_characteristic_tabs'
