            - { id: 'A', label: '输入幅值 A', min: 0.05, max: 8, default: 2, step: 0.05, domain_constraint: 'A>0; valid branch A>d' }
        - id: 'hysteresis_relay'
          label: '滞环继电'
          formula_key: 'hysteresis_relay'
