    teacher_controls: *controls_quiz
    student_access: *access_hidden
    teacher_insight_spec: { widgets: ['parameter_distribution', 'complex_part_reason_distribution'] }
    telemetry_spec: { summary_fields: ['tabId', 'parameters', 'cardSubmitted'], misconception_tags: ['memory_as_static_single_value'] }
