    acceptance_checks: ['互动图像面板不可降级为只读图。', '必须提供重置按钮。', '稳定和非稳定区域必须标注。']

  step-12:
    title: '常见负倒曲线与参数影响'
    layout: { template: 'negative_inverse_rust_family_board', regions: [{ id: 'reading', width: 'full', order: 1 }, { id: 'panel', width: 'full', order: 2 }, { id: 'activity', width: 'full', order: 3 }] }
    modules:
      - { id: 'curve-reading-rule', title: '负倒曲线读图规则', region: 'reading', kind: 'content.cardSet', must_be_visible: true, payload: { legacyKind: 'summary-card', presentation: 'single', semanticRole: 'summary',  title: '负倒曲线读图规则', text: '空心圆是曲线起点，箭头是 $A$ 增大方向；实描述函数负倒曲线落在负实轴上，滞环和间隙会进入复平面。' } }
      - { id: 'parameter-effects', title: '参数影响方向', region: 'reading', kind: 'content.cardSet', must_be_visible: true, payload: { legacyKind: 'bullet-list-card', presentation: 'single',  title: '参数影响方向', bullets: ['饱和中 k 增大使曲线向原点靠近。', '死区增大使出现门槛推向更大振幅。', '滞环宽度增大使曲线虚部下移。', '间隙增大使相位滞后更明显。'] } }
      - { id: 'negative-inverse-rust-panel', title: '负倒曲线族面板', region: 'panel', kind: 'compute.panel', must_be_visible: true, payload: { legacyKind: 'interactive-figure-panel', presentation: 'single', semanticRole: 'media', capabilityRef: 'interactive-figure',  title: '负倒曲线族面板', panel_id: 'rust_negative_inverse_family_panel', text: '常见非线性负倒描述函数曲线族面板。' } }
      - { id: 'negative-inverse-submit', title: '负倒曲线观察提交', region: 'activity', kind: 'activity.panel', must_be_visible: true , payload: { legacyKind: 'activity-card-set', presentation: 'single' }}
    content_blocks:
      parameter_effects:
        - '饱和中 k 增大使曲线向原点靠近。'
        - '死区增大使出现门槛推向更大振幅。'
        - '滞环宽度增大使曲线虚部下移。'
        - '间隙增大使相位滞后更明显。'
    interactive_figure_spec:
      kind: 'rust_negative_inverse_family_panel'
      required: true
      fallback_allowed: false
      default_layout_mirror: '/course-runtime/lessons/5-2/media/5-2-negative-inverse-summary.png'
      curve_source: 'numeric_from_negative_inverse_describing_function_expressions'
      required_marks: ['open_circle_start', 'direction_arrow_for_increasing_A', 'solid_circle_current_A']
      default_scan_range: { min: 0.05, max: 8 }
      curve_families:
        - id: 'saturation'
          label: '饱和'
          formula_key: 'step-08.formulas.saturation'
          negative_inverse: '-1/N(A)'
          default_parameters: { k: 1, a: 1, A: 2 }
          controls:
            - { id: 'k', label: '斜率 k', min: 0.2, max: 5, default: 1, step: 0.1, domain_constraint: 'k>0' }
            - { id: 'a', label: '饱和阈值 a', min: 0.2, max: 5, default: 1, step: 0.1, domain_constraint: 'a>0' }
          parameter_effect: 'k 增大时 -1/N(A) 整体向原点靠近；a 增大时起始段沿负实轴延长。'
          marks: { start: 'open_circle_start', direction: 'arrow_for_increasing_A' }
        - id: 'deadzone'
          label: '死区'
          formula_key: 'step-08.formulas.deadzone'
          negative_inverse: '-1/N(A)'
          default_parameters: { k: 1, Delta: 0.5, A: 2 }
          controls:
            - { id: 'k', label: '斜率 k', min: 0.2, max: 5, default: 1, step: 0.1, domain_constraint: 'k>0' }
            - { id: 'Delta', label: '死区宽度 Δ', min: 0.1, max: 3, default: 0.5, step: 0.05, domain_constraint: 'Delta>0' }
          parameter_effect: 'Δ 增大时有效起点推向更大 A，曲线在负实轴上向远离原点一侧展开。'
          marks: { start: 'open_circle_at_A_equal_Delta_plus', direction: 'arrow_for_increasing_A' }
        - id: 'deadzone_saturation'
          label: '死区饱和'
          formula_key: 'step-08.formulas.deadzone_saturation'
          negative_inverse: '-1/N(A)'
          default_parameters: { k: 1, Delta: 0.5, a: 2, A: 3 }
          controls:
            - { id: 'k', label: '斜率 k', min: 0.2, max: 5, default: 1, step: 0.1, domain_constraint: 'k>0' }
            - { id: 'Delta', label: '死区宽度 Δ', min: 0.1, max: 3, default: 0.5, step: 0.05, domain_constraint: '0<Delta<a' }
            - { id: 'a', label: '饱和阈值 a', min: 0.2, max: 5, default: 2, step: 0.05, domain_constraint: 'a>Delta' }
          parameter_effect: 'Δ 增大推迟曲线出现，a 增大改变饱和段过渡位置。'
          marks: { start: 'open_circle_at_A_equal_Delta_plus', direction: 'arrow_for_increasing_A' }
        - id: 'relay'
          label: '理想继电'
          formula_key: 'step-09.formulas.relay'
          negative_inverse: '$-1/N(A)=-\\pi A/(4M)$'
          default_parameters: { M: 1, A: 2 }
          controls:
            - { id: 'M', label: '继电幅值 M', min: 0.2, max: 5, default: 1, step: 0.1, domain_constraint: 'M>0' }
          parameter_effect: 'M 增大时同一 A 的负倒点向原点靠近。'
          marks: { start: 'open_circle_start', direction: 'arrow_for_increasing_A_along_negative_real_axis' }
        - id: 'deadzone_relay'
          label: '死区继电'
          formula_key: 'step-09.formulas.deadzone_relay'
          negative_inverse: '-1/N(A)'
          default_parameters: { M: 1, d: 0.5, A: 2 }
          controls:
            - { id: 'M', label: '继电幅值 M', min: 0.2, max: 5, default: 1, step: 0.1, domain_constraint: 'M>0' }
            - { id: 'd', label: '死区门槛 d', min: 0.1, max: 3, default: 0.5, step: 0.05, domain_constraint: 'd>0' }
          parameter_effect: 'd 增大时曲线起点对应的有效幅值门槛增大。'
          marks: { start: 'open_circle_at_A_equal_d_plus', direction: 'arrow_for_increasing_A' }
        - id: 'hysteresis_relay'
          label: '滞环继电'
          formula_key: 'step-09.formulas.hysteresis_relay'
          negative_inverse: '-1/N(A)'
          default_parameters: { M: 1, h: 0.5, A: 2 }
          controls:
            - { id: 'M', label: '继电幅值 M', min: 0.2, max: 5, default: 1, step: 0.1, domain_constraint: 'M>0' }
            - { id: 'h', label: '滞环半宽 h', min: 0.1, max: 3, default: 0.5, step: 0.05, domain_constraint: 'h>0; valid branch A>h' }
          parameter_effect: 'h 增大时虚部影响增强，负倒曲线更明显进入复平面。'
          marks: { start: 'open_circle_at_A_equal_h_plus', direction: 'arrow_for_increasing_A' }
        - id: 'backlash'
          label: '间隙'
          formula_key: 'step-09.formulas.backlash'
          negative_inverse: '-1/N(A)'
          default_parameters: { k: 1, b: 0.5, A: 2 }
          controls:
            - { id: 'k', label: '斜率 k', min: 0.2, max: 5, default: 1, step: 0.1, domain_constraint: 'k>0' }
            - { id: 'b', label: '间隙宽度 b', min: 0.1, max: 3, default: 0.5, step: 0.05, domain_constraint: 'b>0; valid branch A>b' }
          parameter_effect: 'b 增大时相位滞后更明显，复平面曲线偏离负实轴。'
          marks: { start: 'open_circle_at_A_equal_b_plus', direction: 'arrow_for_increasing_A' }
      controls:
        - { id: 'nonlinearity_type', label: '非线性类型', kind: 'tab_select', options: ['saturation', 'deadzone', 'deadzone_saturation', 'relay', 'deadzone_relay', 'hysteresis_relay', 'backlash'], default: 'saturation' }
        - { id: 'A', label: '当前幅值 A', kind: 'slider', min: 0.05, max: 8, default: 2, step: 0.05, domain_constraint: 'A>0 and valid branch lower bounds are type-dependent' }
      submit_fields: ['nonlinearity_type', 'parameters', 'current_A_point', 'movement_direction', 'intersection_risk']
    evidence_sequence: ['读图规则', 'Rust 负倒曲线族面板', '参数影响说明', '观察提交']
    interaction_spec:
      interaction_kind: 'activity_card_set'
      student_task: '调节参数，提交负倒曲线移动方向和候选交点风险判断。'
      activity_cards:
        - { id: 'negative-inverse-observation-submit', prompt: '请选择一种非线性类型，调节参数，并记录负倒曲线移动方向和候选交点风险变化。', response_kind: 'text.short', reference_answer: '应说明曲线起点、A 增大方向、参数变化导致的移动方向以及是否更可能与 G(jω) 相交。', submit_scope: 'per_card', layout_span: 'full' }
    teacher_controls: *controls_quiz
    student_access: *access_hidden
    teacher_insight_spec: { widgets: ['parameter_distribution', 'risk_judgment_distribution'] }
    telemetry_spec: { summary_fields: ['type', 'parameters', 'movementDirection', 'cardSubmitted'], misconception_tags: ['parameter_effect_reversed'] }
    ai_context_spec: { page_goal: '强制使用数值计算的 Rust 负倒曲线族面板理解参数影响。' }
    preview_contract: { demo_path: '/interactive-learning/courses/unit-5-2-nonlinear-analysis-entry/student/demo?step=step-12' }
    acceptance_checks: ['Rust 面板不可降级。', '每条曲线必须按表达式数值计算 -1/N(A)。', '必须保留空心圆起点、方向箭头和当前 A 实心点。', '不得暴露幅值扫描上下限控件。']

  step-13:
    title: '理想继电闭环的自振计算'
    layout: { template: 'worked_example_reveal_board', regions: [{ id: 'problem', width: 'full', order: 1 }, { id: 'reveal', width: 'half', order: 2 }, { id: 'media', width: 'half', order: 3 }] }
    modules:
      - { id: 'relay-problem', title: '继电闭环题面', region: 'problem', kind: 'content.rich', must_be_visible: true , payload: { legacyKind: 'problem-statement', presentation: 'single', semanticRole: 'problem' }}
      - { id: 'relay-reveal', title: '继电闭环求解步骤', region: 'reveal', kind: 'content.reveal', must_be_visible: true , payload: { legacyKind: 'step-reveal-chain', presentation: 'single', interactionKind: 'progressive-reveal' }}
      - { id: 'relay-sim', region: 'media', kind: 'content.figure', must_be_visible: true, payload: { legacyKind: 'image-panel', presentation: 'single', semanticRole: 'media',  src: '/course-runtime/lessons/5-2/media/5-2-example-relay-limit-cycle.png', caption: '理想继电闭环的描述函数交点与自振仿真' } }
    content_blocks:
      problem: '$G(s)=\dfrac{10}{s(s+2)^2}$，理想继电 $M=1$，判断是否存在描述函数意义下的自振并求候选频率和振幅。'
      reveal_steps:
        - { body: '写出理想继电描述函数。', formula: '$N(A)=\dfrac{4}{\pi A}$' }
        - { body: '写出负倒描述函数。', formula: '$-\dfrac{1}{N(A)}=-\dfrac{\pi A}{4}$' }
        - { body: '令线性部分 $G(j\omega)$ 的虚部为零。', formula: '$\operatorname{Im}G(j\omega)=0$' }
        - { body: '得到候选角频率。', formula: '$\omega=2\ \mathrm{rad/s}$' }
        - { body: '计算该频率下线性部分的实部。', formula: '$G(j2)=-0.625$' }
        - { body: '由交点方程解出候选振幅。', formula: '$-\dfrac{\pi A}{4}=-0.625,\quad A=\dfrac{2.5}{\pi}\approx0.796$' }
        - { body: '读仿真：短脉冲消失后仍进入周期运动，周期约 $3.14\ \mathrm{s}$。' }
    evidence_sequence: ['题面', '显影公式链', '交点与仿真图', '仿真读图结论']
    interaction_spec: { interaction_kind: 'teacher_reveal_only', step_reveal_policy: { problem_always_visible: true, student_browse_default: false }, student_task: '随教师显影阅读求解链。' }
    teacher_controls: &controls_reveal { release_activity: 'not_applicable', open_browse: 'teacher_toggle', teacher_step_reveal: 'enabled', reveal_reference_answer: 'teacher_toggle' }
    student_access: { default_visibility: 'visible', release_required: false, browse_required: true, can_view_problem_statement: true, can_view_derivation_steps: false, can_submit_without_browse: false }
    teacher_insight_spec: { widgets: ['reveal_progress'] }
    telemetry_spec: { summary_fields: ['viewed', 'revealProgress'], misconception_tags: [] }
    ai_context_spec: { page_goal: '完整显影继电闭环自振频率和振幅计算。' }
    preview_contract: { demo_path: '/interactive-learning/courses/unit-5-2-nonlinear-analysis-entry/student/demo?step=step-13' }
    acceptance_checks: ['题面必须常显。', '显影链必须保留公式和数值结果。']

  step-14:
    title: '饱和环节中线性增益改变自振条件'
    layout: { template: 'worked_example_compare_board', regions: [{ id: 'problem', width: 'full', order: 1 }, { id: 'reveal', width: 'half', order: 2 }, { id: 'media', width: 'half', order: 3 }] }
    modules:
      - { id: 'sat-problem', title: '饱和闭环题面', region: 'problem', kind: 'content.rich', must_be_visible: true , payload: { legacyKind: 'problem-statement', presentation: 'single', semanticRole: 'problem' }}
      - { id: 'sat-reveal', title: '饱和闭环求解步骤', region: 'reveal', kind: 'content.reveal', must_be_visible: true , payload: { legacyKind: 'step-reveal-chain', presentation: 'single', interactionKind: 'progressive-reveal' }}
      - { id: 'sat-sim', region: 'media', kind: 'content.figure', must_be_visible: true, payload: { legacyKind: 'image-panel', presentation: 'single', semanticRole: 'media',  src: '/course-runtime/lessons/5-2/media/5-2-example-saturation-gain-compare.png', caption: '饱和闭环中线性增益改变自振条件' } }
    content_blocks:
      problem: '$G(s)=\dfrac{K}{s(s+1)(0.2s+1)}$，单位饱和 $k=1,a=1$，比较 $K=4$ 与 $K=9$。'
      reveal_steps:
        - { body: '写出单位饱和的描述函数分段式。', formula: '$N(A)=1,\ 0<A\le1;\quad N(A)=\dfrac{2}{\pi}\left[\sin^{-1}\dfrac{1}{A}+\dfrac{1}{A}\sqrt{1-\dfrac{1}{A^2}}\right],\ A>1$' }
        - { body: '令线性部分 $G(j\omega)$ 的虚部为零。', formula: '$\omega=\sqrt{5}$' }
        - { body: '计算 $K=9$ 时的负实轴位置。', formula: '$G(j\sqrt{5})\approx-1.5$' }
        - { body: '交点要求描述函数取值。', formula: '$N(A)=\dfrac{2}{3}$' }
        - { body: '数值解得到候选振幅。', formula: '$A\approx1.807$' }
        - { body: '$K=4$ 时负实轴位置约 $-0.667$，不形成同类交点。' }
        - { body: '读仿真：$K=4$ 衰减，$K=9$ 进入周期运动。' }
    evidence_sequence: ['题面', '显影公式链', 'K=4/K=9 对比图', '仿真读图结论']
    interaction_spec: { interaction_kind: 'teacher_reveal_only', step_reveal_policy: { problem_always_visible: true, student_browse_default: false }, student_task: '随教师显影阅读求解链。' }
    teacher_controls: *controls_reveal
    student_access: { default_visibility: 'visible', release_required: false, browse_required: true, can_view_problem_statement: true, can_view_derivation_steps: false, can_submit_without_browse: false }
    teacher_insight_spec: { widgets: ['reveal_progress'] }
    telemetry_spec: { summary_fields: ['viewed', 'revealProgress'], misconception_tags: [] }
    ai_context_spec: { page_goal: '通过 K=4 与 K=9 对比说明自振由线性部分和非线性部分共同决定。' }
    preview_contract: { demo_path: '/interactive-learning/courses/unit-5-2-nonlinear-analysis-entry/student/demo?step=step-14' }
    acceptance_checks: ['题面必须常显。', 'K=4 与 K=9 的仿真差异必须同页出现。']

  step-15:
    title: '舵机执行器结构中的死区与饱和'
    layout: { template: 'engineering_case_structure_board', regions: [{ id: 'structure', width: 'full', order: 1 }, { id: 'source', width: 'full', order: 2 }, { id: 'activity', width: 'full', order: 3 }] }
