            - { id: 'b', label: '间隙宽度 b', min: 0.1, max: 3, default: 0.5, step: 0.05, domain_constraint: 'b>0' }
            - { id: 'A', label: '输入幅值 A', min: 0.05, max: 8, default: 2, step: 0.05, domain_constraint: 'A>b' }
      graph_requirements: ['显示输入输出关系', '滞环继电与间隙必须显示回线或反向路径', '标注幅值门槛和路径相关方向']
    evidence_sequence: ['左侧输入输出关系', '右侧输入正弦与输出对比', '底部参数控件', '完整公式与参数范围', '观察提交']
