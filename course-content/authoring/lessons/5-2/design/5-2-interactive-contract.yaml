  step-16:
    title: '舵机自振风险与整改方向'
    layout: { template: 'engineering_case_simulation_board', regions: [{ id: 'calculation', width: 'full', order: 1 }, { id: 'media', width: 'full', order: 2 }, { id: 'consequence', width: 'full', order: 3 }, { id: 'activity', width: 'full', order: 4 }] }
    modules:
      - { id: 'rudder-calculation', title: '舵机案例候选交点计算', region: 'calculation', kind: 'content.formula', must_be_visible: true , payload: { legacyKind: 'formula-card', presentation: 'single' }}
      - { id: 'rudder-sim', region: 'media', kind: 'content.figure', must_be_visible: true, payload: { legacyKind: 'image-panel', presentation: 'single', semanticRole: 'media',  src: '/course-runtime/lessons/5-2/media/5-2-ship-rudder-actuator-case-sim.png', caption: '舵机死区饱和案例的交点判断与短脉冲仿真' } }
      - { id: 'engineering-consequence', title: '工程后果', region: 'consequence', kind: 'content.cardSet', must_be_visible: true , payload: { legacyKind: 'bullet-list-card', presentation: 'single' }}
      - { id: 'fix-tasks', title: '整改方向判断', region: 'activity', kind: 'activity.panel', must_be_visible: true , payload: { legacyKind: 'activity-card-set', presentation: 'single' }}
    content_blocks:
      calculation:
        body: '$\Delta=0.30,a=1.00,k=1$；$G(s)=\dfrac{K}{s(s+1)(0.2s+1)}$。'
        formula: '$K=10:\ \omega=\sqrt{5}\approx2.24\ \mathrm{rad/s},\quad G(j\sqrt{5})=-\dfrac{K}{6}\approx-1.667,\quad N(A)=0.600,\quad A\approx1.22;\quad K=5:\ G(j\sqrt{5})\approx-0.833.$'
      consequences: ['液压泵能耗上升。', '阀芯和机械部件磨损加剧。', '航向角周期摆动降低靠泊和狭水道安全裕度。', '积分累积可能拖慢恢复。']
