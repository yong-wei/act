          textBlocks: [{id: domain-conclusion, text: '虚轴极点、持续振荡和零稳定裕度在K等于42时同步成立。', region: {x: 0.62, y: 0.72, width: 0.32, height: 0.16}}]
          revealSteps: [{id: substitute, targetIds: [characteristic-block]}, {id: separate, targetIds: [real-part-block, imag-part-block]}, {id: solve, targetIds: [omega-block, gain-block]}, {id: factor, targetIds: [factor-block, poles-block]}, {id: interpret, targetIds: [domain-conclusion]}]
          connectors: [{id: equation-to-separation, kind: arrow, from: characteristic-block, to: real-part-block, revealStepIds: [separate]}, {id: separation-to-values, kind: arrow, from: imag-part-block, to: omega-block, revealStepIds: [solve]}, {id: values-to-factor, kind: therefore, from: gain-block, to: factor-block, revealStepIds: [factor]}, {id: factor-to-conclusion, kind: therefore, from: poles-block, to: domain-conclusion, revealStepIds: [interpret]}]
          teacherControls: {controlClasses: [release_activity, open_browse, teacher_step_reveal, reveal_reference_answer], enabled: [next, previous, jump, highlight, answerReveal, reset]}
