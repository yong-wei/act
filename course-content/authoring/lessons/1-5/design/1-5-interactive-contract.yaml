  step-10:
    title: 三域证据分工与三种速度
    layout: {template: dual_table_formula_activity, regions: [{id: intro, width: full, order: 1}, {id: evidence, width: full, order: 2}, {id: formula, width: full, order: 3}, {id: activity, width: full, order: 4}, {id: closing, width: full, order: 5}]}
    modules:
      - {id: page-intro, region: intro, kind: content.rich, must_be_visible: true, payload: {block_key: page-intro, title: 三域证据分工与三种速度}}
      - {id: domain-responsibilities, region: evidence, kind: content.table, must_be_visible: true, payload: {block_key: domain-responsibilities, title: 三域证据的直接职责}}
      - {id: speed-definitions, region: evidence, kind: content.table, must_be_visible: true, payload: {block_key: speed-definitions, title: 三种速度语言}}
      - {id: crossover-formula, region: formula, kind: content.formula, must_be_visible: true, payload: {block_key: crossover-formula, title: 环路增益穿越频率}}
      - {id: speed-check, region: activity, kind: activity.panel, must_be_visible: true, payload: {title: 读图与速度分辨, responseContractId: choice.multi}}
      - {id: evidence-boundary, region: closing, kind: content.rich, must_be_visible: true, payload: {block_key: evidence-boundary, title: 直接读数与跨域解释的边界}}
    content_blocks:
      - {id: page-intro, type: plain_text, body: '先区分每一域能直接读出的证据，再区分首次到达、保持在误差带和环路频率尺度。'}
      - id: domain-responsibilities
        type: table
        columns: [观察域, 传递对象, 直接回答的问题, 典型证据]
        rows: [[复平面, 闭环特征方程, 模态是否衰减, 极点实部与虚部], [时域, 'Φ_K(s)', 输出过程怎样展开, 超调量上升时间与调节时间], [频域, 'L_K(s)', 穿越频率与稳定余量, 增益穿越频率相位裕度与增益裕度]]
      - id: speed-definitions
        type: table
        columns: [速度语言, 定义, 所属对象, 回答的问题]
        rows: [[10%到90%上升时间, 输出首次从10%到达90%的时间, 闭环阶跃, 多快到达目标附近], [5%调节时间, 输出进入并保持在5%误差带内的时间, 闭环阶跃, 多快稳定留在目标附近], [增益穿越频率, '满足|L(jω_c)|=1的频率', 环路开环, 环路幅值在哪个频率穿越0dB]]
      - {id: crossover-formula, type: formula, formula: '|L(j\omega_c)|=1', symbols: [{symbol: '\omega_c', meaning: 环路增益穿越频率, unit: rad/s}], body: '该频率属于环路开环，不能直接替代闭环5%调节时间。'}
      - {id: evidence-boundary, type: plain_text, body: '三域证据可以互相解释，但每项数值必须从定义对应的对象和图形中读取。'}
    evidence_sequence: [page-intro, domain-responsibilities, speed-definitions, crossover-formula, speed-check, evidence-boundary]
    interaction_spec:
      interaction_kind: activity_cards
      student_task: 分别完成闭环阶跃直接读数和三种速度关系判断。
      activity_cards:
        - {id: step-direct-readings, title: 闭环阶跃曲线的直接读数, prompt: 哪些指标能从闭环阶跃曲线直接读取？, response_kind: choice.multi, options: [上升时间, 超调量, 调节时间, 相位裕度, 增益裕度], reference_answer: [上升时间, 超调量, 调节时间], submit_scope: per_card, layout_span: half}
        - {id: crossover-proves-settling, title: 环路频率尺度与闭环收敛速度, prompt: 环路增益穿越频率提高足以证明闭环5%调节时间缩短。, response_kind: choice.binary, options: [正确, 错误], reference_answer: 错误, submit_scope: per_card, layout_span: half}
      reveal_answer: after_submit_or_teacher_reveal
    teacher_controls: {release_activity: teacher_toggle, open_browse: page_load_open, teacher_step_reveal: not_applicable, reveal_reference_answer: teacher_toggle}
    student_access: {default_visibility: hidden, release_required: true, browse_required: false, can_view_problem_statement: true, can_view_derivation_steps: not_applicable, can_submit_without_browse: true}
    telemetry_spec: {summary_fields: [viewed, submittedCards, objectiveAccuracy], result_policy: per_card_submission}
    teacher_insight_spec: {widgets: [submission_rate, response_summary, speed_conflation_tags]}
    ai_context_spec: {delivery_mode: hidden_page_context, page_ai_entry: forbidden, page_goal: 区分三域直接证据和三种速度语言。, allowed_scope: [提交后解释指标定义, 提示对象标签], forbidden_scope: [提交前给出答案, 混用环路与闭环指标, 代替学生作答]}
    preview_contract: {route_kind: student_demo, demo_path: '/interactive-learning/courses/unit-1-5-three-domain-gain-sweep/demo?step=step-10'}
    acceptance_checks: [两张原生表格内容完整, 两个活动题面仅在activity_cards出现, 两题双栏且独立提交, 环路与闭环对象标签保留]

  step-11:
    title: 两组增益的失稳距离比较
    layout: {template: problem_activity_derivation, regions: [{id: intro, width: full, order: 1}, {id: problem, width: full, order: 2}, {id: activity, width: full, order: 3}, {id: derivation, width: full, order: 4}, {id: closing, width: full, order: 5}]}
    modules:
      - {id: page-intro, region: intro, kind: content.rich, must_be_visible: true, payload: {block_key: page-intro, title: 两组增益的失稳距离比较}}
      - {id: comparison-problem, region: problem, kind: content.rich, must_be_visible: true, payload: {block_key: comparison-problem, title: K等于12与36的已知数据}}
      - {id: comparison-data, region: problem, kind: content.table, must_be_visible: true, payload: {block_key: comparison-data, title: 两组增益的三域数据}}
      - {id: evidence-order-check, region: activity, kind: activity.panel, must_be_visible: true, payload: {title: 失稳距离与证据顺序判断, responseContractId: text.structured}}
      - id: comparison-derivation
        region: derivation
        kind: visual.derivationStage
        must_be_visible: true
        payload:
          stageId: unit-1-5-k12-k36-evidence-chain
          aspectRatio: '16:9'
          title: 从复平面到时域再到频域的证据链
          formulas:
            - {id: pole-comparison, latex: '|-0.056|<|-0.324|', region: {x: 0.06, y: 0.12, width: 0.3, height: 0.14}, blocks: [{id: pole-block, latex: '-0.056\;\text{比}\;-0.324\;\text{更接近零}', colorRole: known}]}
            - {id: time-comparison, latex: '87.81\%>45.59\%,\quad 52.44\,\mathrm{s}>8.05\,\mathrm{s}', region: {x: 0.34, y: 0.38, width: 0.44, height: 0.16}, blocks: [{id: overshoot-block, latex: 'M_p(36)=87.81\%>M_p(12)=45.59\%', colorRole: transform}, {id: settling-block, latex: '52.44\,\mathrm{s}>8.05\,\mathrm{s}', colorRole: transform}]}
            - {id: margin-comparison, latex: '3.12^\circ<27.41^\circ', region: {x: 0.62, y: 0.64, width: 0.3, height: 0.14}, blocks: [{id: margin-block, latex: '3.12^\circ<27.41^\circ', colorRole: result}]}
          textBlocks: [{id: comparison-result, text: '三域共同指向K等于36更接近失稳边界。', region: {x: 0.12, y: 0.72, width: 0.38, height: 0.14}}]
          revealSteps: [{id: pole-evidence, targetIds: [pole-block]}, {id: time-evidence, targetIds: [overshoot-block, settling-block]}, {id: frequency-evidence, targetIds: [margin-block]}, {id: result, targetIds: [comparison-result]}]
          connectors: [{id: pole-to-time, kind: arrow, from: pole-block, to: overshoot-block, revealStepIds: [time-evidence]}, {id: time-to-frequency, kind: arrow, from: settling-block, to: margin-block, revealStepIds: [frequency-evidence]}, {id: frequency-to-result, kind: therefore, from: margin-block, to: comparison-result, revealStepIds: [result]}]
          teacherControls: {controlClasses: [release_activity, open_browse, teacher_step_reveal, reveal_reference_answer], enabled: [next, previous, jump, highlight, answerReveal, reset]}
          cognitiveLoad: {maxNewFormulaBlocksPerStep: 2, maxSimultaneousColorRoles: 2, longFormulaSplitStrategy: semantic_terms, teachingLoadException: worked-example}
      - {id: comparison-conclusion, region: closing, kind: content.rich, must_be_visible: true, payload: {block_key: comparison-conclusion, title: 三域一致性的来源}}
    content_blocks:
      - {id: page-intro, type: plain_text, body: '题面与已知数据始终可见；学生先判断，再按复平面、时域、频域逐层核对。'}
      - {id: comparison-problem, type: plain_text, body: '比较同一对象在K等于12和K等于36时的三域数据，判断哪一组更接近失稳，并按复平面、时域、频域组织证据。'}
      - id: comparison-data
        type: table
        columns: [增益, 主导极点, 超调量, 5%调节时间, 相位裕度]
        rows: [[12, '-0.324±j1.336', '45.59%', '8.05 s', '27.41°'], [36, '-0.056±j2.286', '87.81%', '52.44 s', '3.12°']]
      - {id: comparison-conclusion, type: plain_text, body: '极点位置、阶跃过程和环路裕度受同一反馈特征方程约束，因此三域判断应当相容。'}
    evidence_sequence: [page-intro, comparison-problem, comparison-data, evidence-order-check, comparison-derivation, comparison-conclusion]
    interaction_spec:
      interaction_kind: worked_example_reveal
      student_task: 先提交失稳距离判断和证据顺序，再查看三域显影链。
      step_reveal_policy: {problem_statement_always_visible: true, sequence: [pole-evidence, time-evidence, frequency-evidence, result], student_browse_requires_open_browse: true, teacher_reveal_unrestricted: true}
      activity_cards:
        - {id: instability-distance, title: 选择与证据顺序提交, prompt: 提交选择结果与三域证据顺序。, problem_source: content_blocks.comparison-problem, response_kind: text.structured, fields: [{key: selected_gain, label: 更接近失稳的增益, input: select, options: [12, 36]}, {key: evidence_order, label: 三域证据顺序, input: ordering, options: [复平面, 时域, 频域]}], reference_answer: 'K=36；证据顺序为复平面、时域、频域。', submit_scope: per_card, layout_span: full}
      reveal_answer: after_submit_or_teacher_reveal
