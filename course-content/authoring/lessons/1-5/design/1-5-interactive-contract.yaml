contract_version: '2.0'
lesson_id: '1-5'
course_title: '1-5：三域联动——一个增益如何改变稳定性'
course_route_segment: 'unit-1-5-three-domain-gain-sweep'
preview_mode:
  default_entry: student_demo
  student_demo_base_path: '/interactive-learning/courses/unit-1-5-three-domain-gain-sweep/demo'
telemetry_strategy: lightweight_high_value
teacher_insight_strategy: step_level_aggregation_only
required_step_fields: [layout, modules, content_blocks, interaction_spec, teacher_controls, student_access, telemetry_spec, teacher_insight_spec, ai_context_spec, preview_contract, acceptance_checks]
layout: {source: 'steps[].layout'}
modules: {source: 'steps[].modules'}
content_blocks: {source: 'steps[].content_blocks'}
evidence_sequence: {source: 'steps[].evidence_sequence'}
interaction_spec: {source: 'steps[].interaction_spec'}
teacher_controls: {source: 'steps[].teacher_controls'}
preview_contract: {source: 'steps[].preview_contract'}

steps:
  step-01:
    title: 增益旋钮牵动的三组证据
    layout: {template: cover_dual_column_questions, regions: [{id: intro, width: half, order: 1}, {id: media, width: half, order: 2}, {id: questions, width: full, order: 3}]}
    modules:
      - {id: page-intro, region: intro, kind: content.rich, must_be_visible: true, payload: {block_key: page-intro, title: 增益旋钮牵动的三组证据}}
      - {id: engineering-scene, region: intro, kind: content.rich, must_be_visible: true, payload: {block_key: engineering-scene, title: 自动舵增益调整场景}}
      - {id: cover-comic, region: media, kind: content.figure, must_be_visible: true, payload: {block_key: cover-comic, title: 增益变化下的三域冲突}}
      - {id: bridge-questions, region: questions, kind: content.cardSet, must_be_visible: true, payload: {block_key: bridge-questions, title: 两个核心追问}}
    content_blocks:
      - {id: page-intro, type: plain_text, body: '同一个比例增益同时改写闭环极点、阶跃过程和环路稳定余量。'}
      - {id: engineering-scene, type: plain_text, body: '船舶自动舵的增益旋钮调大后，航向更早接近目标，却出现更大的摆动；继续调大，振荡越来越难衰减。'}
      - {id: cover-comic, type: media, asset: '1-5-cover-comic.png', caption: '驾驶员看到更早接近目标，工程师同时核对极点、振荡包络和稳定裕度。'}
      - {id: bridge-questions, type: bullet_list, items: ['更早到达目标附近，是否等于更快稳定下来？', '一张阶跃曲线能否独自说明系统离失稳还有多远？']}
    evidence_sequence: [page-intro, engineering-scene, cover-comic, bridge-questions]
    interaction_spec: {interaction_kind: none, student_task: 阅读自动舵场景并辨认同一增益引出的三组证据。}
    teacher_controls: {release_activity: not_applicable, open_browse: page_load_open, teacher_step_reveal: not_applicable, reveal_reference_answer: not_applicable}
    student_access: {default_visibility: visible, release_required: false, browse_required: false, can_view_problem_statement: true, can_view_derivation_steps: not_applicable, can_submit_without_browse: not_applicable}
    telemetry_spec: {summary_fields: [viewed, timeOnStep], result_policy: no_submission}
    teacher_insight_spec: {widgets: [view_count]}
    ai_context_spec: {delivery_mode: hidden_page_context, page_ai_entry: forbidden, page_goal: 识别增益变化同时影响三域证据。, allowed_scope: [解释场景中的三类现象, 追问速度语言], forbidden_scope: [代替学生形成后续结论, 提前给出临界增益]}
    preview_contract: {route_kind: student_demo, demo_path: '/interactive-learning/courses/unit-1-5-three-domain-gain-sweep/demo?step=step-01'}
    acceptance_checks: [导入漫画和两组追问常显, 本页无提交活动, 三域对象不被拆成三个系统]

  step-02:
    title: 课程目标
    layout: {template: goal_focus_slide, regions: [{id: intro, width: full, order: 1}, {id: goals, width: full, order: 2}]}
    modules:
      - {id: page-intro, region: intro, kind: content.rich, must_be_visible: true, payload: {block_key: page-intro, title: 课程目标}}
      - {id: lesson-goals, region: goals, kind: content.cardSet, must_be_visible: true, payload: {block_key: lesson-goals, title: 完成本次课程后能够, objectivePolicy: {classroomRequired: [objective-1, objective-2, objective-3, objective-4], afterClassExtension: [objective-5], classroomAttainmentDenominator: classroomRequired_only}}}
    content_blocks:
      - {id: page-intro, type: plain_text, body: '课堂90分钟必达目标覆盖同步读图、证据组织、速度分辨和状态判断；跨对象迁移作为课后拓展与分层目标单列。'}
      - id: lesson-goals
        type: bullet_list
        items:
          - 调节并读取同一增益下的闭环极点、阶跃响应和环路 Bode 图。
          - 组织极点实部、超调量、5% 调节时间、增益穿越频率和稳定裕度，形成三域证据链。
          - 区分上升速度、收敛速度与环路频率尺度。
          - 识别并解释稳定、近临界、临界稳定和不稳定状态的同步信号。
          - 课后拓展/分层目标：使用 MATLAB/Octave 独立复现三域观察协议，并对新的三阶对象判断稳定区间和临界增益。
    evidence_sequence: [page-intro, lesson-goals]
    interaction_spec: {interaction_kind: none, student_task: 阅读五项课程能力目标。}
    teacher_controls: {release_activity: not_applicable, open_browse: page_load_open, teacher_step_reveal: not_applicable, reveal_reference_answer: not_applicable}
    student_access: {default_visibility: visible, release_required: false, browse_required: false, can_view_problem_statement: true, can_view_derivation_steps: not_applicable, can_submit_without_browse: not_applicable}
    telemetry_spec: {summary_fields: [viewed, timeOnStep], result_policy: no_submission}
    teacher_insight_spec: {widgets: [view_count]}
    ai_context_spec: {delivery_mode: hidden_page_context, page_ai_entry: forbidden, page_goal: 解释四项课堂必达目标与一项课后拓展分层目标。, allowed_scope: [解释目标中的对象和能力动词, 区分课堂必达与课后拓展], forbidden_scope: [增加课程外目标, 把拓展目标计入课堂必达率, 代替学生完成活动]}
    preview_contract: {route_kind: student_demo, demo_path: '/interactive-learning/courses/unit-1-5-three-domain-gain-sweep/demo?step=step-02'}
    acceptance_checks: [四项课堂必达目标与一项课后拓展分层目标均使用能力动词, 课堂必达统计只覆盖目标一至四, 本页无提交活动]

  step-03:
    title: 极点、反馈与读图基础前测
    layout: {template: quiz_group_with_intro, regions: [{id: intro, width: full, order: 1}, {id: activity, width: full, order: 2}]}
    modules:
      - {id: page-intro, region: intro, kind: content.rich, must_be_visible: true, payload: {block_key: page-intro, title: 极点、反馈与读图基础前测}}
      - {id: precheck, region: activity, kind: activity.panel, must_be_visible: true, payload: {title: 三项前置能力检查, responseContractId: choice.single}}
    content_blocks:
      - {id: page-intro, type: plain_text, body: '三道客观题只检查极点趋势、单位负反馈和三种观察域，不考查本课的区段与临界数值。'}
    evidence_sequence: [page-intro, precheck]
    interaction_spec:
      interaction_kind: quiz_group
      student_task: 三题分别提交，检查进入三域增益实践所需的基础能力。
      activity_cards:
        - {id: pole-natural-response, title: 共轭极点对应的自然响应, prompt: '闭环极点为 -0.5±j2，自然响应的总体趋势是？', response_kind: choice.single, options: [单调收敛, 衰减振荡, 等幅振荡, 发散], reference_answer: 衰减振荡, submit_scope: per_card, layout_span: one_third}
        - {id: feedback-characteristic, title: 单位负反馈特征方程, prompt: '单位负反馈系统的闭环特征方程由 1+L(s)=0 给出。', response_kind: choice.binary, options: [正确, 错误], reference_answer: 正确, submit_scope: per_card, layout_span: one_third}
        - id: domain-matching
          title: 三类证据的观察域
          prompt: 将极点位置、输出随时间变化、不同频率下的幅值与相位分别配到复平面、时域、频域。
          response_kind: matching.pairs
          pairs: [{left: 极点位置, right: 复平面}, {left: 输出随时间变化, right: 时域}, {left: 不同频率下的幅值与相位, right: 频域}]
          reference_answer: 极点位置—复平面；输出随时间变化—时域；不同频率下的幅值与相位—频域。
          submit_scope: per_card
          layout_span: one_third
      reveal_answer: after_all_submitted_or_teacher_reveal
    teacher_controls: {release_activity: teacher_toggle, open_browse: not_applicable, teacher_step_reveal: not_applicable, reveal_reference_answer: teacher_toggle}
    student_access: {default_visibility: hidden, release_required: true, browse_required: false, can_view_problem_statement: true, can_view_derivation_steps: not_applicable, can_submit_without_browse: true}
    telemetry_spec: {summary_fields: [viewed, submittedCards, objectiveAccuracy], result_policy: per_card_submission}
    teacher_insight_spec: {widgets: [submission_rate, response_summary, misconception_tags]}
    ai_context_spec: {delivery_mode: hidden_page_context, page_ai_entry: forbidden, page_goal: 检查极点、反馈和观察域三项前置能力。, allowed_scope: [提交后解释错误选项, 回顾前序概念], forbidden_scope: [提交前给出答案, 引入K等于42或四区段结论]}
    preview_contract: {route_kind: student_demo, demo_path: '/interactive-learning/courses/unit-1-5-three-domain-gain-sweep/demo?step=step-03'}
    acceptance_checks: [三题均为客观题, 三个题面只在activity_cards出现一次, 每题独立提交且答案揭示分离]

  step-04:
    title: 三域联动的共同对象与观察协议
    layout: {template: formula_stage_map_table, regions: [{id: intro, width: full, order: 1}, {id: formulas, width: full, order: 2}, {id: stages, width: full, order: 3}, {id: protocol, width: full, order: 4}, {id: closing, width: full, order: 5}]}
    modules:
      - {id: page-intro, region: intro, kind: content.rich, must_be_visible: true, payload: {block_key: page-intro, title: 三域联动的共同对象与观察协议}}
      - {id: model-formulas, region: formulas, kind: content.formula, must_be_visible: true, payload: {block_key: model-formulas, title: 对象、环路与闭环}}
      - {id: channel-labels, region: formulas, kind: content.cardSet, must_be_visible: true, payload: {block_key: channel-labels, title: 三域读取通道}}
      - {id: gain-regions, region: stages, kind: content.stageMap, must_be_visible: true, payload: {block_key: gain-regions, title: 四个增益观察区段}}
      - {id: observation-protocol, region: protocol, kind: content.table, must_be_visible: true, payload: {block_key: observation-protocol, title: 三域观察协议}}
      - {id: shared-object-conclusion, region: closing, kind: content.rich, must_be_visible: true, payload: {block_key: shared-object-conclusion, title: 全程一致的对象约定}}
    content_blocks:
      - {id: page-intro, type: plain_text, body: '后续所有面板共享同一对象、同一增益和同一单位负反馈约定。'}
      - {id: model-formulas, type: formula, formulas: ['G_0(s)=1/[s(s+1)(s+6)]', 'L_K(s)=K/[s(s+1)(s+6)]', '\Phi_K(s)=K/(s^3+7s^2+6s+K)', 's^3+7s^2+6s+K=0'], symbols: [{symbol: K, meaning: 比例增益, range: 'K>0'}, {symbol: 'L_K(s)', meaning: 环路开环传递函数}, {symbol: '\Phi_K(s)', meaning: 单位负反馈闭环传递函数}]}
      - {id: channel-labels, type: bullet_list, items: ['闭环极点与阶跃响应读取 Φ_K(s)。', '增益穿越频率、相位裕度和增益裕度读取 L_K(s)。']}
      - {id: gain-regions, type: stage_map, stages: [{id: low, title: 低增益, range: '3≤K≤6', state: 稳定余量充足}, {id: medium, title: 中增益, range: '8≤K≤20', state: 振荡浮现且余量收缩}, {id: high, title: 高增益, range: '22≤K<42', state: 接近稳定边界}, {id: boundary, title: 边界与越界, range: 'K≥42', state: 临界稳定或不稳定}]}
      - id: observation-protocol
        type: table
        columns: [观察域, 直接读取对象, 记录指标, 判断职责]
        rows: [[复平面, 闭环极点, 主导极点实部与虚部, 模态是否衰减], [时域, 闭环单位阶跃, 超调量上升时间与5%调节时间, 输出过程怎样展开], [频域, 环路Bode, 增益穿越频率相位裕度与增益裕度, 距稳定边界还有多少余量]]
      - {id: shared-object-conclusion, type: plain_text, body: '每次调节 K，都按复平面、时域、频域的顺序核对三组证据，并保留通道标签。'}
    evidence_sequence: [page-intro, model-formulas, channel-labels, gain-regions, observation-protocol, shared-object-conclusion]
    interaction_spec: {interaction_kind: none, student_task: 确认共同对象、通道标签、四个区段与观察顺序。}
    teacher_controls: {release_activity: not_applicable, open_browse: page_load_open, teacher_step_reveal: teacher_highlight_only, reveal_reference_answer: not_applicable}
    student_access: {default_visibility: visible, release_required: false, browse_required: false, can_view_problem_statement: true, can_view_derivation_steps: not_applicable, can_submit_without_browse: not_applicable}
    telemetry_spec: {summary_fields: [viewed, timeOnStep, highlightedDomain], result_policy: no_submission}
    teacher_insight_spec: {widgets: [view_count]}
    ai_context_spec: {delivery_mode: hidden_page_context, page_ai_entry: forbidden, page_goal: 固定三域增益扫描的对象、通道和观察协议。, allowed_scope: [解释公式符号, 区分闭环与环路指标], forbidden_scope: [改写对象, 混用Phi与L, 提前代填扫描数据]}
    preview_contract: {route_kind: student_demo, demo_path: '/interactive-learning/courses/unit-1-5-three-domain-gain-sweep/demo?step=step-04'}
    acceptance_checks: [对象公式和通道标签常显, 四区段顺序与讲义一致, 观察协议表可直接渲染]

  step-05:
    title: 低增益区的稳定余量
    layout: {template: intro_formula_compute_submit, regions: [{id: intro, width: full, order: 1}, {id: formula, width: full, order: 2}, {id: compute, width: full, order: 3}, {id: closing, width: full, order: 4}]}
    modules:
      - {id: page-intro, region: intro, kind: content.rich, must_be_visible: true, payload: {block_key: page-intro, title: 低增益区的稳定余量}}
      - {id: reading-order, region: formula, kind: content.cardSet, must_be_visible: true, payload: {block_key: reading-order, title: 低增益区读图顺序}}
      - id: low-gain-workbench
        region: compute
        kind: compute.panel
        must_be_visible: true
        payload:
          capabilityRef: control-workbench
          panel_id: unit-1-5-low-gain-three-domain
          spec_key: control_workbench
          title: 低增益区的闭环极点、阶跃响应与环路 Bode
          visiblePanelIds: [root-locus, step-response, bode, performance]
          responseContractId: step-05.low-gain-observation.parameter.set
          releaseState: released
          fallbackState: supported
          objectChannelBar: {plant: 'G_0(s)=1/[s(s+1)(s+6)]', loop: 'L_K(s)=KG_0(s)', closedLoop: 'Φ_K(s)=L_K(s)/[1+L_K(s)]', feedback: 单位负反馈, poleAndStepSource: 'Φ_K(s)', marginSource: 'L_K(s)'}
          defaultParameters: {k: 3, gainRegion: '3≤K≤6'}
          request: {runtimeMode: analysis, caseId: unit-1-5-three-domain-gain, plant: {numerator: [1], denominator: [1, 7, 6, 0], coefficientOrder: descending, label: 'G_0(s)=1/[s(s+1)(s+6)]'}, structures: [{kind: gain, enabled: true, params: {k: 3}, label: K}], outputs: [step_response, root_locus, magnitude, phase, bode], responseType: step, settlingBandRatio: 0.05, timeRange: {start: 0, end: 25, samples: 240}, frequencyRange: {min: 0.03, max: 20, samples: 180}, rootLocus: {minGain: 0, maxGain: 46, samples: 220, currentGain: 3}}
          parameterControls: {position: below_graph, fields: [{key: k, label: 增益 K, input: slider, min: 3, max: 6, step: 0.25, defaultValue: 3, presets: [3, 6]}]}
          submissionFields: [{key: k, label: 当前增益 K, input: slider, min: 3, max: 6, step: 0.25, defaultValue: 3, presets: [3, 6]}, {key: dominant_pole_real, label: 主导极点实部, input: number}, {key: response_shape, label: 响应形态, input: select, options: [单调收敛, 衰减振荡, 等幅振荡, 发散]}, {key: phase_margin_deg, label: 相位裕度, input: number}, {key: boundary_distance, label: 距稳定边界的判断, input: select, options: [较远, 较近]}]
          submissionDefaults: {k: 3, dominant_pole_real: '', response_shape: '', phase_margin_deg: '', boundary_distance: ''}
          feedbackPolicy:
            validationSource: control-engine-request-snapshot
            numericTolerance: {dominant_pole_real: {absolute: 0.03}, phase_margin_deg: {absolute: 1.0}}
            stateCriteria: {response_shape: closed_loop_pole_real_part_and_step_envelope, boundary_distance: phase_and_gain_margin_band}
            recordOnlyFields: []
            textObservationScoring: disabled
          learningFactPolicy: {skipLearningFact: true, validationScope: engine_result_only, reason: 服务端学习事实校验策略尚未建立；当前仅确认引擎结果可用，不物化课程侧LearningFact。}
          baselineReadings: {k: 3, dominantPoles: '-0.452±j0.537', overshootPercent: 7.05, settlingTime5PercentSeconds: 7.38, gainCrossoverRadPerSec: 0.454, phaseMarginDeg: 61.26, gainMarginDb: 22.92}
          feasible_region: not_applicable
          fallbackMedia: {src: '/course-runtime/lessons/1-5/media/1-5-fig-01-three-domain-k3.png', alt: 'K等于3时的闭环极点、阶跃响应和环路Bode后备图'}
      - {id: low-gain-conclusion, region: closing, kind: content.rich, must_be_visible: true, payload: {block_key: low-gain-conclusion, title: 首组三域证据}}
    content_blocks:
      - {id: page-intro, type: plain_text, body: '在3≤K≤6内同步调节三域图，先建立距离稳定边界较远的基线。'}
      - {id: reading-order, type: bullet_list, items: ['先读闭环主导极点实部。', '再读阶跃衰减、超调量和5%调节时间。', '最后读环路相位裕度与增益裕度。']}
      - {id: low-gain-conclusion, type: plain_text, body: '主导极点离虚轴较远、振荡能够衰减且裕度较大，共同说明低增益状态距离稳定边界较远。'}
    evidence_sequence: [page-intro, reading-order, low-gain-workbench, low-gain-conclusion]
    interaction_spec:
      interaction_kind: interactive_figure_submit
      canonical_response_owner: compute.panel
      evidence_key: step-05.low-gain-observation.parameter.set
      activity_cards: []
      student_task: 调节低增益状态，并通过工作台唯一提交入口保存参数、极点、响应形态、相位裕度和边界距离判断。
      reveal_answer: after_submit_or_teacher_reveal
    teacher_controls: {release_activity: teacher_toggle, open_browse: page_load_open, teacher_step_reveal: not_applicable, reveal_reference_answer: teacher_toggle}
    student_access: {default_visibility: visible, release_required: true, browse_required: false, can_view_problem_statement: true, can_view_derivation_steps: not_applicable, can_submit_without_browse: true}
    telemetry_spec: {summary_fields: [viewed, parameterChanges, submittedParameterSet], result_policy: explicit_parameter_submission_only}
    teacher_insight_spec: {widgets: [submission_rate, parameter_distribution, response_summary]}
    ai_context_spec: {delivery_mode: hidden_page_context, page_ai_entry: forbidden, page_goal: 建立低增益区的首组三域证据。, allowed_scope: [解释已显示的三域读数, 提交后检查证据一致性], forbidden_scope: [替学生选择参数, 代写提交判断, 把滑块浏览当作掌握证据]}
    preview_contract: {route_kind: student_demo, demo_path: '/interactive-learning/courses/unit-1-5-three-domain-gain-sweep/demo?step=step-05'}
    acceptance_checks: [capabilityRef和对象通道条完整, 默认K等于3且控件位于图下, 五个提交字段完整, 本页无普通选择题]

  step-06:
    title: 中增益区的振荡与余量收缩
    layout: {template: baseline_compute_submit, regions: [{id: intro, width: full, order: 1}, {id: baseline, width: full, order: 2}, {id: compute, width: full, order: 3}, {id: closing, width: full, order: 4}]}
    modules:
      - {id: page-intro, region: intro, kind: content.rich, must_be_visible: true, payload: {block_key: page-intro, title: 中增益区的振荡与余量收缩}}
      - {id: low-gain-baseline, region: baseline, kind: content.cardSet, must_be_visible: true, payload: {block_key: low-gain-baseline, title: K等于3的比较基线}}
      - id: medium-gain-workbench
        region: compute
        kind: compute.panel
