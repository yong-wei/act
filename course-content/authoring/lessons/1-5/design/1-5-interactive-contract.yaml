  step-12:
    title: 临界边界与换对象迁移
    layout: {template: code_task_workspace, regions: [{id: intro, width: full, order: 1}, {id: code, width: full, order: 2}, {id: activity, width: full, order: 3}, {id: closing, width: full, order: 4}]}
    modules:
      - {id: page-intro, region: intro, kind: content.rich, must_be_visible: true, payload: {block_key: page-intro, title: 临界边界与换对象迁移}}
      - id: octave-reproduction
        region: code
        kind: content.code
        must_be_visible: true
        payload:
          title: MATLAB/Octave三域复现骨架
          language: matlab
          code: |-
            G0 = tf(1, [1 7 6 0]);
            gains = [6 18 30 42];
            for K = gains
                Phi = feedback(K*G0, 1);
                p = pole(Phi);
                figure; step(Phi);
                figure; margin(K*G0);
            end
            figure; rlocus(G0);
          block_key: octave-reproduction
      - id: migration-workspace
        region: activity
        kind: activity.workspace
        must_be_visible: true
        payload:
          title: 参数反推、Routh判断与换对象扫描
          responseContractId: text.structured
          fields: [k, dominant_poles, response_shape, phase_margin_deg, system_state]
          row_keys: [k5, k25, k55, k70]
          rows:
            - {row_key: k5, k: 5, dominant_poles: '', response_shape: '', phase_margin_deg: '', system_state: ''}
            - {row_key: k25, k: 25, dominant_poles: '', response_shape: '', phase_margin_deg: '', system_state: ''}
            - {row_key: k55, k: 55, dominant_poles: '', response_shape: '', phase_margin_deg: '', system_state: ''}
            - {row_key: k70, k: 70, dominant_poles: '', response_shape: '', phase_margin_deg: '', system_state: ''}
      - {id: migration-conclusion, region: closing, kind: content.rich, must_be_visible: true, payload: {block_key: migration-conclusion, title: 可迁移关系与必须重算的数值}}
    content_blocks:
      - {id: page-intro, type: plain_text, body: '使用同一组控制函数复现三域观察，再分别完成参数反推、含零点对象判断和换对象扫描。'}
      - id: octave-reproduction
        type: code
        language: matlab
        code: |-
          G0 = tf(1, [1 7 6 0]);
          gains = [6 18 30 42];
          for K = gains
              Phi = feedback(K*G0, 1);
              p = pole(Phi);
              figure; step(Phi);
              figure; margin(K*G0);
          end
          figure; rlocus(G0);
      - {id: migration-conclusion, type: plain_text, body: '稳定边界的三域同步关系可以迁移；具体临界增益、极点轨迹、超调量和调节时间必须按新对象重算。'}
    evidence_sequence: [page-intro, octave-reproduction, migration-workspace, migration-conclusion]
    interaction_spec:
      interaction_kind: task_card_workspace
      student_task: 三项任务分别提交，完成参数反推、Routh条件判断和换对象扫描。
      activity_cards:
        - {id: infer-gain, title: 从三域数据反推增益, prompt: 已知主导极点约为-0.249±j1.645、超调量约60.18%、相位裕度约17.99°，从K等于12、18、24、36中选择对应增益，并判断三项数据是否相容。, response_kind: choice.single, options: [12, 18, 24, 36], reference_answer: 'K=18，三项数据相容。', submit_scope: per_card, layout_span: one_third}
        - id: zero-added-routh
          title: 增加零点后的Routh判断
          prompt: 对L(s)=K(s+2)/[s(s+1)(s+6)]，补全闭环特征多项式，并根据三阶Routh条件判断是否存在有限正临界增益。
          response_kind: text.structured
          fields: [{key: characteristic_polynomial, label: 闭环特征多项式}, {key: routh_condition, label: Routh条件}, {key: finite_positive_critical_gain, label: 是否存在有限正临界增益}]
          reference_answer: 's^3+7s^2+(6+K)s+2K；7(6+K)>2K对K>0恒成立；不存在有限正临界增益。'
          submit_scope: per_card
          layout_span: one_third
        - id: new-plant-scan
          title: 新对象的四区段三域扫描
          prompt: 对G_1(s)=1/[s(s+2)(s+5)]，由特征多项式求稳定区间和临界增益，再用K等于5、25、55、70完成四行三域对照，并写出一条跨对象比较。
          response_kind: table.builder
          columns: [K, 主导极点, 阶跃形态, 相位裕度, 系统状态]
          row_keys: [k5, k25, k55, k70]
          fields: [{key: stable_interval, label: 稳定区间}, {key: critical_gain, label: 临界增益}, {key: comparison, label: 跨对象比较}]
          reference_answer: '特征多项式s^3+7s^2+10s+K；0<K<70；Kcrit=70；三域同步关系可迁移，具体数值必须重算。'
          submit_scope: per_card
          layout_span: one_third
      reveal_answer: after_submit_or_teacher_reveal
    teacher_controls: {release_activity: teacher_toggle, open_browse: page_load_open, teacher_step_reveal: not_applicable, reveal_reference_answer: teacher_toggle_per_card}
    student_access: {default_visibility: hidden, release_required: true, browse_required: false, can_view_problem_statement: true, can_view_derivation_steps: not_applicable, can_submit_without_browse: true}
    telemetry_spec: {summary_fields: [viewed, codeCopied, submittedCards, migrationCompletion], result_policy: per_card_submission}
    teacher_insight_spec: {widgets: [submission_rate, response_summary, routh_errors, migration_completion]}
    ai_context_spec: {delivery_mode: hidden_page_context, page_ai_entry: forbidden, page_goal: 用MATLAB或Octave复现并迁移三域观察协议。, allowed_scope: [解释代码函数, 提交后检查Routh逻辑和对象一致性], forbidden_scope: [代替学生运行并填写提交结果, 把原对象数值直接移植到新对象]}
    preview_contract: {route_kind: student_demo, demo_path: '/interactive-learning/courses/unit-1-5-three-domain-gain-sweep/demo?step=step-12'}
    acceptance_checks: [代码模块kind为content.code且language为matlab, 三个任务题面仅在activity_cards出现, 三卡分别提交, 新对象数值与原对象明确分离]

  step-13:
    title: 三域联动能力后测
    layout: {template: post_quiz_with_intro, regions: [{id: intro, width: full, order: 1}, {id: activity, width: full, order: 2}, {id: feedback, width: full, order: 3}]}
    modules:
      - {id: page-intro, region: intro, kind: content.rich, must_be_visible: true, payload: {block_key: page-intro, title: 三域联动能力后测}}
      - {id: postcheck, region: activity, kind: activity.panel, must_be_visible: true, payload: {title: 三项目标达成检查, responseContractId: choice.single}}
      - {id: scoring-note, region: feedback, kind: content.rich, must_be_visible: true, payload: {block_key: scoring-note, title: 作答与反馈口径}}
    content_blocks:
      - {id: page-intro, type: plain_text, body: '三道题分别检查状态判断、三域证据归位和上升速度与收敛速度分辨。'}
      - {id: scoring-note, type: plain_text, body: '三题逐卡提交；目标达成反馈在全部提交或教师揭示后显示。'}
    evidence_sequence: [page-intro, postcheck, scoring-note]
    interaction_spec:
      interaction_kind: quiz_group
      student_task: 三题分别提交，完成本次课程的三域联动能力检查。
      activity_cards:
        - {id: near-critical-state, title: 近临界状态判断, prompt: 某状态主导极点位于左半平面且实部接近零、阶跃振荡缓慢衰减、相位裕度很小，最恰当的判断是？, response_kind: choice.single, options: [余量充足, 近临界但稳定, 临界稳定, 不稳定], reference_answer: 近临界但稳定, submit_scope: per_card, layout_span: one_third}
        - id: three-domain-slots
          title: 临界信号的三域归位
          prompt: 把闭环极点到达虚轴、阶跃出现不衰减振荡、相位裕度为零分别放入复平面、时域、频域三个证据槽。
          response_kind: matching.pairs
          pairs: [{left: 闭环极点到达虚轴, right: 复平面}, {left: 阶跃出现不衰减振荡, right: 时域}, {left: 相位裕度为零, right: 频域}]
          reference_answer: 复平面—闭环极点到达虚轴；时域—阶跃出现不衰减振荡；频域—相位裕度为零。
          submit_scope: per_card
          layout_span: one_third
        - {id: rise-versus-settle, title: 上升时间与整体收敛, prompt: 为什么上升时间缩短不能单独证明系统整体收敛更快？, response_kind: text.short, reference_answer: 上升时间只描述首次到达，调节时间还取决于振荡包络衰减。, scoring_rubric: 同时提及首次到达与振荡包络或调节时间为完整回答。, submit_scope: per_card, layout_span: one_third}
      reveal_answer: after_all_submitted_or_teacher_reveal
    teacher_controls: {release_activity: teacher_toggle, open_browse: not_applicable, teacher_step_reveal: not_applicable, reveal_reference_answer: teacher_toggle}
    student_access: {default_visibility: hidden, release_required: true, browse_required: false, can_view_problem_statement: true, can_view_derivation_steps: not_applicable, can_submit_without_browse: true}
    telemetry_spec: {summary_fields: [viewed, submittedCards, objectiveAccuracy, shortAnswerSubmitted], result_policy: per_card_submission}
    teacher_insight_spec: {widgets: [submission_rate, response_summary, ordering_errors, short_answer_keyword_coverage]}
    ai_context_spec: {delivery_mode: hidden_page_context, page_ai_entry: forbidden, page_goal: 检验状态判断、三域归位和速度分辨目标。, allowed_scope: [提交后解释错误原因, 提示短答缺失的信息类别], forbidden_scope: [提交前给出答案, 代写短答, 用单一关键词判定掌握]}
    preview_contract: {route_kind: student_demo, demo_path: '/interactive-learning/courses/unit-1-5-three-domain-gain-sweep/demo?step=step-13'}
    acceptance_checks: [后测恰为三题且最多一题主观题, 三个题面只在activity_cards出现一次, 三题分别提交, 答案揭示与发放分离]

