          stageId: unit-1-5-critical-gain-derivation
          aspectRatio: '16:9'
          title: 从虚轴代入到临界三域结论
          formulas:
            - {id: characteristic, latex: 's^3+7s^2+6s+K=0', region: {x: 0.06, y: 0.08, width: 0.38, height: 0.12}, blocks: [{id: characteristic-block, latex: 's^3+7s^2+6s+K=0', colorRole: known}]}
            - {id: real-imag, latex: 'K-7\omega^2=0,\quad 6\omega-\omega^3=0', region: {x: 0.08, y: 0.3, width: 0.5, height: 0.14}, blocks: [{id: real-part-block, latex: 'K-7\omega^2=0', colorRole: transform}, {id: imag-part-block, latex: '6\omega-\omega^3=0', colorRole: transform}]}
            - {id: critical-values, latex: '\omega^2=6,\quad K_{\mathrm{crit}}=42', region: {x: 0.54, y: 0.5, width: 0.38, height: 0.14}, blocks: [{id: omega-block, latex: '\omega=\sqrt6', colorRole: result}, {id: gain-block, latex: 'K=7\omega^2=42', colorRole: result}]}
