        - { id: 'comparison', width: 'full', order: 2 }
        - { id: 'figure', width: 'half', order: 3 }
        - { id: 'bridge', width: 'full', order: 4 }
    modules:
      - { id: 'plant-card', region: 'evidence', kind: 'formula-card', must_be_visible: true }
      - { id: 'recovered-solution-card', region: 'evidence', kind: 'formula-card', must_be_visible: true }
      - { id: 'problem-focus', region: 'evidence', kind: 'summary-card', must_be_visible: true }
      - { id: 'scenario-reorder-note', region: 'comparison', kind: 'summary-card', must_be_visible: true }
      - { id: 'mismatch-figure', region: 'figure', kind: 'image-panel', must_be_visible: true }
      - { id: 'figure-reading-cue', region: 'figure', kind: 'summary-card', must_be_visible: true }
      - { id: 'bridge-conclusion', region: 'bridge', kind: 'summary-card', must_be_visible: true }
    content_blocks:
      key_formulas:
        - '$P_p(s)=\\dfrac{0.01715}{s(s+0.1)(s+2.14375)}$'
        - '$C_p(s)=1.7679\\dfrac{10.4676s+1}{2.6452s+1}$'
      mismatch_figure:
        runtime_media: '/course-runtime/lessons/4-6/media/4-6-destroyer-mismatch-evidence.png'
      scenario_table:
        columns: ['配置项', '客船航向保持', '驱逐舰快速机动航向控制']
        rows:
          - ['对象模型', '$P_p(s)=\\dfrac{0.01715}{s(s+0.1)(s+2.14375)}$', '$P_d(s)=\\dfrac{0.0216}{s(s+0.16)(s+2.85)}$']
          - ['任务语义', '单次航向保持，强调平顺和储备', '多段快速机动，强调关键时段跟踪与动作分配']
          - ['参考轨迹', '单次保持参考', '分段机动参考：起始转向、加深机动、回收再调整']
          - ['动作筛选线', '峰值动作、总能量只要不逼近边界即可', '峰值动作与控制能量都单独设线，不允许互相挤占']
          - ['优先判断', '速度、超调、稳健性、动作代价协调', '机动完成时间、跟踪误差、峰值动作、控制能量、稳健性并列比较']
    evidence_sequence: ['客船对象', '4-5 可用解', '问题句', '表 1 场景配置对比', '驱逐舰失配图', '图后阅读口令', '收束句']
    interaction_spec: { interaction_kind: 'none', student_task: '只阅读，不提交。' }
    teacher_controls: { release_activity: 'not_applicable', open_browse: 'not_applicable', teacher_step_reveal: 'not_applicable', reveal_reference_answer: 'not_applicable' }
    student_access: { default_visibility: 'visible', release_required: false, browse_required: false, can_view_problem_statement: true, can_view_derivation_steps: false, can_submit_without_browse: false }
    teacher_insight_spec: { widgets: ['view_count', 'sync_status'] }
    telemetry_spec: { summary_fields: ['viewed', 'timeOnStep'], misconception_tags: [] }
    ai_context_spec: { page_goal: '用表 1、旧解回收和新证据钉住“问题写法失效”的入口。' }
    preview_contract: { demo_path: '/interactive-learning/courses/unit-4-6-fixed-structure-boundary-structural-encoding/student/demo?step=step-01' }
    acceptance_checks: ['表 1、旧解与失配图必须同页常显。']

  step-02:
    title: '本次课程目标：完成这轮迁移判断后应能做到什么'
    layout:
      template: 'objective_chain_board'
      regions:
        - { id: 'header', width: 'full', order: 1 }
        - { id: 'goals', width: 'full', order: 2 }
        - { id: 'bridge', width: 'full', order: 3 }
    modules:
      - { id: 'objective-header', region: 'header', kind: 'summary-card', must_be_visible: true }
      - { id: 'objective-list', region: 'goals', kind: 'summary-card', must_be_visible: true }
      - { id: 'objective-bridge', region: 'bridge', kind: 'summary-card', must_be_visible: true }
    content_blocks:
      objective_list:
        bullets:
          - '说明客船与驱逐舰任务中为什么会发生任务重排。'
          - '指出固定结构迁移后首先暴露出的失配信号。'
          - '解释驱逐舰专用代价函数为什么不是旧指标换名。'
          - '读懂五类结构的统一编码、有效槽位和逐槽映射。'
          - '用四类方案比较说明目标与结构是两道独立判断。'
    evidence_sequence: ['标题', '五条课程目标', '桥接句']
    interaction_spec: { interaction_kind: 'none', student_task: '阅读课程目标。' }
    teacher_controls: { release_activity: 'not_applicable', open_browse: 'not_applicable', teacher_step_reveal: 'not_applicable', reveal_reference_answer: 'not_applicable' }
    student_access: { default_visibility: 'visible', release_required: false, browse_required: false, can_view_problem_statement: true, can_view_derivation_steps: false, can_submit_without_browse: false }
    teacher_insight_spec: { widgets: ['view_count'] }
    telemetry_spec: { summary_fields: ['viewed', 'timeOnStep'], misconception_tags: [] }
    ai_context_spec: { page_goal: '独立呈现本课布鲁姆能力目标。' }
    preview_contract: { demo_path: '/interactive-learning/courses/unit-4-6-fixed-structure-boundary-structural-encoding/student/demo?step=step-02' }
    acceptance_checks: ['只允许出现本课目标，不暴露单元编排口径。']

  step-03:
    title: '迁移场景任务重排：客船与驱逐舰到底换了什么'
    layout:
      template: 'scenario_reorder_compare_board'
      regions:
        - { id: 'formula', width: 'full', order: 1 }
        - { id: 'comparison', width: 'full', order: 2 }
        - { id: 'summary', width: 'full', order: 3 }
        - { id: 'interaction', width: 'full', order: 4 }
    modules:
      - { id: 'migration-formula', region: 'formula', kind: 'formula-card', must_be_visible: true }
      - { id: 'scenario-compare-table', region: 'comparison', kind: 'native-table', must_be_visible: true }
      - { id: 'priority-summary', region: 'summary', kind: 'summary-card', must_be_visible: true }
      - { id: 'task-change-card', region: 'interaction', kind: 'activity-card', must_be_visible: false }
      - { id: 'boundary-split-card', region: 'interaction', kind: 'activity-card', must_be_visible: false }
    content_blocks:
      migration_formula:
        latex: '$\\text{迁移判断}=\\text{对象变化}+\\text{任务变化}+\\text{筛选线重排}$'
      scenario_reorder_note:
        text: '回看 step-01 的表 1：对象模型、任务语义、参考轨迹、动作筛选线和优先判断共同改写了问题。驱逐舰不是更快一点的客船，而是进入多段快速机动、动作边界分开筛选、任务质量并列比较的新场景。'
    evidence_sequence: ['迁移判断式', '表 1 后的迁移判断说明', '优先判断总结', '两张判断卡']
    interaction_spec:
      interaction_kind: 'activity_card_set'
      student_task: '指出任务重排不仅包含对象参数变化。'
      activity_cards:
        - { id: 'task-change-card', prompt: '除了对象参数变化，本页还要求你至少指出哪两类任务语义变化？', response_kind: 'fill_text', submit_scope: 'per_card', layout_span: 'half' }
        - { id: 'boundary-split-card', prompt: '为什么驱逐舰场景必须把峰值动作和控制能量分开筛选？', response_kind: 'fill_text', submit_scope: 'per_card', layout_span: 'half' }
    teacher_controls: { release_activity: 'teacher_toggle', open_browse: 'page_load_open', teacher_step_reveal: 'not_applicable', reveal_reference_answer: 'teacher_toggle' }
    student_access: { default_visibility: 'visible', activity_visibility: 'hidden', release_required: true, browse_required: false, can_view_problem_statement: true, can_view_derivation_steps: true, can_submit_without_browse: true }
    teacher_insight_spec: { widgets: ['card_completion_rate', 'error_bucket_distribution'] }
    telemetry_spec: { summary_fields: ['cardSubmitted', 'timeOnStep'], misconception_tags: ['migration_as_speedup_only'] }
    ai_context_spec: { page_goal: '把对象、任务和筛选线的重排写实。' }
    preview_contract: { demo_path: '/interactive-learning/courses/unit-4-6-fixed-structure-boundary-structural-encoding/student/demo?step=step-03' }
    acceptance_checks: ['本页基于 step-01 的表 1 完成判断，不重复渲染完整表格。']

  step-04:
    title: '固定结构迁移后的失配信号：拖尾、航迹偏离与职责过载如何同时出现'
    layout:
      template: 'mismatch_evidence_board'
      regions:
        - { id: 'formula', width: 'full', order: 1 }
        - { id: 'figure', width: 'half', order: 2 }
        - { id: 'reveal', width: 'half', order: 3 }
        - { id: 'summary', width: 'full', order: 4 }
    modules:
      - { id: 'legacy-weight-card', region: 'formula', kind: 'formula-card', must_be_visible: true }
      - { id: 'legacy-objective-card', region: 'formula', kind: 'formula-card', must_be_visible: true }
      - { id: 'legacy-symbol-table', region: 'formula', kind: 'native-table', must_be_visible: true }
      - { id: 'mismatch-figure', region: 'figure', kind: 'image-panel', must_be_visible: true }
      - { id: 'mismatch-reveal', region: 'reveal', kind: 'step-reveal', must_be_visible: true }
      - { id: 'mismatch-conclusion', region: 'summary', kind: 'summary-card', must_be_visible: true }
    content_blocks:
      key_formulas:
        - '$B=[0.30,0.30,0.20,0.20]$'
        - '$J_p(\\theta)=0.30\\bar t_s+0.30\\overline{\\mathrm{ITAE}}+0.20\\overline{\\mathrm{ITSE}}+0.20\\bar E_u$'
      legacy_symbol_table:
        columns: ['符号', '计算方法', '含义']
        rows:
          - ['$\\bar t_s$', '调节时间除以客船基准调节时间 $t_{s,0}$', '衡量保持任务的收敛速度。']
          - ['$\\overline{\\mathrm{ITAE}}$', '$\\mathrm{ITAE}(\\theta)/\\mathrm{ITAE}_0$', '时间加权绝对误差，用来惩罚后期仍拖尾的误差。']
          - ['$\\overline{\\mathrm{ITSE}}$', '$\\mathrm{ITSE}(\\theta)/\\mathrm{ITSE}_0$', '时间加权平方误差，用来压低较大的持续误差。']
          - ['$\\bar E_u$', '$E_u(\\theta)/E_{u,0}$', '控制能量归一化结果，用来约束持续动作代价。']
      mismatch_figure:
        runtime_media: '/course-runtime/lessons/4-6/media/4-6-destroyer-mismatch-evidence.png'
    evidence_sequence: ['旧权重', '旧总代价', '旧总代价符号说明', '失配图', '三类失配信号显影', '结论']
    interaction_spec:
      interaction_kind: 'teacher_reveal_only'
      student_task: '理解三类失配信号如何共同指向旧问题写法失效。'
      step_reveal_policy: { min_layers: 3, local_click_to_continue: true }
    teacher_controls: { release_activity: 'not_applicable', open_browse: 'not_applicable', teacher_step_reveal: 'teacher_only', reveal_reference_answer: 'not_applicable' }
    student_access: { default_visibility: 'visible', release_required: false, browse_required: false, can_view_problem_statement: true, can_view_derivation_steps: false, can_submit_without_browse: false }
    teacher_insight_spec: { widgets: ['step_reveal_progress'] }
    telemetry_spec: { summary_fields: ['stepRevealCount', 'timeOnStep'], misconception_tags: ['parameter_tuning_is_enough'] }
    ai_context_spec: { page_goal: '把三类失配信号落成可读可见的证据链。' }
    preview_contract: { demo_path: '/interactive-learning/courses/unit-4-6-fixed-structure-boundary-structural-encoding/student/demo?step=step-04' }
    acceptance_checks: ['旧总代价公式的每个符号必须有计算方法和含义说明。', '失配图与三类失配信号必须同页联动。']

  step-05:
    title: '驱逐舰专用代价函数：为什么比较对象必须重写'
    layout:
      template: 'objective_rewrite_board'
      regions:
        - { id: 'formula', width: 'full', order: 1 }
        - { id: 'table', width: 'full', order: 2 }
        - { id: 'interaction', width: 'full', order: 3 }
        - { id: 'summary', width: 'full', order: 4 }
    modules:
      - { id: 'legacy-objective', region: 'formula', kind: 'formula-card', must_be_visible: true }
      - { id: 'destroyer-objective', region: 'formula', kind: 'formula-card', must_be_visible: true }
      - { id: 'metric-duty-table', region: 'table', kind: 'native-table', must_be_visible: true }
      - { id: 'trajectory-duty-card', region: 'interaction', kind: 'activity-card', must_be_visible: false }
      - { id: 'action-duty-card', region: 'interaction', kind: 'activity-card', must_be_visible: false }
      - { id: 'objective-summary', region: 'summary', kind: 'summary-card', must_be_visible: true }
    content_blocks:
      destroyer_objective:
        latex: '$J_d(\\theta)=\\lambda_1\\bar E_{\\mathrm{trans}}+\\lambda_2\\bar E_{\\psi}+\\lambda_3\\bar E_{\\mathrm{traj}}+\\lambda_4\\bar u_{\\mathrm{peak}}+\\lambda_5\\bar E_u$'
      metric_duty_table:
        columns: ['职责', '符号', '计算方法', '含义']
        rows:
          - ['切换段误差', '$\\bar E_{\\mathrm{trans}}$', '$E_{\\mathrm{trans}}(\\theta)/E_{\\mathrm{trans},0}$', '统计方波切换后短时间窗口内的误差面积，衡量变向后能否尽快跟上。']
          - ['全程跟踪误差', '$\\bar E_{\\psi}$', '$E_{\\psi}(\\theta)/E_{\\psi,0}$', '覆盖整个 120s 机动过程，防止只把少数切换段做好。']
          - ['航迹偏离', '$\\bar E_{\\mathrm{traj}}$', '$E_{\\mathrm{traj}}(\\theta)/E_{\\mathrm{traj},0}$', '将期望航向与实际航向按固定航速积分成平面轨迹后累计偏差，回答船是否真正走到位。']
          - ['峰值动作', '$\\bar u_{\\mathrm{peak}}$', '$u_{\\mathrm{peak}}(\\theta)/u_{\\mathrm{lim}}$', '检查执行机构瞬时最大操纵量是否越界。']
          - ['控制能量', '$\\bar E_u$', '$E_u(\\theta)/E_{u,\\mathrm{lim}}$', '统计全程控制量平方积分，检查持续动作代价。']
    evidence_sequence: ['旧目标与新目标对照', '五项职责表', '两张判断卡', '收束句']
    interaction_spec:
      interaction_kind: 'activity_card_set'
      student_task: '区分五项量各自承担的判断职责。'
      activity_cards:
        - { id: 'trajectory-duty-card', prompt: '哪一项指标直接回答“船是否真正走到位”？', response_kind: 'fill_text', submit_scope: 'per_card', layout_span: 'half' }
        - { id: 'action-duty-card', prompt: '为什么峰值动作与控制能量必须继续分开接受比较？', response_kind: 'fill_text', submit_scope: 'per_card', layout_span: 'half' }
    teacher_controls: { release_activity: 'teacher_toggle', open_browse: 'page_load_open', teacher_step_reveal: 'not_applicable', reveal_reference_answer: 'teacher_toggle' }
    student_access: { default_visibility: 'visible', activity_visibility: 'hidden', release_required: true, browse_required: false, can_view_problem_statement: true, can_view_derivation_steps: true, can_submit_without_browse: true }
    teacher_insight_spec: { widgets: ['card_completion_rate', 'response_bucket_distribution'] }
    telemetry_spec: { summary_fields: ['cardSubmitted', 'timeOnStep'], misconception_tags: ['metric_rename_only'] }
    ai_context_spec: { page_goal: '把五项比较对象写成清楚的职责表。' }
    preview_contract: { demo_path: '/interactive-learning/courses/unit-4-6-fixed-structure-boundary-structural-encoding/student/demo?step=step-05' }
    acceptance_checks: ['五项职责必须明确写出对应符号、计算方法和含义，不得退化为摘要句。']

  step-06:
    title: '何时把结构选择正式抬成问题本身'
    layout:
      template: 'structure_entry_board'
      regions:
        - { id: 'chain', width: 'full', order: 1 }
        - { id: 'reveal', width: 'full', order: 2 }
        - { id: 'structures', width: 'full', order: 3 }
        - { id: 'summary', width: 'full', order: 4 }
    modules:
      - { id: 'overload-chain', region: 'chain', kind: 'formula-card', must_be_visible: true }
      - { id: 'search-condition-reveal', region: 'reveal', kind: 'step-reveal', must_be_visible: true }
      - { id: 'candidate-structures', region: 'structures', kind: 'native-table', must_be_visible: true }
      - { id: 'structure-decode-example', region: 'structures', kind: 'summary-card', must_be_visible: true }
      - { id: 'entry-conclusion', region: 'summary', kind: 'summary-card', must_be_visible: true }
    content_blocks:
      overload_chain:
        latex: '$\\text{对象变换}\\rightarrow\\text{任务变换}\\rightarrow\\text{筛选线重排}\\rightarrow\\text{固定结构职责过载}$'
      candidate_structures:
        columns: ['编号', '结构', '表达式', '有效参数', '参数范围']
        rows:
          - ['1', 'PI', '$C(s)=K\\dfrac{T_i s+1}{T_i s}$', '$K,T_i$', '$K\\in[0.90,2.20],\\ T_i\\in[8.00,28.00]$']
          - ['2', '超前', '$C(s)=K\\dfrac{T_z s+1}{T_p s+1}$', '$K,T_z,T_p$', '$K\\in[1.00,2.73],\\ T_z\\in[8.00,17.585],\\ T_p\\in[4.00,7.33]$']
          - ['3', 'PI + 超前', '$C(s)=K\\dfrac{T_i s+1}{T_i s}\\dfrac{T_z s+1}{T_p s+1}$', '$K,T_i,T_z,T_p$', '$K\\in[1.00,2.20],\\ T_i\\in[6.00,48.00],\\ T_z\\in[5.00,22.00],\\ T_p\\in[1.80,6.00]$']
          - ['4', '滞后 + 超前', '$C(s)=K\\dfrac{\\beta T_{\\mathrm{lag}}s+1}{T_{\\mathrm{lag}}s+1}\\dfrac{T_{\\mathrm{lead}}s+1}{T_p s+1}$', '$K,T_{\\mathrm{lag}},\\beta,T_{\\mathrm{lead}},T_p$', '$K\\in[0.90,2.10],\\ T_{\\mathrm{lag}}\\in[6.00,18.00],\\ \\beta\\in[0.65,0.96],\\ T_{\\mathrm{lead}}\\in[6.00,18.00],\\ T_p\\in[2.50,6.20]$']
          - ['5', '带微分滤波的 PID', '$C(s)=K_p\\left(1+\\dfrac{1}{T_i s}+\\dfrac{T_d s}{T_f s+1}\\right)$', '$K_p,T_i,T_d,T_f$', '$K_p\\in[0.90,2.50],\\ T_i\\in[8.00,22.00],\\ T_d\\in[0.50,3.80],\\ T_f\\in[0.04,0.20]$']
      structure_decode_example:
        text: '解码例：z=[0.50,0.28,0.93,0.78,0.16,0.62]，先由 z_0=0.50 得到 ceil(5z_0)=3，选择 PI + 超前；随后只解释 z_1 到 z_4，得到 $K=1.336$、$T_i=45.06$、$T_z=18.26$、$T_p=2.472$，z_5 在该结构下被忽略。'
    evidence_sequence: ['固定结构可用域收缩链', '结构搜索引入条件显影', '五类候选结构码本预览', '解码映射例子', '收束句']
    interaction_spec:
      interaction_kind: 'teacher_reveal_only'
      student_task: '理解结构搜索是在什么条件下才成为合理入口。'
      step_reveal_policy: { min_layers: 3, local_click_to_continue: true }
    teacher_controls: { release_activity: 'not_applicable', open_browse: 'not_applicable', teacher_step_reveal: 'teacher_only', reveal_reference_answer: 'not_applicable' }
    student_access: { default_visibility: 'visible', release_required: false, browse_required: false, can_view_problem_statement: true, can_view_derivation_steps: false, can_submit_without_browse: false }
    teacher_insight_spec: { widgets: ['step_reveal_progress'] }
    telemetry_spec: { summary_fields: ['stepRevealCount', 'timeOnStep'], misconception_tags: ['structure_search_as_algorithm_upgrade'] }
    ai_context_spec: { page_goal: '把结构搜索引入条件钉成显性判断链。' }
    preview_contract: { demo_path: '/interactive-learning/courses/unit-4-6-fixed-structure-boundary-structural-encoding/student/demo?step=step-06' }
    acceptance_checks: ['五类候选结构必须列出表达式、有效参数和参数范围。', '必须给出至少一个解码映射例子。']

  step-07:
    title: '五类结构的统一编码：先判结构，再解释参数'
    layout:
      template: 'structural_encoding_workspace'
      regions:
        - { id: 'encoding', width: 'full', order: 1 }
        - { id: 'codebook', width: 'full', order: 2 }
        - { id: 'examples', width: 'full', order: 3 }
        - { id: 'interaction', width: 'full', order: 4 }
    modules:
      - { id: 'encoding-formula', region: 'encoding', kind: 'formula-card', must_be_visible: true }
      - { id: 'structure-codebook', region: 'codebook', kind: 'native-table', must_be_visible: true }
      - { id: 'decode-reveal', region: 'examples', kind: 'step-reveal', must_be_visible: true }
      - { id: 'structure-first-card', region: 'interaction', kind: 'activity-card', must_be_visible: false }
      - { id: 'active-slots-card', region: 'interaction', kind: 'activity-card', must_be_visible: false }
    content_blocks:
      encoding_formula:
        latex:
          - '$[z_0,z_1,\\ldots,z_5]\\in[0,1]^6$'
          - '$k=\\max(1,\\lceil 5z_0\\rceil)$'
      codebook_table:
        columns: ['结构', '有效槽位', '忽略槽位', '参数允许范围']
        rows: ['PI', '超前', 'PI + 超前', '滞后 + 超前', '带微分滤波的 PID']
      decode_examples:
        vectors:
          - 'z=[0.50,0.28,0.93,0.78,0.16,0.62]'
          - 'z=[0.33,0.44,0.82,0.18,0.91,0.73]'
