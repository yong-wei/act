  step-02:
    title: '问题提出与三张记录表：稳定之后还要回答什么'
    layout: { template: 'goal_chain_slide', regions: [ { id: 'question', width: 'full', order: 1 }, { id: 'outputs', width: 'full', order: 2 }, { id: 'summary', width: 'full', order: 3 } ] }
    modules: [ { id: 'core-question-card', region: 'question', kind: 'content.cardSet', must_be_visible: true , payload: { legacyKind: 'summary-card', presentation: 'single', semanticRole: 'summary' }}, { id: 'deliverable-table', region: 'outputs', kind: 'content.table', must_be_visible: true , payload: { legacyKind: 'native-table', presentation: 'single' }}, { id: 'chain-summary-card', region: 'summary', kind: 'content.cardSet', must_be_visible: true , payload: { legacyKind: 'summary-card', presentation: 'single', semanticRole: 'summary' }} ]
    content_blocks:
      core_question: { text: '同样位于稳定窗口内的参数，也可能对应完全不同的速度、振荡、风险与工程后果。' }
      deliverables: { columns: [ '记录表', '要回答的问题', '至少应包含的信息' ], rows: [ [ '关键节点读图记录', '主图上先看哪些位置。', '分离点、虚轴交点、主导极点候选、稳定窗口' ], [ '参数窗口判断表', '哪些参数只是稳定，哪些参数更值得选用。', '根轨迹增益、实际控制器增益、非增益参数窗口、稳定性判断、性能趋势' ], [ '对象化验证记录', '图上的判断落回真实对象后是否仍成立。', '时域后果、频域后果、主导极点近似是否可信、低中频近似与高频差异' ] ] }
      chain_summary: { text: '三张记录表首尾相接：关键节点读图 -> 参数窗口判断 -> 对象化三域验证 -> 广义参数验证。' }
    evidence_sequence: [ '核心问题卡', '三张记录表', '判断链摘要' ]
    interaction_spec: { interaction_kind: 'none', student_task: '只阅读，不提交。', answer_reveal: 'none' }
    teacher_controls: { release_activity: 'not_applicable', open_browse: 'not_applicable', teacher_step_reveal: 'not_applicable', reveal_reference_answer: 'not_applicable' }
    student_access: { default_visibility: 'visible', release_required: false, browse_required: false, can_view_problem_statement: true, can_view_derivation_steps: true, can_submit_without_browse: false }
    teacher_insight_spec: { widgets: [ 'view_count' ] }
    telemetry_spec: { summary_fields: [ 'viewed', 'timeOnStep' ], misconception_tags: [] }
    ai_context_spec: { page_goal: '让学生明确本课最终要交的是三份判断记录。' }
    preview_contract: { demo_path: '/interactive-learning/courses/unit-3-4-root-locus-reading-validation/student/demo?step=step-02' }
    acceptance_checks: [ '三张记录表必须完整出现。', '不能退化为一句“形成记录”。' ]

  step-03:
    title: '固定对象与三个版本：先暴露“稳定=可用”的第一误判'
    layout: { template: 'version_overview_quiz', regions: [ { id: 'object', width: 'full', order: 1 }, { id: 'versions', width: 'full', order: 2 }, { id: 'interaction', width: 'full', order: 3 } ] }
    modules: [ { id: 'object-formula-card', region: 'object', kind: 'content.formula', must_be_visible: true , payload: { legacyKind: 'formula-card', presentation: 'single' }}, { id: 'version-table', region: 'versions', kind: 'content.table', must_be_visible: true , payload: { legacyKind: 'native-table', presentation: 'single' }}, { id: 'prejudge-quiz', region: 'interaction', kind: 'activity.panel', must_be_visible: true , payload: { legacyKind: 'quiz-group', presentation: 'single', interactionKind: 'quiz' }} ]
    content_blocks:
      object_formula: { text: '$G(s)=\\dfrac{0.01715K}{s(s+0.1)(s+2.14375)},\\ k=0.01715K$' }
      version_table: { columns: [ '版本', 'K', 'k', '闭环极点特征', '第一判断' ], rows: [ [ 'A', '0.20', '0.00343', '实极点主导，响应偏慢', '还稳定，但明显偏慢' ], [ 'B', '0.6064', '0.0104', '已越过分离点，且远离虚轴边界', '较均衡，可作为参考工作点' ], [ 'C', '20.00', '0.3430', '靠近边界，共轭主导明显', '速度更快，但风险明显升高' ] ] }
      quiz_items: [ '谁最慢。', '谁最均衡。', '谁最冒险。' ]
    evidence_sequence: [ '对象与记号', '版本表', '三题初判' ]
    interaction_spec: { interaction_kind: 'quiz_group', student_task: '识别“稳定=可用”的入口误判。', questions: [ { id: 'slowest', prompt: '哪一版最慢。', response_kind: 'choice.single' }, { id: 'balanced', prompt: '哪一版最均衡。', response_kind: 'choice.single' }, { id: 'risky', prompt: '哪一版最冒险。', response_kind: 'choice.single' } ], answer_reveal: 'teacher_toggle' }
    teacher_controls: { release_activity: 'teacher_toggle', open_browse: 'page_load_open', teacher_step_reveal: 'not_applicable', reveal_reference_answer: 'teacher_toggle' }
    student_access: { default_visibility: 'visible', activity_visibility: 'hidden', release_required: true, browse_required: false, can_view_problem_statement: true, can_view_derivation_steps: false, can_submit_without_browse: true }
    teacher_insight_spec: { widgets: [ 'question_distribution', 'top_misconceptions' ] }
    telemetry_spec: { summary_fields: [ 'attemptCount', 'resultState', 'timeOnStep' ], misconception_tags: [ 'stable_means_usable', 'ignore_object_formula', 'no_version_context' ] }
    ai_context_spec: { page_goal: '让学生先看到同一对象下三种版本差异，再暴露“稳定=可用”的误判。' }
    preview_contract: { demo_path: '/interactive-learning/courses/unit-3-4-root-locus-reading-validation/student/demo?step=step-03' }
    acceptance_checks: [ '对象公式必须先于题卡出现。', '本页不得配图。' ]

  step-04:
    title: '固定读图顺序：先骨架，再关键节点，再窗口，再后果'
    layout: { template: 'workflow_sort_board', regions: [ { id: 'workflow', width: 'full', order: 1 }, { id: 'interaction', width: 'full', order: 2 }, { id: 'feedback', width: 'full', order: 3 } ] }
    modules: [ { id: 'workflow-cards', region: 'workflow', kind: 'content.cardSet', must_be_visible: true , payload: { legacyKind: 'card-stack', presentation: 'single' }}, { id: 'sort-board', region: 'interaction', kind: 'activity.panel', must_be_visible: true , payload: { legacyKind: 'sort-board', presentation: 'board', responseKind: 'ordering.sequence' }}, { id: 'feedback-strip', region: 'feedback', kind: 'content.cardSet', must_be_visible: true , payload: { legacyKind: 'summary-card', presentation: 'single', semanticRole: 'summary' }} ]
    content_blocks:
      workflow_cards: [ '看骨架：先看起点、终点和分支数量，判断对象的整体骨架。', '找关键节点：锁定分离点、虚轴交点和主导极点候选，判断主导形态与边界位置。', '区分窗口：从关键节点走到稳定窗口与可接受窗口，判断参数落在哪一侧。', '翻译后果：把图上的位置改写成参数语言和工程后果，说明快慢、振荡、裕量与风险。' ]
      error_warning: { text: '不能因为某个点看起来顺眼，就跳过前两步直接宣布哪个版本更好。' }
      summary_sentence: { text: '读图顺序先于好坏判断。' }
    evidence_sequence: [ '四步法卡片', '排序区', '误判提示' ]
    interaction_spec: { interaction_kind: 'sequence_sort', student_task: '把四步法排成稳定读图动作链；初始顺序必须随机，不显示数字序号。', answer_reveal: 'teacher_toggle' }
    teacher_controls: { release_activity: 'teacher_toggle', open_browse: 'page_load_open', teacher_step_reveal: 'not_applicable', reveal_reference_answer: 'teacher_toggle' }
    student_access: { default_visibility: 'visible', activity_visibility: 'hidden', release_required: true, browse_required: false, can_view_problem_statement: true, can_view_derivation_steps: false, can_submit_without_browse: true }
    teacher_insight_spec: { widgets: [ 'sort_success_rate' ] }
    telemetry_spec: { summary_fields: [ 'attemptCount', 'resultState' ], misconception_tags: [ 'judge_before_read', 'skip_keynodes' ] }
    ai_context_spec: { page_goal: '把主图读法固定成四步动作链。' }
    preview_contract: { demo_path: '/interactive-learning/courses/unit-3-4-root-locus-reading-validation/student/demo?step=step-04' }
    acceptance_checks: [ '四步法必须完整显示。', '排序区不得以默认正确顺序出现。' ]

  step-05:
    title: '关键节点证据板：分离点、虚轴交点与参考工作点 `B`'
    layout: { template: 'evidence_reading_board', regions: [ { id: 'evidence', width: 'full', order: 1 }, { id: 'interaction', width: 'full', order: 2 } ] }
    modules: [ { id: 'evidence-cards', region: 'evidence', kind: 'content.cardSet', must_be_visible: true , payload: { legacyKind: 'card-stack', presentation: 'single' }}, { id: 'root-locus-target-panel', region: 'interaction', kind: 'compute.panel', must_be_visible: true , payload: { legacyKind: 'root-locus-target-panel', presentation: 'single', capabilityRef: 'shared-engine-root-locus' }} ]
    content_blocks:
      evidence_cards: [ '分离点 s≈-0.0494 把实极点主导与共轭极点主导分开。', '虚轴交点对应 K≈28.05，对应虚轴交点 s=±j0.4626，给出稳定窗口上界。', 'B 对应主导极点 -0.0488±j0.0496，既越过分离点，又远离虚轴边界，因此可作为均衡参考。' ]
      target_questions: [ '把闭环极点拖到分离点附近后提交。', '把闭环极点拖到虚轴边界附近后提交。', '把闭环极点拖到参考工作点 B 附近后提交。' ]
      tolerance_note: { text: '判定采用容差范围，只检查当前拖动点是否落在目标区域内；不要求同时联动其他极点。' }
    evidence_sequence: [ '三张证据卡', '统一根轨迹面板 + 三题提交区' ]
    interaction_spec: { interaction_kind: 'hotspot_labeling', student_task: '在当前问题按钮下拖动左侧统一根轨迹面板中的闭环极点，并分别提交分离点、虚轴边界和参考工作点 B。', answer_reveal: 'teacher_toggle' }
    teacher_controls: { release_activity: 'teacher_toggle', open_browse: 'page_load_open', teacher_step_reveal: 'not_applicable', reveal_reference_answer: 'teacher_toggle' }
    student_access: { default_visibility: 'visible', activity_visibility: 'hidden', release_required: true, browse_required: false, can_view_problem_statement: true, can_view_derivation_steps: false, can_submit_without_browse: true }
    teacher_insight_spec: { widgets: [ 'hotspot_accuracy', 'top_misconceptions' ] }
    telemetry_spec: { summary_fields: [ 'attemptCount', 'resultState', 'errorBucket' ], misconception_tags: [ 'separation_equals_boundary', 'cannot_locate_B', 'node_name_only' ] }
    ai_context_spec: { page_goal: '让学生把节点位置和节点作用一一对应。' }
    preview_contract: { demo_path: '/interactive-learning/courses/unit-3-4-root-locus-reading-validation/student/demo?step=step-05' }
    acceptance_checks: [ '本页不得再使用静态总图作为主交互。', '三个问题必须用同一块统一根轨迹面板完成。' ]

  step-06:
    title: '关键节点读图记录：把主图证据写成一句工程判断'
    layout: { template: 'record_workspace', regions: [ { id: 'record', width: 'full', order: 1 }, { id: 'interaction', width: 'full', order: 2 } ] }
    modules: [ { id: 'record-template', region: 'record', kind: 'content.table', must_be_visible: true , payload: { legacyKind: 'native-table', presentation: 'single' }}, { id: 'activity-card-a', region: 'interaction', kind: 'content.cardSet', must_be_visible: true , payload: { legacyKind: 'fill-text-card', presentation: 'single', responseKind: 'text.short' }}, { id: 'activity-card-b', region: 'interaction', kind: 'content.cardSet', must_be_visible: true , payload: { legacyKind: 'fill-text-card', presentation: 'single', responseKind: 'text.short' }} ]
    content_blocks:
      record_template: { columns: [ '对象版本', '是否越过分离点', '与虚轴边界关系', '主导极点候选', '读图结论' ], rows: [ [ 'B', '已越过分离点', '仍明显远离虚轴边界', '$-0.0488\\pm j0.0496$', '速度与阻尼较均衡，可作参考工作点' ], [ 'C', '早已越过分离点', '已明显向虚轴边界逼近', '$-0.0135\\pm j0.3931$', '仍稳定，但振荡趋势与风险感显著增强' ] ], note: '写判断句时，位置、边界关系与工程后果必须一起出现。' }
      task_prompts: [ '写出 B 的完整工程判断。', '写出 C 的风险判断。' ]
      summary_sentence: { text: '读图记录的目标是把 B/C 的节点位置、边界关系和工程后果连成完整判断句，而不是收集碎片化形容词。' }
    evidence_sequence: [ 'B/C 证据回顾表', '判断提示', '双卡作答' ]
    interaction_spec: { interaction_kind: 'activity_cards', student_task: '把主图证据写成完整工程判断。', activity_cards: [ { id: 'record-b', prompt: '请写出 B 的完整工程判断。', response_kind: 'text.short', submit_scope: 'per_card', layout_span: 'half' }, { id: 'record-c', prompt: '请写出 C 的风险判断。', response_kind: 'text.short', submit_scope: 'per_card', layout_span: 'half' } ], answer_reveal: 'teacher_toggle' }
    teacher_controls: { release_activity: 'teacher_toggle', open_browse: 'page_load_open', teacher_step_reveal: 'not_applicable', reveal_reference_answer: 'teacher_toggle' }
    student_access: { default_visibility: 'visible', activity_visibility: 'hidden', release_required: true, browse_required: false, can_view_problem_statement: true, can_view_derivation_steps: false, can_submit_without_browse: true }
    teacher_insight_spec: { widgets: [ 'error_bucket_distribution', 'card_completion_rate' ] }
    telemetry_spec: { summary_fields: [ 'cardSubmitted', 'errorBucket', 'timeOnStep' ], misconception_tags: [ 'position_without_consequence', 'adjective_only' ] }
    ai_context_spec: { page_goal: '把节点证据翻译成完整工程判断句。' }
    preview_contract: { demo_path: '/interactive-learning/courses/unit-3-4-root-locus-reading-validation/student/demo?step=step-06' }
    acceptance_checks: [ '模板必须先于作答卡出现。', '两题必须分别提交。' ]

  step-07:
    title: '稳定窗口与可接受窗口：`A/B/C` 各自处在哪一侧'
    layout: { template: 'comparison_judgement_board', regions: [ { id: 'definition', width: 'full', order: 1 }, { id: 'table', width: 'full', order: 2 }, { id: 'interaction', width: 'full', order: 3 } ] }
    modules: [ { id: 'definition-cards', region: 'definition', kind: 'content.cardSet', must_be_visible: true , payload: { legacyKind: 'comparison-cards', presentation: 'single' }}, { id: 'stable-window-card', region: 'definition', kind: 'content.formula', must_be_visible: true , payload: { legacyKind: 'formula-card', presentation: 'single' }}, { id: 'window-table', region: 'table', kind: 'content.table', must_be_visible: true , payload: { legacyKind: 'native-table', presentation: 'single' }}, { id: 'activity-card-a', region: 'interaction', kind: 'activity.panel', must_be_visible: true , payload: { legacyKind: 'single-choice-card', presentation: 'single', interactionKind: 'single-choice', responseKind: 'choice.single' }}, { id: 'activity-card-b', region: 'interaction', kind: 'content.cardSet', must_be_visible: true , payload: { legacyKind: 'fill-text-card', presentation: 'single', responseKind: 'text.short' }} ]
    content_blocks:
      window_definitions: [ '稳定窗口回答还能不能维持闭环稳定。', '可接受窗口回答这个参数是否值得工程上采用。' ]
      stable_window_formula: { text: '$0<K<28.05$' }
      judgement_table: { columns: [ '版本', '窗口位置', '主要收益', '主要代价', '第一判断' ], rows: [ [ 'A', '稳定窗口内，但远离可接受中心', '风险小', '过慢', '还稳定，但不宜直接采用' ], [ 'B', '稳定窗口内，且接近可接受中心', '较均衡', '仍有代价', '可作为参考工作点' ], [ 'C', '稳定窗口内，但靠近边界', '速度更快', '振荡与频域风险上升', '属于取舍型参数' ] ] }
      boundary_sentence: { text: '还稳定只是一条底线，不等于已经可接受。' }
    evidence_sequence: [ '双窗口定义', '稳定窗口数值边界', '参数窗口判断表', '双卡作答' ]
    interaction_spec: { interaction_kind: 'activity_cards', student_task: '区分底线判断与工程判断。', activity_cards: [ { id: 'window-side', prompt: '请判断 A/B/C 各自属于哪一层窗口。', response_kind: 'choice.single', submit_scope: 'per_card', layout_span: 'half' }, { id: 'cost-line', prompt: '请补写一句代价说明。', response_kind: 'text.short', submit_scope: 'per_card', layout_span: 'half' } ], answer_reveal: 'teacher_toggle' }
    teacher_controls: { release_activity: 'teacher_toggle', open_browse: 'page_load_open', teacher_step_reveal: 'not_applicable', reveal_reference_answer: 'teacher_toggle' }
    student_access: { default_visibility: 'visible', activity_visibility: 'hidden', release_required: true, browse_required: false, can_view_problem_statement: true, can_view_derivation_steps: false, can_submit_without_browse: true }
    teacher_insight_spec: { widgets: [ 'question_distribution', 'top_misconceptions' ] }
    telemetry_spec: { summary_fields: [ 'cardSubmitted', 'resultState', 'errorBucket' ], misconception_tags: [ 'stable_equals_acceptable', 'no_cost_language' ] }
    ai_context_spec: { page_goal: '让学生把窗口判断分成“能不能稳定”和“值不值得采用”两层。' }
    preview_contract: { demo_path: '/interactive-learning/courses/unit-3-4-root-locus-reading-validation/student/demo?step=step-07' }
