  - 'interaction_spec'
  - 'teacher_controls'
  - 'student_access'
  - 'telemetry_spec'
  - 'teacher_insight_spec'
  - 'ai_context_spec'
  - 'preview_contract'
  - 'acceptance_checks'
steps:
  step-01:
    title: '回到地图：从 `3-3` 法则走向 `3-4` 判断'
    layout: { template: 'map_hero_slide', regions: [ { id: 'header', width: 'full', order: 1 }, { id: 'lead', width: 'full', order: 2 }, { id: 'summary', width: 'full', order: 3 } ] }
    modules: [ { id: 'stage-map', region: 'header', kind: 'stage-map', must_be_visible: true }, { id: 'core-question-card', region: 'lead', kind: 'summary-card', must_be_visible: true }, { id: 'boundary-card', region: 'summary', kind: 'summary-card', must_be_visible: true } ]
    content_blocks:
      page_intro: { title: '本课角色', lead: '3-3 解决法则与稳定边界，3-4 要把这些法则翻译成真正可执行的工程判断。' }
      goal_cards: [ '沿既有根轨迹继续调增益时，哪些工作点只是还稳定。', '哪些工作点才值得工程上选用。', '为什么 3-5 必须进入结构改变，而不是继续沿原轨迹选点。' ]
      boundary_note: { text: '本课不重讲 3-3 的法则证明，不进入零点、PD 与模块 4 的设计任务。' }
    evidence_sequence: [ '路径图', '主问题卡', '边界卡' ]
    interaction_spec: { interaction_kind: 'none', student_task: '只阅读，不提交。', answer_reveal: 'none' }
    teacher_controls: { release_activity: 'not_applicable', open_browse: 'not_applicable', teacher_step_reveal: 'not_applicable', reveal_reference_answer: 'not_applicable' }
    student_access: { default_visibility: 'visible', release_required: false, browse_required: false, can_view_problem_statement: true, can_view_derivation_steps: true, can_submit_without_browse: false }
    teacher_insight_spec: { widgets: [ 'view_count', 'sync_status' ] }
    telemetry_spec: { summary_fields: [ 'viewed', 'timeOnStep' ], misconception_tags: [] }
    ai_context_spec: { page_goal: '让学生知道 3-4 的任务是把法则翻译成工程判断。' }
    preview_contract: { demo_path: '/interactive-learning/courses/unit-3-4-root-locus-reading-validation/student/demo?step=step-01' }
    acceptance_checks: [ '首屏同时看到路径、主问题和边界。', '不得提前出现根轨迹主图。' ]

  step-02:
    title: '问题提出与三张记录表：稳定之后还要回答什么'
    layout: { template: 'goal_chain_slide', regions: [ { id: 'question', width: 'full', order: 1 }, { id: 'outputs', width: 'full', order: 2 }, { id: 'summary', width: 'full', order: 3 } ] }
    modules: [ { id: 'core-question-card', region: 'question', kind: 'summary-card', must_be_visible: true }, { id: 'deliverable-table', region: 'outputs', kind: 'native-table', must_be_visible: true }, { id: 'chain-summary-card', region: 'summary', kind: 'summary-card', must_be_visible: true } ]
    content_blocks:
      core_question: { text: '同样位于稳定窗口内的参数，也可能对应完全不同的速度、振荡、风险与工程后果。' }
      deliverables: [ '关键节点读图记录', '参数窗口判断表', '对象化验证记录' ]
      chain_summary: { text: '关键节点读图 -> 参数窗口判断 -> 对象化三域验证 -> 广义参数验证。' }
    evidence_sequence: [ '核心问题卡', '三张记录表', '判断链摘要' ]
    interaction_spec: { interaction_kind: 'none', student_task: '只阅读，不提交。', answer_reveal: 'none' }
    teacher_controls: { release_activity: 'not_applicable', open_browse: 'not_applicable', teacher_step_reveal: 'not_applicable', reveal_reference_answer: 'not_applicable' }
    student_access: { default_visibility: 'visible', release_required: false, browse_required: false, can_view_problem_statement: true, can_view_derivation_steps: true, can_submit_without_browse: false }
    teacher_insight_spec: { widgets: [ 'view_count' ] }
    telemetry_spec: { summary_fields: [ 'viewed', 'timeOnStep' ], misconception_tags: [] }
    ai_context_spec: { page_goal: '让学生明确本课最终要交的是三份判断记录。' }
    preview_contract: { demo_path: '/interactive-learning/courses/unit-3-4-root-locus-reading-validation/student/demo?step=step-02' }
    acceptance_checks: [ '三张记录表必须完整出现。', '不能退化为一句“形成记录”。' ]

  step-03:
    title: '固定对象与三个版本：先暴露“稳定=可用”的第一误判'
    layout: { template: 'version_overview_quiz', regions: [ { id: 'object', width: 'full', order: 1 }, { id: 'versions', width: 'full', order: 2 }, { id: 'interaction', width: 'full', order: 3 } ] }
    modules: [ { id: 'object-formula-card', region: 'object', kind: 'formula-card', must_be_visible: true }, { id: 'version-table', region: 'versions', kind: 'native-table', must_be_visible: true }, { id: 'prejudge-quiz', region: 'interaction', kind: 'quiz-group', must_be_visible: true } ]
    content_blocks:
      object_formula: { text: '$G(s)=\\dfrac{0.01715K}{s(s+0.1)(s+2.14375)},\\ k=0.01715K$' }
      version_table: { columns: [ '版本', 'K', 'k', '闭环极点特征', '第一判断' ], rows: [ [ 'A', '0.20', '0.00343', '实极点主导，响应偏慢', '还稳定，但明显偏慢' ], [ 'B', '0.6064', '0.0104', '已越过分离点，且远离虚轴边界', '较均衡，可作为参考工作点' ], [ 'C', '20.00', '0.3430', '靠近边界，共轭主导明显', '速度更快，但风险明显升高' ] ] }
      quiz_items: [ '谁最慢。', '谁最均衡。', '谁最冒险。' ]
    evidence_sequence: [ '对象与记号', '版本表', '三题初判' ]
    interaction_spec: { interaction_kind: 'quiz_group', student_task: '识别“稳定=可用”的入口误判。', questions: [ { id: 'slowest', prompt: '哪一版最慢。', response_kind: 'single_choice' }, { id: 'balanced', prompt: '哪一版最均衡。', response_kind: 'single_choice' }, { id: 'risky', prompt: '哪一版最冒险。', response_kind: 'single_choice' } ], answer_reveal: 'teacher_toggle' }
    teacher_controls: { release_activity: 'teacher_toggle', open_browse: 'page_load_open', teacher_step_reveal: 'not_applicable', reveal_reference_answer: 'teacher_toggle' }
    student_access: { default_visibility: 'visible', activity_visibility: 'hidden', release_required: true, browse_required: false, can_view_problem_statement: true, can_view_derivation_steps: false, can_submit_without_browse: true }
    teacher_insight_spec: { widgets: [ 'question_distribution', 'top_misconceptions' ] }
    telemetry_spec: { summary_fields: [ 'attemptCount', 'resultState', 'timeOnStep' ], misconception_tags: [ 'stable_means_usable', 'ignore_object_formula', 'no_version_context' ] }
    ai_context_spec: { page_goal: '让学生先看到同一对象下三种版本差异，再暴露“稳定=可用”的误判。' }
    preview_contract: { demo_path: '/interactive-learning/courses/unit-3-4-root-locus-reading-validation/student/demo?step=step-03' }
    acceptance_checks: [ '对象公式必须先于题卡出现。', '版本表不能被压成一句排序结论。' ]

  step-04:
    title: '固定读图顺序：先骨架，再关键节点，再窗口，再后果'
    layout: { template: 'workflow_sort_board', regions: [ { id: 'workflow', width: 'full', order: 1 }, { id: 'interaction', width: 'full', order: 2 }, { id: 'feedback', width: 'full', order: 3 } ] }
    modules: [ { id: 'workflow-cards', region: 'workflow', kind: 'card-stack', must_be_visible: true }, { id: 'sort-board', region: 'interaction', kind: 'sort-board', must_be_visible: true }, { id: 'feedback-strip', region: 'feedback', kind: 'summary-card', must_be_visible: true } ]
    content_blocks:
      workflow_cards: [ '看骨架', '找关键节点', '区分窗口', '翻译后果' ]
      error_warning: { text: '不能因为某个点看起来顺眼，就跳过前两步直接宣布哪个版本更好。' }
      summary_sentence: { text: '读图顺序先于好坏判断。' }
    evidence_sequence: [ '四步法卡片', '排序区', '误判提示' ]
    interaction_spec: { interaction_kind: 'sequence_sort', student_task: '把四步法排成稳定读图动作链。', answer_reveal: 'teacher_toggle' }
    teacher_controls: { release_activity: 'teacher_toggle', open_browse: 'page_load_open', teacher_step_reveal: 'not_applicable', reveal_reference_answer: 'teacher_toggle' }
    student_access: { default_visibility: 'visible', activity_visibility: 'hidden', release_required: true, browse_required: false, can_view_problem_statement: true, can_view_derivation_steps: false, can_submit_without_browse: true }
    teacher_insight_spec: { widgets: [ 'sort_success_rate' ] }
    telemetry_spec: { summary_fields: [ 'attemptCount', 'resultState' ], misconception_tags: [ 'judge_before_read', 'skip_keynodes' ] }
    ai_context_spec: { page_goal: '把主图读法固定成四步动作链。' }
    preview_contract: { demo_path: '/interactive-learning/courses/unit-3-4-root-locus-reading-validation/student/demo?step=step-04' }
    acceptance_checks: [ '四步法必须完整显示。', '作答区不得抢在四步法之前。' ]

  step-05:
    title: '关键节点证据板：分离点、虚轴交点与参考工作点 `B`'
    layout: { template: 'evidence_reading_board', regions: [ { id: 'figure', width: 'full', order: 1 }, { id: 'evidence', width: 'full', order: 2 }, { id: 'interaction', width: 'full', order: 3 } ] }
    modules: [ { id: 'root-locus-figure', region: 'figure', kind: 'media', must_be_visible: true }, { id: 'keynode-figure', region: 'figure', kind: 'media', must_be_visible: true }, { id: 'reference-b-figure', region: 'figure', kind: 'media', must_be_visible: true }, { id: 'evidence-cards', region: 'evidence', kind: 'card-stack', must_be_visible: true }, { id: 'hotspot-board', region: 'interaction', kind: 'hotspot-board', must_be_visible: true } ]
    content_blocks:
      media_requirements: { root_locus_asset: '3-4-root-locus-summary.png', keynode_asset: '3-4-root-locus-keynodes.png', reference_b_asset: '3-4-root-locus-reference-b.png' }
      evidence_cards: [ '分离点 s≈-0.0494 把实极点主导与共轭极点主导分开。', '虚轴交点对应 K≈28.05，给出稳定窗口上界。', 'B 既越过分离点，又远离虚轴边界，因此可作为均衡参考。' ]
      readout_note: { text: '当前页不是记三个名词，而是把三个节点各自回答的问题读出来。' }
    evidence_sequence: [ '主图与关键节点图', '三张证据卡', '热点定位区' ]
    interaction_spec: { interaction_kind: 'hotspot_labeling', student_task: '在图上点选分离点、虚轴边界和参考工作点 B。', answer_reveal: 'teacher_toggle' }
    teacher_controls: { release_activity: 'teacher_toggle', open_browse: 'page_load_open', teacher_step_reveal: 'not_applicable', reveal_reference_answer: 'teacher_toggle' }
    student_access: { default_visibility: 'visible', activity_visibility: 'hidden', release_required: true, browse_required: false, can_view_problem_statement: true, can_view_derivation_steps: false, can_submit_without_browse: true }
    teacher_insight_spec: { widgets: [ 'hotspot_accuracy', 'top_misconceptions' ] }
    telemetry_spec: { summary_fields: [ 'attemptCount', 'resultState', 'errorBucket' ], misconception_tags: [ 'separation_equals_boundary', 'cannot_locate_B', 'node_name_only' ] }
    ai_context_spec: { page_goal: '让学生把节点位置和节点作用一一对应。' }
    preview_contract: { demo_path: '/interactive-learning/courses/unit-3-4-root-locus-reading-validation/student/demo?step=step-05' }
    acceptance_checks: [ '主图必须先于热点交互出现。', '三张证据卡必须与三个节点一一对应。' ]

  step-06:
    title: '关键节点读图记录：把主图证据写成一句工程判断'
    layout: { template: 'record_workspace', regions: [ { id: 'record', width: 'full', order: 1 }, { id: 'interaction', width: 'full', order: 2 } ] }
    modules: [ { id: 'record-template', region: 'record', kind: 'native-table', must_be_visible: true }, { id: 'activity-card-a', region: 'interaction', kind: 'fill-text-card', must_be_visible: true }, { id: 'activity-card-b', region: 'interaction', kind: 'fill-text-card', must_be_visible: true } ]
    content_blocks:
      record_template: { columns: [ '对象版本', '关键位置', '边界关系', '主导特征', '工程后果' ], note: '位置与后果必须一起写。' }
      task_prompts: [ '写出 B 的完整工程判断。', '写出 C 的风险判断。' ]
      summary_sentence: { text: '读图记录的目标是写出完整工程判断，而不是收集碎片化形容词。' }
    evidence_sequence: [ '记录模板', '判断提示', '双卡作答' ]
    interaction_spec: { interaction_kind: 'activity_cards', student_task: '把主图证据写成完整工程判断。', activity_cards: [ { id: 'record-b', prompt: '请写出 B 的完整工程判断。', response_kind: 'fill_text', submit_scope: 'per_card', layout_span: 'half' }, { id: 'record-c', prompt: '请写出 C 的风险判断。', response_kind: 'fill_text', submit_scope: 'per_card', layout_span: 'half' } ], answer_reveal: 'teacher_toggle' }
    teacher_controls: { release_activity: 'teacher_toggle', open_browse: 'page_load_open', teacher_step_reveal: 'not_applicable', reveal_reference_answer: 'teacher_toggle' }
    student_access: { default_visibility: 'visible', activity_visibility: 'hidden', release_required: true, browse_required: false, can_view_problem_statement: true, can_view_derivation_steps: false, can_submit_without_browse: true }
    teacher_insight_spec: { widgets: [ 'error_bucket_distribution', 'card_completion_rate' ] }
    telemetry_spec: { summary_fields: [ 'cardSubmitted', 'errorBucket', 'timeOnStep' ], misconception_tags: [ 'position_without_consequence', 'adjective_only' ] }
    ai_context_spec: { page_goal: '把节点证据翻译成完整工程判断句。' }
    preview_contract: { demo_path: '/interactive-learning/courses/unit-3-4-root-locus-reading-validation/student/demo?step=step-06' }
    acceptance_checks: [ '模板必须先于作答卡出现。', '不得只保留“更靠左”“更危险”一类碎句。' ]

  step-07:
    title: '稳定窗口与可接受窗口：`A/B/C` 各自处在哪一侧'
    layout: { template: 'comparison_judgement_board', regions: [ { id: 'definition', width: 'full', order: 1 }, { id: 'table', width: 'full', order: 2 }, { id: 'interaction', width: 'full', order: 3 } ] }
    modules: [ { id: 'definition-cards', region: 'definition', kind: 'comparison-cards', must_be_visible: true }, { id: 'stable-window-card', region: 'definition', kind: 'formula-card', must_be_visible: true }, { id: 'window-table', region: 'table', kind: 'native-table', must_be_visible: true }, { id: 'activity-card-a', region: 'interaction', kind: 'single-choice-card', must_be_visible: true }, { id: 'activity-card-b', region: 'interaction', kind: 'fill-text-card', must_be_visible: true } ]
    content_blocks:
      window_definitions: [ '稳定窗口回答还能不能维持闭环稳定。', '可接受窗口回答这个参数是否值得工程上采用。' ]
      stable_window_formula: { text: '$0<K<28.05$' }
      judgement_table: { columns: [ '版本', '窗口位置', '主要收益', '主要代价', '第一判断' ], rows: [ [ 'A', '稳定窗口内，但远离可接受中心', '风险小', '过慢', '还稳定，但不宜直接采用' ], [ 'B', '稳定窗口内，且接近可接受中心', '较均衡', '仍有代价', '可作为参考工作点' ], [ 'C', '稳定窗口内，但靠近边界', '速度更快', '振荡与频域风险上升', '属于取舍型参数' ] ] }
      boundary_sentence: { text: '还稳定只是一条底线，不等于已经可接受。' }
    evidence_sequence: [ '双窗口定义', '稳定窗口数值边界', '参数窗口判断表', '双卡作答' ]
    interaction_spec: { interaction_kind: 'activity_cards', student_task: '区分底线判断与工程判断。', activity_cards: [ { id: 'window-side', prompt: '请判断 A/B/C 各自属于哪一层窗口。', response_kind: 'single_choice', submit_scope: 'per_card', layout_span: 'half' }, { id: 'cost-line', prompt: '请补写一句代价说明。', response_kind: 'fill_text', submit_scope: 'per_card', layout_span: 'half' } ], answer_reveal: 'teacher_toggle' }
    teacher_controls: { release_activity: 'teacher_toggle', open_browse: 'page_load_open', teacher_step_reveal: 'not_applicable', reveal_reference_answer: 'teacher_toggle' }
    student_access: { default_visibility: 'visible', activity_visibility: 'hidden', release_required: true, browse_required: false, can_view_problem_statement: true, can_view_derivation_steps: false, can_submit_without_browse: true }
    teacher_insight_spec: { widgets: [ 'question_distribution', 'top_misconceptions' ] }
    telemetry_spec: { summary_fields: [ 'cardSubmitted', 'resultState', 'errorBucket' ], misconception_tags: [ 'stable_equals_acceptable', 'no_cost_language' ] }
    ai_context_spec: { page_goal: '让学生把窗口判断分成“能不能稳定”和“值不值得采用”两层。' }
    preview_contract: { demo_path: '/interactive-learning/courses/unit-3-4-root-locus-reading-validation/student/demo?step=step-07' }
    acceptance_checks: [ '定义区必须先于判断表出现。', '必须保留代价语言。' ]

  step-08:
    title: '增益换算链：从图上的 `k` 落回工程参数 `K`'
    layout: { template: 'worked_example_reveal', regions: [ { id: 'principle', width: 'full', order: 1 }, { id: 'problem', width: 'full', order: 2 }, { id: 'activity', width: 'full', order: 3 }, { id: 'reference', width: 'full', order: 4 } ] }
    modules: [ { id: 'principle-card', region: 'principle', kind: 'formula-card', must_be_visible: true }, { id: 'problem-card', region: 'problem', kind: 'problem-card', must_be_visible: true }, { id: 'step-reveal-board', region: 'activity', kind: 'step-reveal', must_be_visible: true }, { id: 'activity-card-a', region: 'activity', kind: 'fill-text-card', must_be_visible: true }, { id: 'activity-card-b', region: 'activity', kind: 'fill-text-card', must_be_visible: true }, { id: 'reference-answer', region: 'reference', kind: 'reference-answer', must_be_visible: true } ]
    content_blocks:
      formula_block: { relation: '$k=0.01715K$', inverse_relation: '$K=\\dfrac{k}{0.01715}$' }
      problem_statement: { text: '若图上读得参考工作点 B 对应 k=0.0104，实际控制器增益 K 应写成多少。' }
      reveal_steps: [ '先写关系式。', '再代入 k=0.0104。', '最后得到 K≈0.6064，并说明变量含义。' ]
    evidence_sequence: [ '原理卡与题面卡', '换算显影链', '双卡作答与参考答案' ]
    interaction_spec: { interaction_kind: 'worked_example_workspace', student_task: '完成一次完整换算，而不是只抄结果。', step_reveal_policy: { initial_state: 'collapsed', visible_without_browse: [ '题面', '换算关系', '本页任务提示' ], student_progression: 'requires_open_browse', teacher_progression: 'teacher_step_reveal_independent' }, activity_cards: [ { id: 'conversion-chain', prompt: '补全 B 的换算链。', response_kind: 'fill_text', submit_scope: 'per_card', layout_span: 'half' }, { id: 'meaning', prompt: '解释为什么图上的 k 不等于控制器中的 K。', response_kind: 'fill_text', submit_scope: 'per_card', layout_span: 'half' } ], answer_reveal: 'teacher_toggle' }
    teacher_controls: { release_activity: 'teacher_toggle', open_browse: 'teacher_toggle', teacher_step_reveal: 'teacher_toggle', reveal_reference_answer: 'teacher_toggle' }
    student_access: { default_visibility: 'visible', activity_visibility: 'hidden', release_required: true, browse_required: true, can_view_problem_statement: true, can_view_derivation_steps: false, can_submit_without_browse: false }
    teacher_insight_spec: { widgets: [ 'step_reveal_progress', 'card_completion_rate' ] }
    telemetry_spec: { summary_fields: [ 'stepRevealCount', 'cardSubmitted', 'timeOnStep' ], misconception_tags: [ 'copy_result_only', 'k_equals_K' ] }
    ai_context_spec: { page_goal: '让学生把图上的增益读数换回工程参数。' }
    preview_contract: { demo_path: '/interactive-learning/courses/unit-3-4-root-locus-reading-validation/student/demo?step=step-08' }
    acceptance_checks: [ '题面必须固定可见。', '显影链至少包含三层。' ]

  step-09:
    title: '为什么必须三域互证：主图、时域、频域先并排对齐'
