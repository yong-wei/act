      formula_chain: [ '$s^3+(2.24375+3.43a)s^2+(0.214375+0.343a)s+0.0104=0$', '$B(s)+aA(s)=0$', '$1+aA(s)/B(s)=0$', '$G_e(s)=A(s)/B(s)$' ]
