      - id: "principle"
        type: "formula_group"
        title: "换算关系"
        items:
          - "k=0.01715K"
          - "K=\\frac{k}{0.01715}"
      - id: "problem"
        type: "plain_text"
        title: "参考工作点 B"
        body: "若图上读得参考工作点 B 对应 k=0.0104，实际控制器增益 K 应写成多少。"
