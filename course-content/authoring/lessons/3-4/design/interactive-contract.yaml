evidence_unit_upgrade_table:
  - evidence_unit_id: "3-4-eu-01"
    handout_anchor: "## 一、问题提出：稳定之后，还要回答什么"
    evidence_kind: "路径定位+课程边界"
    target_steps: ["step-01"]
    upgrade_mode: "地图页静态保留"
    keep_elements: ["3-3 -> 3-4 -> 3-5 路径", "读图与验证高亮", "主问题", "边界句"]
    non_reducible: ["不重讲 3-3 法则证明", "不进入零点、PD 与模块 4 设计任务"]
    acceptance_checks: ["首屏必须同屏看到路径图、主问题和边界卡。"]
  - evidence_unit_id: "3-4-eu-02"
    handout_anchor: "## 一、问题提出：稳定之后，还要回答什么"
    evidence_kind: "核心问题+课堂产出"
    target_steps: ["step-02"]
    upgrade_mode: "问题链页 + 产出表"
    keep_elements: ["核心问题", "三张记录表", "判断链"]
    non_reducible: ["稳定只是下限，不是结论", "三张记录表不得压成口号"]
    acceptance_checks: ["学生离开讲稿后仍知道本课最终要交什么。"]
  - evidence_unit_id: "3-4-eu-03"
    handout_anchor: "### 2.1 固定对象与三个版本"
    evidence_kind: "对象公式+版本表+前测"
    target_steps: ["step-03"]
    upgrade_mode: "对象卡 + 版本表 + 初判题"
    keep_elements: ["对象公式", "k=0.01715K", "A/B/C 三版本", "第一判断"]
    non_reducible: ["对象、记号与版本差异必须同时出现"]
    acceptance_checks: ["对象卡、版本表与三题初判必须同页。"]
  - evidence_unit_id: "3-4-eu-04"
    handout_anchor: "### 2.2 拿到主图后的固定读图顺序"
    evidence_kind: "读图流程"
    target_steps: ["step-04"]
    upgrade_mode: "流程卡 + 排序区"
    keep_elements: ["四步法", "误判提示"]
    non_reducible: ["先节点后窗口", "先窗口后后果"]
    acceptance_checks: ["学生能够把读图顺序排成稳定动作链。"]
  - evidence_unit_id: "3-4-eu-05"
    handout_anchor: "### 2.3 分离点：从实极点主导走向共轭极点主导 / ### 2.4 虚轴交点：稳定窗口的上界 / ### 2.5 参考工作点 B 的位置为什么重要"
    evidence_kind: "主图关键节点"
    target_steps: ["step-05"]
    upgrade_mode: "证据板 + 热点定位"
    keep_elements: ["主图", "关键节点图", "B 位置图", "三条证据卡"]
    non_reducible: ["节点名称", "节点作用", "B 的主图依据"]
    acceptance_checks: ["学生能准确指出节点，并说清每个节点回答的问题。"]
  - evidence_unit_id: "3-4-eu-06"
    handout_anchor: "### 2.6 关键节点读图记录"
    evidence_kind: "记录模板+判断句"
    target_steps: ["step-06"]
    upgrade_mode: "模板表 + 双卡作答"
    keep_elements: ["五字段记录模板", "B/C 判断句任务"]
    non_reducible: ["位置与后果必须同时出现", "不得只剩碎句"]
    acceptance_checks: ["至少能写出一句完整工程判断。"]
  - evidence_unit_id: "3-4-eu-07"
    handout_anchor: "### 3.2 稳定窗口不等于可接受窗口 / ### 3.3 参数窗口判断表"
    evidence_kind: "窗口语言+参数角色"
    target_steps: ["step-07"]
    upgrade_mode: "双定义页 + 判断表 + 双卡作答"
    keep_elements: ["0<K<28.05", "双窗口定义", "A/B/C 参数角色与后果"]
    non_reducible: ["还稳定不等于可接受", "必须保留代价语言"]
    acceptance_checks: ["学生能区分底线判断与工程判断。"]
  - evidence_unit_id: "3-4-eu-08"
    handout_anchor: "### 3.1 先把图上的增益和工程里的增益分开"
    evidence_kind: "换算链"
    target_steps: ["step-08"]
    upgrade_mode: "完整例题页 + 逐步显影"
    keep_elements: ["k=0.01715K", "K=k/0.01715", "B 版本示例"]
    non_reducible: ["题面", "关系式", "代入链", "变量解释"]
    acceptance_checks: ["学生默认先见题面与公式，步骤后显影。"]
  - evidence_unit_id: "3-4-eu-09"
    handout_anchor: "### 4.1 为什么要做三域验证 / ### 4.2 总三域对照表"
    evidence_kind: "三域角色+总表"
    target_steps: ["step-09"]
    upgrade_mode: "角色卡 + 总表 + 配对区"
    keep_elements: ["三域角色", "A/B/C 总三域对照表"]
    non_reducible: ["先说明三域各回答什么", "不得压成再看两张图"]
    acceptance_checks: ["学生能先理解三域为何互证，再进入具体验证。"]
  - evidence_unit_id: "3-4-eu-10"
    handout_anchor: "### 4.3 时域验证：版本 B 为什么能够作为参考工作点"
    evidence_kind: "时域验证图+说明"
    target_steps: ["step-10"]
    upgrade_mode: "图后解释页 + 双卡作答"
    keep_elements: ["3-4-step-compare.png", "主导极点近似说明", "局限提示"]
    non_reducible: ["近似可信与仍有局限必须并存"]
    acceptance_checks: ["图、说明卡和作答卡必须同页。"]
  - evidence_unit_id: "3-4-eu-11"
    handout_anchor: "### 4.4 频域验证：低中频为什么近似成立，高频为何仍不能忽略"
    evidence_kind: "频率点表+频域解释"
    target_steps: ["step-11"]
    upgrade_mode: "频率点表 + Bode 对照 + 双卡作答"
    keep_elements: ["四个代表频率点", "低中频近似", "高频差异"]
    non_reducible: ["不得只给结论句", "高频差异仍需单列记录"]
    acceptance_checks: ["学生能写出哪里成立、哪里失效的完整句。"]
  - evidence_unit_id: "3-4-eu-12"
    handout_anchor: "### 4.5 频域代价：版本 C 为什么不能只看跟踪收益 / ### 4.6 斜坡响应与航迹对照：连续跟踪中的收益与代价 / ### 4.7 对象化验证记录"
    evidence_kind: "收益代价对照"
    target_steps: ["step-12"]
    upgrade_mode: "双证据对照页 + 双卡作答"
    keep_elements: ["C 的高带宽/低裕量/高共振峰", "B/C 航迹与斜坡对照", "收益-代价句模板", "对象化验证记录口径"]
    non_reducible: ["不得只写更快或更危险其中之一"]
    acceptance_checks: ["学生能写出完整收益-代价句，并把它归回取舍型参数。"]
  - evidence_unit_id: "3-4-eu-13"
    handout_anchor: "### 5.1 为什么这里还要补上广义根轨迹"
    evidence_kind: "新问题入口"
    target_steps: ["step-13"]
    upgrade_mode: "结构图 + 误判判断"
    keep_elements: ["非增益参数问题", "局部反馈结构图", "误判提示"]
    non_reducible: ["不得把 a 当成再调一次 K"]
    acceptance_checks: ["学生知道对象变了，问题也变了。"]
  - evidence_unit_id: "3-4-eu-14"
    handout_anchor: "### 5.2 给定局部反馈结构如何改写特征方程"
    evidence_kind: "改写链"
    target_steps: ["step-14"]
    upgrade_mode: "完整例题页 + 逐步显影"
    keep_elements: ["G_1(s)", "G_{1,eq}(s)", "新特征方程", "B(s)+aA(s)=0", "1+aA(s)/B(s)=0", "G_e(s)=A(s)/B(s)", "180° 根轨迹解释"]
    non_reducible: ["题面与改写链必须完整出现", "不能只给最后等效开环"]
    acceptance_checks: ["学生能说清法则不变，只是对象先被改写。"]
  - evidence_unit_id: "3-4-eu-15"
    handout_anchor: "### 5.3 非增益参数 $a$ 改写主导极点的方式 / ### 5.4 非增益参数窗口记录"
    evidence_kind: "广义参数窗口"
    target_steps: ["step-15"]
    upgrade_mode: "广义根轨迹图 + 参数窗口表 + 双卡作答"
    keep_elements: ["a=0/0.2/0.5/1.0 极点表", "三段窗口建议", "a 的权衡句"]
    non_reducible: ["不得写成 a 越大越好", "不得把窗口压成单点结论"]
    acceptance_checks: ["学生能写出比较基线、实践窗口与边界提醒。"]
  - evidence_unit_id: "3-4-eu-16"
    handout_anchor: "## 六、课末收束：沿既有结构分析的能力与边界 / ## 七、小结"
    evidence_kind: "后测+收束"
    target_steps: ["step-16", "step-17"]
    upgrade_mode: "后测页 + 出口页"
    keep_elements: ["三题后测", "五条带走", "边界句", "3-5 去向"]
    non_reducible: ["后测不得与总结混页", "出口页不得重新引入新任务"]
    acceptance_checks: ["学生离开本课时能明确留下了什么能力、为什么下一课要改结构。"]
steps:
  step-01:
    title: "回到地图：从 3-3 法则走向 3-4 判断"
    layout:
      template: "map_hero_slide"
      regions:
        - { id: "header", width: "full", order: 1 }
        - { id: "lead", width: "full", order: 2 }
        - { id: "summary", width: "full", order: 3 }
    modules:
      - { id: "stage-map", region: "lead", kind: "stage-map", must_be_visible: true }
      - { id: "core-question-card", region: "lead", kind: "question-card", must_be_visible: true }
      - { id: "boundary-card", region: "summary", kind: "boundary-card", must_be_visible: true }
    content_blocks:
      - id: "path"
        type: "plain_text"
        title: "路径定位"
        body: "固定高亮 3-3 -> 3-4 -> 3-5。"
      - id: "question"
        type: "plain_text"
        title: "主问题"
        body: "沿既有根轨迹继续调增益时，哪些工作点只是还稳定，哪些工作点才值得选用。"
      - id: "boundary"
        type: "bullet_list"
        title: "本课边界"
        items:
          - "不重讲 3-3 的法则证明。"
          - "不进入零点、PD 与模块 4 设计任务。"
    evidence_sequence:
      - "先呈现路径图。"
      - "再呈现主问题卡。"
      - "最后呈现边界卡。"
    interaction_spec:
      interaction_kind: "none"
      student_task: "只阅读，不提交。"
      answer_reveal: "none"
    teacher_controls:
      release_activity: "not_applicable"
      open_browse: "not_applicable"
      teacher_step_reveal: "not_applicable"
      reveal_reference_answer: "not_applicable"
    student_access:
      default_visibility: "visible"
      release_required: false
      browse_required: false
      can_view_problem_statement: true
      can_view_derivation_steps: true
      can_submit_without_browse: "not_applicable"
    telemetry_spec:
      summary_fields: ["viewed", "timeOnStep", "teacherFollowSync"]
      result_policy: "no_submission"
    teacher_insight_spec:
      widgets: ["view_count", "sync_status"]
      aggregation: "step_level"
    ai_context_spec:
      page_goal: "标定 3-4 是 3-3 之后的读图与验证课。"
      allowed_scope: ["课程路径", "主问题", "本课边界"]
      forbidden_scope: ["A/B/C 的最终排序", "广义根轨迹细节"]
      canonical_facts:
        - "3-3 负责法则。"
        - "3-4 负责按图判断。"
        - "3-5 将进入结构改变。"
    preview_contract:
      route_kind: "student_demo"
      demo_path: "/interactive-learning/courses/unit-3-4-root-locus-reading-validation/student/demo?step=step-01"
      must_match_student_page: true
    acceptance_checks:
      - "首屏必须同时出现路径图、主问题卡和边界卡。"
      - "本页无作答区。"

  step-02:
    title: "问题提出与三张记录表：稳定之后还要回答什么"
    layout:
      template: "goal_chain_slide"
      regions:
        - { id: "question", width: "full", order: 1 }
        - { id: "outputs", width: "full", order: 2 }
        - { id: "summary", width: "full", order: 3 }
    modules:
      - { id: "core-question-card", region: "question", kind: "question-card", must_be_visible: true }
      - { id: "deliverable-table", region: "outputs", kind: "deliverable-table", must_be_visible: true }
      - { id: "chain-summary-card", region: "summary", kind: "summary-card", must_be_visible: true }
    content_blocks:
      - id: "question"
        type: "plain_text"
        title: "核心问题"
        body: "同样位于稳定窗口内的参数，也可能对应完全不同的速度、振荡、风险与工程后果。"
      - id: "outputs"
        type: "table"
        title: "三张记录表"
        body: "关键节点读图记录、参数窗口判断表、对象化验证记录。"
      - id: "chain"
        type: "formula"
        title: "判断链"
        value: "\\text{关键节点读图} \\rightarrow \\text{参数窗口判断} \\rightarrow \\text{对象化三域验证} \\rightarrow \\text{广义参数验证}"
    evidence_sequence:
      - "先呈现核心问题卡。"
      - "再呈现三张记录表。"
      - "最后呈现判断链摘要。"
    interaction_spec:
      interaction_kind: "none"
      student_task: "建立本课产出边界。"
      answer_reveal: "none"
    teacher_controls:
      release_activity: "not_applicable"
      open_browse: "not_applicable"
      teacher_step_reveal: "not_applicable"
      reveal_reference_answer: "not_applicable"
    student_access:
      default_visibility: "visible"
      release_required: false
      browse_required: false
      can_view_problem_statement: true
      can_view_derivation_steps: true
      can_submit_without_browse: "not_applicable"
    telemetry_spec:
      summary_fields: ["viewed", "timeOnStep"]
      result_policy: "no_submission"
    teacher_insight_spec:
      widgets: ["view_count"]
      aggregation: "step_level"
    ai_context_spec:
      page_goal: "压实本课要交什么、为什么不能停在还稳定。"
      allowed_scope: ["三张记录表", "判断链"]
      forbidden_scope: ["把三张记录表压成口号"]
      canonical_facts:
        - "本课围绕三份记录组织。"
    preview_contract:
      route_kind: "student_demo"
      demo_path: "/interactive-learning/courses/unit-3-4-root-locus-reading-validation/student/demo?step=step-02"
      must_match_student_page: true
    acceptance_checks:
      - "核心问题卡、三张记录表和判断链摘要必须同屏。"
      - "本页无作答区。"

  step-03:
    title: "固定对象与三个版本：先暴露“稳定=可用”的第一误判"
    layout:
      template: "version_overview_quiz"
      regions:
        - { id: "object", width: "full", order: 1 }
        - { id: "versions", width: "full", order: 2 }
        - { id: "interaction", width: "full", order: 3 }
    modules:
      - { id: "object-formula-card", region: "object", kind: "formula-card", must_be_visible: true }
      - { id: "version-table", region: "versions", kind: "comparison-table", must_be_visible: true }
      - { id: "prejudge-quiz", region: "interaction", kind: "quiz-group", must_be_visible: true }
    content_blocks:
      - id: "object"
        type: "formula_group"
        title: "对象与记号"
        items:
          - "G(s)=\\frac{0.01715K}{s(s+0.1)(s+2.14375)}"
          - "k=0.01715K"
      - id: "version-table"
        type: "table"
        title: "A/B/C 三版本"
        body: "必须完整列出 K、k、闭环极点特征与第一判断。"
      - id: "quiz-note"
        type: "plain_text"
        title: "初判范围"
        body: "只暴露谁最慢、谁最均衡、谁最冒险，不提前公布标准排序。"
    evidence_sequence:
      - "先呈现对象与记号。"
      - "再呈现 A/B/C 版本表。"
      - "最后呈现三题初判。"
    interaction_spec:
      interaction_kind: "quiz_group"
      student_task: "完成三题初判，不把稳定直接等同于更优。"
      questions:
        - id: "q1"
          prompt: "哪一版最慢。"
          response_kind: "single_choice"
        - id: "q2"
          prompt: "哪一版最均衡。"
          response_kind: "single_choice"
        - id: "q3"
          prompt: "哪一版最冒险。"
          response_kind: "single_choice"
      attempt_model: "allow_one_retry"
      answer_reveal: "teacher_toggle"
    teacher_controls:
      release_activity: "separate_toggle"
      open_browse: "not_applicable"
      teacher_step_reveal: "not_applicable"
      reveal_reference_answer: "separate_toggle"
    student_access:
      default_visibility: "hidden"
      release_required: true
      browse_required: false
      can_view_problem_statement: true
      can_view_derivation_steps: "not_applicable"
      can_submit_without_browse: true
    telemetry_spec:
      summary_fields: ["attemptCount", "selectedOption", "errorBucket"]
      misconception_tags: ["stable_equals_usable", "ignored_parameter_role", "no_common_coordinate_system"]
    teacher_insight_spec:
      widgets: ["option_distribution", "top_misconceptions"]
      aggregation: "step_level"
    ai_context_spec:
      page_goal: "先暴露对 A/B/C 的第一印象。"
      allowed_scope: ["版本气质", "常见误判"]
      forbidden_scope: ["直接给出标准排序"]
      canonical_facts:
        - "A/B/C 必须在同一对象、同一口径下比较。"
    preview_contract:
      route_kind: "student_demo"
      demo_path: "/interactive-learning/courses/unit-3-4-root-locus-reading-validation/student/demo?step=step-03"
      must_match_student_page: true
