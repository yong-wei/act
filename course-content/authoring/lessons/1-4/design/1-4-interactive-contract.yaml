contract_version: '2.0'
lesson_id: '1-4'
course_title: '1-4：时域与频域——同一个系统的两种观察视角'
course_route_segment: 'unit-1-4-time-frequency-views'
preview_mode:
  default_entry: student_demo
  student_demo_base_path: '/interactive-learning/courses/unit-1-4-time-frequency-views/student/demo'
telemetry_strategy: lightweight_high_value
teacher_insight_strategy: step_level_aggregation_only
required_step_fields: [layout, modules, content_blocks, interaction_spec, teacher_controls, telemetry_spec, teacher_insight_spec, ai_context_spec, preview_contract, acceptance_checks]
layout: {source: 'steps[].layout'}
modules: {source: 'steps[].modules'}
content_blocks: {source: 'steps[].content_blocks'}
evidence_sequence: {source: 'steps[].evidence_sequence'}
interaction_spec: {source: 'steps[].interaction_spec'}
teacher_controls: {source: 'steps[].teacher_controls'}
preview_contract: {source: 'steps[].preview_contract'}
steps:
  step-01:
    title: 船舶航向中的过程与节律
    layout:
      template: cover_top_dual_column
      regions: [{id: lead, width: half, order: 1}, {id: media, width: half, order: 2}, {id: closing, width: full, order: 3}]
    modules:
      - {id: page-intro, region: lead, kind: content.rich, must_be_visible: true, payload: {block_key: page-intro, title: 船舶航向中的过程与节律}}
      - {id: cover-comic, region: media, kind: content.figure, must_be_visible: true, payload: {block_key: cover-comic, title: 船舶航向控制场景}}
      - {id: observation-questions, region: closing, kind: content.cardSet, must_be_visible: true, payload: {block_key: observation-questions, title: 两类观察问题}}
      - {id: bridge-question, region: closing, kind: content.rich, must_be_visible: true, payload: {block_key: bridge-question, title: 核心追问}}
    content_blocks:
      - {id: page-intro, type: plain_text, body: '自动舵既要完成一次转向指令，也要面对持续的周期海浪。同一套系统因此出现两种不同的观察任务。'}
      - {id: cover-comic, type: media, asset: '1-4-cover-comic.png', caption: '驾驶员关注转向后的全过程，工程师同时关注不同海浪节律传到航向输出的程度。'}
      - {id: observation-questions, type: bullet_list, items: ['指令刚发出后，航向是否超调、多久稳定？', '海浪持续作用时，哪些节律容易传到输出、哪些节律被削弱？']}
      - {id: bridge-question, type: plain_text, body: '同一个系统，为什么既要沿时间轴看过程，又要沿频率轴看节律？'}
    evidence_sequence: [page-intro, cover-comic, observation-questions, bridge-question]
    interaction_spec: {interaction_kind: none, student_task: 阅读场景并区分过程问题与节律问题。}
    teacher_controls: {release_activity: not_applicable, open_browse: page_load_open, teacher_step_reveal: not_applicable, reveal_reference_answer: not_applicable}
    student_access: {default_visibility: visible, release_required: false, browse_required: false, can_view_problem_statement: true, can_view_derivation_steps: not_applicable, can_submit_without_browse: not_applicable}
    telemetry_spec: {summary_fields: [viewed, timeOnStep], result_policy: no_submission}
    teacher_insight_spec: {widgets: [view_count]}
    ai_context_spec: {delivery_mode: guided, page_goal: 区分一次变化的全过程与持续节律问题。, allowed_scope: [解释时域与频域问题的差别, 追问观察对象], forbidden_scope: [代替学生作答, 生成提交内容]}
    acceptance_checks: [导入漫画与两类问题常显, 本页无提交模块, T_r与T_d与L对象语义不提前混用]
    preview_contract: {route_kind: student_demo, demo_path: '/interactive-learning/courses/unit-1-4-time-frequency-views/student/demo?step=step-01'}

  step-02:
    title: 课程目标
    layout: {template: goal_focus_slide, regions: [{id: goals, width: full, order: 1}]}
    modules:
      - {id: page-intro, region: goals, kind: content.rich, must_be_visible: true, payload: {block_key: page-intro, title: 课程目标}}
      - {id: lesson-goals, region: goals, kind: content.cardSet, must_be_visible: true, payload: {block_key: lesson-goals, title: 完成本次课程后能够}}
    content_blocks:
      - {id: page-intro, type: plain_text, body: '本页列出读图、通道区分和多域联读的五项学习目标。'}
      - id: lesson-goals
        type: bullet_list
        items: ['区分复平面、时域和频域分别呈现的系统信息。', '标明频率响应的输入输出通道，区分闭环指令、扰动和环路对象。', '读取 Bode 图的低频、高频趋势与闭环 -3 dB 带宽。', '解释 Bode 与 Nyquist 的同源关系，完成单个频点的幅值—相位—复平面互译。', '联读闭环极点、阶跃响应、Bode 与 Nyquist 图，形成有对象标签的定性判断。']
    evidence_sequence: [page-intro, lesson-goals]
    interaction_spec: {interaction_kind: none, student_task: 阅读五项课程目标。}
    teacher_controls: {release_activity: not_applicable, open_browse: page_load_open, teacher_step_reveal: not_applicable, reveal_reference_answer: not_applicable}
    student_access: {default_visibility: visible, release_required: false, browse_required: false, can_view_problem_statement: true, can_view_derivation_steps: not_applicable, can_submit_without_browse: not_applicable}
    telemetry_spec: {summary_fields: [viewed, timeOnStep], result_policy: no_submission}
    teacher_insight_spec: {widgets: [view_count]}
    ai_context_spec: {delivery_mode: guided, page_goal: 解释本次课程五项能力目标。, allowed_scope: [解释目标中的学科动词和对象], forbidden_scope: [代替学生作答, 生成提交内容, 增加课程外目标]}
    acceptance_checks: [五项目标均使用能力动词, 目标只覆盖本次课程, 本页无提交模块]
    preview_contract: {route_kind: student_demo, demo_path: '/interactive-learning/courses/unit-1-4-time-frequency-views/student/demo?step=step-02'}

  step-03:
    title: 复平面、正弦信号与反馈结构前测
    layout: {template: quiz_group_with_intro, regions: [{id: intro, width: full, order: 1}, {id: activity, width: full, order: 2}]}
    modules:
      - {id: page-intro, region: intro, kind: content.rich, must_be_visible: true, payload: {block_key: page-intro, title: 复平面、正弦信号与反馈结构前测}}
      - {id: precheck, region: activity, kind: activity.panel, must_be_visible: true, payload: {title: 三项前置能力检查, responseContractId: choice.single}}
    content_blocks:
      - {id: page-intro, type: plain_text, body: '三道客观题只检查极点位置、正弦频率和单位负反馈结构，不考查本次课程的新概念。'}
    evidence_sequence: [page-intro, precheck]
    interaction_spec:
      interaction_kind: quiz_group
      student_task: 三题分别提交，检查进入频域学习所需的基础能力。
      activity_cards:
        - {id: pole-trend, title: 左半平面极点对应的响应趋势, prompt: '极点 -2±j2 位于左半平面，对应自然响应的总体趋势是？', response_kind: choice.single, options: [收敛, 等幅振荡, 发散, 仅凭极点无法判断], reference_answer: 收敛, submit_scope: per_card, layout_span: one_third}
        - {id: sine-frequency, title: 周期与频率的关系, prompt: 正弦信号周期缩短为原来的一半，频率变为原来的多少倍？, response_kind: choice.single, options: [一半, 不变, 两倍, 四倍], reference_answer: 两倍, submit_scope: per_card, layout_span: one_third}
        - {id: feedback-denominator, title: 单位负反馈闭环分母, prompt: 单位负反馈闭环传递函数的分母来自 1+L(s)。, response_kind: choice.binary, options: [正确, 错误], reference_answer: 正确, submit_scope: per_card, layout_span: one_third}
      reveal_answer: after_all_submitted_or_teacher_reveal
    teacher_controls: {release_activity: teacher_toggle, open_browse: not_applicable, teacher_step_reveal: not_applicable, reveal_reference_answer: teacher_toggle}
    student_access: {default_visibility: hidden, release_required: true, browse_required: false, can_view_problem_statement: true, can_view_derivation_steps: not_applicable, can_submit_without_browse: true}
    telemetry_spec: {summary_fields: [viewed, submittedCards, objectiveAccuracy], result_policy: per_card_submission}
    teacher_insight_spec: {widgets: [submission_rate, response_summary]}
    ai_context_spec: {delivery_mode: guided, page_goal: 检查进入本次课程所需的三项前置能力。, allowed_scope: [提交后的概念提示, 解释错误选项], forbidden_scope: [提交前给出答案, 代替学生作答, 引入Bode或Nyquist新知识]}
    acceptance_checks: [三题均为客观题, 不考查本次课程新知识, 每题独立提交且答案揭示分离]
    preview_contract: {route_kind: student_demo, demo_path: '/interactive-learning/courses/unit-1-4-time-frequency-views/student/demo?step=step-03'}

  step-04:
    title: 观察域与输入输出通道
    layout: {template: table_formula_dual_activity, regions: [{id: intro, width: full, order: 1}, {id: evidence, width: full, order: 2}, {id: activity, width: full, order: 3}, {id: closing, width: full, order: 4}]}
    modules:
      - {id: page-intro, region: intro, kind: content.rich, must_be_visible: true, payload: {block_key: page-intro, title: 观察域与输入输出通道}}
      - {id: domain-table, region: evidence, kind: content.table, must_be_visible: true, payload: {block_key: domain-table, title: 三种表征的观察对象}}
      - {id: channel-formulas, region: evidence, kind: content.formula, must_be_visible: true, payload: {block_key: channel-formulas, title: 三类输入输出通道}}
      - {id: channel-classification, region: activity, kind: activity.panel, must_be_visible: true, payload: {title: 表征与通道分类, responseContractId: matching.pairs}}
      - {id: conclusion, region: closing, kind: content.rich, must_be_visible: true, payload: {block_key: conclusion, title: 判断顺序}}
    content_blocks:
      - {id: page-intro, type: plain_text, body: '先区分复平面、时域和频域的观察对象，再为工程问题标明输入与输出。'}
      - id: domain-table
        type: table
        columns: [表征, 横向对象, 典型问题, 主要证据]
        rows: [[复平面, 极点位置, 模态收敛发散或振荡倾向, 实部与虚部], [时域, '时间 t', 一次输入后过程怎样展开, 超调调节时间与波形], [频域, '频率 ω', 不同节律如何传到输出, 幅值比与相位差]]
      - {id: channel-formulas, type: formula, formula: 'T_r(s)=Y(s)/R(s),\quad T_d(s)=Y(s)/D(s),\quad L(s)=C(s)G(s)H(s)', body: '指令跟随、扰动抑制和环路分析对应不同传递对象。'}
      - {id: conclusion, type: plain_text, body: '频域读图必须先标明输入和输出；未标通道的“系统 Bode 图”不足以支持工程判断。'}
    evidence_sequence: [page-intro, domain-table, channel-formulas, channel-classification, conclusion]
    interaction_spec:
      interaction_kind: activity_cards
      student_task: 分别完成表征归类和扰动通道选择。
      activity_cards:
        - {id: domain-match, title: 证据归入对应表征, prompt: 将阶跃超调、周期扰动幅值、闭环极点向左移动分别归入时域、频域、复平面。, response_kind: matching.pairs, pairs: [{left: 阶跃超调, right: 时域}, {left: 周期扰动幅值, right: 频域}, {left: 闭环极点向左移动, right: 复平面}], reference_answer: 时域—阶跃超调；频域—周期扰动幅值；复平面—闭环极点向左移动, submit_scope: per_card, layout_span: half}
        - {id: disturbance-channel, title: 阵风抑制对应的通道, prompt: 判断阵风抑制能力时，应优先明确哪一个传递对象？, response_kind: choice.single, options: ['T_r(s)', 'T_d(s)', 'L(s)'], reference_answer: 'T_d(s)', submit_scope: per_card, layout_span: half}
      reveal_answer: after_submit_or_teacher_reveal
    teacher_controls: {release_activity: teacher_toggle, open_browse: page_load_open, teacher_step_reveal: not_applicable, reveal_reference_answer: teacher_toggle}
    student_access: {default_visibility: hidden, release_required: true, browse_required: false, can_view_problem_statement: true, can_view_derivation_steps: not_applicable, can_submit_without_browse: true}
    telemetry_spec: {summary_fields: [viewed, submittedCards, objectiveAccuracy], result_policy: per_card_submission}
    teacher_insight_spec: {widgets: [submission_rate, response_summary]}
    ai_context_spec: {delivery_mode: guided, page_goal: 先区分观察域，再为工程任务标明输入输出通道。, allowed_scope: [提示输入和输出的识别方法, 提交后解释T_r与T_d与L], forbidden_scope: [代替学生配对, 直接给出选项答案]}
    acceptance_checks: [仅包含两张作答卡, T_r与T_d与L标签常显, 两题分别提交]
    preview_contract: {route_kind: student_demo, demo_path: '/interactive-learning/courses/unit-1-4-time-frequency-views/student/demo?step=step-04'}

  step-05:
    title: 闭环极点与阶跃响应的时域参照
    layout: {template: formula_compute_table, regions: [{id: intro, width: full, order: 1}, {id: formula, width: full, order: 2}, {id: compute, width: full, order: 3}, {id: evidence, width: full, order: 4}]}
    modules:
      - {id: page-intro, region: intro, kind: content.rich, must_be_visible: true, payload: {block_key: page-intro, title: 闭环极点与阶跃响应的时域参照}}
      - {id: model-formulas, region: formula, kind: content.formula, must_be_visible: true, payload: {block_key: model-formulas, title: 对象与闭环传递函数}}
      - id: time-domain-workbench
        region: compute
        kind: compute.panel
        must_be_visible: true
        payload:
          capabilityRef: control-linked-comparison
          panel_id: unit-1-4-time-domain-reference
          spec_key: control_linked_comparison
          title: 增益、闭环极点与阶跃响应
          visiblePanelIds: [step-response, root-locus, performance]
          responseContractId: step-05.time-domain-observation.parameter.set
          releaseState: released
          fallbackState: supported
          request: &gain_request {runtimeMode: analysis, caseId: unit-1-4-gain-family, plant: {numerator: [1], denominator: [1, 4, 0], coefficientOrder: descending, label: 'G_0(s)=1/[s(s+4)]'}, structures: [{kind: gain, enabled: true, params: {k: 8}, label: K}], outputs: [step_response, root_locus, magnitude, phase, bode, nyquist], responseType: step, timeRange: {start: 0, end: 15, samples: 160}, frequencyRange: {min: 0.05, max: 20, samples: 128}, rootLocus: {minGain: 0, maxGain: 12, samples: 160, currentGain: 8}}
          parameterPresets: [1, 4, 8]
          submissionFields: [{key: k, label: 增益 K, input: slider, min: 0.5, max: 12, step: 0.5, defaultValue: 8, presets: [1, 4, 8]}, {key: pole_type, label: 极点类型, input: select, options: [两个实极点, 重实极点, 共轭复极点]}, {key: response_shape, label: 响应形态, input: text}, {key: numeric_observation, label: 一项数值观察, input: text}]
          fallbackMedia: {src: '/course-runtime/lessons/1-4/media/1-4-fig-01-step-responses.png', alt: 'K=1、4、8 的闭环阶跃响应后备图'}
    content_blocks:
      - {id: page-intro, type: plain_text, body: '在进入频域前，先用同一对象回看增益、闭环极点与阶跃响应之间的联系。'}
      - {id: model-formulas, type: formula, formula: 'G_0(s)=1/[s(s+4)],\qquad T_K(s)=K/(s^2+4s+K)', body: 'K 改变闭环特征方程，因此极点形态与阶跃过程同步变化。'}
    evidence_sequence: [page-intro, model-formulas, time-domain-workbench]
    interaction_spec:
      interaction_kind: interactive_figure_submit
      submit_fields: [k, pole_type, response_shape, numeric_observation]
      student_task: 选择一个非预设 K，提交极点类型、响应形态和一项数值观察。
      activity_cards: [{id: gain-observation, title: 增益变化下的时域观察, prompt: 选择一个非预设 K，记录极点类型、响应形态和一项超调量或调节时间数值。, response_kind: parameter.set, submit_scope: per_card, layout_span: full, reference_answer: 按当前计算状态核对对象、极点和阶跃指标的一致性。}]
    teacher_controls: {release_activity: teacher_toggle, open_browse: page_load_open, teacher_step_reveal: not_applicable, reveal_reference_answer: teacher_toggle}
    student_access: {default_visibility: visible, release_required: true, browse_required: false, can_view_problem_statement: true, can_view_derivation_steps: not_applicable, can_submit_without_browse: true}
    telemetry_spec: {summary_fields: [viewed, parameterChanges, submittedParameterSet], result_policy: explicit_parameter_submission_only}
    teacher_insight_spec: {widgets: [submission_rate, response_summary]}
    ai_context_spec: {delivery_mode: guided, page_goal: 建立K变化、闭环极点和阶跃响应之间的时域参照。, allowed_scope: [解释参数变化后的图形证据, 提交后检查观察链], forbidden_scope: [替学生选择K, 代写观察结论, 直接生成提交内容]}
    acceptance_checks: [参数字段key为k且范围0.5到12, 预设包含1与4与8, 极点曲线指标同页联动, 本页不增加选择题]
    preview_contract: {route_kind: student_demo, demo_path: '/interactive-learning/courses/unit-1-4-time-frequency-views/student/demo?step=step-05'}

  step-06:
    title: 闭环 Bode 图、带宽与环路穿越频率
    layout: {template: formula_dual_compute_definition, regions: [{id: intro, width: full, order: 1}, {id: formula, width: full, order: 2}, {id: compute, width: full, order: 3}, {id: definitions, width: full, order: 4}]}
    modules:
      - {id: page-intro, region: intro, kind: content.rich, must_be_visible: true, payload: {block_key: page-intro, title: 闭环 Bode 图、带宽与环路穿越频率}}
      - {id: sinusoid-formula, region: formula, kind: content.formula, must_be_visible: true, payload: {block_key: sinusoid-formula, title: 正弦稳态的幅值与相位}}
      - id: closed-loop-bode
        region: compute
        kind: compute.panel
        must_be_visible: true
        payload:
          capabilityRef: control-frequency-reading-workbench
          panel_id: unit-1-4-closed-loop-bode
          spec_key: control_frequency_reading_workbench
          title: 闭环指令传递 T(s) 的 Bode 图
          visiblePanelIds: [bode]
          responseContractId: step-06.closed-loop-bandwidth.parameter.set
          releaseState: released
          fallbackState: supported
          focusFrequencyField: closed_loop_bandwidth_rad_s
          sharedFrequencyAnchors: [{id: low_frequency_reference, frequencyRadPerSec: 0.05, role: low_frequency_baseline}]
          request: &closed_loop_request {runtimeMode: analysis, caseId: unit-1-4-closed-loop-frequency, plant: {numerator: [8], denominator: [1, 4, 8], coefficientOrder: descending, label: 'T(s)=8/(s^2+4s+8)'}, structures: [{kind: gain, enabled: true, params: {k: 1}, label: 固定闭环对象}], outputs: [step_response, root_locus, magnitude, phase, bode, nyquist], responseType: step, timeRange: {start: 0, end: 8, samples: 160}, frequencyRange: {min: 0.05, max: 30, samples: 160}, rootLocus: {minGain: 0, maxGain: 1, samples: 80, currentGain: 0}}
          submissionFields: [{key: closed_loop_bandwidth_rad_s, label: 相对低频下降 3 dB 的频点, input: number}]
          fallbackMedia: {src: '/course-runtime/lessons/1-4/media/1-4-fig-02-closed-loop-bode.png', alt: '闭环指令传递 T(s) 的 Bode 后备图'}
      - id: loop-bode
        region: compute
        kind: compute.panel
        must_be_visible: true
        payload:
          capabilityRef: control-frequency-reading-workbench
          panel_id: unit-1-4-loop-bode
          spec_key: control_frequency_reading_workbench
          title: 环路 L(s) 的增益穿越频率对照
          visiblePanelIds: [bode]
          responseContractId: step-06.loop-gain-crossover.parameter.set
          releaseState: course-controlled
          fallbackState: supported
          focusFrequencyField: loop_gain_crossover_rad_s
          sharedFrequencyAnchors: []
          request: *gain_request
          submissionFields: [{key: loop_gain_crossover_rad_s, label: 环路 0 dB 穿越频率, input: number}]
          fallbackMedia: {src: '/course-runtime/lessons/1-4/media/1-4-fig-03-open-loop-bode.png', alt: '对象 G0(s) 的开环 Bode 后备图'}
      - {id: definition-cards, region: definitions, kind: content.cardSet, must_be_visible: true, payload: {block_key: definition-cards, title: 带宽与增益穿越频率}}
      - {id: definition-check, region: definitions, kind: activity.panel, must_be_visible: true, payload: {title: 两个频率标志的关系, responseContractId: choice.binary}}
    content_blocks:
      - {id: page-intro, type: plain_text, body: '先读取闭环指令通道的幅值与相位，再用环路对象辨析另一种频率标志。'}
      - {id: sinusoid-formula, type: formula, formula: 'r(t)=A\sin\omega t,\qquad y_{ss}(t)=A|T(j\omega)|\sin(\omega t+\angle T(j\omega))', body: '该关系成立于稳定线性定常系统的正弦稳态。'}
