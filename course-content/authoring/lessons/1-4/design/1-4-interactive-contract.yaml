      - {id: example-one-problem, type: plain_text, body: '已知 T_e(s)=0.64/(s²+0.88s+0.64)。单位阶跃超调约 12.63%，5% 调节时间约 6.62 s；ω=0.2 rad/s 时输出幅值比约 1.024、相位 -16.35°；ω=4 rad/s 时输出幅值比约 0.0406、相位 -167.09°。判断哪个频率更容易被系统跟随，并说明三组数据的表征归属。'}
      - {id: example-one-reveal, type: reveal_list, items: ['时域证据：超调量和调节时间描述一次输入后的全过程。', '低频证据：ω=0.2 rad/s 时幅值接近 1、相位滞后较小，慢节律基本通过。', '高频证据：ω=4 rad/s 时输出幅值仅为输入约 4.06%，且相位接近反相。', '结构联系：同一对共轭闭环极点同时影响阶跃超调和自然频率附近的幅相变化，单个频点不能独立确定超调量。']}
