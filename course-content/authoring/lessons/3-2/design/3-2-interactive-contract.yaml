contract_version: '2.1'
lesson_id: '3-2'
course_title: '3-2：劳斯判据——从高阶系统稳定判定到参数可行域'
course_route_segment: 'unit-3-2-routh-stability-boundary'
preview_mode:
  default_entry: 'student_demo'
  student_demo_base_path: '/interactive-learning/courses/unit-3-2-routh-stability-boundary/student/demo'
  teacher_preview_panel_note: '教师端模板弹窗只用于查看课堂骨架；默认页面预览必须打开学生演示页。'
telemetry_strategy: 'lightweight_high_value'
teacher_insight_strategy: 'step_level_aggregation_only'
required_step_fields:
  - 'layout'
  - 'modules'
  - 'content_blocks'
  - 'evidence_sequence'
  - 'interaction_spec'
  - 'teacher_controls'
  - 'student_access'
  - 'telemetry_spec'
  - 'teacher_insight_spec'
  - 'ai_context_spec'
  - 'preview_contract'
  - 'acceptance_checks'
steps:
  step-01:
    title: '回到地图——从纯极点语言走向稳定边界'
    layout:
      template: 'map_hero_slide'
      regions:
        - id: 'header'
          width: 'full'
          order: 1
        - id: 'lead'
          width: 'full'
          order: 2
        - id: 'summary'
          width: 'full'
          order: 3
    modules:
      - id: 'stage-map'
        region: 'lead'
        kind: 'stage-map'
        must_be_visible: true
      - id: 'today-task'
        region: 'summary'
        kind: 'key-task-card'
        must_be_visible: true
      - id: 'boundary-note'
        region: 'summary'
        kind: 'boundary-card'
        must_be_visible: true
    content_blocks:
      - id: 'stage-map'
        type: 'plain_text'
        title: '路径定位'
        body: '固定高亮 3-1 -> 3-2 -> 3-3 -> 4-1。'
      - id: 'today-task'
        type: 'bullet_list'
        title: '本课任务'
        items:
          - '面对高阶闭环特征方程先判断是否稳定。'
          - '识别临界边界对应的根结构。'
          - '把判稳推进到参数可行域。'
      - id: 'boundary-note'
        type: 'bullet_list'
        title: '本课边界'
        items:
          - '进入劳斯判据、特殊情况与区域约束。'
          - '不进入根轨迹与控制器整定。'
    evidence_sequence:
      - '路径图'
      - '今日任务'
      - '课程边界'
    interaction_spec:
      interaction_kind: 'none'
      student_task: '只阅读，不提交。'
      answer_reveal: 'none'
    teacher_controls:
      release_activity: 'not_applicable'
      open_browse: 'not_applicable'
      teacher_step_reveal: 'not_applicable'
      reveal_reference_answer: 'not_applicable'
    student_access:
      default_visibility: 'visible'
      release_required: false
      browse_required: false
      can_view_problem_statement: true
      can_view_derivation_steps: true
      can_submit_without_browse: true
    telemetry_spec:
      summary_fields:
        - 'viewed'
        - 'timeOnStep'
        - 'teacherFollowSync'
      result_policy: 'no_submission'
    teacher_insight_spec:
      widgets:
        - 'view_count'
        - 'sync_status'
      aggregation: 'step_level'
    ai_context_spec:
      page_goal: '标定本课位于模块 3 的位置。'
      allowed_scope:
        - '课程路径'
        - '高阶稳定边界'
        - '参数可行域'
      forbidden_scope:
        - '提前展开根轨迹'
        - '提前进入整定'
      canonical_facts:
        - '3-1 建立纯极点语言。'
        - '3-2 建立稳定边界与参数可行域语言。'
    preview_contract:
      route_kind: 'student_demo'
      demo_path: '/interactive-learning/courses/unit-3-2-routh-stability-boundary/student/demo?step=step-01'
      must_match_student_page: true
    acceptance_checks:
      - '首屏可见路径图、任务卡和边界卡。'
      - '本页没有作答区。'

  step-02:
    title: '先看主对象——极点迁移图提出了哪三个问题'
    layout:
      template: 'figure_question_board'
      regions:
        - id: 'media'
          width: 'full'
          order: 1
        - id: 'questions'
          width: 'full'
          order: 2
        - id: 'interaction'
          width: 'full'
          order: 3
    modules:
      - id: 'pole-migration-figure'
        region: 'media'
        kind: 'illustration'
        must_be_visible: true
      - id: 'three-questions'
        region: 'questions'
        kind: 'question-list'
        must_be_visible: true
      - id: 'binary-choice'
        region: 'interaction'
        kind: 'binary-choice'
        must_be_visible: true
    content_blocks:
      - id: 'figure'
        type: 'media'
        title: '主对象极点迁移图'
        src: '../media/processed/3-2-pole-migration.png'
      - id: 'questions'
        type: 'bullet_list'
        title: '三问'
        items:
          - '哪一段参数仍保持稳定。'
          - '哪两个点恰好压在边界上。'
          - '若只有特征方程，怎样不靠图继续判断。'
      - id: 'bridge'
        type: 'plain_text'
        title: '结论桥接'
        body: '图像暴露边界，但不能替代由系数直接给出的判稳规则。'
    evidence_sequence:
      - '极点迁移图'
      - '三问清单'
      - '桥接结论'
      - '二选一判断'
    interaction_spec:
      interaction_kind: 'binary_choice'
      student_task: '判断“只看图是否已经足够写出参数可行域”。'
      correct_answer: 'B'
      options:
        A: '足够，图上边界点已经全部给出。'
        B: '不够，还需要一套由特征方程系数直接判稳的方法。'
      failure_feedback: '只提示“图像直觉不能替代代数规则”。'
      answer_reveal: 'separate_teacher_toggle'
    teacher_controls:
      release_activity: 'page_load_open'
      open_browse: 'not_applicable'
      teacher_step_reveal: 'not_applicable'
      reveal_reference_answer: 'separate_toggle'
    student_access:
      default_visibility: 'visible'
      release_required: false
      browse_required: false
      can_view_problem_statement: true
      can_view_derivation_steps: true
      can_submit_without_browse: true
    telemetry_spec:
      summary_fields:
        - 'selectedOption'
        - 'resultState'
        - 'teacherRevealSeen'
      misconception_tags:
        - 'visual_boundary_is_enough'
    teacher_insight_spec:
      widgets:
        - 'option_distribution'
        - 'misconception_rate'
      aggregation: 'step_level'
    ai_context_spec:
      page_goal: '暴露“只看图就够了”的起点误判。'
      allowed_scope:
        - '边界点'
        - '稳定段'
        - '代数规则入口'
      forbidden_scope:
        - '直接给出最终区间'
      canonical_facts:
        - '图像只是入口，不能替代系数判稳。'
    preview_contract:
      route_kind: 'student_demo'
      demo_path: '/interactive-learning/courses/unit-3-2-routh-stability-boundary/student/demo?step=step-02'
      must_match_student_page: true
    acceptance_checks:
      - '主图、三问与判断区在未作答状态下同屏。'
      - '错误反馈不提前给出稳定区间。'

  step-03:
    title: '前测——不求根判稳、特殊情况与区域收紧'
    layout:
      template: 'question_stack'
      regions:
        - id: 'title'
          width: 'full'
          order: 1
        - id: 'question-stack'
          width: 'full'
          order: 2
        - id: 'submit-bar'
          width: 'full'
          order: 3
    modules:
      - id: 'post-card'
        region: 'title'
        kind: 'title-card'
        must_be_visible: true
      - id: 'pretest-q1'
        region: 'question-stack'
        kind: 'single-choice-card'
        must_be_visible: true
      - id: 'pretest-q2'
        region: 'question-stack'
        kind: 'single-choice-card'
        must_be_visible: true
      - id: 'pretest-q3'
        region: 'question-stack'
        kind: 'single-choice-card'
        must_be_visible: true
    content_blocks:
      - id: 'title'
        type: 'plain_text'
        title: '本页任务'
        body: '检查三类起点判断：不求根判稳、特殊情况辨识、区域约束收紧。'
      - id: 'misconception-note'
        type: 'bullet_list'
        title: '常见混淆'
        items:
          - '劳斯判据不是另一种求根法。'
          - '首位为 0 不等于全零行。'
          - '稳定区间不等于更强区域约束下的可行域。'
    evidence_sequence:
      - '本页任务卡'
      - '三道前测题'
      - '误区提示'
      - '提交与统计'
    interaction_spec:
      interaction_kind: 'quiz_group'
      student_task: '完成三道前测题。'
      attempt_model: '允许重提一次，教师端区分首答与重提。'
      answer_reveal: 'separate_teacher_toggle'
    teacher_controls:
      release_activity: 'page_load_open'
      open_browse: 'not_applicable'
      teacher_step_reveal: 'not_applicable'
      reveal_reference_answer: 'separate_toggle'
    student_access:
      default_visibility: 'visible'
      release_required: false
      browse_required: false
      can_view_problem_statement: true
      can_view_derivation_steps: true
      can_submit_without_browse: true
    telemetry_spec:
      summary_fields:
        - 'attemptCount'
        - 'resultState'
        - 'errorBucket'
      misconception_tags:
        - 'routh_equals_root_solving'
        - 'zero_head_equals_zero_row'
        - 'stability_equals_stronger_region'
    teacher_insight_spec:
      widgets:
        - 'question_distribution'
        - 'top_misconceptions'
      aggregation: 'step_level'
    ai_context_spec:
      page_goal: '暴露三类起点误区。'
      allowed_scope:
        - '错因归类'
        - '术语纠偏'
      forbidden_scope:
        - '代替学生作答'
      canonical_facts:
        - '前测用于暴露误判，而不是提前给结论。'
    preview_contract:
      route_kind: 'student_demo'
      demo_path: '/interactive-learning/courses/unit-3-2-routh-stability-boundary/student/demo?step=step-03'
      must_match_student_page: true
    acceptance_checks:
      - '三题在未作答状态下全部可见。'
      - '教师端可看到错误分布。'

  step-04:
    title: '普通劳斯表——固定 k=4 时怎样从第一列读出稳定性'
    layout:
      template: 'worked_example_reveal'
      regions:
        - id: 'problem'
          width: 'full'
          order: 1
        - id: 'derivation'
          width: 'full'
          order: 2
        - id: 'activity'
          width: 'full'
          order: 3
        - id: 'reference'
          width: 'full'
          order: 4
    modules:
      - id: 'problem-card'
        region: 'problem'
        kind: 'question-card'
        must_be_visible: true
      - id: 'formula-card'
        region: 'problem'
        kind: 'formula-card'
        must_be_visible: true
      - id: 'reveal-steps'
        region: 'derivation'
        kind: 'step-reveal-board'
        must_be_visible: true
      - id: 'activity-card-a'
        region: 'activity'
        kind: 'single-choice-card'
        must_be_visible: true
      - id: 'activity-card-b'
        region: 'activity'
        kind: 'fill-text-card'
        must_be_visible: true
      - id: 'reference-answer'
        region: 'reference'
        kind: 'reference-answer-card'
        must_be_visible: true
    content_blocks:
      - id: 'problem'
        type: 'plain_text'
        title: '完整题面'
        body: '取 k=4，对 D(s,k)=s^4+5s^3+9s^2+(7+k)s+(2+k) 列写普通劳斯表，并判断系统稳定性。'
      - id: 'formula'
        type: 'formula'
        title: '固定对象'
        value: 'D(s)=s^4+5s^3+9s^2+11s+6'
      - id: 'reveal_steps'
        type: 'bullet_list'
        title: '显影链'
        items:
          - '先排出 s^4 与 s^3 两行。'
          - '再依次算出 b_1、b_2 与 c_1。'
          - '最后读第一列并做数值求根交叉验证。'
      - id: 'conclusion'
        type: 'formula_list'
        title: '第一列与结论'
        items:
          - '1,\\ 5,\\ \\frac{34}{5},\\ \\frac{112}{17},\\ 6'
          - '\\text{右半平面根数}=0'
    evidence_sequence:
      - '完整题面'
      - '固定对象公式'
      - '普通劳斯表显影链'
      - '第一列结论'
      - '独立作答卡'
      - '参考答案'
    interaction_spec:
      interaction_kind: 'activity_cards'
      student_task: '先跟随显影链读出第一列，再完成两张独立作答卡。'
      activity_card_rationale: '本页需要同时检查“读出右半平面根数”和“理解劳斯判据不是显式求根”两层判断，因此拆成两张卡。'
      step_reveal_policy:
        mode: 'teacher_or_browse_release'
        problem_statement: 'always_visible'
        derivation_steps: 'teacher_step_reveal'
        reference_answer: 'separate_teacher_toggle'
      activity_cards:
        - id: 'card-04-a'
          prompt: '本例右半平面根数是多少。'
          response_kind: 'single_choice'
          submit_scope: 'per_card'
          layout_span: 'half'
        - id: 'card-04-b'
          prompt: '为什么本页已经能判稳，但还没有显式求出全部根。'
          response_kind: 'fill_text'
          submit_scope: 'per_card'
          layout_span: 'half'
    teacher_controls:
      release_activity: 'separate_toggle'
      open_browse: 'separate_toggle'
      teacher_step_reveal: 'teacher_only'
      reveal_reference_answer: 'separate_toggle'
      instructor_demo_tools:
        - 'reveal_next_step'
        - 'show_reference_answer'
    student_access:
      default_visibility: 'hidden'
      release_required: true
      browse_required: true
      can_view_problem_statement: true
      can_view_derivation_steps: false
      can_submit_without_browse: false
    telemetry_spec:
      summary_fields:
        - 'cardResultStates'
        - 'stepRevealCount'
        - 'timeOnStep'
      misconception_tags:
        - 'stable_equals_all_roots_solved'
        - 'first_column_role_missing'
    teacher_insight_spec:
      widgets:
        - 'card_accuracy_distribution'
        - 'step_reveal_usage'
      aggregation: 'step_level'
    ai_context_spec:
      page_goal: '建立“第一列 -> 右半平面根数”的第一条稳定判断链。'
      allowed_scope:
        - '普通劳斯表'
        - '第一列'
        - '右半平面根数'
      forbidden_scope:
        - '跳过表格直接报答案'
      canonical_facts:
        - '题面必须始终可见。'
        - '逐步显影只隐藏递推步骤。'
    preview_contract:
      route_kind: 'student_demo'
      demo_path: '/interactive-learning/courses/unit-3-2-routh-stability-boundary/student/demo?step=step-04'
      must_match_student_page: true
    acceptance_checks:
      - '对象公式、显影链和作答卡保持在同一逻辑页内。'
      - '学生不看讲稿也能知道本例在求什么、为什么看第一列。'

  step-05:
    title: '带参数劳斯表——稳定区间怎样从第一列条件链中写出'
    layout:
      template: 'worked_example_reveal'
      regions:
        - id: 'problem'
          width: 'full'
          order: 1
        - id: 'derivation'
          width: 'full'
          order: 2
        - id: 'activity'
          width: 'full'
          order: 3
        - id: 'reference'
          width: 'full'
          order: 4
    modules:
      - id: 'problem-card'
        region: 'problem'
        kind: 'question-card'
        must_be_visible: true
      - id: 'parametric-formula'
        region: 'problem'
        kind: 'formula-card'
        must_be_visible: true
      - id: 'reveal-steps'
        region: 'derivation'
        kind: 'step-reveal-board'
        must_be_visible: true
      - id: 'activity-card-a'
        region: 'activity'
        kind: 'fill-text-card'
        must_be_visible: true
      - id: 'activity-card-b'
        region: 'activity'
        kind: 'single-choice-card'
        must_be_visible: true
      - id: 'reference-answer'
        region: 'reference'
        kind: 'reference-answer-card'
        must_be_visible: true
    content_blocks:
      - id: 'problem'
        type: 'plain_text'
        title: '完整题面'
        body: '保留参数 k，列写劳斯表，并写出系统保持稳定的参数区间。'
      - id: 'formula'
        type: 'formula'
        title: '带参数对象'
        value: 'D(s,k)=s^4+5s^3+9s^2+(7+k)s+(2+k)'
      - id: 'reveal_steps'
        type: 'bullet_list'
        title: '显影链'
        items:
          - '先列出带参数劳斯表。'
          - '再写出第一列的不等式链。'
          - '最后合并条件得到稳定区间。'
      - id: 'interval'
        type: 'formula'
        title: '稳定区间'
        value: '-2<k<18'
    evidence_sequence:
      - '完整题面'
      - '带参数对象'
      - '劳斯表显影链'
      - '第一列条件链'
      - '稳定区间'
      - '独立作答卡'
    interaction_spec:
      interaction_kind: 'activity_cards'
      student_task: '根据显影链写出稳定区间，并指出最容易遗漏的条件。'
      activity_card_rationale: '本页既要核对区间结果，也要暴露漏掉 s^0 行的典型错因，因此拆成结果卡和错因卡。'
      step_reveal_policy:
        mode: 'teacher_or_browse_release'
        problem_statement: 'always_visible'
        derivation_steps: 'teacher_step_reveal'
        reference_answer: 'separate_teacher_toggle'
      activity_cards:
        - id: 'card-05-a'
          prompt: '填写稳定区间。'
          response_kind: 'fill_text'
          submit_scope: 'per_card'
          layout_span: 'half'
        - id: 'card-05-b'
          prompt: '哪一个条件最容易被遗漏。'
          response_kind: 'single_choice'
          submit_scope: 'per_card'
          layout_span: 'half'
    teacher_controls:
      release_activity: 'separate_toggle'
      open_browse: 'separate_toggle'
      teacher_step_reveal: 'teacher_only'
      reveal_reference_answer: 'separate_toggle'
      instructor_demo_tools:
        - 'reveal_next_step'
        - 'show_reference_answer'
    student_access:
      default_visibility: 'hidden'
      release_required: true
      browse_required: true
      can_view_problem_statement: true
      can_view_derivation_steps: false
      can_submit_without_browse: false
    telemetry_spec:
      summary_fields:
        - 'cardResultStates'
        - 'stepRevealCount'
        - 'attemptCount'
      misconception_tags:
        - 'missing_s0_condition'
        - 'fraction_sign_chain_error'
    teacher_insight_spec:
      widgets:
        - 'interval_accuracy_distribution'
        - 'top_missing_conditions'
      aggregation: 'step_level'
    ai_context_spec:
      page_goal: '把“第一列条件链”转成“稳定区间”这一动作做实。'
      allowed_scope:
        - '不等式链'
        - '区间合并'
      forbidden_scope:
        - '把推导压成黑箱结果'
      canonical_facts:
        - 's^0 行条件不能遗漏。'
    preview_contract:
      route_kind: 'student_demo'
      demo_path: '/interactive-learning/courses/unit-3-2-routh-stability-boundary/student/demo?step=step-05'
      must_match_student_page: true
    acceptance_checks:
      - '静态区必须先看到条件链，再看到区间结论。'
      - '结果卡与错因卡独立提交。'

  step-06:
    title: '边界点回到复平面——k=-2、18、22 分别对应什么根结构'
    layout:
      template: 'figure_mapping_workspace'
      regions:
        - id: 'table'
          width: 'full'
          order: 1
        - id: 'media'
          width: 'full'
          order: 2
        - id: 'activity'
          width: 'full'
          order: 3
        - id: 'reference'
          width: 'full'
          order: 4
    modules:
      - id: 'parameter-table'
        region: 'table'
        kind: 'comparison-table'
        must_be_visible: true
      - id: 'pole-migration-figure'
        region: 'media'
        kind: 'illustration'
        must_be_visible: true
      - id: 'activity-card-a'
        region: 'activity'
        kind: 'match-card'
        must_be_visible: true
      - id: 'activity-card-b'
        region: 'activity'
        kind: 'fill-text-card'
        must_be_visible: true
      - id: 'reference-answer'
        region: 'reference'
        kind: 'reference-answer-card'
        must_be_visible: true
    content_blocks:
      - id: 'parameter-table'
        type: 'table'
        title: '参数点与根结构'
        body: '至少列出 k=12、18、22 的求根结果与稳定性，并补充 k=-2 的边界说明。'
      - id: 'figure'
        type: 'media'
        title: '极点迁移图'
        src: '../media/processed/3-2-pole-migration.png'
      - id: 'note'
        type: 'plain_text'
