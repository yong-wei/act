    content_blocks:
      - id: 'problem'
        type: 'plain_text'
        title: '完整题面'
        body: '要求全部极点满足 Re(s)<-0.5，把区域约束转成普通劳斯判定，并写出新的可行域。'
      - id: 'shift'
        type: 'formula_list'
        title: '变量平移'
        items:
          - 's=z-\\frac12'
          - '\\tilde D(z,k)=D\\left(z-\\frac12,k\\right)'
      - id: 'reveal_steps'
        type: 'bullet_list'
        title: '显影链'
        items:
          - '先写出平移后多项式。'
          - '再列写平移后的劳斯表。'
          - '最后比较旧区间与新区间。'
      - id: 'intervals'
        type: 'formula_list'
        title: '区间对比'
        items:
          - '-2<k<18'
          - '-\\frac38<k<4'
    evidence_sequence:
