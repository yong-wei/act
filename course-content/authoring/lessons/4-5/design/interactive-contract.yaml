        - { id: 'return-card', prompt: '哪两条边界收益被换回来了？', response_kind: 'fill_text', submit_scope: 'per_card', layout_span: 'half' }
    teacher_controls: { release_activity: 'teacher_toggle', open_browse: 'page_load_open', teacher_step_reveal: 'teacher_only', reveal_reference_answer: 'teacher_toggle' }
