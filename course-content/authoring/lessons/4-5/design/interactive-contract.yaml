      - { id: 'closure-table', region: 'evidence', kind: 'native-table', must_be_visible: true }
      - { id: 'closure-figure', region: 'evidence', kind: 'image-panel', must_be_visible: true }
      - { id: 'summary-reveal', region: 'interaction', kind: 'step-reveal', must_be_visible: true }
