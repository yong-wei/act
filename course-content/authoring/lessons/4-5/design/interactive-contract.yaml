      interaction_kind: 'teacher_reveal_only'
      student_task: '理解结构改变会把最优区间带向何处。'
      step_reveal_policy: { min_layers: 1, local_click_to_continue: true }
    teacher_controls: { release_activity: 'not_applicable', open_browse: 'page_load_open', teacher_step_reveal: 'teacher_only', reveal_reference_answer: 'not_applicable' }
    student_access: { default_visibility: 'visible', release_required: false, browse_required: false, can_view_problem_statement: true, can_view_derivation_steps: true, can_submit_without_browse: false }
    teacher_insight_spec: { widgets: ['view_count', 'time_distribution'] }
    telemetry_spec: { summary_fields: ['viewed', 'timeOnStep'], misconception_tags: ['pid_is_always_better'] }
