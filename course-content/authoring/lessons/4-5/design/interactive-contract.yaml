        - { id: 'table', width: 'full', order: 2 }
        - { id: 'figure', width: 'full', order: 3 }
        - { id: 'summary', width: 'full', order: 4 }
    modules:
      - { id: 'structure-controllers', region: 'controllers', kind: 'formula-card-row', must_be_visible: true }
      - { id: 'structure-table', region: 'table', kind: 'native-table', must_be_visible: true }
      - { id: 'structure-figure', region: 'figure', kind: 'image-panel', must_be_visible: true }
      - { id: 'structure-summary', region: 'summary', kind: 'summary-card', must_be_visible: true }
    content_blocks:
      structure_figure: { runtime_media: '/course-runtime/lessons/4-5/media/4-5-ship-heading-pid-vs-leadlag-compare.png' }
