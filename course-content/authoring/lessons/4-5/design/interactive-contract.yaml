    modules:
      - { id: 'object-card', region: 'evidence', kind: 'formula-card', must_be_visible: true }
      - { id: 'controller-card', region: 'evidence', kind: 'formula-card', must_be_visible: true }
      - { id: 'candidate-card', region: 'evidence', kind: 'formula-card', must_be_visible: true }
      - { id: 'failure-figure', region: 'figure', kind: 'image-panel', must_be_visible: true }
      - { id: 'problem-focus', region: 'evidence', kind: 'summary-card', must_be_visible: true }
      - { id: 'bridge-conclusion', region: 'evidence', kind: 'summary-card', must_be_visible: true }
    content_blocks:
      failure_figure: { runtime_media: '/course-runtime/lessons/4-5/media/4-5-ship-heading-unconstrained-failure-compare.png' }
    evidence_sequence: ['对象', '结构', '候选', '失败图', '问题句与收束句']
    interaction_spec: { interaction_kind: 'none', student_task: '只阅读，不提交。' }
    teacher_controls: { release_activity: 'not_applicable', open_browse: 'not_applicable', teacher_step_reveal: 'not_applicable', reveal_reference_answer: 'not_applicable' }
    student_access: { default_visibility: 'visible', release_required: false, browse_required: false, can_view_problem_statement: true, can_view_derivation_steps: false, can_submit_without_browse: false }
    teacher_insight_spec: { widgets: ['view_count', 'sync_status'] }
    telemetry_spec: { summary_fields: ['viewed', 'timeOnStep'], misconception_tags: [] }
    ai_context_spec: { page_goal: '固定“更优不等于可交付”的入口。' }
    preview_contract: { demo_path: '/interactive-learning/courses/unit-4-5-constraint-aware-parameter-optimization/student/demo?step=step-01' }
    acceptance_checks: ['对象、结构、候选与失败图必须同屏常显。']

  step-02:
    title: '本次课程目标：完成这轮实践后应能做到什么'
    layout:
      template: 'objective_chain_board'
      regions:
        - { id: 'header', width: 'full', order: 1 }
        - { id: 'goals', width: 'full', order: 2 }
        - { id: 'bridge', width: 'full', order: 3 }
    modules:
      - { id: 'objective-header', region: 'header', kind: 'summary-card', must_be_visible: true }
      - { id: 'objective-list', region: 'goals', kind: 'summary-card', must_be_visible: true }
      - { id: 'objective-bridge', region: 'bridge', kind: 'summary-card', must_be_visible: true }
    content_blocks:
      objective_list:
        bullets:
          - '指出无约束候选在哪些工程边界上失守。'
          - '把超调、控制峰值和相角裕度写成硬约束。'
          - '区分参数范围与输出侧硬约束的职责。'
          - '解释罚函数与 fmincon/nonlcon 为什么会改写最优点位置。'
          - '比较起始方案、无约束候选和带约束可用解，并说明剩余风险。'
    evidence_sequence: ['标题', '五条课程目标', '桥接句']
    interaction_spec: { interaction_kind: 'none', student_task: '阅读课程目标。' }
    teacher_controls: { release_activity: 'not_applicable', open_browse: 'not_applicable', teacher_step_reveal: 'not_applicable', reveal_reference_answer: 'not_applicable' }
    student_access: { default_visibility: 'visible', release_required: false, browse_required: false, can_view_problem_statement: true, can_view_derivation_steps: false, can_submit_without_browse: false }
    teacher_insight_spec: { widgets: ['view_count'] }
    telemetry_spec: { summary_fields: ['viewed', 'timeOnStep'], misconception_tags: [] }
    ai_context_spec: { page_goal: '独立呈现本课布鲁姆能力目标。' }
    preview_contract: { demo_path: '/interactive-learning/courses/unit-4-5-constraint-aware-parameter-optimization/student/demo?step=step-02' }
    acceptance_checks: ['只允许出现本课目标，不暴露单元编排口径。']

  step-03:
    title: '自由目标收益与工程复核：更优为什么还不等于可用'
    layout:
      template: 'dual_table_evidence_board'
      regions:
        - { id: 'intro', width: 'full', order: 1 }
        - { id: 'gain', width: 'half', order: 2 }
        - { id: 'boundary', width: 'half', order: 3 }
        - { id: 'summary', width: 'full', order: 4 }
    modules:
      - { id: 'case-bridge', region: 'intro', kind: 'summary-card', must_be_visible: true }
      - { id: 'gain-table', region: 'gain', kind: 'native-table', must_be_visible: true }
      - { id: 'boundary-table', region: 'boundary', kind: 'native-table', must_be_visible: true }
      - { id: 'conclusion-card', region: 'summary', kind: 'summary-card', must_be_visible: true }
    content_blocks:
      gain_table:
        columns: ['指标', '4-3 起始方案', '4-4 无约束候选', '收益判断']
      boundary_table:
        columns: ['指标', '4-3 起始方案', '4-4 无约束候选', '复核结论']
    evidence_sequence: ['案例说明', '表1', '表2', '结论']
    interaction_spec: { interaction_kind: 'none', student_task: '对照收益与工程复核。' }
    teacher_controls: { release_activity: 'not_applicable', open_browse: 'not_applicable', teacher_step_reveal: 'not_applicable', reveal_reference_answer: 'not_applicable' }
    student_access: { default_visibility: 'visible', release_required: false, browse_required: false, can_view_problem_statement: true, can_view_derivation_steps: true, can_submit_without_browse: false }
    teacher_insight_spec: { widgets: ['view_count', 'sync_status'] }
    telemetry_spec: { summary_fields: ['viewed', 'timeOnStep'], misconception_tags: ['free_gain_equals_delivery'] }
    ai_context_spec: { page_goal: '把收益列与工程复核重新对齐到讲义第三章。' }
    preview_contract: { demo_path: '/interactive-learning/courses/unit-4-5-constraint-aware-parameter-optimization/student/demo?step=step-03' }
    acceptance_checks: ['表 1 与表 2 必须同页出现。']

  step-04:
    title: '三条硬约束第一次被显性提出'
    layout:
      template: 'constraint_statement_board'
      regions:
        - { id: 'formula', width: 'full', order: 1 }
        - { id: 'table', width: 'full', order: 2 }
        - { id: 'summary', width: 'full', order: 3 }
        - { id: 'interaction', width: 'full', order: 4 }
    modules:
      - { id: 'constraint-formula', region: 'formula', kind: 'formula-card', must_be_visible: true }
      - { id: 'risk-table', region: 'table', kind: 'native-table', must_be_visible: true }
      - { id: 'delivery-conclusion', region: 'summary', kind: 'summary-card', must_be_visible: true }
      - { id: 'constraint-role-card', region: 'interaction', kind: 'activity-card', must_be_visible: false }
      - { id: 'misread-card', region: 'interaction', kind: 'activity-card', must_be_visible: false }
    evidence_sequence: ['三条硬约束', '风险表', '结论', '两张判断卡']
    interaction_spec:
      interaction_kind: 'activity_card_set'
      student_task: '识别三条硬约束如何共同裁决结果是否可交付。'
      activity_cards:
        - { id: 'constraint-role-card', prompt: '哪一条边界最直接挡住控制量爆表？', response_kind: 'fill_text', submit_scope: 'per_card', layout_span: 'half' }
        - { id: 'misread-card', prompt: '为什么相角裕度没崩塌，仍不能说明候选整体可交付？', response_kind: 'fill_text', submit_scope: 'per_card', layout_span: 'half' }
    teacher_controls: { release_activity: 'teacher_toggle', open_browse: 'page_load_open', teacher_step_reveal: 'not_applicable', reveal_reference_answer: 'teacher_toggle' }
    student_access: { default_visibility: 'visible', activity_visibility: 'hidden', release_required: true, browse_required: false, can_view_problem_statement: true, can_view_derivation_steps: true, can_submit_without_browse: true }
    teacher_insight_spec: { widgets: ['card_completion_rate', 'error_bucket_distribution'] }
    telemetry_spec: { summary_fields: ['cardSubmitted', 'timeOnStep'], misconception_tags: ['range_as_constraint', 'phase_margin_as_sufficient'] }
    ai_context_spec: { page_goal: '把三条硬边界升格为交付裁决语言。' }
    preview_contract: { demo_path: '/interactive-learning/courses/unit-4-5-constraint-aware-parameter-optimization/student/demo?step=step-04' }
    acceptance_checks: ['三条硬约束必须常显。']

  step-05:
    title: '参数范围与硬约束分别在回答什么'
    layout:
      template: 'constraint_role_split_board'
      regions:
        - { id: 'top', width: 'full', order: 1 }
        - { id: 'table', width: 'full', order: 2 }
        - { id: 'interaction', width: 'full', order: 3 }
    modules:
      - { id: 'range-formula', region: 'top', kind: 'formula-card', must_be_visible: true }
      - { id: 'role-summary', region: 'top', kind: 'summary-card', must_be_visible: true }
      - { id: 'role-table', region: 'table', kind: 'native-table', must_be_visible: true }
      - { id: 'role-task', region: 'interaction', kind: 'activity-card', must_be_visible: false }
    evidence_sequence: ['参数范围式', '结论', '职责表', '判断卡']
    interaction_spec:
      interaction_kind: 'activity_card_set'
      student_task: '区分参数范围与输出侧硬约束分别在回答什么。'
      activity_cards:
        - { id: 'role-task', prompt: '$1\\le K\\le 6$ 与 $u_{\\max}\\le 7$ 分别在回答什么问题？', response_kind: 'fill_text', submit_scope: 'per_card', layout_span: 'full' }
    teacher_controls: { release_activity: 'teacher_toggle', open_browse: 'page_load_open', teacher_step_reveal: 'not_applicable', reveal_reference_answer: 'teacher_toggle' }
    student_access: { default_visibility: 'visible', activity_visibility: 'hidden', release_required: true, browse_required: false, can_view_problem_statement: true, can_view_derivation_steps: true, can_submit_without_browse: true }
    teacher_insight_spec: { widgets: ['card_completion_rate', 'response_bucket_distribution'] }
    telemetry_spec: { summary_fields: ['cardSubmitted', 'timeOnStep'], misconception_tags: ['range_equals_delivery', 'constraint_role_confusion'] }
    ai_context_spec: { page_goal: '清楚区分结构可解释与结果可交付。' }
    preview_contract: { demo_path: '/interactive-learning/courses/unit-4-5-constraint-aware-parameter-optimization/student/demo?step=step-05' }
    acceptance_checks: ['职责判断题面必须公式渲染。']

  step-06:
    title: '罚函数把边界写进模型'
    layout:
      template: 'formula_reveal_board'
      regions:
        - { id: 'formula', width: 'full', order: 1 }
        - { id: 'explain', width: 'full', order: 2 }
        - { id: 'summary', width: 'full', order: 3 }
    modules:
      - { id: 'jfree-card', region: 'formula', kind: 'formula-card', must_be_visible: true }
      - { id: 'jcon-card', region: 'formula', kind: 'formula-card', must_be_visible: true }
      - { id: 'penalty-card', region: 'formula', kind: 'formula-card', must_be_visible: true }
      - { id: 'explain-reveal', region: 'explain', kind: 'step-reveal', must_be_visible: true }
      - { id: 'rule-conclusion', region: 'summary', kind: 'summary-card', must_be_visible: true }
    evidence_sequence: ['J_free', 'J_con', 'P(theta)', '解释链', '结论']
    interaction_spec:
      interaction_kind: 'teacher_reveal_only'
      student_task: '理解偏好没变，规则变了。'
      step_reveal_policy: { min_layers: 3, local_click_to_continue: true }
    teacher_controls: { release_activity: 'not_applicable', open_browse: 'not_applicable', teacher_step_reveal: 'teacher_only', reveal_reference_answer: 'not_applicable' }
    student_access: { default_visibility: 'visible', release_required: false, browse_required: false, can_view_problem_statement: true, can_view_derivation_steps: false, can_submit_without_browse: false }
    teacher_insight_spec: { widgets: ['step_reveal_progress'] }
    telemetry_spec: { summary_fields: ['stepRevealCount', 'timeOnStep'], misconception_tags: ['penalty_as_new_preference'] }
    ai_context_spec: { page_goal: '固定三条公式与“偏好没变，规则变了”。' }
    preview_contract: { demo_path: '/interactive-learning/courses/unit-4-5-constraint-aware-parameter-optimization/student/demo?step=step-06' }
    acceptance_checks: ['三个公式必须纵向通栏出现。']

  step-07:
    title: '求解输入与六步求解链：求解器究竟在消费什么'
    layout:
      template: 'solver_chain_board'
      regions:
        - { id: 'table', width: 'full', order: 1 }
        - { id: 'chain', width: 'full', order: 2 }
        - { id: 'summary', width: 'full', order: 3 }
