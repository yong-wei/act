    content_blocks:
      same_weight_context:
        text: '当前仍是客船航向保持主案例；比较对象没有切换，只是在同一对象、同一权重下并排看起始方案、无约束最优与带约束最优。'
      controller_triple:
        formulas:
          - 'C_0(s)=2.796(10s+1)/(4.06s+1)'
          - 'C_B(s)=2.0644(9.9804s+1)/(2.0809s+1)'
          - 'C_{B,c}(s)=1.7679(10.4676s+1)/(2.6452s+1)'
      same_weight_table:
        title: '表 6. 同一权重下的三方案对比'
        columns: ['方案', '调节时间 / s', 'ITAE', 'ITSE', '控制能量', '控制峰值', '相角裕度 / deg']
        rows:
          - ['`4-3` 起始方案', '36.0', '63.692', '16.528', '125.715', '6.887', '49.046']
          - ['同权重无约束解', '13.5', '28.265', '12.404', '122.910', '9.901', '67.747']
          - ['同权重带约束解', '15.4', '37.784', '16.486', '79.767', '6.996', '67.694']
      same_weight_figure:
        runtime_media: '/course-runtime/lessons/4-5/media/4-5-ship-heading-same-weight-constraint-compare.png'
        caption: '平衡权重下：无约束最优与带约束最优为什么会分出两组不同解'
      feasible_reveal:
        steps:
          - '同一权重没有变化。'
          - '越界解被排出可行域。'
          - '最优点因此在新的可行域内迁移。'
      feasible_conclusion:
        text: '改写的是可行域，不是权重语言。'
      same_weight_task:
        prompt: '为什么这里改写的是可行域，而不是权重语言？'
    evidence_sequence: ['三条控制器', '表 6', '同权重比较图', '解释链', '结论句', '判断卡']
    interaction_spec:
      interaction_kind: 'teacher_reveal_only'
      student_task: '理解同一权重下最优点为何迁移。'
      step_reveal_policy: { min_layers: 3, local_click_to_continue: true }
      activity_cards:
        - { id: 'same-weight-task', prompt: '为什么这里改写的是可行域，而不是权重语言？', response_kind: 'fill_text', submit_scope: 'per_card', layout_span: 'full' }
    teacher_controls: { release_activity: 'teacher_toggle', open_browse: 'not_applicable', teacher_step_reveal: 'teacher_only', reveal_reference_answer: 'teacher_toggle' }
    student_access: { default_visibility: 'visible', activity_visibility: 'hidden', release_required: true, browse_required: false, can_view_problem_statement: true, can_view_derivation_steps: false, can_submit_without_browse: true }
    teacher_insight_spec: { widgets: ['step_reveal_progress', 'card_completion_rate'] }
    telemetry_spec: { summary_fields: ['stepRevealCount', 'cardSubmitted', 'timeOnStep'], misconception_tags: ['weight_changed', 'best_point_static'] }
    ai_context_spec: { page_goal: '固定“改写的是可行域，不是权重语言”。' }
    preview_contract: { demo_path: '/interactive-learning/courses/unit-4-5-constraint-aware-parameter-optimization/student/demo?step=step-07' }
    acceptance_checks: ['三条控制器、表 6 和比较图必须常显。', '解释链可显影，但图表不可隐藏。', '结论必须落到可行域迁移。']

  step-08:
    title: '三方案闭环比较：约束牺牲了什么，又换回了什么'
    layout:
      template: 'comparison_decision_board'
      regions:
        - { id: 'question', width: 'full', order: 1 }
        - { id: 'evidence', width: 'full', order: 2 }
        - { id: 'interaction', width: 'full', order: 3 }
    modules:
