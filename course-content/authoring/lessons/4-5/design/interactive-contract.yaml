    telemetry_spec: { summary_fields: ['viewed', 'timeOnStep'], misconception_tags: ['acceptable_equals_final', 'pid_as_next_step_only'] }
    ai_context_spec: { page_goal: '独立承载讲义 6.5，不把结构对比压进收尾页。' }
    preview_contract: { demo_path: '/interactive-learning/courses/unit-4-5-constraint-aware-parameter-optimization/student/demo?step=step-09' }
    acceptance_checks: ['三条可接受标准和余量告警必须先于结构对比出现。', '本页不得写成后测或下一课正文。', '权重扫掠只能作为后置补证。']

  step-10:
    title: '后测与收束：下一课转入结构边界与迁移'
    layout:
      template: 'quiz_summary_board'
      regions:
        - { id: 'header', width: 'full', order: 1 }
        - { id: 'quiz', width: 'full', order: 2 }
        - { id: 'summary', width: 'full', order: 3 }
    modules:
      - { id: 'posttest-header', region: 'header', kind: 'summary-card', must_be_visible: true }
      - { id: 'posttest-q1', region: 'quiz', kind: 'quiz-card', must_be_visible: true }
      - { id: 'posttest-q2', region: 'quiz', kind: 'quiz-card', must_be_visible: true }
      - { id: 'posttest-q3', region: 'quiz', kind: 'quiz-card', must_be_visible: true }
      - { id: 'handoff-summary', region: 'summary', kind: 'summary-card', must_be_visible: true }
    content_blocks:
      posttest_header:
        text: '阶段判断后测：把边界、求解与解释重新连成一条链。'
      posttest_q1:
        prompt: '同一权重下为何分出两组参数？'
        reference_explanation: '同一权重下分出两组参数，不是因为偏好变了，而是因为越界解被排出可行域，最优点被迫迁移。'
        misconception_feedback: '若回答停在“罚函数变大了”，说明还没有回到可行域迁移这一层判断。'
      posttest_q2:
        prompt: '参数范围和输出侧硬约束分别回答什么问题？'
        reference_explanation: '参数范围回答结构语义和搜索区间，输出侧硬约束回答结果是否还能交付。'
        misconception_feedback: '若把两者都写成“限制参数”，说明仍在混淆结构可解释与结果可交付两层语言。'
      posttest_q3:
        prompt: '为什么当前结果仍需继续被审视？'
        reference_explanation: '当前结果虽已可接受，但控制峰值余量很窄，且结构一旦改变，最优区间会明显改写，所以还不能把固定结构下的可行解当成终局。'
        misconception_feedback: '若把“可接受”直接等同于“问题结束”，说明忽略了结构边界尚未进入主线。'
      handoff_summary:
        text: '当前结构余量不宽松，下一课转入结构边界与迁移。'
    evidence_sequence: ['后测标题卡', '三题题干', '收束句']
    interaction_spec:
      interaction_kind: 'quiz_group'
      student_task: '完成三题后测。'
      activity_cards:
        - { id: 'posttest-q1', prompt: '同一权重下为何分出两组参数？', response_kind: 'fill_text', submit_scope: 'per_card', layout_span: 'full' }
        - { id: 'posttest-q2', prompt: '参数范围和输出侧硬约束分别回答什么问题？', response_kind: 'fill_text', submit_scope: 'per_card', layout_span: 'full' }
        - { id: 'posttest-q3', prompt: '为什么当前结果仍需继续被审视？', response_kind: 'fill_text', submit_scope: 'per_card', layout_span: 'full' }
    teacher_controls: { release_activity: 'teacher_toggle', open_browse: 'page_load_open', teacher_step_reveal: 'not_applicable', reveal_reference_answer: 'teacher_toggle' }
    student_access: { default_visibility: 'visible', release_required: true, browse_required: false, can_view_problem_statement: true, can_view_derivation_steps: true, can_submit_without_browse: true }
