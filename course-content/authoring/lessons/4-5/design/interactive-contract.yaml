contract_version: '2.1'
lesson_id: '4-5'
course_title: '4-5：约束下的优化设计实践：参数约束翻译与带约束参数优化'
course_route_segment: 'unit-4-5-constraint-aware-parameter-optimization'
preview_mode:
  default_entry: 'student_demo'
  student_demo_base_path: '/interactive-learning/courses/unit-4-5-constraint-aware-parameter-optimization/student/demo'
  teacher_preview_panel_note: '教师预览默认对齐学生页。'
media_policy:
  runtime_only: true
  runtime_export_required: true
  runtime_media_base: '/course-runtime/lessons/4-5/media'
  note: '正式页面只读取 runtime 媒体；作者态媒体只用于说明证据落点。'
telemetry_strategy: 'lightweight_high_value'
teacher_insight_strategy: 'step_level_aggregation_only'
required_step_fields:
  - 'layout'
  - 'modules'
  - 'content_blocks'
  - 'evidence_sequence'
  - 'interaction_spec'
  - 'teacher_controls'
  - 'student_access'
  - 'teacher_insight_spec'
  - 'telemetry_spec'
  - 'ai_context_spec'
  - 'preview_contract'
  - 'acceptance_checks'
steps:
  step-01:
    title: '无约束候选越界：时间指标更好，为什么仍不可交付'
    layout:
      template: 'failure_evidence_hero_board'
      regions:
        - { id: 'evidence', width: 'half', order: 1 }
        - { id: 'figure', width: 'half', order: 2 }
    modules:
      - { id: 'object-card', region: 'evidence', kind: 'formula-card', must_be_visible: true }
      - { id: 'controller-card', region: 'evidence', kind: 'formula-card', must_be_visible: true }
      - { id: 'candidate-card', region: 'evidence', kind: 'formula-card', must_be_visible: true }
      - { id: 'failure-figure', region: 'figure', kind: 'image-panel', must_be_visible: true }
      - { id: 'problem-focus', region: 'evidence', kind: 'summary-card', must_be_visible: true }
      - { id: 'bridge-conclusion', region: 'evidence', kind: 'summary-card', must_be_visible: true }
    content_blocks:
      object_card:
        title: '主案例对象'
        body: 'P_h(s)=0.01715/[s(s+0.1)(s+2.14375)]；当前对象仍是客船航向保持主案例。'
      controller_card:
        title: '固定结构'
        body: 'C_h(s)=K(Ts+1)/(αTs+1), 0<α<1'
      candidate_card:
        title: '无约束候选'
        body: 'C_u(s)=5(10s+1)/(2s+1)；这是 4-4 留下的无约束候选，不是最终可交付方案。'
      failure_figure:
        runtime_media: '/course-runtime/lessons/4-5/media/4-5-ship-heading-unconstrained-failure-compare.png'
        caption: '客船航向保持：无约束候选为什么不可直接交付'
        reading_clues:
          - '先看闭环输出确实更快压向目标。'
          - '再看控制量已经明显冲出可接受动作区间。'
      problem_focus:
        title: '时间指标更好，为什么仍不可交付？'
        text: '客船航向保持主案例中，更快收敛与更低误差还没有自动等于工程可交付。'
      bridge_conclusion:
        title: '本页结论'
        text: '本课先不继续谈求解器，而是先把更优与可交付的断裂看清。更优不等于可交付。'
    evidence_sequence: ['对象 P_h(s)', '结构 C_h(s)', '无约束候选 C_u(s)', '失败对比图', '问题句与收束句']
    interaction_spec: { interaction_kind: 'none', student_task: '只阅读，不提交。' }
    teacher_controls: { release_activity: 'not_applicable', open_browse: 'not_applicable', teacher_step_reveal: 'not_applicable', reveal_reference_answer: 'not_applicable' }
    student_access: { default_visibility: 'visible', release_required: false, browse_required: false, can_view_problem_statement: true, can_view_derivation_steps: false, can_submit_without_browse: false }
    teacher_insight_spec: { widgets: ['view_count', 'sync_status'] }
    telemetry_spec: { summary_fields: ['viewed', 'timeOnStep'], misconception_tags: [] }
    ai_context_spec: { page_goal: '固定“更优不等于可交付”的入口，不回顾课程目标，不先讲求解器。' }
    preview_contract: { demo_path: '/interactive-learning/courses/unit-4-5-constraint-aware-parameter-optimization/student/demo?step=step-01' }
    acceptance_checks: ['对象、结构、候选、失败图、问题句和收束句必须同屏常显。', '本页不得出现课程目标。', '失败案例不得做显影。']

  step-02:
    title: '自由目标收益不等于工程可用'
    layout:
      template: 'dual_table_evidence_board'
      regions:
        - { id: 'intro', width: 'full', order: 1 }
        - { id: 'gain', width: 'half', order: 2 }
        - { id: 'boundary', width: 'half', order: 3 }
        - { id: 'summary', width: 'full', order: 4 }
    modules:
      - { id: 'case-bridge', region: 'intro', kind: 'summary-card', must_be_visible: true }
      - { id: 'gain-table', region: 'gain', kind: 'native-table', must_be_visible: true }
      - { id: 'boundary-table', region: 'boundary', kind: 'native-table', must_be_visible: true }
      - { id: 'reading-order', region: 'summary', kind: 'summary-card', must_be_visible: true }
      - { id: 'conclusion-card', region: 'summary', kind: 'summary-card', must_be_visible: true }
    content_blocks:
      case_bridge:
        title: '比较对象'
        text: '当前仍是客船航向保持主案例，比较对象是 4-3 起始方案与 4-4 无约束候选；左表只看自由目标收益，右表专门复核这些收益是否伴随新的工程失守。'
      gain_table:
        title: '表 1. 客船航向保持主案例中的自由目标收益'
        columns: ['指标', '`4-3` 起始方案', '`4-4` 无约束候选', '收益判断']
        rows:
          - ['调节时间 / s', '36.0', '19.6', '更快']
          - ['`ITAE`', '63.6924', '20.1632', '拖尾更短']
          - ['`ITSE`', '16.5282', '5.3330', '前中段误差强度下降']
          - ['控制能量', '125.7148', '774.9575', '为收益支付了更大动作代价']
      boundary_table:
        title: '表 2. 同一主案例下的工程复核'
        columns: ['指标', '`4-3` 起始方案', '`4-4` 无约束候选', '复核结论']
        rows:
          - ['超调 / %', '18.8636', '20.2410', '已越过舒适性边界']
          - ['调节时间 / s', '36.0', '19.6', '收敛明显更快']
          - ['`ITAE`', '63.6924', '20.1632', '拖尾明显缩短']
          - ['`ITSE`', '16.5282', '5.3330', '前中段误差强度下降']
          - ['控制能量', '125.7148', '774.9575', '动作代价急剧上升']
          - ['控制峰值', '6.8867', '25.0000', '远超执行机构边界']
          - ['相角裕度 / deg', '49.0462', '47.8274', '裕度未崩塌，但并没有换来更稳妥的整体结果']
        emphasis_rows: ['超调 / %', '控制峰值', '相角裕度 / deg']
        emphasis_note: '实现时必须把三条越界或边界相关证据做成高亮复核行，不能淹没在普通指标中。'
      reading_order:
        text: '先读收益列，再读越界列，最后判断这些收益是不是建立在越界代价之上。'
      conclusion_card:
        text: '自由目标收益是真实存在的，但它不能自动等于工程可用。'
    evidence_sequence: ['案例说明', '表 1 收益列', '表 2 越界列', '读表口令', '结论句']
    interaction_spec:
      interaction_kind: 'none'
      student_task: '只阅读，不提交。'
    teacher_controls: { release_activity: 'not_applicable', open_browse: 'not_applicable', teacher_step_reveal: 'not_applicable', reveal_reference_answer: 'not_applicable' }
    student_access: { default_visibility: 'visible', release_required: false, browse_required: false, can_view_problem_statement: true, can_view_derivation_steps: true, can_submit_without_browse: false }
    teacher_insight_spec: { widgets: ['view_count', 'sync_status'] }
    telemetry_spec: { summary_fields: ['viewed', 'timeOnStep'], misconception_tags: ['free_gain_equals_delivery'] }
    ai_context_spec: { page_goal: '把收益列与越界列同页并置，固定本课真正问题。' }
    preview_contract: { demo_path: '/interactive-learning/courses/unit-4-5-constraint-aware-parameter-optimization/student/demo?step=step-02' }
    acceptance_checks: ['表 1 与表 2 必须并排且同屏常显。', '必须出现客船航向保持主案例与比较对象说明。', '必须出现收益列/越界列比较口令。', '结论必须是“自由目标收益是真实存在的，但它不能自动等于工程可用”。']

  step-03:
    title: '三条硬约束第一次被显性提出'
    layout:
      template: 'constraint_statement_board'
      regions:
        - { id: 'formula', width: 'full', order: 1 }
        - { id: 'table', width: 'full', order: 2 }
        - { id: 'summary', width: 'full', order: 3 }
        - { id: 'interaction', width: 'full', order: 4 }
    modules:
      - { id: 'constraint-formula', region: 'formula', kind: 'formula-card', must_be_visible: true }
      - { id: 'risk-table', region: 'table', kind: 'native-table', must_be_visible: true }
      - { id: 'delivery-conclusion', region: 'summary', kind: 'summary-card', must_be_visible: true }
      - { id: 'constraint-role-card', region: 'interaction', kind: 'activity-card', must_be_visible: true }
      - { id: 'misread-card', region: 'interaction', kind: 'activity-card', must_be_visible: true }
    content_blocks:
      constraint_formula:
        title: '三条必须常显的硬约束'
        body: 'M_p≤20%,  max|u(t)|≤7,  φ_m≥45°'
        note: '本页所有判断都以这三条边界为固定参照。'
      risk_table:
        columns: ['硬约束', '挡住的风险', '若不显性写出会发生什么']
        rows:
          - ['M_p≤20%', '舒适性与修航平稳程度', '把越摆当作可无限接受的提速代价']
          - ['max|u(t)|≤7', '执行机构物理能力', '候选解看似更快，实际已不可实现']
          - ['φ_m≥45°', '闭环稳健性储备', '只看时域变快，不看模型偏差和扰动下的脆弱性']
      delivery_conclusion:
        text: '硬约束不是在表扬哪一组更优，而是在裁决结果能否交付。'
      constraint_role_card:
        title: '控制量爆表先被哪条边界挡住'
        prompt: '哪一条边界最直接挡住控制量爆表？'
      misread_card:
        title: '相角裕度未崩塌为何仍不足够'
        prompt: '为什么相角裕度没崩塌，仍不能说明候选整体可交付？'
    evidence_sequence: ['三条硬约束', '风险-边界对应表', '交付裁决结论', '两张判断卡']
    interaction_spec:
      interaction_kind: 'activity_card_set'
      student_task: '识别三条硬约束如何共同裁决结果能否交付。'
      activity_cards:
        - { id: 'constraint-role-card', prompt: '哪一条边界最直接挡住控制量爆表？', response_kind: 'fill_text', submit_scope: 'per_card', layout_span: 'half' }
        - { id: 'misread-card', prompt: '为什么相角裕度没崩塌，仍不能说明候选整体可交付？', response_kind: 'fill_text', submit_scope: 'per_card', layout_span: 'half' }
    teacher_controls: { release_activity: 'teacher_toggle', open_browse: 'page_load_open', teacher_step_reveal: 'not_applicable', reveal_reference_answer: 'teacher_toggle' }
    student_access: { default_visibility: 'visible', release_required: true, browse_required: false, can_view_problem_statement: true, can_view_derivation_steps: true, can_submit_without_browse: true }
    teacher_insight_spec: { widgets: ['card_completion_rate', 'error_bucket_distribution'] }
    telemetry_spec: { summary_fields: ['cardSubmitted', 'errorBucket', 'timeOnStep'], misconception_tags: ['range_as_constraint', 'phase_margin_as_sufficient'] }
    ai_context_spec: { page_goal: '把三条硬边界升格为交付裁决语言，不混入参数范围。' }
    preview_contract: { demo_path: '/interactive-learning/courses/unit-4-5-constraint-aware-parameter-optimization/student/demo?step=step-03' }
    acceptance_checks: ['三条硬约束必须全程常显。', '风险-边界对应表必须完整落页。', '交付裁决结论必须常显。', '单页作答卡最多两张。']

  step-04:
    title: '参数范围不是硬约束'
    layout:
      template: 'constraint_role_split_board'
      regions:
        - { id: 'top', width: 'full', order: 1 }
        - { id: 'table', width: 'full', order: 2 }
        - { id: 'interaction', width: 'full', order: 3 }
    modules:
      - { id: 'range-formula', region: 'top', kind: 'formula-card', must_be_visible: true }
      - { id: 'role-summary', region: 'top', kind: 'summary-card', must_be_visible: true }
      - { id: 'role-table', region: 'table', kind: 'native-table', must_be_visible: true }
      - { id: 'role-task', region: 'interaction', kind: 'activity-card', must_be_visible: false }
    content_blocks:
      range_formula:
        title: '参数范围'
        body: '1≤K≤6, 4≤T≤15, 0.15≤α≤0.85'
      role_summary:
        text: '参数范围负责结构可解释，硬约束负责结果可交付。'
      role_table:
        columns: ['设计对象', '在模型中的角色', '具体职责']
        rows:
          - ['$K,T,α$ 的结构解释', '参数范围', '维持固定结构可解释区间，告诉搜索只能在这一结构语义内移动']
          - ['超调、控制峰值、相角裕度', '硬约束', '结果越界时进入罚函数或直接判为不可行']
          - ['调节时间、ITAE、控制能量', '软目标', '在守住边界后继续争取更好表现']
          - ['ITSE、截止频率、幅值裕度', '复核项', '求解后解释为什么当前结果可信而不是偶然数值']
      role_task:
        title: '职责判断'
        prompt: '1≤K≤6 与 u_max≤7 分别在回答什么问题？'
    evidence_sequence: ['参数范围式', '核心结论', '模型分工表', '判断卡']
    interaction_spec:
      interaction_kind: 'activity_card_set'
      student_task: '区分参数范围与硬约束分别在回答什么问题。'
      activity_cards:
        - { id: 'role-task', prompt: '1≤K≤6 与 u_max≤7 分别在回答什么问题？', response_kind: 'fill_text', submit_scope: 'per_card', layout_span: 'full' }
    teacher_controls: { release_activity: 'teacher_toggle', open_browse: 'page_load_open', teacher_step_reveal: 'not_applicable', reveal_reference_answer: 'teacher_toggle' }
    student_access: { default_visibility: 'visible', activity_visibility: 'hidden', release_required: true, browse_required: false, can_view_problem_statement: true, can_view_derivation_steps: true, can_submit_without_browse: true }
    teacher_insight_spec: { widgets: ['card_completion_rate', 'response_bucket_distribution'] }
    telemetry_spec: { summary_fields: ['cardSubmitted', 'resultState', 'timeOnStep'], misconception_tags: ['range_equals_delivery', 'constraint_role_confusion'] }
    ai_context_spec: { page_goal: '只做职责区分，不重复上一页的边界论证。' }
    preview_contract: { demo_path: '/interactive-learning/courses/unit-4-5-constraint-aware-parameter-optimization/student/demo?step=step-04' }
    acceptance_checks: ['参数范围式与核心结论必须同屏常显。', '模型分工表必须完整。', '本页最多一张判断卡。']

  step-05:
    title: '罚函数把边界写进模型'
    layout:
      template: 'formula_reveal_board'
      regions:
        - { id: 'formula', width: 'full', order: 1 }
        - { id: 'explain', width: 'full', order: 2 }
        - { id: 'summary', width: 'full', order: 3 }
    modules:
      - { id: 'jfree-card', region: 'formula', kind: 'formula-card', must_be_visible: true }
      - { id: 'jcon-card', region: 'formula', kind: 'formula-card', must_be_visible: true }
      - { id: 'penalty-card', region: 'formula', kind: 'formula-card', must_be_visible: true }
      - { id: 'explain-reveal', region: 'explain', kind: 'step-reveal', must_be_visible: true }
      - { id: 'rule-conclusion', region: 'summary', kind: 'summary-card', must_be_visible: true }
    content_blocks:
      jfree_card:
        title: '自由目标'
        body: 'J_free(θ)=w_1·t_s(θ)/40+w_2·ITAE(θ)/ITAE_0+w_3·ITSE(θ)/ITSE_0+w_4·E_u(θ)/E_{u,0}'
      jcon_card:
        title: '带约束总代价'
        body: 'J_con(θ)=J_free(θ)+P(θ)'
      penalty_card:
        title: '罚函数'
        body: 'P(θ)=50max(0,M_p-20)^2+20max(0,u_max-7)^2+5max(0,45-φ_m)^2'
      explain_reveal:
        steps:
          - '只要三条硬约束都未越界，P(θ)=0，搜索仍按原有偏好推进。'
          - '一旦某一项越界，罚项开始增大，总代价不再只奖励更快或更省。'
          - '越界越严重，罚项增长越快，搜索会被推回可交付区域。'
      rule_conclusion:
        text: '偏好没变，规则变了。'
    evidence_sequence: ['J_free', 'J_con', 'P(θ)', '三层解释链', '结论句']
    interaction_spec:
      interaction_kind: 'teacher_reveal_only'
      student_task: '理解偏好和规则的分工。'
      step_reveal_policy: { min_layers: 3, local_click_to_continue: true }
    teacher_controls: { release_activity: 'not_applicable', open_browse: 'not_applicable', teacher_step_reveal: 'teacher_only', reveal_reference_answer: 'not_applicable' }
    student_access: { default_visibility: 'visible', release_required: false, browse_required: false, can_view_problem_statement: true, can_view_derivation_steps: false, can_submit_without_browse: false }
    teacher_insight_spec: { widgets: ['step_reveal_progress'] }
    telemetry_spec: { summary_fields: ['stepRevealCount', 'timeOnStep'], misconception_tags: ['penalty_as_new_preference'] }
    ai_context_spec: { page_goal: '固定“偏好没变，规则变了”，不提前进入求解器细节。' }
    preview_contract: { demo_path: '/interactive-learning/courses/unit-4-5-constraint-aware-parameter-optimization/student/demo?step=step-05' }
    acceptance_checks: ['三条公式本体必须常显。', '显影只作用于解释链，不作用于公式。', '“偏好没变，规则变了”必须常显。', '本页不得展开 fmincon 细节。']

  step-06:
    title: '求解器只消费五项定义'
    layout:
      template: 'solver_chain_board'
      regions:
        - { id: 'table', width: 'full', order: 1 }
        - { id: 'chain', width: 'full', order: 2 }
        - { id: 'summary', width: 'full', order: 3 }
        - { id: 'interaction', width: 'full', order: 4 }
    modules:
      - { id: 'solver-input-table', region: 'table', kind: 'native-table', must_be_visible: true }
      - { id: 'solver-chain', region: 'chain', kind: 'step-reveal', must_be_visible: true }
      - { id: 'solver-conclusion', region: 'summary', kind: 'summary-card', must_be_visible: true }
      - { id: 'solver-task', region: 'interaction', kind: 'activity-card', must_be_visible: false }
    content_blocks:
      solver_input_table:
        title: '表 5. 求解器真正消费的五项定义'
        columns: ['项目', '当前写法', '作用']
        rows:
          - ['对象', 'P_h(s)=0.01715/[s(s+0.1)(s+2.14375)]', '提供被控对象模型']
          - ['结构', 'C_h(s)=K(Ts+1)/(αTs+1)', '固定参数化形式']
          - ['起点与范围', 'x_0=[2.796,10,0.406]^T; lb=[1,4,0.15]^T; ub=[6,15,0.85]^T', '告诉搜索从哪里出发、能走到哪里']
          - ['objective', '自由目标项加权和', '告诉求解器想把什么继续压低']
          - ['nonlcon', 'M_p≤20%, max|u(t)|≤7, φ_m≥45°', '把交付边界写成可行性判定']
      solver_chain:
        steps:
          - '给出 x0、lb、ub。'
          - '写 objective。'
          - '写 nonlcon。'
          - '调用 fmincon。'
          - '得到 x_star。'
          - '把 x_star 翻译成 C_star。'
      solver_conclusion:
        text: '求解器只是在消费已经写清的问题定义，不会替我们决定边界来自哪里。'
      solver_task:
        prompt: '为什么本页的重点不是 API，而是五项定义？'
    evidence_sequence: ['表 5 的五项定义', '六步求解链', '收束句', '判断卡']
    interaction_spec:
      interaction_kind: 'teacher_reveal_only'
      student_task: '理解求解器只是在消费问题定义。'
      step_reveal_policy: { min_layers: 6, local_click_to_continue: true }
      activity_cards:
