      - { id: 'solver-conclusion', region: 'summary', kind: 'summary-card', must_be_visible: true }
      - { id: 'solver-task', region: 'interaction', kind: 'activity-card', must_be_visible: false }
    evidence_sequence: ['表5', '六步链', '结论', '判断卡']
    interaction_spec:
      interaction_kind: 'teacher_reveal_only'
      student_task: '理解求解器只是在消费问题定义。'
      step_reveal_policy: { min_layers: 6, local_click_to_continue: true }
      activity_cards:
        - { id: 'solver-task', prompt: '为什么本页重点不是 API，而是问题定义？', response_kind: 'fill_text', submit_scope: 'per_card', layout_span: 'full' }
    teacher_controls: { release_activity: 'teacher_toggle', open_browse: 'not_applicable', teacher_step_reveal: 'teacher_only', reveal_reference_answer: 'teacher_toggle' }
    student_access: { default_visibility: 'visible', activity_visibility: 'hidden', release_required: true, browse_required: false, can_view_problem_statement: true, can_view_derivation_steps: false, can_submit_without_browse: true }
    teacher_insight_spec: { widgets: ['step_reveal_progress', 'card_completion_rate'] }
    telemetry_spec: { summary_fields: ['stepRevealCount', 'cardSubmitted', 'timeOnStep'], misconception_tags: ['solver_as_magic'] }
    ai_context_spec: { page_goal: '把表 5 和六步求解链补足到可独立理解。' }
    preview_contract: { demo_path: '/interactive-learning/courses/unit-4-5-constraint-aware-parameter-optimization/student/demo?step=step-07' }
    acceptance_checks: ['表5第二列的公式必须可渲染。']

  step-08:
    title: '同一权重下，为什么会分出两组最优'
    layout:
      template: 'same_weight_compare_board'
      regions:
        - { id: 'controllers', width: 'full', order: 1 }
        - { id: 'evidence', width: 'full', order: 2 }
        - { id: 'summary', width: 'full', order: 3 }
        - { id: 'interaction', width: 'full', order: 4 }
    modules:
      - { id: 'controller-triple', region: 'controllers', kind: 'formula-card-row', must_be_visible: true }
      - { id: 'same-weight-table', region: 'evidence', kind: 'native-table', must_be_visible: true }
      - { id: 'same-weight-figure', region: 'evidence', kind: 'image-panel', must_be_visible: true }
      - { id: 'feasible-reveal', region: 'summary', kind: 'step-reveal', must_be_visible: true }
      - { id: 'feasible-conclusion', region: 'summary', kind: 'summary-card', must_be_visible: true }
      - { id: 'same-weight-task', region: 'interaction', kind: 'activity-card', must_be_visible: false }
    content_blocks:
      same_weight_figure: { runtime_media: '/course-runtime/lessons/4-5/media/4-5-ship-heading-same-weight-constraint-compare.png' }
    evidence_sequence: ['三条控制器', '表6', '比较图', '解释链', '结论']
    interaction_spec:
      interaction_kind: 'teacher_reveal_only'
      student_task: '理解同一权重下最优点为何迁移。'
      step_reveal_policy: { min_layers: 3, local_click_to_continue: true }
      activity_cards:
        - { id: 'same-weight-task', prompt: '为什么这里改写的是可行域，而不是权重语言？', response_kind: 'fill_text', submit_scope: 'per_card', layout_span: 'full' }
    teacher_controls: { release_activity: 'teacher_toggle', open_browse: 'not_applicable', teacher_step_reveal: 'teacher_only', reveal_reference_answer: 'teacher_toggle' }
    student_access: { default_visibility: 'visible', activity_visibility: 'hidden', release_required: true, browse_required: false, can_view_problem_statement: true, can_view_derivation_steps: false, can_submit_without_browse: true }
    teacher_insight_spec: { widgets: ['step_reveal_progress', 'card_completion_rate'] }
    telemetry_spec: { summary_fields: ['stepRevealCount', 'cardSubmitted', 'timeOnStep'], misconception_tags: ['weight_changed', 'best_point_static'] }
    ai_context_spec: { page_goal: '承载讲义6.3，解释可行域迁移。' }
