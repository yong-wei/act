    title: '权重影响：可行域不变时，收益会怎样被重新分配'
    layout:
      template: 'weight_tradeoff_board'
      regions:
        - { id: 'weights', width: 'full', order: 1 }
        - { id: 'table', width: 'full', order: 2 }
        - { id: 'figure', width: 'full', order: 3 }
        - { id: 'summary', width: 'full', order: 4 }
    modules:
      - { id: 'weight-row', region: 'weights', kind: 'formula-card-row', must_be_visible: true }
      - { id: 'weight-table', region: 'table', kind: 'native-table', must_be_visible: true }
      - { id: 'weight-figure', region: 'figure', kind: 'image-panel', must_be_visible: true }
      - { id: 'weight-summary', region: 'summary', kind: 'step-reveal', must_be_visible: true }
    content_blocks:
      weight_figure: { runtime_media: '/course-runtime/lessons/4-5/media/4-5-weight-sweep-constrained-summary.png' }
    evidence_sequence: ['三组权重', '表7', '权重扫掠图', '两条趋势']
    interaction_spec:
      interaction_kind: 'teacher_reveal_only'
      student_task: '理解约束内的收益如何被权重重新分配。'
      step_reveal_policy: { min_layers: 2, local_click_to_continue: true }
    teacher_controls: { release_activity: 'not_applicable', open_browse: 'not_applicable', teacher_step_reveal: 'teacher_only', reveal_reference_answer: 'not_applicable' }
    student_access: { default_visibility: 'visible', release_required: false, browse_required: false, can_view_problem_statement: true, can_view_derivation_steps: true, can_submit_without_browse: false }
    teacher_insight_spec: { widgets: ['step_reveal_progress'] }
    telemetry_spec: { summary_fields: ['stepRevealCount', 'timeOnStep'], misconception_tags: ['weight_means_anything_goes'] }
    ai_context_spec: { page_goal: '承载讲义6.4的权重重排证据。' }
    preview_contract: { demo_path: '/interactive-learning/courses/unit-4-5-constraint-aware-parameter-optimization/student/demo?step=step-09' }
