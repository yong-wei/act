    ai_context_spec: { page_goal: '回收本课三条判断链，并把去向收束到 4-6。' }
    preview_contract: { demo_path: '/interactive-learning/courses/unit-4-5-constraint-aware-parameter-optimization/student/demo?step=step-10' }
    acceptance_checks: ['三个题干必须常显。', '参考解释与错因反馈必须后置。', '收束不得扩成下一课正文。']
