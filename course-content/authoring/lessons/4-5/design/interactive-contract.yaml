    teacher_insight_spec: { widgets: ['card_completion_rate', 'top_misconceptions'] }
    telemetry_spec: { summary_fields: ['cardSubmitted', 'stepRevealCount', 'timeOnStep'], misconception_tags: ['more_conservative_only', 'single_metric_best'] }
    ai_context_spec: { page_goal: '解释收益与代价的再分配，避免空泛地说“更稳妥”。' }
    preview_contract: { demo_path: '/interactive-learning/courses/unit-4-5-constraint-aware-parameter-optimization/student/demo?step=step-08' }
    acceptance_checks: ['表头、三方案名称和核心指标必须常显。', '结论链可显影，但不能退化成空泛稳妥叙述。', '单页作答卡不超过两张。']

  step-09:
    title: '当前结果可接受，但结构差异已经露头'
    layout:
      template: 'residual_risk_board'
      regions:
        - { id: 'criteria', width: 'full', order: 1 }
        - { id: 'evidence', width: 'full', order: 2 }
        - { id: 'summary', width: 'full', order: 3 }
    modules:
      - { id: 'acceptance-criteria', region: 'criteria', kind: 'summary-card', must_be_visible: true }
      - { id: 'margin-warning', region: 'criteria', kind: 'formula-card', must_be_visible: true }
      - { id: 'structure-controllers', region: 'evidence', kind: 'formula-card-row', must_be_visible: true }
      - { id: 'structure-table', region: 'evidence', kind: 'native-table', must_be_visible: true }
      - { id: 'structure-figure', region: 'evidence', kind: 'image-panel', must_be_visible: true }
      - { id: 'not-final-conclusion', region: 'summary', kind: 'summary-card', must_be_visible: true }
      - { id: 'forward-link', region: 'summary', kind: 'summary-card', must_be_visible: true }
      - { id: 'weight-sweep-note', region: 'summary', kind: 'step-reveal', must_be_visible: true }
    content_blocks:
      acceptance_criteria:
        bullets:
          - '参数仍能回到当前结构机理上解释。'
          - '超调、控制峰值和相角裕度三条边界全部守住。'
          - '改进收益能够在统一证据下被读出来。'
      margin_warning:
        title: '余量告警'
        body: 'u_max*=6.996≈7'
        note: '当前结构仍成立，但余量并不宽松。'
      structure_controllers:
        formulas:
          - 'C_{LL}^*(s)=1.7679(10.4676s+1)/(2.6452s+1)'
          - 'C_{PID}^*(s)=0.3205(1+1/(137.3s)+100.0s/(5.0s+1))'
      structure_table:
        title: '表 8. 同一主案例下，不同结构的最优解对比'
        columns: ['方案', '调节时间 / s', 'ITAE', 'ITSE', '控制能量', '控制峰值', '相角裕度 / deg', '超调 / %']
