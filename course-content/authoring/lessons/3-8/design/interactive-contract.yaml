      reveal_reference_answer: separate_toggle
      instructor_demo_tools:
        - show_correct_anchors
    student_access:
      default_visibility: hidden
      release_required: true
      browse_required: false
      can_view_problem_statement: true
      can_view_derivation_steps: true
      can_submit_without_browse: true
    telemetry_spec:
      summary_fields:
        - labelResultStates
        - selectedHotspots
      misconception_tags:
        - wc_equals_bandwidth
        - bode_as_another_rule
    teacher_insight_spec:
      widgets:
        - common_mislabels
        - anchor_error_heatmap
      aggregation: step_level
    ai_context_spec:
      page_goal: 把 Bode 判稳放回与 Nyquist 同一条稳定边界链。
      allowed_scope:
        - ωc
        - ωπ
        - PM
        - GM
