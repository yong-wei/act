contract_version: '2.2'
lesson_id: '3-8'
course_title: '3-8：频域判别与跨域综合语言'
course_route_segment: 'unit-3-8-frequency-domain-translation-judgment'
design_acceptance_focus:
  - '学生脱离讲稿后，仍能基于当前页面理解知识对象、判断动作和主线位置。'
  - '逐步披露只隐藏步骤，不隐藏题面、对象、目标指标与结论桥接。'
  - '曲线图默认升级为可复现讲义基线态、且带读图口令的互动面板。'
preview_mode:
  default_entry: 'student_demo'
  student_demo_base_path: '/interactive-learning/courses/unit-3-8-frequency-domain-translation-judgment/student/demo'
  teacher_preview_panel_note: '教师预览只检查课堂骨架；默认预览路径仍以学生演示页为准。'
telemetry_strategy: 'step_level_learning_evidence'
teacher_insight_strategy: 'misconception_and_progress_dual_track'
required_step_fields:
  - 'layout'
  - 'modules'
  - 'content_blocks'
  - 'evidence_sequence'
  - 'interaction_spec'
  - 'teacher_controls'
  - 'student_access'
  - 'telemetry_spec'
  - 'teacher_insight_spec'
  - 'ai_context_spec'
  - 'preview_contract'
  - 'acceptance_checks'
steps:
  step-01:
    title: '路径定位：`3-8` 为什么不是新章'
    layout:
      template: 'map_hero_slide'
      regions:
        - id: 'header'
          width: 'full'
          order: 1
        - id: 'lead'
          width: 'full'
          order: 2
        - id: 'summary'
          width: 'full'
          order: 3
    modules:
      - id: 'stage-map'
        region: 'lead'
        kind: 'stage-map'
        must_be_visible: true
      - id: 'core-question-card'
        region: 'lead'
        kind: 'question-card'
        must_be_visible: true
      - id: 'boundary-card'
        region: 'summary'
        kind: 'boundary-card'
        must_be_visible: true
    content_blocks:
      - id: 'path'
        type: 'plain_text'
        title: '路径定位'
        body: '固定高亮 3-5 -> 3-7 -> 3-8 -> 3-9，并写清 3-8 负责把前述结构变化统一翻译到频域判断语言。'
      - id: 'question'
        type: 'plain_text'
        title: '主问题'
        body: '为什么增益、零点、极点和积分补偿会在频域里留下不同指纹，这些指纹又如何接到稳定判断与工程决策。'
      - id: 'boundary'
        type: 'bullet_list'
        title: '边界'
        items:
          - '不重讲模块 2 的作图基础。'
          - '不提前进入模块 4 的完整整定。'
    evidence_sequence:
      - '路径图'
      - '主问题卡'
      - '边界卡'
    interaction_spec:
      interaction_kind: 'none'
      student_task: '只阅读，不提交。'
      step_reveal_policy:
        mode: 'none'
    teacher_controls:
      release_activity: 'not_applicable'
      open_browse: 'not_applicable'
      teacher_step_reveal: 'not_applicable'
      reveal_reference_answer: 'not_applicable'
      instructor_demo_tools:
        - 'highlight_path_node'
    student_access:
      default_visibility: 'visible'
      release_required: false
      browse_required: false
      can_view_problem_statement: true
      can_view_derivation_steps: true
      can_submit_without_browse: true
    telemetry_spec:
      summary_fields:
        - 'viewed'
        - 'timeOnStep'
        - 'teacherFollowSync'
      result_policy: 'no_submission'
    teacher_insight_spec:
      widgets:
        - 'view_count'
        - 'sync_status'
      aggregation: 'step_level'
    ai_context_spec:
      page_goal: '明确 3-8 在模块 3 中的路径位置和主问题。'
      allowed_scope:
        - '3-5/3-7/3-8/3-9 的关系'
        - '课程边界'
      forbidden_scope:
        - '提前展开 Nyquist 与 Bode 公式细节'
      canonical_facts:
        - '3-8 不是新章孤岛。'
        - '本课的任务是建立统一判断语言。'
    preview_contract:
      route_kind: 'student_demo'
      demo_path: '/interactive-learning/courses/unit-3-8-frequency-domain-translation-judgment/student/demo?step=step-01'
      must_match_student_page: true
    acceptance_checks:
      - '首屏必须同时看到路径图、主问题卡和边界卡。'
      - '不依赖教师口头补充，学生也能说出 3-8 在模块 3 中的位置。'

  step-02:
    title: '统一翻译器：结构变化如何接到稳定边界与闭环后果'
    layout:
      template: 'translation_chain_board'
      regions:
        - id: 'chain'
          width: 'full'
          order: 1
        - id: 'method'
          width: 'full'
          order: 2
        - id: 'objective'
          width: 'full'
          order: 3
    modules:
      - id: 'translation-chain-card'
        region: 'chain'
        kind: 'formula-chain'
        must_be_visible: true
      - id: 'three-step-method-card'
        region: 'method'
        kind: 'process-card'
        must_be_visible: true
      - id: 'objective-list'
        region: 'objective'
        kind: 'objective-list'
        must_be_visible: true
      - id: 'boundary-note'
        region: 'objective'
        kind: 'boundary-card'
        must_be_visible: true
    content_blocks:
      - id: 'chain'
        type: 'plain_text'
        title: '统一翻译链'
        body: '结构变化 -> 开环频率特性改写 -> 稳定边界变化 -> 闭环性能后果。'
      - id: 'method'
        type: 'bullet_list'
        title: '三步判断法'
        items:
          - '先判断哪一段频带被改写。'
          - '再判断系统离稳定边界更近还是更远。'
          - '最后把频域量读回速度、超调、稳态精度和高频代价。'
      - id: 'objective'
        type: 'bullet_list'
        title: '课程目标'
        items:
          - '会把结构变化翻译成频域指纹。'
          - '会按 P -> N -> Z 的顺序做 Nyquist 基本判稳。'
          - '会用 Bode 图读出截止频率与稳定裕度。'
          - '会按三频段读回闭环性能。'
    evidence_sequence:
      - '统一翻译链'
      - '三步判断法'
      - '课程目标与边界'
    interaction_spec:
      interaction_kind: 'none'
      student_task: '只建立判断框架，不提交。'
      step_reveal_policy:
        mode: 'none'
    teacher_controls:
      release_activity: 'not_applicable'
      open_browse: 'not_applicable'
      teacher_step_reveal: 'not_applicable'
      reveal_reference_answer: 'not_applicable'
      instructor_demo_tools:
        - 'highlight_chain_node'
    student_access:
      default_visibility: 'visible'
      release_required: false
      browse_required: false
      can_view_problem_statement: true
      can_view_derivation_steps: true
      can_submit_without_browse: true
    telemetry_spec:
      summary_fields:
        - 'viewed'
        - 'timeOnStep'
      result_policy: 'no_submission'
    teacher_insight_spec:
      widgets:
        - 'view_count'
      aggregation: 'step_level'
    ai_context_spec:
      page_goal: '让学生在进入细节前先知道本课按什么逻辑推进。'
      allowed_scope:
        - '翻译链'
        - '三步判断法'
        - '本课目标'
      forbidden_scope:
        - '代替学生完成后续例题'
      canonical_facts:
        - '频域术语不是散点，而是同一判断链上的节点。'
    preview_contract:
      route_kind: 'student_demo'
      demo_path: '/interactive-learning/courses/unit-3-8-frequency-domain-translation-judgment/student/demo?step=step-02'
      must_match_student_page: true
    acceptance_checks:
      - '翻译链、三步判断法和课程目标必须同页可见。'
      - '学生不看讲稿也能知道本课的判断顺序。'

  step-03:
    title: '前测：四类典型误判先暴露出来'
    layout:
      template: 'question_stack'
      regions:
        - id: 'prompt'
          width: 'full'
          order: 1
        - id: 'questions'
          width: 'full'
          order: 2
        - id: 'notes'
          width: 'full'
          order: 3
    modules:
      - id: 'misconception-list'
        region: 'prompt'
        kind: 'bullet-card'
        must_be_visible: true
      - id: 'pretest-card-group'
        region: 'questions'
        kind: 'quiz-group'
        must_be_visible: true
      - id: 'reason-record'
        region: 'notes'
        kind: 'reason-record'
        must_be_visible: true
      - id: 'ai-lock-note'
        region: 'notes'
        kind: 'notice-card'
        must_be_visible: true
    content_blocks:
      - id: 'misconceptions'
        type: 'bullet_list'
        title: '四类误判'
        items:
          - '只看幅值，不看频带与相位。'
          - 'Nyquist 判稳跳过 P，直接看图形。'
          - '把截止频率更大直接等同于系统更好。'
          - '把非最小相对象理解成可以靠更大带宽硬压过去。'
      - id: 'ai_note'
        type: 'plain_text'
        title: 'AI 锁定'
        body: '必须先完成首答，之后才允许进入 AI 对照。'
    evidence_sequence:
      - '误判清单'
      - '前测题组'
      - '理由记录与 AI 锁定提示'
    interaction_spec:
      interaction_kind: 'quiz_group'
      student_task: '完成四道前测题，并为每题提交一句理由。'
      step_reveal_policy:
        mode: 'none'
      activity_cards:
        - id: 'card-03-a'
          prompt: '频域判断是否只要看曲线有没有抬高。'
          response_kind: 'single_choice'
          submit_scope: 'per_card'
          layout_span: 'half'
        - id: 'card-03-b'
          prompt: 'Nyquist 判稳是否可以不先数开环右半平面极点。'
          response_kind: 'single_choice'
          submit_scope: 'per_card'
          layout_span: 'half'
        - id: 'card-03-c'
          prompt: '截止频率更大是否自动意味着系统更优。'
          response_kind: 'single_choice'
          submit_scope: 'per_card'
          layout_span: 'half'
        - id: 'card-03-d'
          prompt: '非最小相对象是否只要继续提带宽就能解决问题。'
          response_kind: 'single_choice'
          submit_scope: 'per_card'
          layout_span: 'half'
    teacher_controls:
      release_activity: 'separate_toggle'
      open_browse: 'not_applicable'
      teacher_step_reveal: 'not_applicable'
      reveal_reference_answer: 'separate_toggle'
      instructor_demo_tools:
        - 'show_misconception_distribution'
    student_access:
      default_visibility: 'hidden'
      release_required: true
      browse_required: false
      can_view_problem_statement: true
      can_view_derivation_steps: true
      can_submit_without_browse: true
    telemetry_spec:
      summary_fields:
        - 'attemptCount'
        - 'resultState'
        - 'errorBucket'
      misconception_tags:
        - 'only_watch_magnitude'
        - 'nyquist_skip_p'
        - 'wc_equals_everything'
        - 'nmp_push_bandwidth'
    teacher_insight_spec:
      widgets:
        - 'question_distribution'
        - 'top_misconceptions'
      aggregation: 'step_level'
    ai_context_spec:
      page_goal: '先暴露本课最常见的误判，再进入正式内容。'
      allowed_scope:
        - '误判纠偏'
        - '错因归类'
      forbidden_scope:
        - '代做后续例题'
      canonical_facts:
        - '必须先首答，再看 AI 对照。'
    preview_contract:
      route_kind: 'student_demo'
      demo_path: '/interactive-learning/courses/unit-3-8-frequency-domain-translation-judgment/student/demo?step=step-03'
      must_match_student_page: true
    acceptance_checks:
      - '误判清单必须先于前测题组出现。'
      - '教师端必须能按四类误判聚合结果。'

  step-04:
    title: '四类结构变化总表：先看哪一段频带，再谈收益与代价'
    layout:
      template: 'table_explain_board'
      regions:
        - id: 'table'
          width: 'full'
          order: 1
        - id: 'notes'
          width: 'full'
          order: 2
        - id: 'focus'
          width: 'full'
          order: 3
    modules:
      - id: 'fingerprint-table'
        region: 'table'
        kind: 'comparison-table'
        must_be_visible: true
      - id: 'frequency-band-note'
        region: 'notes'
        kind: 'summary-card'
        must_be_visible: true
      - id: 'row-focus-toggle'
        region: 'focus'
        kind: 'row-focus-toggle'
        must_be_visible: true
    content_blocks:
      - id: 'columns'
        type: 'bullet_list'
        title: '总表字段'
        items:
          - '结构变化'
          - '主要改写频带'
          - '幅频与相频主变化'
          - '典型收益'
          - '典型代价'
      - id: 'band_note'
        type: 'plain_text'
        title: '阅读口令'
        body: '任何结构变化都先回答“哪一段频带先被改写”，再回答“换来什么、付出什么”。'
    evidence_sequence:
      - '完整总表'
      - '频带职责提示'
      - '行聚焦控件'
    interaction_spec:
      interaction_kind: 'row_focus_toggle'
      student_task: '切换高亮四类变化中的任意一行，辅助阅读，不提交。'
      step_reveal_policy:
        mode: 'none'
    teacher_controls:
      release_activity: 'not_applicable'
      open_browse: 'not_applicable'
      teacher_step_reveal: 'not_applicable'
      reveal_reference_answer: 'not_applicable'
      instructor_demo_tools:
        - 'highlight_selected_row'
    student_access:
      default_visibility: 'visible'
      release_required: false
      browse_required: false
      can_view_problem_statement: true
      can_view_derivation_steps: true
      can_submit_without_browse: true
    telemetry_spec:
      summary_fields:
        - 'viewed'
        - 'focusedRow'
      result_policy: 'no_submission'
    teacher_insight_spec:
      widgets:
        - 'focus_row_heatmap'
      aggregation: 'step_level'
    ai_context_spec:
      page_goal: '先用总表稳住四类变化的整体骨架。'
      allowed_scope:
        - '结构变化总表'
        - '频带职责'
      forbidden_scope:
        - '从总表直接跳到控制器选型'
      canonical_facts:
        - '四类变化必须先以总表稳定呈现，再进入图像互动。'
    preview_contract:
      route_kind: 'student_demo'
      demo_path: '/interactive-learning/courses/unit-3-8-frequency-domain-translation-judgment/student/demo?step=step-04'
      must_match_student_page: true
    acceptance_checks:
      - '总表在无交互状态下也必须完整可读。'
      - '学生不看讲稿也能说出四类变化对应的首要频带。'

  step-05:
    title: '曲线互动页：四类结构变化为什么留下不同频域指纹'
    layout:
      template: 'curve_compare_lab'
      regions:
        - id: 'selector'
          width: 'full'
          order: 1
        - id: 'figure'
          width: 'full'
          order: 2
        - id: 'cards'
          width: 'full'
          order: 3
    modules:
      - id: 'change-selector'
        region: 'selector'
        kind: 'tab-selector'
        must_be_visible: true
      - id: 'fingerprint-2x2-panel'
        region: 'figure'
        kind: 'interactive-figure-panel'
        must_be_visible: true
      - id: 'band-overlay-strip'
        region: 'figure'
        kind: 'overlay-strip'
        must_be_visible: true
      - id: 'activity-card-row'
        region: 'cards'
        kind: 'activity-card-row'
        must_be_visible: true
    content_blocks:
      - id: 'reading_prompt'
        type: 'bullet_list'
        title: '读图口令'
        items:
          - '先看当前变化是哪一类。'
          - '再看低频 / 中频 / 高频哪一段先被改写。'
          - '最后看这会如何改写稳定边界和闭环后果。'
      - id: 'panel_note'
        type: 'plain_text'
        title: '面板说明'
        body: '固定 2×2：左上幅频、右上相频、左下根轨迹、右下时域；默认状态必须复现讲义静态图义。'
    evidence_sequence:
      - '读图口令'
      - '变化类型切换'
      - '2×2 面板'
      - '频带罩层'
      - '独立作答卡'
    interaction_spec:
      interaction_kind: 'curve_compare_panel'
      student_task: '切换四类结构变化，并完成频带、收益、代价三张独立作答卡。'
      step_reveal_policy:
        mode: 'none'
      activity_cards:
        - id: 'card-05-a'
          prompt: '当前变化优先改写哪一段频带。'
          response_kind: 'single_choice'
          submit_scope: 'per_card'
          layout_span: 'one_third'
        - id: 'card-05-b'
          prompt: '这类变化首先换来什么收益。'
          response_kind: 'multi_choice'
          submit_scope: 'per_card'
          layout_span: 'one_third'
        - id: 'card-05-c'
          prompt: '这类变化最可能带来什么代价。'
          response_kind: 'match'
          submit_scope: 'per_card'
          layout_span: 'one_third'
    interactive_figure_spec:
      baseline_media:
        - '3-8-gain-effect.png'
        - '3-8-zero-effect.png'
        - '3-8-pole-effect.png'
        - '3-8-rhp-zero-effect.png'
      default_variant: 'gain'
      panel_layout: '2x2_fixed'
      overlays:
        - 'low_mid_high_band'
        - 'margin_hint'
      controls:
        - 'change_toggle'
        - 'band_overlay_toggle'
        - 'metric_hint_toggle'
      question_prompt: '当前结构变化先改哪一段频带，它带来的主要收益和代价分别是什么。'
    teacher_controls:
      release_activity: 'separate_toggle'
      open_browse: 'always_on'
      teacher_step_reveal: 'not_applicable'
      reveal_reference_answer: 'separate_toggle'
      instructor_demo_tools:
        - 'lock_change_variant'
        - 'toggle_band_overlay'
    student_access:
      default_visibility: 'visible'
      release_required: true
      browse_required: false
      can_view_problem_statement: true
      can_view_derivation_steps: true
      can_submit_without_browse: true
    telemetry_spec:
      summary_fields:
        - 'selectedVariant'
        - 'selectedBand'
        - 'cardResultStates'
      misconception_tags:
        - 'cannot_locate_frequency_band'
        - 'ignore_phase_cost'
    teacher_insight_spec:
      widgets:
        - 'variant_distribution'
        - 'band_error_heatmap'
      aggregation: 'step_level'
    ai_context_spec:
      page_goal: '把静态四图升级为可比、可读、可提交证据的曲线面板。'
      allowed_scope:
        - '四类结构变化'
        - '频带'
        - '收益与代价'
      forbidden_scope:
        - '从面板直接跳到控制器推荐'
      canonical_facts:
        - '曲线图不是装饰，而是用来回答“哪段频带先被改写”。'
    preview_contract:
      route_kind: 'student_demo'
      demo_path: '/interactive-learning/courses/unit-3-8-frequency-domain-translation-judgment/student/demo?step=step-05'
      must_match_student_page: true
    acceptance_checks:
      - '默认面板必须复现讲义静态图义，而不是另起一套视觉逻辑。'
      - '学生不看讲稿，也能知道先看哪张子图、回答哪三个判断问题。'

  step-06:
    title: '例题 1：先从哪一段频带开始判断结构变化'
    layout:
      template: 'worked_example_lab'
      regions:
        - id: 'problem'
          width: 'full'
          order: 1
        - id: 'reveal'
          width: 'full'
          order: 2
        - id: 'activity'
          width: 'full'
          order: 3
    modules:
      - id: 'problem-statement-card'
        region: 'problem'
        kind: 'worked-example-card'
        must_be_visible: true
      - id: 'given-change-list'
        region: 'problem'
        kind: 'condition-list'
        must_be_visible: true
      - id: 'step-reveal-column'
        region: 'reveal'
        kind: 'step-reveal-column'
        must_be_visible: true
      - id: 'activity-card-grid'
        region: 'activity'
        kind: 'activity-card-grid'
        must_be_visible: true
      - id: 'reference-answer-card'
        region: 'activity'
        kind: 'reference-answer-card'
        must_be_visible: true
    content_blocks:
      - id: 'problem'
        type: 'plain_text'
        title: '完整题面'
        body: '分别对 4 倍增益、左半平面零点 1+s/0.8、原点积分极点三种变化，判断哪种先改写低频、哪种先改写中频，并说明各自收益与代价。'
      - id: 'reveal_steps'
        type: 'bullet_list'
        title: '显影链'
        items:
          - '先判哪一段频带先被改写。'
          - '再判断会带来什么收益。'
