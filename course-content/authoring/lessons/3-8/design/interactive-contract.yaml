  step-06:
    title: 例题 1：先从哪一段频带开始判断结构变化
    layout:
      template: worked_example_lab
      regions:
        - id: problem
          width: full
          order: 1
        - id: reveal
          width: full
          order: 2
        - id: activity
          width: full
          order: 3
    modules:
      - id: problem-statement-card
        region: problem
        kind: worked-example-card
        must_be_visible: true
        payload:
          title: 完整题面
          text: 设某单位负反馈系统原始开环频率特性已知，现在分别施加：增益扩大为 4 倍；引入左半平面零点 1+s/0.8；在原点增加一个积分极点。分别判断哪种变化最先改写低频，哪种最先改写中频，并说明每种变化的主要收益和代价。
      - id: given-change-list
        region: problem
        kind: condition-list
        must_be_visible: true
        payload:
          title: 三种结构变化
          items:
            - 增益扩大为 4 倍。
            - 引入左半平面零点 1+s/0.8。
            - 在原点增加一个积分极点。
      - id: step-reveal-column
        region: reveal
        kind: step-reveal-column
        must_be_visible: true
        payload:
          title: 显影链
          items: &a1
            - 4 倍增益使幅频曲线整体上移，第一观察重点是截止频率是否右移，收益是速度提高，代价常是稳定余量减小。
            - 左半平面零点主要改写中频，相位提前和高频抬升同时出现，收益是动态更积极，代价是高频负担上升。
            - 积分极点首先增强低频，改善稳态精度，再把中频相位余量压紧。
            - 结论：最先改写低频的是积分极点，最先改写中频的是左半平面零点，改写最均匀的是增益提升。
      - id: activity-card-grid
        region: activity
        kind: activity-card-grid
        must_be_visible: true
        payload:
          title: 作答区
      - id: reference-answer-card
        region: activity
        kind: reference-answer-card
        must_be_visible: true
        payload:
          title: 参考答案
          items:
            - 最先改写低频的是积分极点。
            - 最先改写中频的是左半平面零点。
            - 改写最均匀的是增益提升。
    content_blocks:
      - id: problem
        type: plain_text
        title: 完整题面
        body: 设某单位负反馈系统原始开环频率特性已知，现在分别施加：增益扩大为 4 倍；引入左半平面零点 1+s/0.8；在原点增加一个积分极点。分别判断哪种变化最先改写低频，哪种最先改写中频，并说明每种变化的主要收益和代价。
      - id: reveal_steps
        type: bullet_list
        title: 显影链
        items: *a1
    evidence_sequence:
      - 完整题面
      - 已知变化列表
      - 逐步显影链
      - 独立作答卡
      - 参考答案
    interaction_spec:
      interaction_kind: activity_cards
      student_task: 完成两张独立作答卡：低频归因与中频/收益代价归因。
      activity_card_rationale: 例题页需要保持“先判频带，再配对收益与代价”的解题顺序，因此拆成两张并排卡，避免题面在页内重复出现。
      step_reveal_policy:
        mode: teacher_or_browse_release
        problem_statement: always_visible
        derivation_steps: teacher_step_reveal
        reference_answer: separate_teacher_toggle
      activity_cards:
        - id: card-06-a
          prompt: 哪一种变化最先改写低频。
          response_kind: single_choice
          options:
            - value: gain
              label: 增益提升
            - value: lhp-zero
              label: 左半平面零点
            - value: integral
              label: 原点积分极点
          reference_answer: 原点积分极点最先指向低频补偿。
          submit_scope: per_card
          layout_span: half
        - id: card-06-b
          prompt: 哪一种变化最先改写中频，并带来“动态更积极但高频代价上升”的组合。
          response_kind: single_choice
          options:
            - value: gain
              label: 增益提升
            - value: lhp-zero
              label: 左半平面零点
            - value: integral
              label: 原点积分极点
          reference_answer: 左半平面零点主要改写中频，同时可能抬升高频代价。
          submit_scope: per_card
          layout_span: half
    teacher_controls:
      release_activity: separate_toggle
      open_browse: separate_toggle
      teacher_step_reveal: teacher_only
      reveal_reference_answer: separate_toggle
      instructor_demo_tools:
        - reveal_next_step
        - show_reference_answer
    student_access:
      default_visibility: hidden
      release_required: true
      browse_required: true
      can_view_problem_statement: true
      can_view_derivation_steps: false
      can_submit_without_browse: true
    telemetry_spec:
      summary_fields:
        - cardResultStates
        - stepRevealCount
      misconception_tags:
        - band_before_conclusion_missing
        - benefit_cost_mismatch
    teacher_insight_spec:
      widgets:
        - card_accuracy_distribution
        - step_reveal_usage
      aggregation: step_level
    ai_context_spec:
      page_goal: 让学生把“先判频带”真正用在一个完整例题上。
      allowed_scope:
        - 频带判断
        - 收益与代价
      forbidden_scope:
        - 把答案直接告诉学生而不经过逐步显影
      canonical_facts:
        - 题面必须始终可见。
        - 逐步披露只隐藏步骤，不隐藏问题。
    preview_contract:
      route_kind: student_demo
      demo_path: /interactive-learning/courses/unit-3-8-frequency-domain-translation-judgment/student/demo?step=step-06
      must_match_student_page: true
    acceptance_checks:
      - 学生在未打开讲稿时，也能完整知道例题对象、任务和判断顺序。
      - 作答卡必须按卡独立提交，不使用整页统一表单。
  step-07:
    title: 幅角原理：总转角、`P` 与 `Z` 在说什么
    layout:
      template: formula_story_board
      regions:
        - id: question
          width: full
          order: 1
        - id: formula
          width: full
          order: 2
        - id: note
          width: full
          order: 3
    modules:
      - id: question-card
        region: question
        kind: question-card
        must_be_visible: true
      - id: argument-principle-formula
        region: formula
        kind: formula-card
        must_be_visible: true
      - id: symbol-meaning-table
        region: formula
        kind: comparison-table
        must_be_visible: true
        payload:
          title: 幅角原理符号表
          columns:
            - 记号
            - 含义
            - 在闭环稳定分析中的作用
          rows:
            - - $P$
              - 路径内部极点数
              - 反映开环右半平面极点数
            - - $Z$
              - 路径内部零点数
              - 对应闭环右半平面极点数
            - - $\Delta \arg F(s)$
              - 映射曲线总转角
              - 反映函数值对原点的环绕
      - id: mini-summary-card
        region: note
        kind: summary-card
        must_be_visible: true
    content_blocks:
      - id: question
        type: plain_text
        title: 本页问题
        body: 为什么只要知道总转角、P 和 Z，就能把闭环稳定问题转成一个可数的问题。
      - id: formula
        type: formula_list
        title: 核心公式
        items:
          - Δarg F(s)=2π(Z-P)
      - id: summary
        type: plain_text
        title: 结论桥接
        body: 总转角不是抽象符号，而是通向 Nyquist 判稳的逻辑起点。
    evidence_sequence:
      - 本页问题
      - 总转角公式
      - P/Z 含义表
      - 结论桥接
    interaction_spec:
      interaction_kind: step_reveal
      student_task: 按显影顺序阅读解释，不提交答案。
      step_reveal_policy:
        mode: teacher_step_reveal
        problem_statement: always_visible
        derivation_steps: teacher_step_reveal
        reference_answer: not_applicable
      activity_cards:
        - id: step-07-activity
          prompt: 按显影顺序阅读解释，不提交答案。
          response_kind: single_choice
          options:
            - value: turning
              label: 总转角连接 P 与 Z
            - value: amplitude
              label: 幅值大小直接决定 Z
            - value: bandwidth
              label: 带宽直接等于 Z
          reference_answer: 总转角把 P 与 Z 连接起来，是 Nyquist 判稳的逻辑起点。
          submit_scope: per_card
          layout_span: full
    teacher_controls:
      release_activity: not_applicable
      open_browse: separate_toggle
      teacher_step_reveal: teacher_only
      reveal_reference_answer: not_applicable
      instructor_demo_tools:
        - reveal_symbol_meaning
    student_access:
      default_visibility: locked
      release_required: false
      browse_required: true
      can_view_problem_statement: true
      can_view_derivation_steps: false
      can_submit_without_browse: true
    telemetry_spec:
      summary_fields:
        - viewed
        - revealProgress
      result_policy: no_submission
    teacher_insight_spec:
      widgets:
        - reveal_completion_rate
      aggregation: step_level
    ai_context_spec:
      page_goal: 给 Nyquist 判据补上幅角原理的逻辑起点。
      allowed_scope:
        - 总转角
        - P/Z 含义
      forbidden_scope:
        - 提前跳到具体判稳例题答案
      canonical_facts:
        - 本页不求快算，只建立意义。
    preview_contract:
      route_kind: student_demo
      demo_path: /interactive-learning/courses/unit-3-8-frequency-domain-translation-judgment/student/demo?step=step-07
      must_match_student_page: true
    acceptance_checks:
      - 总转角公式与 P/Z 含义表必须在同一页。
      - 学生能说明这页是 Nyquist 判据的来路之一，而非孤立定义。
  step-08:
    title: 为什么取 `F(s)=1+L(s)`，为什么盯住 `(-1,0)`
    layout:
      template: derivation_compare_board
      regions:
        - id: formula
          width: full
          order: 1
        - id: geometry
          width: full
          order: 2
        - id: chain
          width: full
          order: 3
    modules:
      - id: auxiliary-function-card
        region: formula
        kind: formula-card
        must_be_visible: true
      - id: closed-loop-root-card
        region: formula
        kind: formula-card
        must_be_visible: true
      - id: critical-point-graphic
        region: geometry
        kind: comparison-graphic
        must_be_visible: true
        payload:
          path: 3-8-nyquist-quickcheck.png
          caption: 临界点 (-1,0) 是把 F 平面绕原点问题转写到 L 平面的等价观察点。
          src: 3-8-nyquist-quickcheck.png
      - id: reason-chain-sorter
        region: chain
        kind: reason-chain
        must_be_visible: true
    content_blocks:
      - id: auxiliary
        type: formula_list
        title: 辅助函数链
        items:
          - F(s)=1+G(s)H(s)
          - F(s)=0 等价于闭环特征方程成立
      - id: critical
        type: plain_text
        title: 临界点桥接
        body: 在 F 平面看原点，等价于在 G(s)H(s) 平面看 (-1,0)。
      - id: order
        type: bullet_list
        title: 固定顺序
        items:
          - 先数开环右半平面极点数 P。
          - 再数对临界点的包围数 N。
          - 最后算闭环右半平面极点数 Z。
    evidence_sequence:
      - 辅助函数链
      - 临界点图示
      - 固定顺序
      - 因果排序区
    interaction_spec:
      interaction_kind: reason_chain
      student_task: 把辅助函数、临界点和判稳顺序排成正确的因果链。
      step_reveal_policy:
        mode: teacher_or_browse_release
        problem_statement: always_visible
        derivation_steps: teacher_step_reveal
        reference_answer: separate_teacher_toggle
      activity_cards:
        - id: card-08-a
          prompt: 把 F(s)、闭环特征方程、(-1,0)、P/N/Z 顺序排成因果链。
          response_kind: drag_sort
          options:
            - value: auxiliary
              label: 写出 F(s)=1+L(s)
            - value: equation
              label: 把闭环特征方程写成 F(s)=0
            - value: geometry
              label: 转到 L(s) 平面观察 (-1,0)
            - value: counting
              label: 用 P/N/Z 得出稳定结论
          reference_answer: 顺序为辅助函数 -> 闭环特征方程 -> (-1,0) 几何点 -> P/N/Z 结论。
          submit_scope: per_card
          layout_span: full
    teacher_controls:
      release_activity: separate_toggle
      open_browse: separate_toggle
      teacher_step_reveal: teacher_only
      reveal_reference_answer: separate_toggle
      instructor_demo_tools:
        - reveal_next_formula_link
    student_access:
      default_visibility: hidden
      release_required: true
      browse_required: true
      can_view_problem_statement: true
      can_view_derivation_steps: false
      can_submit_without_browse: false
    telemetry_spec:
      summary_fields:
        - sortResultState
        - revealProgress
      misconception_tags:
        - nyquist_memorize_without_reason
        - critical_point_origin_confusion
    teacher_insight_spec:
      widgets:
        - chain_breakpoint_distribution
      aggregation: step_level
    ai_context_spec:
      page_goal: 让学生真正知道为什么 Nyquist 最终盯的是 (-1,0)。
      allowed_scope:
        - 辅助函数
        - 临界点
        - P/N/Z 顺序
      forbidden_scope:
        - 绕开因果链直接背结论
      canonical_facts:
        - Nyquist 判据的关键不是口号，而是等价链。
    preview_contract:
      route_kind: student_demo
      demo_path: /interactive-learning/courses/unit-3-8-frequency-domain-translation-judgment/student/demo?step=step-08
      must_match_student_page: true
    acceptance_checks:
      - F(s)=1+L(s)、(-1,0) 和 P/N/Z 固定顺序必须同页可见。
      - 学生不看讲稿，也能说出为什么会从原点等价到 (-1,0)。
  step-09:
    title: 例题 2：第一组 Nyquist 快速判稳题
    layout:
      template: worked_example_quadrant
      regions:
        - id: problem
          width: full
          order: 1
        - id: table
          width: full
          order: 2
        - id: activity
          width: full
          order: 3
    modules:
      - id: quickcheck-image
        region: problem
        kind: comparison-graphic
        must_be_visible: true
        payload:
          path: 3-8-nyquist-quickcheck.png
          caption: 四条 Nyquist 曲线需要逐一配对 P、N、Z 与稳定结论。
          src: 3-8-nyquist-quickcheck.png
      - id: pnz-table
        region: table
        kind: comparison-table
        must_be_visible: true
        payload:
          title: Nyquist 快速判稳 P/N/Z 表
          columns:
            - 图形
            - 对象 $L(s)$
            - $P$
            - $N$
            - $Z=P-N$
            - 结论
          rows:
            - - A
              - $6/[(s+1)(s+2)(s+4)]$
              - "0"
              - "0"
              - "0"
              - 开环稳定，闭环稳定
            - - B
              - $0.5(s+0.5)/[(s-1)(s+1)(s+3)]$
              - "1"
              - "0"
              - "1"
              - 开环不稳定，闭环仍不稳定
            - - C
              - $8(s+0.5)/[(s-1)(s+1)(s+3)]$
              - "1"
              - "1"
              - "0"
              - 开环不稳定，但闭环稳定
            - - D
              - $10(s-0.5)/[(s+1)(s+2)(s+8)]$
              - "0"
              - "0"
              - "0"
              - 含右半平面零点，但闭环仍稳定
      - id: matrix-choice-cards
        region: activity
        kind: activity-card-grid
        must_be_visible: true
        payload:
          title: 分组对照作答区
      - id: boundary-note
        region: activity
        kind: summary-card
        must_be_visible: true
        payload:
          block_key: boundary
          title: 边界提醒
          text: 右半平面零点不等于右半平面极点；快判也不能跳过 P/N/Z。
    content_blocks:
      - id: image
        type: media
        title: 例题 2 图组
        path: 3-8-nyquist-quickcheck.png
      - id: boundary
        type: plain_text
        title: 边界提醒
        body: 右半平面零点不等于右半平面极点；快判也不能跳过 P/N/Z。
    evidence_sequence:
      - Nyquist 四图题面
      - P/N/Z 判稳表
      - 边界提醒
      - 两张分组对照卡（A/B、C/D）
    interaction_spec:
      interaction_kind: matrix_choice_cards
      student_task: 通过两张分组对照卡完成 A/B 与 C/D 四个对象的 P/N/Z 判断。
      activity_card_rationale: 本页用两张分组对照卡覆盖 A/B 与 C/D 四个对象，既保留 P/N/Z 定位信息，也满足非测验页不超过两张作答卡。
      step_reveal_policy:
        mode: teacher_or_browse_release
        problem_statement: always_visible
        derivation_steps: teacher_step_reveal
        reference_answer: separate_teacher_toggle
      activity_cards:
        - id: card-09-a
          prompt: 对象 A 与 B 的 P、N、Z 关系分别说明闭环是否稳定。
          response_kind: single_choice
          options:
            - value: A-stable-B-unstable
              label: A 稳定，B 不稳定
            - value: A-unstable-B-stable
              label: A 不稳定，B 稳定
            - value: both-stable
              label: 二者都稳定
          reference_answer: "A: P=0,N=0,Z=0，闭环稳定；B: P=1,N=0,Z=1，闭环不稳定。"
          submit_scope: per_card
          layout_span: half
        - id: card-09-b
          prompt: 对象 C 与 D 的判断中，哪一句正确。
          response_kind: single_choice
          options:
            - value: C-stabilized-D-stable
              label: C 开环不稳定但闭环稳定；D 含右半平面零点但不自动失稳
            - value: D-auto-unstable
              label: D 因右半平面零点自动失稳
            - value: C-unstable-D-unstable
              label: C 与 D 都闭环不稳定
          reference_answer: C 通过正确包围使 Z=0；D 的右半平面零点不等同右半平面极点，不能自动判失稳。
