  step-11:
    title: Bode 判稳：截止频率、相角裕度和增益裕度
    layout:
      template: dual_graph_indicator_locator
      regions:
        - id: graph
          width: full
          order: 1
        - id: formula
          width: full
          order: 2
        - id: activity
          width: full
          order: 3
    modules:
      - id: bode-image
        region: graph
        kind: comparison-graphic
        must_be_visible: true
        payload:
          path: 3-8-bode-example.png
          caption: Bode 判稳同时读截止频率、相位穿越频率、PM 线和 GM 线。
          src: 3-8-bode-example.png
      - id: indicator-formula-list
        region: formula
        kind: formula-card
        must_be_visible: true
      - id: three-language-table
        region: formula
        kind: comparison-table
        must_be_visible: true
        payload:
          title: 同一稳定问题的三种语言
          columns:
            - 想回答的问题
            - 极点 / 根轨迹语言
            - Nyquist 语言
            - Bode 语言
          rows:
            - - 闭环是否稳定
              - 闭环极点是否落在左半平面
              - 是否按要求包围或不包围临界点 $(-1,0)$
              - 相角裕度、增益裕度是否为正
            - - 离临界状态还有多远
              - 极点离虚轴多近，根轨迹是否逼近虚轴
              - 曲线离临界点多近，包围趋势是否出现
              - 截止频率处离 $-180^\circ$ 多远；相位穿越处离 $0$ dB 多远
            - - 为什么结构变化会改写稳定性
              - 极点迁移方向变了
              - 对临界点的相对位置变了
              - 穿越频率和裕度一起变了
      - id: hotspot-labeling-zone
        region: activity
        kind: hotspot-labeling
        must_be_visible: true
    content_blocks:
      - id: image
        type: media
        title: Bode 判稳图
        path: 3-8-bode-example.png
      - id: equations
        type: formula_list
        title: 指标定义
        items:
          - "|L(jωc)|=1"
          - γ = 180° + ∠L(jωc)
          - Gm = 1 / |L(jωπ)|
      - id: slogan
        type: plain_text
        title: 固定口令
        body: 开环读余量，闭环看带宽。
