        payload:
          path: 3-8-three-band-overview.png
          caption: 低频看精度，中频看速度与稳定边界，高频看噪声和执行器代价。
          src: 3-8-three-band-overview.png
      - id: band-duty-table
        region: table
        kind: comparison-table
        must_be_visible: true
        payload:
          title: 三频段职责表
          columns:
            - 频段
            - 主要关注量
            - 常见工程含义
          rows:
            - - 低频段
              - 低频增益、误差衰减能力
              - 稳态精度、抗缓变扰动
            - - 中频段
              - 截止频率、相角裕度、增益裕度
              - 速度、超调、稳定边界
            - - 高频段
              - 衰减斜率、峰值放大
              - 噪声敏感性、执行器负担、鲁棒性
      - id: metric-readback-table
        region: table
        kind: comparison-table
        must_be_visible: true
        payload:
          title: 频域量读回闭环表现
          columns:
            - 频域量
            - 通常关心什么
            - 对闭环的典型提示
          rows:
            - - 带宽 $\omega_b$
              - 系统能有效跟踪多快的变化
              - 越大通常越快
            - - 相角裕度 $\gamma$
              - 离临界状态还有多远
              - 越大通常越稳
            - - 谐振峰值 $M_r$
              - 闭环峰化是否明显
              - 越大越容易超调、共振
            - - 谐振频率 $\omega_r$
              - 峰值出现在什么频带
              - 帮助判断共振集中哪一段
