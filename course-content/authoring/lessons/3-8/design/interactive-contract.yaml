          response_kind: single_choice
          options:
            - value: wc-line
              label: 幅值穿越 0 dB 的截止频率线
            - value: wpi-line
              label: 相位穿越 -180° 的频率线
            - value: pm-gap
              label: 截止频率处到 -180° 的相角间隔
            - value: gm-gap
              label: 相位穿越处到 0 dB 的幅值间隔
          reference_answer: 截止频率线是幅值穿越 0 dB；相位穿越频率线是相位穿越 -180°。
          submit_scope: per_card
          layout_span: half
        - id: card-11-b
          prompt: 标出 PM 线与 GM 线。
          response_kind: single_choice
          options:
            - value: wc-line
              label: 幅值穿越 0 dB 的截止频率线
            - value: wpi-line
              label: 相位穿越 -180° 的频率线
            - value: pm-gap
              label: 截止频率处到 -180° 的相角间隔
            - value: gm-gap
              label: 相位穿越处到 0 dB 的幅值间隔
          reference_answer: PM 是截止频率处相角余量；GM 是相位穿越频率处幅值余量。
          submit_scope: per_card
          layout_span: half
    interactive_figure_spec:
