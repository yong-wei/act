            - value: conclusion-first
              label: 先给好坏结论
            - value: gain-first
              label: 先调增益
          reference_answer: 完整链条从频带定位开始。
          submit_scope: per_card
          layout_span: half
        - id: card-19-b
          prompt: 使用 Nyquist 或 Bode 判断稳定边界时，应先保留哪类边界证据，再决定是否越过稳定侧。
          response_kind: single_choice
          options:
            - value: margin-or-pnz
              label: P/N/Z 或裕度正负
            - value: time-only
              label: 只看时域快慢
            - value: dc-only
              label: 只看低频增益
          reference_answer: 边界判断必须保留 P/N/Z 或裕度证据。
          submit_scope: per_card
          layout_span: half
        - id: card-19-c
          prompt: 当频域量显示系统更快但裕度变小时，如何把结果读回闭环表现。
          response_kind: single_choice
          options:
            - value: faster-risk
              label: 速度可能提高，但超调、振荡或鲁棒性风险上升
            - value: always-better
              label: 闭环一定更优
            - value: accuracy-only
              label: 只影响稳态精度
          reference_answer: 速度和裕度要共同读回闭环后果。
          submit_scope: per_card
          layout_span: half
        - id: card-19-d
          prompt: 工程目标从“尽快跟踪”改为“减小超调和执行器波动”时，完整判断链应如何重排。
          response_kind: single_choice
          options:
            - value: goal-band-boundary-closed
              label: 目标 -> 频带 -> 边界 -> 闭环读回
            - value: ai-first
              label: 先问 AI 再选方案
            - value: gain-only
              label: 只降低增益
          reference_answer: 目标切换后应重新走目标、频带、边界、闭环读回链。
          submit_scope: per_card
          layout_span: half
