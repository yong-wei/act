contract_version: "2.2"
lesson_id: 3-8
course_title: 3-8：频域判别与跨域综合语言
course_route_segment: unit-3-8-frequency-domain-translation-judgment
design_acceptance_focus:
  - 学生脱离讲稿后，仍能基于当前页面理解知识对象、判断动作和主线位置。
  - 逐步披露只隐藏步骤，不隐藏题面、对象、目标指标与结论桥接。
  - 曲线图默认升级为可复现讲义基线态、且带读图口令的互动面板。
preview_mode:
  default_entry: student_demo
  student_demo_base_path: /interactive-learning/courses/unit-3-8-frequency-domain-translation-judgment/student/demo
  teacher_preview_panel_note: 教师预览只检查课堂骨架；默认预览路径仍以学生演示页为准。
telemetry_strategy: step_level_learning_evidence
teacher_insight_strategy: misconception_and_progress_dual_track
required_step_fields:
  - layout
  - modules
  - content_blocks
  - evidence_sequence
  - interaction_spec
  - teacher_controls
  - student_access
  - telemetry_spec
  - teacher_insight_spec
  - ai_context_spec
  - preview_contract
  - acceptance_checks
steps:
  step-01:
    title: 导入：三类结构变化为什么需要统一频域语言
    layout:
      template: map_hero_slide
      regions:
        - id: header
          width: full
          order: 1
        - id: lead
          width: full
          order: 2
        - id: summary
          width: full
          order: 3
    modules:
      - id: known-change-card
        region: lead
        kind: question-card
        must_be_visible: true
      - id: engineering-question-card
        region: lead
        kind: process-card
        must_be_visible: true
      - id: core-question-card
        region: summary
        kind: question-card
        must_be_visible: true
    content_blocks:
      - id: known_changes
        type: bullet_list
        title: 已经见过的三类变化
        items:
          - 调大增益后，系统往往更快，但更容易靠近稳定边界。
          - 引入零点后，动态更积极，高频代价也可能抬升。
          - 加入积分或滞后后，稳态精度提高，中频相位余量会变紧。
      - id: engineering_questions
        type: bullet_list
        title: 导入问题
        items:
          - 结构变化首先改写低频、中频还是高频。
          - 这种改写最终落到速度、超调、稳态精度还是噪声代价上。
      - id: question
        type: plain_text
        title: 本课核心问题
        body: 为什么增益、零点、极点和积分补偿会在频域里留下不同指纹，这些指纹又怎样被翻译成稳定判断、性能读回与工程决策。
    evidence_sequence:
      - 已有三类结构变化
      - 两个工程问题
      - 本课核心问题
    interaction_spec:
      interaction_kind: none
      student_task: 只阅读，不提交。
      step_reveal_policy:
        mode: none
    teacher_controls:
      release_activity: not_applicable
      open_browse: not_applicable
      teacher_step_reveal: not_applicable
      reveal_reference_answer: not_applicable
      instructor_demo_tools:
        - highlight_path_node
    student_access:
      default_visibility: visible
      release_required: false
      browse_required: false
      can_view_problem_statement: true
      can_view_derivation_steps: true
      can_submit_without_browse: true
    telemetry_spec:
      summary_fields:
        - viewed
        - timeOnStep
        - teacherFollowSync
      result_policy: no_submission
    teacher_insight_spec:
      widgets:
        - view_count
        - sync_status
      aggregation: step_level
    ai_context_spec:
      page_goal: 基于前述增益、零点、积分和滞后知识提出新的频域判断问题。
      allowed_scope:
        - 3-5/3-7/3-8/3-9 的关系
        - 课程边界
      forbidden_scope:
        - 提前展开 Nyquist 与 Bode 公式细节
      canonical_facts:
        - 3-8 不是新章孤岛。
        - 本课的任务是建立统一判断语言。
    preview_contract:
      route_kind: student_demo
      demo_path: /interactive-learning/courses/unit-3-8-frequency-domain-translation-judgment/student/demo?step=step-01
      must_match_student_page: true
    acceptance_checks:
      - 首屏必须呈现已学变化、工程问题和本课核心问题。
      - 不得出现空的路径定位模块。
  step-02:
    title: 统一翻译器：结构变化如何接到稳定边界与闭环后果
    layout:
      template: translation_chain_board
      regions:
        - id: chain
          width: full
          order: 1
        - id: method
          width: full
          order: 2
        - id: objective
          width: full
          order: 3
    modules:
      - id: translation-chain-card
        region: chain
        kind: formula-chain
        must_be_visible: true
      - id: three-step-method-card
        region: method
        kind: process-card
        must_be_visible: true
      - id: objective-list
        region: objective
        kind: objective-list
        must_be_visible: true
    content_blocks:
      - id: chain
        type: plain_text
        title: 统一翻译链
        body: 结构变化 -> 开环频率特性改写 -> 稳定边界变化 -> 闭环性能后果。
      - id: method
        type: bullet_list
        title: 三步判断法
        items:
          - 识别变化主要改写的频带。
          - 判定系统离稳定边界更近还是更远。
          - 解释频域量如何读回速度、超调、稳态精度和噪声代价。
      - id: objective
        type: bullet_list
        title: 完成本次课程后，学习者能够
        items:
          - 区分增益、零点、极点和积分补偿在频域中的典型指纹。
          - 依据 P、N、Z 的关系判定 Nyquist 图对应的闭环稳定性。
          - 使用 Bode 图读出截止频率、相角裕度和增益裕度，并判断系统处于边界哪一侧。
          - 评价频带改写对闭环速度、超调、稳态精度和噪声代价的影响。
    evidence_sequence:
      - 统一翻译链
      - 三步判断法
      - 布鲁姆动词学习成果
    interaction_spec:
      interaction_kind: none
      student_task: 只建立判断框架，不提交。
      step_reveal_policy:
        mode: none
    teacher_controls:
      release_activity: not_applicable
      open_browse: not_applicable
      teacher_step_reveal: not_applicable
      reveal_reference_answer: not_applicable
      instructor_demo_tools:
        - highlight_chain_node
    student_access:
      default_visibility: visible
      release_required: false
      browse_required: false
      can_view_problem_statement: true
      can_view_derivation_steps: true
      can_submit_without_browse: true
    telemetry_spec:
      summary_fields:
        - viewed
        - timeOnStep
      result_policy: no_submission
    teacher_insight_spec:
      widgets:
        - view_count
      aggregation: step_level
    ai_context_spec:
      page_goal: 让学生在进入细节前先知道本课按什么逻辑推进。
      allowed_scope:
        - 翻译链
        - 三步判断法
        - 本课目标
      forbidden_scope:
        - 代替学生完成后续例题
      canonical_facts:
        - 频域术语不是散点，而是同一判断链上的节点。
    preview_contract:
      route_kind: student_demo
      demo_path: /interactive-learning/courses/unit-3-8-frequency-domain-translation-judgment/student/demo?step=step-02
      must_match_student_page: true
    acceptance_checks:
      - 翻译链、三步判断法和课程目标必须同页可见。
      - 学生不看讲稿也能知道本课的判断顺序。
  step-03:
    title: 前测：四类典型误判先暴露出来
    layout:
      template: question_stack
      regions:
        - id: prompt
          width: full
          order: 1
        - id: questions
          width: full
          order: 2
        - id: notes
          width: full
          order: 3
    modules:
      - id: misconception-list
        region: prompt
        kind: bullet-card
        must_be_visible: true
      - id: pretest-card-group
        region: questions
        kind: quiz-group
        must_be_visible: true
      - id: reason-record
        region: notes
        kind: reason-record
        must_be_visible: true
      - id: ai-lock-note
        region: notes
        kind: notice-card
        must_be_visible: true
    content_blocks:
      - id: misconceptions
        type: bullet_list
        title: 前测只检查进入本课所需的读图基础
        items:
          - 能否把频率响应读成幅值、相位和频带共同作用，而不是只看曲线高低。
          - 能否在 Bode 图上区分截止频率、相位穿越频率、相角裕度和增益裕度。
          - 能否把根轨迹中的“靠近虚轴”理解成稳定余量变小。
          - 能否说明积分补偿改善低频精度时，可能压缩中频相位余量。
      - id: reason_note
        type: plain_text
        title: 作答要求
        body: 每题先选判断，再写一句理由。前测不考本单元尚未展开的 Nyquist 判据细节。
    evidence_sequence:
      - 前置基础说明
      - 前测题组
      - 理由记录
    interaction_spec:
      interaction_kind: quiz_group
      student_task: 完成四道前置基础题，检查频率响应、Bode 读图、稳定余量和积分补偿代价。
      activity_card_rationale: 前测页属于题组页，四张卡分别测试本课需要的前置基础，不提前考本单元尚未讲解的判据。
      step_reveal_policy:
        mode: none
      activity_cards:
        - id: card-03-a
          prompt: 频率响应读图时，是否需要同时看幅值、相位和所在频带。
          response_kind: single_choice
          options:
            - value: yes
              label: 需要同时看
            - value: magnitude-only
              label: 只看幅值
            - value: phase-only
              label: 只看相位
          reference_answer: 需要。频率响应的判断至少同时包含幅值、相位和频带位置。
          submit_scope: per_card
          layout_span: half
        - id: card-03-b
          prompt: Bode 图中，截止频率右移是否只能说明速度倾向，不能单独说明综合性能更优。
          response_kind: single_choice
          options:
            - value: yes
              label: 是
            - value: no
              label: 不是
            - value: only-stability
              label: 只说明稳定性更强
          reference_answer: 是。截止频率右移通常提示速度变化，但还要结合裕度和高频代价。
          submit_scope: per_card
          layout_span: half
        - id: card-03-c
          prompt: 根轨迹或闭环极点更靠近虚轴时，稳定余量通常如何变化。
          response_kind: single_choice
          options:
            - value: smaller
              label: 余量变小
            - value: larger
              label: 余量变大
            - value: unrelated
              label: 无法形成任何提示
          reference_answer: 通常表示稳定余量变小，动态也更容易出现较大超调或振荡。
          submit_scope: per_card
          layout_span: half
        - id: card-03-d
          prompt: 积分补偿改善低频稳态精度时，最需要警惕哪类频域代价。
          response_kind: single_choice
          options:
            - value: mid-phase
              label: 中频相位余量被压缩
            - value: low-loss
              label: 低频增益必然降低
            - value: no-cost
              label: 没有代价
          reference_answer: 最需要警惕中频相位余量被压缩。
          submit_scope: per_card
          layout_span: half
    teacher_controls:
      release_activity: separate_toggle
      open_browse: not_applicable
      teacher_step_reveal: not_applicable
      reveal_reference_answer: separate_toggle
      instructor_demo_tools:
        - show_misconception_distribution
    student_access:
      default_visibility: hidden
      release_required: true
      browse_required: false
      can_view_problem_statement: true
      can_view_derivation_steps: true
      can_submit_without_browse: true
    telemetry_spec:
      summary_fields:
        - attemptCount
        - resultState
        - errorBucket
      misconception_tags:
        - frequency_response_one_dimensional
        - bode_margin_confusion
        - root_locus_margin_weak
        - integral_phase_cost_missing
    teacher_insight_spec:
      widgets:
        - question_distribution
        - top_misconceptions
      aggregation: step_level
    ai_context_spec:
      page_goal: 先暴露本课最常见的误判，再进入正式内容。
      allowed_scope:
        - 误判纠偏
        - 错因归类
      forbidden_scope:
        - 代做后续例题
      canonical_facts:
        - 前测只检查进入本课所需的基础读图能力。
    preview_contract:
      route_kind: student_demo
      demo_path: /interactive-learning/courses/unit-3-8-frequency-domain-translation-judgment/student/demo?step=step-03
      must_match_student_page: true
    acceptance_checks:
      - 误判清单必须先于前测题组出现。
      - 教师端必须能按四类误判聚合结果。
  step-04:
    title: 四类结构变化总表：先看哪一段频带，再谈收益与代价
    layout:
      template: table_explain_board
      regions:
        - id: table
          width: full
          order: 1
        - id: notes
          width: full
          order: 2
        - id: focus
          width: full
          order: 3
    modules:
      - id: fingerprint-table
        region: table
        kind: comparison-table
        must_be_visible: true
        payload:
          title: 四类结构变化的频域指纹总表
          columns:
            - 结构变化
            - 幅频主变化
            - 相频主变化
            - 第一观察重点
            - 常见闭环后果
          rows:
            - - 增益提升
              - 整体上移
              - 相位基本不变
              - 截止频率是否右移
              - 速度提高，稳定余量常减小
            - - 左半平面零点
              - 中高频抬升
              - 中频相位提前
              - 中频是否获得更多提前
              - 动态更积极，高频代价上升
            - - 极点增加 / 积分环节
              - 低频到中频抬升或转折变早
              - 相位更早下降
              - 中频余量是否被压缩
              - 精度提高，相位余量更紧
            - - 右半平面零点
              - 幅值可能抬升
              - 相位朝不利方向变化
              - 截止频率上升是否伴随更大相位代价
              - 直觉容易失真，超调风险增大
      - id: frequency-band-note
        region: notes
        kind: summary-card
        must_be_visible: true
      - id: row-focus-toggle
        region: focus
        kind: row-focus-toggle
        must_be_visible: true
    content_blocks:
      - id: columns
        type: bullet_list
        title: 总表字段
        items:
          - 结构变化
          - 主要改写频带
          - 幅频与相频主变化
          - 典型收益
          - 典型代价
      - id: band_note
        type: plain_text
        title: 阅读口令
        body: 任何结构变化都先回答“哪一段频带先被改写”，再回答“换来什么、付出什么”。
    evidence_sequence:
      - 完整总表
      - 频带职责提示
      - 行聚焦控件
    interaction_spec:
      interaction_kind: row_focus_toggle
      student_task: 切换高亮四类变化中的任意一行，辅助阅读，不提交。
      step_reveal_policy:
        mode: none
      activity_cards:
        - id: step-04-activity
          prompt: 切换高亮四类变化中的任意一行，辅助阅读，不提交。
          response_kind: single_choice
          options:
            - value: gain
              label: 增益提升
            - value: lhp-zero
              label: 左半平面零点
            - value: integral-lag
              label: 积分 / 滞后
            - value: nmp
              label: 非最小相
          reference_answer: 聚焦任一行都可以，但判断必须先说明对应频带。
          submit_scope: per_card
          layout_span: full
    teacher_controls:
      release_activity: not_applicable
      open_browse: not_applicable
      teacher_step_reveal: not_applicable
      reveal_reference_answer: not_applicable
      instructor_demo_tools:
        - highlight_selected_row
    student_access:
      default_visibility: visible
      release_required: false
      browse_required: false
      can_view_problem_statement: true
      can_view_derivation_steps: true
      can_submit_without_browse: true
    telemetry_spec:
      summary_fields:
        - viewed
        - focusedRow
      result_policy: no_submission
    teacher_insight_spec:
      widgets:
        - focus_row_heatmap
      aggregation: step_level
    ai_context_spec:
      page_goal: 先用总表稳住四类变化的整体骨架。
      allowed_scope:
        - 结构变化总表
        - 频带职责
      forbidden_scope:
        - 从总表直接跳到控制器选型
      canonical_facts:
        - 四类变化必须先以总表稳定呈现，再进入图像互动。
    preview_contract:
      route_kind: student_demo
      demo_path: /interactive-learning/courses/unit-3-8-frequency-domain-translation-judgment/student/demo?step=step-04
      must_match_student_page: true
    acceptance_checks:
      - 总表在无交互状态下也必须完整可读。
      - 学生不看讲稿也能说出四类变化对应的首要频带。
  step-05:
    title: 曲线互动页：四类结构变化为什么留下不同频域指纹
    layout:
      template: curve_compare_lab
      regions:
        - id: selector
          width: full
          order: 1
        - id: figure
          width: full
          order: 2
        - id: cards
          width: full
          order: 3
    modules:
      - id: change-selector
        region: selector
        kind: tab-selector
        must_be_visible: true
      - id: fingerprint-2x2-panel
        region: figure
        kind: interactive-figure-panel
        must_be_visible: true
        payload:
          title: 四类结构变化的讲义图组
          items:
            - path: 3-8-gain-effect.png
              caption: 增益提升：幅频整体上移，相位基本不变，截止频率可能右移。
              src: 3-8-gain-effect.png
            - path: 3-8-zero-effect.png
              caption: 左半平面零点：中频相位提前，同时带来高频抬升。
              src: 3-8-zero-effect.png
            - path: 3-8-pole-effect.png
              caption: 极点或积分补偿：低频精度增强，中频相位余量更紧。
              src: 3-8-pole-effect.png
            - path: 3-8-rhp-zero-effect.png
              caption: 右半平面零点：幅值看似更强，但相位代价不利。
              src: 3-8-rhp-zero-effect.png
      - id: band-overlay-strip
        region: figure
        kind: overlay-strip
        must_be_visible: true
      - id: activity-card-row
        region: cards
        kind: activity-card-row
        must_be_visible: true
    content_blocks:
      - id: reading_prompt
        type: bullet_list
        title: 读图口令
        items:
          - 先看当前变化是哪一类。
          - 再看低频 / 中频 / 高频哪一段先被改写。
          - 最后看这会如何改写稳定边界和闭环后果。
      - id: panel_note
        type: plain_text
        title: 面板说明
        body: 固定 2×2：左上幅频、右上相频、左下根轨迹、右下时域；默认状态必须复现讲义静态图义。
    evidence_sequence:
      - 读图口令
      - 变化类型切换
      - 2×2 面板
      - 频带罩层
      - 独立作答卡
    interaction_spec:
      interaction_kind: curve_compare_panel
      student_task: 切换四类结构变化，并完成频带定位、收益代价配对两张作答卡。
      activity_card_rationale: 两张卡分别承载频带定位与收益代价配对，保证作答区不超过两卡且仍保留“先判频带”的动作。
      step_reveal_policy:
        mode: none
      activity_cards:
        - id: card-05-a
          prompt: 当前结构变化优先改写哪一段频带。
          response_kind: single_choice
          options:
            - value: low
              label: 低频
            - value: mid
              label: 中频
            - value: high
              label: 高频
            - value: all-lift
              label: 整体上移
          reference_answer: 先判主要被改写的频带，再解释收益和代价。
          submit_scope: per_card
          layout_span: half
        - id: card-05-b
          prompt: 把当前变化的主要收益和主要代价配成一组。
          response_kind: multi_choice
          options:
            - value: accuracy-phase
              label: 低频精度提高 / 中频相位余量变紧
            - value: speed-margin
              label: 速度提高 / 稳定余量可能减小
