  - contract_id: 'curve-step-06'
    step_id: 'step-06'
    figure_ref: 'pure-gain-feasible-region'
    baseline_state:
      structure: 'pure_gain'
      parameters:
        K: 0.192
      display_overlays: ['feasible_region', 'dominant_poles']
    layout_mirror: 'top_formula_plus_left_plot_right_record'
    controls: ['K slider']
    reachable_states: ['纯增益靠近超调边界但仍无法满足 ts 目标', '复根实部固定在 -0.4 的失败态']
