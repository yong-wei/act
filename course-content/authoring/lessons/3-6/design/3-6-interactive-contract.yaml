evidence_unit_upgrade_table:
  - evidence_unit_id: 'eu-01'
    handout_anchor: '### 1.1 上一课的成果与本课的挑战'
    evidence_kind: 'concept'
    target_steps: ['step-02']
    upgrade_mode: 'static_retention'
    keep_elements: ['3-5 -> 3-6 -> 3-7 路径图', '主线切换句']
    non_reducible: ['3-5 讲机理，3-6 讲目标驱动设计，3-7 讲稳态改善']
    acceptance_checks: ['首屏必须看出本课在模块 3 中的位置。']
  - evidence_unit_id: 'eu-02'
    handout_anchor: '### 1.2 本课主线'
    evidence_kind: 'task_card'
    target_steps: ['step-03']
    upgrade_mode: 'native_html'
    keep_elements: ['五任务链', '交付物卡', '实践规则卡']
    non_reducible: ['五个任务名称与顺序', '固定提交物']
    acceptance_checks: ['不得缩成“若干设计任务”。']
  - evidence_unit_id: 'eu-03'
    handout_anchor: '### 1.3 先做一次“目标翻译”预测'
    evidence_kind: 'task_card+quiz'
    target_steps: ['step-04']
    upgrade_mode: 'native_html'
    keep_elements: ['三题前测', '理由栏']
    non_reducible: ['先独立判断，再进入 AI 对照']
    acceptance_checks: ['页面内不出现显式 AI gate。']
  - evidence_unit_id: 'eu-04'
    handout_anchor: '### 2.1 / ### 2.2 / ### 2.3'
    evidence_kind: 'object+formula+table'
    target_steps: ['step-05']
    upgrade_mode: 'native_html'
    keep_elements: ['对象公式', '三类校正表达式', '五任务表']
    non_reducible: ['对象公式、三类装置标准表达、任务 A-E 与推荐工具']
    acceptance_checks: ['对象卡、表达式卡和任务表必须同屏。']
  - evidence_unit_id: 'eu-05'
    handout_anchor: '### 2.4 将时域指标翻译为目标区域'
    evidence_kind: 'derivation'
    target_steps: ['step-06']
    upgrade_mode: 'click_reveal'
    keep_elements: ['Mp 翻译公式', 'ts 翻译公式', '区域结论']
    non_reducible: ['公式 -> 代入 -> 区域 -> 失败原因']
    acceptance_checks: ['不得只保留最终结论。']
  - evidence_unit_id: 'eu-06'
    handout_anchor: '### 2.4 将时域指标翻译为目标区域'
    evidence_kind: 'curve_figure'
    target_steps: ['step-06']
    upgrade_mode: 'shared_engine_panel'
    keep_elements: ['复平面可行域', '纯增益根轨迹', '失败记录']
    non_reducible: ['原对象复根实部固定在 -0.4，无法达到 Re(s)<=-1']
    acceptance_checks: ['根轨迹面板在左，记录区在右，且基线态必须复现讲义中的纯增益失败图景。']
  - evidence_unit_id: 'eu-07'
    handout_anchor: '### 3.1 / ### 3.2 / ### 3.3'
    evidence_kind: 'derivation+curve_figure'
    target_steps: ['step-07']
    upgrade_mode: 'click_reveal+parametric_sim'
    keep_elements: ['设计点', '相角条件', '模值条件', '三面板']
    non_reducible: ['设计点选择理由、Td≈0.35、K≈1.00、验收逻辑']
    acceptance_checks: ['不得只保留最终参数结果式。']
  - evidence_unit_id: 'eu-08'
    handout_anchor: '### 4.1 / ### 4.2 / ### 4.4'
    evidence_kind: 'structure_figure+derivation+table'
    target_steps: ['step-08', 'step-09']
    upgrade_mode: 'native_svg+click_reveal+parametric_sim'
    keep_elements: ['测速反馈结构图', '等效特征方程', '对照表', '三面板']
    non_reducible: ['先定等效极点，再求 Kt，最后由模值条件求 K']
    acceptance_checks: ['step-08 不得直接跳成工作区，且不设置独立学生作答区。']
  - evidence_unit_id: 'eu-09'
    handout_anchor: '### 5.1 / ### 5.2 / ### 5.3 / ### 5.4 / ### 5.5'
    evidence_kind: 'derivation+curve_figure'
    target_steps: ['step-10', 'step-11']
    upgrade_mode: 'click_reveal+parametric_sim'
    keep_elements: ['共同频域目标', '只调增益失败证据', '超前四步链', '2x2 工作区']
    non_reducible: ['PM>=50°', 'wc≈3', '补角、布置频带、由幅值条件求 Kc']
    acceptance_checks: ['不得只留下“超前形式 + 调参面板”。']
  - evidence_unit_id: 'eu-10'
    handout_anchor: '### 6.1 / ### 6.2 / ### 6.3 / ### 6.4 / ### 6.5'
    evidence_kind: 'derivation+compare+curve_figure'
    target_steps: ['step-12', 'step-13']
    upgrade_mode: 'click_reveal+parametric_sim+native_table'
    keep_elements: ['共同目标卡', 'PD 频域相角条件', '并排比较板']
    non_reducible: ['同指标比较副作用的课程意图']
    acceptance_checks: ['比较板不得只写“二者都达标”。']
  - evidence_unit_id: 'eu-11'
    handout_anchor: '### 7.1 / ### 7.2 / ### 7.3 / 附录 B'
    evidence_kind: 'curve_figure+boundary+task_card'
    target_steps: ['step-14']
    upgrade_mode: 'parametric_sim+click_reveal'
    keep_elements: ['边界对象公式', '风险图', '保守示例抽屉', '选择矩阵']
    non_reducible: ['先改目标，再选结构']
    acceptance_checks: ['不得只保留风险图，不得省略保守示例。']
  - evidence_unit_id: 'eu-12'
    handout_anchor: '## 八、本课小结与前后衔接'
    evidence_kind: 'summary+infographic'
    target_steps: ['step-15']
    upgrade_mode: 'static_retention'
    keep_elements: ['三句结论', '3-6-info.png', '去向卡']
    non_reducible: ['时域入口、频域入口、非最小相边界三句结论']
    acceptance_checks: ['信息图与三句结论必须同屏。']
