steps:
  step-01:
    title: '封面导入：目标必须先于工具'
    stage: 'bridge'
    duration_minutes: 3
    layout:
      template: 'binary_choice_illustration'
      regions:
        - { id: 'media', width: 'full', order: 1 }
        - { id: 'question', width: 'full', order: 2 }
        - { id: 'interaction', width: 'full', order: 3 }
    modules:
      - { id: 'cover-media', region: 'media', kind: 'illustration', must_be_visible: true }
      - { id: 'core-question-card', region: 'question', kind: 'question-card', must_be_visible: true }
      - { id: 'first-reaction-choice', region: 'interaction', kind: 'single-choice', must_be_visible: true }
    evidence_units: ['eu-03']
    content_blocks:
      - id: 'core-question'
        type: 'plain_text'
        title: '核心追问'
        body: '为什么同样都在引入零点相关装置，有时入口是目标极点区域，有时入口却是相角裕度与截止频率。'
    interaction_spec:
      interaction_kind: 'single_choice'
      student_task: '在三种入口判断之间做首次选择。'
      options: { A: '先看根轨迹', B: '先看 Bode 图', C: '先看目标是什么' }
      correct_answer: 'C'
      answer_reveal: 'teacher_toggle'
    teacher_controls: ['释放首反应选择', '显示正确项与一句点评']
    telemetry_spec:
      summary_fields: ['selectedOption', 'resultState', 'teacherRevealSeen']
      misconception_tags: ['tool_before_goal']
    teacher_insight_spec:
      widgets: ['option_distribution', 'goal_entry_confusion_rate']
      aggregation: 'step_level'
    ai_context_spec:
      page_goal: '打破先上某张图再说的惯性。'
      allowed_scope: ['目标', '入口', '工具分类']
      forbidden_scope: ['后续参数结果']
      canonical_facts: ['本课入口先按目标分类。']
    preview_contract:
      route_kind: 'student_demo'
      demo_path: '/interactive-learning/courses/unit-3-6-zero-design-workshop/student/demo?step=step-01'
      must_match_student_page: true
    acceptance_checks:
      - '封面媒体、核心追问和选择按钮首屏可见。'
      - '本页不提前出现任务结果。'
  step-02:
    title: '回到地图：从 3-5 的机理走向 3-6 的设计'
    stage: 'bridge'
    duration_minutes: 3
    layout:
      template: 'map_hero_slide'
      regions:
        - { id: 'header', width: 'full', order: 1 }
        - { id: 'lead', width: 'full', order: 2 }
        - { id: 'summary', width: 'full', order: 3 }
    modules:
      - { id: 'stage-map', region: 'header', kind: 'stage-map', must_be_visible: true }
      - { id: 'bridge-card', region: 'lead', kind: 'bridge-card', must_be_visible: true }
      - { id: 'boundary-card', region: 'summary', kind: 'boundary-card', must_be_visible: true }
    evidence_units: ['eu-01']
    content_blocks:
      - id: 'boundary'
        type: 'plain_text'
        title: '本课边界'
        body: '本课只做目标驱动设计与边界判断，不进入模块 4 的完整方案整定。'
    interaction_spec:
      interaction_kind: 'none'
      student_task: '只阅读，不提交。'
      answer_reveal: 'none'
    teacher_controls: ['推进到下一页', '高亮当前节点']
    telemetry_spec:
      summary_fields: ['viewed', 'timeOnStep', 'teacherFollowSync']
      result_policy: 'no_submission'
    teacher_insight_spec:
      widgets: ['view_count', 'sync_status']
      aggregation: 'step_level'
    ai_context_spec:
      page_goal: '标定本课在模块 3 中的位置。'
