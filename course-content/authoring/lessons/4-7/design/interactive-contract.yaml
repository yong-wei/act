    acceptance_checks: ['噪声不得和外部扰动混写；测量方程必须常显。']

  step-11:
    title: '后测：参数来源、结构选择和边界判断是否已经成链'
    layout: { template: 'posttest_board', regions: [{ id: 'header', width: 'full', order: 1 }, { id: 'quiz', width: 'full', order: 2 }] }
    modules:
      - { id: 'posttest-header', region: 'header', kind: 'summary-card', must_be_visible: true }
      - { id: 'rudder-question', region: 'quiz', kind: 'quiz-card', must_be_visible: false }
      - { id: 'hull-question', region: 'quiz', kind: 'quiz-card', must_be_visible: false }
      - { id: 'cross-model-question', region: 'quiz', kind: 'quiz-card', must_be_visible: false }
      - { id: 'disturbance-question', region: 'quiz', kind: 'quiz-card', must_be_visible: false }
    content_blocks:
      header: '本页检查参数来源、结构选择、跨模型验证和边界判断是否已经连成链。'
    evidence_sequence: ['后测说明', '四题独立提交', '参考答案']
    interaction_spec:
      interaction_kind: 'quiz_group'
      student_task: '完成四张后测题卡。'
      activity_cards:
        - id: 'rudder-question'
          prompt: '根据舵机阶跃辨识图，说明 $T_r$ 的含义。为什么实际舵角响应不能被看作无惯性的立即到位？若 $T_r$ 被低估，控制器设计会怎样误判舵机能力？'
          reference_answer: '$T_r$ 是舵机一阶惯性的时间尺度，表示实际舵角接近新稳态所需的滞后。若把它看成零，会高估舵机快速到位能力，使控制器给出过快舵令。'
          response_kind: 'fill_text'
          submit_scope: 'per_card'
          layout_span: 'half'
          rubric: ['说清 $T_r$ 是时间常数。', '说明实际舵角存在迟滞。', '指出低估 $T_r$ 会高估快速执行能力。']
        - id: 'hull-question'
          prompt: '用 $G_h(s)=K_h/(T_hs+1)$ 解释 $T_h$ 与 $K_h$ 的来源。为什么船体段辨识需要同时约束艏摇角速度和积分后的航向角？'
          reference_answer: '$T_h$ 来自艏摇角速度响应的时间尺度，$K_h$ 来自稳态艏摇角速度与舵角的比值；航向角是艏摇角速度积分，因此只拟合 $r(t)$ 不足以保证 $\\psi(t)$ 任务可用。'
          response_kind: 'fill_text'
          submit_scope: 'per_card'
          layout_span: 'half'
          rubric: ['说明 $T_h$ 来自响应时间尺度。', '说明 $K_h$ 来自稳态比值。', '指出航向角是艏摇角速度积分并需同时约束 $r(t)$ 与 $\\psi(t)$。']
        - id: 'cross-model-question'
          prompt: '若基于辨识模型的优化设计在辨识模型上代价更小，但在高保真 zig-zag 航线中航迹偏离更大，应怎样修改最终判断？'
          reference_answer: '最终判断应降低该方案的交付等级，要求高保真模型上的航向、航迹和执行边界同时合格；辨识模型上的低代价只能说明名义入口成立。'
          response_kind: 'fill_text'
          submit_scope: 'per_card'
          layout_span: 'half'
          rubric: ['指出不能只按辨识模型代价交付。', '提到高保真航向证据。', '提到高保真航迹和执行边界。']
        - id: 'disturbance-question'
          prompt: '$T_d=54.00\\,\\mathrm{s}$、$K_d=0.0150\\,\\mathrm{rad}$ 为什么不能证明现实风浪扰动已经被充分建模？答案需要同时提到艏摇、横荡、局部流速和舵效。'
          reference_answer: '该等效通道只描述某一类艏摇等效影响，不能覆盖横荡、局部流速改变和舵效变化；因此它是扰动边界入口，不是完整风浪模型。'
          response_kind: 'fill_text'
          submit_scope: 'per_card'
          layout_span: 'half'
          rubric: ['指出等效扰动不是完整风浪模型。', '提到艏摇。', '在横荡、局部流速、舵效中至少提到两项。']
    teacher_controls: { release_activity: 'teacher_toggle', open_browse: 'page_load_open', teacher_step_reveal: 'not_applicable', reveal_reference_answer: 'teacher_toggle' }
    student_access: { default_visibility: 'visible', activity_visibility: 'hidden', release_required: true, browse_required: false, can_view_problem_statement: true, can_view_derivation_steps: true, can_submit_without_browse: true }
    telemetry_spec: { summary_fields: ['quizSubmitted', 'cardSubmitted', 'timeOnStep'], misconception_tags: ['parameter_source_missing', 'disturbance_noise_mix', 'heading_only_validation'] }
    teacher_insight_spec: { widgets: ['quiz_completion_rate', 'error_bucket_distribution'] }
    ai_context_spec: { delivery_mode: 'hidden_page_context', page_goal: '检查参数来源、结构选择、跨模型验证和边界判断。' }
    preview_contract: { demo_path: '/interactive-learning/courses/unit-4-7-destroyer-hifi-design-closure/student/demo?step=step-11' }
    acceptance_checks: ['四道题面必须完整呈现并独立提交。']

  step-12:
    title: '总结：传统控制结构的局限与前沿方法入口'
    layout: { template: 'summary_exit_board', regions: [{ id: 'summary', width: 'full', order: 1 }, { id: 'media', width: 'full', order: 2 }, { id: 'frontier', width: 'full', order: 3 }] }
    modules:
      - { id: 'limitation-cards', region: 'summary', kind: 'summary-card', must_be_visible: true }
      - { id: 'real-scenario-figure', region: 'media', kind: 'image-panel', must_be_visible: true }
      - { id: 'info-figure', region: 'media', kind: 'image-panel', must_be_visible: true }
      - { id: 'frontier-methods', region: 'frontier', kind: 'summary-card', must_be_visible: true }
    content_blocks:
      limitations:
        - { name: '固定低阶传递函数', explanation: '三阶名义模型能解释主要航向通道，但不能完整表达横荡、舵效变化和工况切换。' }
        - { name: '固定结构', explanation: '固定 $PI+\\text{超前}$ 或固定 PID 滤波结构便于解释，但难以同时适配名义、扰动和噪声场景。' }
        - { name: '线性反馈', explanation: '线性反馈围绕局部工作点设计，遇到饱和、强扰动和非线性舵效时需要额外边界处理。' }
        - { name: '单传感器反馈', explanation: '只看航向测量会遗漏航迹、横向偏离、舵机状态和环境估计，容易把可交付性压缩成单曲线判断。' }
      frontier_methods:
        - '鲁棒控制处理模型不确定性。'
        - '扰动观测器估计外部扰动。'
        - '增益调度按工况切换参数。'
        - '模型预测控制显式处理约束。'
        - '学习型策略用于复杂环境中的策略更新。'
      media:
        - { runtime_media: '/course-runtime/lessons/4-7/media/4-7-real-scenario-interpretation.png' }
        - { runtime_media: '/course-runtime/lessons/4-7/media/4-7-info.png' }
      figure_explanations:
        - '真实场景解释图用于回看本课证据：低阶模型、优化搜索、扰动和噪声都只是高保真任务中的一部分。'
        - '封底信息图用于收束学习路径：经典结构先给可解释基线，再由边界问题引出更强方法。'
      evidence_bridge: '本课不是否定传统控制，而是用高保真任务说明传统控制在哪些条件下可靠、在哪些条件下需要鲁棒控制、扰动观测、增益调度、MPC 或学习型策略。'
      conclusion: '先确认低阶经典设计能做到什么，再判断什么时候必须越过它。'
    evidence_sequence: ['四类局限', '真实场景解释图', '信息图', '前沿方法入口']
    interaction_spec: { interaction_kind: 'none', student_task: '阅读总结，不提交。' }
    teacher_controls: { release_activity: 'not_applicable', open_browse: 'not_applicable', teacher_step_reveal: 'not_applicable', reveal_reference_answer: 'not_applicable' }
    student_access: { default_visibility: 'visible', release_required: false, browse_required: false, can_view_problem_statement: true, can_view_derivation_steps: false, can_submit_without_browse: false }
    telemetry_spec: { summary_fields: ['viewed', 'timeOnStep'], misconception_tags: [] }
    teacher_insight_spec: { widgets: ['view_count'] }
    ai_context_spec: { delivery_mode: 'hidden_page_context', page_goal: '收束传统控制结构局限，并给出前沿方法入口。' }
    preview_contract: { demo_path: '/interactive-learning/courses/unit-4-7-destroyer-hifi-design-closure/student/demo?step=step-12' }
    acceptance_checks: ['总结页不放新作答；只给前沿入口，不展开算法教程。']
