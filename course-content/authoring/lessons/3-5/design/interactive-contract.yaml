      demo_path: "/interactive-learning/courses/unit-3-5-zero-dynamic-improvement/student/demo?step=step-08"
      must_match_student_page: true
    acceptance_checks:
      - "公式卡、例题卡和填写区必须同屏。"
      - "页面必须保留结构解释栏。"

  step-09:
    title: "PD 与测速反馈的三域对照：同样提阻尼，不等于结构相同"
    layout:
      template: "tri_domain_compare_workspace"
      regions:
        - { id: "graphs", width: "full", order: 1 }
        - { id: "summary", width: "full", order: 2 }
        - { id: "record", width: "full", order: 3 }
    modules:
      - { id: "tri-domain-figure", region: "graphs", kind: "comparison-graphic", must_be_visible: true }
      - { id: "conclusion-card-row", region: "summary", kind: "conclusion-card-row", must_be_visible: true }
      - { id: "structured-compare", region: "record", kind: "structured-compare", must_be_visible: true }
    content_blocks:
      - id: "figure-ref"
        type: "plain_text"
        title: "三域图"
        body: "固定使用 3-5-rl-03-pd-rate-compare.png。"
      - id: "conclusions"
        type: "bullet_list"
        title: "三句结论"
        items:
          - "同样提高阻尼，不等于结构相同。"
          - "PD 有前向零点，测速反馈没有。"
          - "频域与时域差异要读回结构来源。"
      - id: "transfer-functions"
        type: "formula_list"
        title: "闭环传递函数"
        items:
          - "T_{PD}(s)=4(1+0.3s)/(s^2+2s+4)"
          - "T_v(s)=4/(s^2+2s+4)"
    interaction_spec:
      interaction_kind: "structured_compare"
      student_task: "分别填写共同点与不同点，并覆盖根轨迹、时域、频域三个域。"
      answer_reveal: "teacher_toggle"
      minimum_fields: ["common_point", "difference_1", "difference_2"]
    teacher_controls:
      - "显示参考对照"
      - "高亮缺失的域"
    telemetry_spec:
      summary_fields: ["domainCoverage", "differenceCount", "attemptCount"]
      result_policy: "store_latest_attempt"
    teacher_insight_spec:
      widgets: ["domain_missing_rate", "top_confused_domains"]
      aggregation: "step_level"
    ai_context_spec:
      page_goal: "把同样提阻尼拆回结构来源。"
      allowed_scope: ["根轨迹", "时域", "频域", "结构"]
      forbidden_scope: ["把三域比较简化成单一指标比较"]
      canonical_facts:
        - "三域差异必须能读回结构。"
    preview_contract:
      route_kind: "student_demo"
      demo_path: "/interactive-learning/courses/unit-3-5-zero-dynamic-improvement/student/demo?step=step-09"
      must_match_student_page: true
    acceptance_checks:
      - "三域图、结论卡和填写区同屏。"
      - "页面必须允许按域填写。"

  step-10:
    title: "PD 单独装置的频域指纹：中高频抬升与高频代价"
    layout:
      template: "frequency_principle_workspace"
      regions:
        - { id: "formula", width: "full", order: 1 }
        - { id: "bands", width: "full", order: 2 }
        - { id: "interaction", width: "full", order: 3 }
    modules:
      - { id: "pd-formula-card", region: "formula", kind: "formula-card", must_be_visible: true }
      - { id: "band-note-card", region: "bands", kind: "summary-card", must_be_visible: true }
      - { id: "band-labeling-zone", region: "interaction", kind: "frequency-band-labeling", must_be_visible: true }
    content_blocks:
      - id: "transfer-function"
        type: "formula_list"
        title: "PD 传函"
        items:
          - "G_{PD}(s)=1+T_d s"
      - id: "formulas"
        type: "formula_list"
        title: "PD 幅相特性"
        items:
          - "|G_{PD}(j\\omega)|=\\sqrt{1+(\\omega T_d)^2}"
          - "\\phi_{PD}(\\omega)=\\arctan(\\omega T_d)"
      - id: "band-note"
        type: "bullet_list"
        title: "三频段提示"
        items:
          - "低频影响小。"
          - "拐点后中高频抬升明显。"
          - "高频代价是噪声和控制动作放大。"
          - "中高频持续抬升会推动交叉频率右移。"
    interaction_spec:
      interaction_kind: "frequency_band_labeling"
      student_task: "为低频、拐点后与高频区域放置正确标签。"
      answer_reveal: "instant_feedback"
    teacher_controls:
      - "重置标注"
      - "显示常见错位"
    telemetry_spec:
      summary_fields: ["bandLabelsPlaced", "attemptCount"]
      result_policy: "store_best_attempt"
    teacher_insight_spec:
      widgets: ["band_confusion_heatmap"]
      aggregation: "step_level"
    ai_context_spec:
      page_goal: "让 PD 的频域原理先以频带分工出现。"
      allowed_scope: ["中高频抬升", "交叉频率", "噪声放大"]
      forbidden_scope: ["把 PD 直接等同为更强的超前"]
      canonical_facts:
        - "PD 更像持续抬升中高频。"
    preview_contract:
      route_kind: "student_demo"
      demo_path: "/interactive-learning/courses/unit-3-5-zero-dynamic-improvement/student/demo?step=step-10"
      must_match_student_page: true
    acceptance_checks:
      - "公式卡、频段提示和标注区必须同屏。"
      - "高频代价必须静态可见。"

  step-11:
    title: "超前单独装置的频域指纹：相位峰、补角与作用频带"
    layout:
      template: "lead_phase_peak_workspace"
      regions:
        - { id: "formula", width: "full", order: 1 }
        - { id: "graphic", width: "full", order: 2 }
        - { id: "interaction", width: "full", order: 3 }
    modules:
      - { id: "lead-formula-card", region: "formula", kind: "formula-card", must_be_visible: true }
      - { id: "phase-peak-graphic", region: "graphic", kind: "comparison-graphic", must_be_visible: true }
      - { id: "phase-peak-locator", region: "interaction", kind: "phase-peak-locator", must_be_visible: true }
    content_blocks:
      - id: "formulas"
        type: "formula_list"
        title: "超前标准式"
        items:
          - "G_{lead}(s)=(Ts+1)/(\\alpha Ts+1),\\ 0<\\alpha<1"
          - "|G_{lead}(j\\omega)|=\\sqrt{(1+(\\omega T)^2)/(1+(\\alpha \\omega T)^2)}"
          - "\\phi_{lead}(\\omega)=\\arctan(\\omega T)-\\arctan(\\alpha \\omega T)"
          - "\\omega_m=1/(T\\sqrt{\\alpha})"
          - "\\phi_m=\\sin^{-1}((1-\\alpha)/(1+\\alpha))"
      - id: "interpretation"
        type: "plain_text"
        title: "核心解释"
        body: "超前不是持续抬整个中高频，而是在关键频带制造相位峰。"
    interaction_spec:
      interaction_kind: "phase_peak_locator"
      student_task: "定位相位峰频带，并匹配其主要改善对象。"
      answer_reveal: "teacher_toggle"
      target_metric: "phase_margin"
    teacher_controls:
      - "显示相位峰位置"
      - "揭示目标指标"
    telemetry_spec:
      summary_fields: ["peakBandSelection", "targetMetricSelection", "attemptCount"]
      result_policy: "store_best_attempt"
    teacher_insight_spec:
      widgets: ["peak_band_distribution", "target_metric_confusion_rate"]
      aggregation: "step_level"
    ai_context_spec:
      page_goal: "把超前的相位峰与 PD 的持续抬升区分开。"
      allowed_scope: ["相位峰", "补相角", "关键频带"]
      forbidden_scope: ["只拿零点位置做唯一比较"]
      canonical_facts:
        - "超前更像在截止频率附近补相角。"
    preview_contract:
      route_kind: "student_demo"
      demo_path: "/interactive-learning/courses/unit-3-5-zero-dynamic-improvement/student/demo?step=step-11"
      must_match_student_page: true
    acceptance_checks:
      - "标准式卡、峰值图解和定位区必须同屏。"
      - "目标指标必须明确是相角裕度。"

  step-12:
