contract_version: "2.0"
lesson_id: "3-5"
course_title: "3-5：零点引入与动态改善——为什么改变结构后，轨迹和响应会一起变"
course_route_segment: "unit-3-5-zero-dynamic-improvement"
preview_mode:
  default_entry: "student_demo"
  student_demo_base_path: "/interactive-learning/courses/unit-3-5-zero-dynamic-improvement/student/demo"
  teacher_preview_panel_note: "教师端模板弹窗只用于查看课堂骨架；默认页面预览必须打开学生演示页。"
telemetry_strategy: "lightweight_high_value"
teacher_insight_strategy: "step_level_aggregation_only"
required_step_fields:
  - "layout"
  - "modules"
  - "content_blocks"
  - "interaction_spec"
  - "teacher_controls"
  - "telemetry_spec"
  - "teacher_insight_spec"
  - "ai_context_spec"
  - "preview_contract"
  - "acceptance_checks"
steps:
  step-01:
    title: "回到地图：从沿轨迹读图转向结构改变"
    layout:
      template: "map_hero_slide"
      regions:
        - { id: "header", width: "full", order: 1 }
        - { id: "lead", width: "full", order: 2 }
        - { id: "summary", width: "full", order: 3 }
    modules:
      - { id: "stage-map", region: "lead", kind: "stage-map", must_be_visible: true }
      - { id: "core-question-card", region: "lead", kind: "question-card", must_be_visible: true }
      - { id: "boundary-card", region: "summary", kind: "boundary-card", must_be_visible: true }
    content_blocks:
      - id: "path"
        type: "plain_text"
        title: "路径定位"
        body: "固定高亮 3-4 -> 3-5 -> 3-6。"
      - id: "questions"
        type: "bullet_list"
        title: "三个主问题"
        items:
          - "零点为什么不是更大增益的别名。"
          - "PD 与测速反馈为什么不能混同。"
          - "右半平面零点为什么会把动态改善变成带条件判断。"
      - id: "boundary"
        type: "plain_text"
        title: "本课边界"
        body: "本课不进入模块 4 的完整整定流程。"
    interaction_spec:
      interaction_kind: "none"
      student_task: "只阅读，不提交。"
      answer_reveal: "none"
    teacher_controls:
      - "推进到下一页"
      - "高亮当前节点"
    telemetry_spec:
      summary_fields: ["viewed", "timeOnStep", "teacherFollowSync"]
      result_policy: "no_submission"
    teacher_insight_spec:
      widgets: ["view_count", "sync_status"]
      aggregation: "step_level"
    ai_context_spec:
      page_goal: "标定 3-5 位于模块 3 的结构改变入口。"
      allowed_scope: ["课程路径", "3-4/3-5/3-6 衔接"]
      forbidden_scope: ["提前给出实例结论", "提前给出数值结果"]
      canonical_facts:
        - "3-4 负责沿既有轨迹读图。"
        - "3-5 负责结构改变与零点边界。"
        - "3-6 将进入统一对象实验。"
    preview_contract:
      route_kind: "student_demo"
      demo_path: "/interactive-learning/courses/unit-3-5-zero-dynamic-improvement/student/demo?step=step-01"
      must_match_student_page: true
    acceptance_checks:
      - "首屏能看到路径图、主问题卡和边界卡。"
      - "本页没有作答区。"

  step-02:
    title: "统一对象与观察框架：四个版本、三项产出、四个观察量"
    layout:
      template: "goal_chain_slide"
      regions:
        - { id: "objects", width: "full", order: 1 }
        - { id: "outputs", width: "full", order: 2 }
        - { id: "metrics", width: "full", order: 3 }
    modules:
      - { id: "object-card", region: "objects", kind: "object-card", must_be_visible: true }
      - { id: "version-card-row", region: "objects", kind: "comparison-card-row", must_be_visible: true }
      - { id: "deliverable-card-row", region: "outputs", kind: "deliverable-card-row", must_be_visible: true }
      - { id: "observation-card-row", region: "metrics", kind: "metric-card-row", must_be_visible: true }
    content_blocks:
      - id: "object"
        type: "plain_text"
        title: "统一对象约束"
        body: "后续比较优先在同一对象上进行，不靠更换对象偷换结论。"
      - id: "versions"
        type: "bullet_list"
        title: "四个版本"
        items: ["纯极点基准", "左半平面零点", "PD/测速反馈", "右半平面零点边界"]
      - id: "deliverables"
        type: "bullet_list"
        title: "三项固定产出"
        items: ["零点作用判断表", "结构对比解释", "风险边界卡"]
      - id: "observations"
        type: "bullet_list"
        title: "四个观察量"
        items: ["根轨迹", "时域", "频域", "结构判断"]
    interaction_spec:
      interaction_kind: "none"
      student_task: "只建立比较框架，不提交。"
      answer_reveal: "none"
    teacher_controls:
      - "高亮统一对象"
      - "逐项强调产出与观察量"
    telemetry_spec:
      summary_fields: ["viewed", "timeOnStep"]
      result_policy: "no_submission"
    teacher_insight_spec:
      widgets: ["view_count"]
      aggregation: "step_level"
    ai_context_spec:
      page_goal: "压实比较框架。"
      allowed_scope: ["对象", "版本", "产出", "观察量"]
      forbidden_scope: ["把本课简化成图像浏览"]
      canonical_facts:
        - "比较必须优先在同一对象上进行。"
        - "三项固定产出贯穿全课。"
    preview_contract:
      route_kind: "student_demo"
      demo_path: "/interactive-learning/courses/unit-3-5-zero-dynamic-improvement/student/demo?step=step-02"
      must_match_student_page: true
    acceptance_checks:
      - "对象卡、版本卡、产出卡和观察量卡同屏。"
      - "本页无提交组件。"

  step-03:
    title: "前测：三类起点误判先落地"
    layout:
      template: "question_stack"
      regions:
        - { id: "question-stack", width: "full", order: 1 }
        - { id: "record", width: "full", order: 2 }
        - { id: "feedback", width: "full", order: 3 }
    modules:
      - { id: "pretest-q1", region: "question-stack", kind: "single-choice-card", must_be_visible: true }
      - { id: "pretest-q2", region: "question-stack", kind: "single-choice-card", must_be_visible: true }
      - { id: "pretest-q3", region: "question-stack", kind: "single-choice-card", must_be_visible: true }
      - { id: "intuition-record", region: "record", kind: "short-response", must_be_visible: true }
    content_blocks:
      - id: "ai-gate-note"
        type: "plain_text"
        title: "AI 顺序约束"
        body: "先提交自己的判断，再允许打开 AI 对照；AI 只用于误判对照，不代答。"
    interaction_spec:
      interaction_kind: "quiz_group"
      student_task: "完成三道前测，并提交一句自己的直觉判断。"
      attempt_model: "允许重提一次；教师端区分首答与重提。"
      answer_reveal: "teacher_toggle"
      ai_unlock_rule: "只有前测与直觉提交完成后才可打开 AI 对照。"
    teacher_controls:
      - "释放前测"
      - "显示误区分布"
      - "控制答案揭示"
    telemetry_spec:
      summary_fields: ["attemptCount", "resultState", "errorBucket", "intuitionTextSubmitted"]
      misconception_tags: ["zero_equals_gain", "pd_equals_rate_feedback", "rhp_zero_still_helpful"]
    teacher_insight_spec:
      widgets: ["question_distribution", "top_misconceptions"]
      aggregation: "step_level"
    ai_context_spec:
      page_goal: "暴露起点误区并保住先独立判断的顺序。"
      allowed_scope: ["错因归类", "术语纠偏", "误判对照"]
      forbidden_scope: ["直接生成前测答案", "替学生写直觉句"]
      canonical_facts:
        - "AI 只用于对照和纠错。"
    preview_contract:
      route_kind: "student_demo"
      demo_path: "/interactive-learning/courses/unit-3-5-zero-dynamic-improvement/student/demo?step=step-03"
      must_match_student_page: true
    acceptance_checks:
      - "未作答状态下三题和直觉栏同时可见。"
      - "AI 入口默认锁定。"

  step-04:
    title: "二阶对象接入零点：先看哪条分支被拉走"
    layout:
      template: "figure_annotation_workspace"
      regions:
        - { id: "figure", width: "full", order: 1 }
        - { id: "legend", width: "full", order: 2 }
        - { id: "workspace", width: "full", order: 3 }
    modules:
      - { id: "low-order-compare-figure", region: "figure", kind: "figure", must_be_visible: true }
      - { id: "object-formula-card", region: "legend", kind: "formula-card", must_be_visible: true }
      - { id: "branch-annotation-layer", region: "workspace", kind: "annotation-choice", must_be_visible: true }
      - { id: "judgement-table", region: "workspace", kind: "record-card", must_be_visible: true }
    content_blocks:
      - id: "figure-ref"
        type: "plain_text"
        title: "图示"
        body: "根轨迹区统一接入 Rust/WASM 控制分析引擎，只保留一个根轨迹面板。"
      - id: "formulas"
        type: "formula_list"
        title: "对象式"
        items:
          - "L_0(s)=K/[s(s+1)]"
          - "L_1(s)=K(s+2)/[s(s+1)]"
          - "L_2(s)=K(s+0.5)/[s(s+1)]"
      - id: "workspace-rules"
        type: "bullet_list"
        title: "工作区要求"
        items: ["单根轨迹工作区", "添加零点", "添加极点", "拖动零极点", "默认零极点位置与讲义一致"]
      - id: "prompt"
        type: "bullet_list"
        title: "判断顺序"
        items: ["先看哪条分支被零点拉走。", "再看实轴区段如何重排。"]
    interaction_spec:
      interaction_kind: "annotation_choice"
      student_task: "标记被零点拉走的分支，并勾选被重排的实轴区段。"
      answer_reveal: "teacher_toggle"
    teacher_controls:
      - "控制标注层显示"
      - "揭示正确区域"
    telemetry_spec:
      summary_fields: ["selectedBranchRegion", "selectedRealAxisSegment", "attemptCount"]
      result_policy: "store_best_attempt"
    teacher_insight_spec:
      widgets: ["branch_choice_distribution", "real_axis_confusion_map"]
      aggregation: "step_level"
    ai_context_spec:
      page_goal: "建立零点改写轨迹骨架的第一印象。"
      allowed_scope: ["分支终点", "实轴区段", "轨迹重排"]
      forbidden_scope: ["只说更快而不指出哪里变了"]
      canonical_facts:
        - "零点出现后，根轨迹骨架会改写。"
    preview_contract:
      route_kind: "student_demo"
      demo_path: "/interactive-learning/courses/unit-3-5-zero-dynamic-improvement/student/demo?step=step-04"
      must_match_student_page: true
    acceptance_checks:
      - "图、对象式和统一根轨迹工作区同屏。"
      - "判断表与图示在同一滚屏内可见。"

  step-05:
    title: "三阶对象接入零点：零点位置怎样改写主导分支"
    layout:
      template: "dual_figure_compare_workspace"
      regions:
        - { id: "figure", width: "full", order: 1 }
        - { id: "compare", width: "full", order: 2 }
        - { id: "record", width: "full", order: 3 }
    modules:
      - { id: "high-order-compare-figure", region: "figure", kind: "figure", must_be_visible: true }
      - { id: "zero-position-card", region: "compare", kind: "comparison-card", must_be_visible: true }
      - { id: "compare-note", region: "record", kind: "short-response", must_be_visible: true }
    content_blocks:
      - id: "figure-ref"
        type: "plain_text"
        title: "图示"
        body: "根轨迹区继续沿用统一仿真引擎，只保留一个根轨迹面板。"
      - id: "formulas"
        type: "formula_list"
        title: "对象式"
        items:
          - "L_3(s)=K/[s(s+1)(s+4)]"
          - "L_{3a}(s)=K(s+0.4)/[s(s+1)(s+4)]"
          - "L_{3b}(s)=K(s+2.5)/[s(s+1)(s+4)]"
      - id: "sentence-frame"
        type: "plain_text"
        title: "句式"
        body: "我认为 ________ 被重排得更明显，因为 ________。"
      - id: "workspace-rules"
        type: "bullet_list"
        title: "工作区要求"
        items: ["单根轨迹工作区", "添加零点", "添加极点", "拖动零极点", "默认零极点位置与讲义一致"]
    interaction_spec:
      interaction_kind: "compare_note"
      student_task: "完成一句比较判断。"
      answer_reveal: "teacher_toggle"
      quality_gate: "是否同时提到零点位置与主导分支变化。"
    teacher_controls:
      - "显示关键词提示"
      - "揭示参考表述"
    telemetry_spec:
      summary_fields: ["compareNoteSubmitted", "usedKeywords", "attemptCount"]
      result_policy: "store_latest_attempt"
    teacher_insight_spec:
      widgets: ["keyword_coverage", "top_missing_reasoning_fields"]
      aggregation: "step_level"
    ai_context_spec:
      page_goal: "把零点位置差异压成可回查的主导分支判断。"
      allowed_scope: ["零点位置", "主导分支", "重排位置"]
      forbidden_scope: ["泛化成零点都会改善动态"]
      canonical_facts:
        - "零点位置不同，主导分支被拉走的方式也不同。"
    preview_contract:
      route_kind: "student_demo"
      demo_path: "/interactive-learning/courses/unit-3-5-zero-dynamic-improvement/student/demo?step=step-05"
      must_match_student_page: true
    acceptance_checks:
      - "图、比较卡、句式和统一根轨迹工作区同屏。"
      - "页面必须保留比较记录栏。"

  step-06:
    title: "第一收束：左半平面零点改善趋势与右半平面问号"
    layout:
      template: "contrast_summary_board"
      regions:
        - { id: "table", width: "full", order: 1 }
        - { id: "risk", width: "full", order: 2 }
        - { id: "record", width: "full", order: 3 }
    modules:
      - { id: "compare-table", region: "table", kind: "comparison-table", must_be_visible: true }
      - { id: "risk-prediction-card", region: "risk", kind: "risk-card", must_be_visible: true }
      - { id: "judgement-record", region: "record", kind: "record-card", must_be_visible: true }
    content_blocks:
      - id: "table-fields"
        type: "bullet_list"
        title: "对照字段"
        items: ["开环结构", "轨迹骨架", "主导极点可达区域", "时域与频域后果"]
      - id: "risk-questions"
        type: "bullet_list"
        title: "右半平面零点三问"
        items:
          - "轨迹还会不会继续朝有利区域重排？"
          - "输出会不会仍然沿目标方向起步？"
          - "相位会不会继续像左半平面零点那样给帮助？"
    interaction_spec:
      interaction_kind: "risk_prediction_submit"
      student_task: "提交一个风险预测，并写一句理由。"
      answer_reveal: "teacher_toggle"
    teacher_controls:
      - "显示风险预测分布"
      - "统一揭示本页结论"
    telemetry_spec:
      summary_fields: ["selectedRiskClaim", "reasonTag", "attemptCount"]
      result_policy: "store_latest_attempt"
    teacher_insight_spec:
      widgets: ["risk_prediction_distribution", "top_reason_tags"]
      aggregation: "step_level"
    ai_context_spec:
      page_goal: "把改善趋势和待检验边界并置。"
      allowed_scope: ["改善趋势", "待检验边界", "风险提问"]
      forbidden_scope: ["提前给出非最小相完整结论"]
      canonical_facts:
        - "左半平面零点常给出动态改善趋势。"
        - "右半平面零点必须保留问号。"
    preview_contract:
      route_kind: "student_demo"
      demo_path: "/interactive-learning/courses/unit-3-5-zero-dynamic-improvement/student/demo?step=step-06"
      must_match_student_page: true
    acceptance_checks:
      - "对照表和风险卡先于提交区出现。"
      - "本页不能把风险问号直接写成最终答案。"

  step-07:
    title: "结构辨认：PD 与测速反馈不靠名字判断"
    layout:
      template: "structure_compare_slide"
      regions:
        - { id: "media", width: "full", order: 1 }
        - { id: "terms", width: "full", order: 2 }
        - { id: "interaction", width: "full", order: 3 }
    modules:
      - { id: "pd-rate-structure-figure", region: "media", kind: "figure", must_be_visible: true }
      - { id: "term-card-row", region: "terms", kind: "term-card-row", must_be_visible: true }
      - { id: "binary-vote", region: "interaction", kind: "binary-choice", must_be_visible: true }
    content_blocks:
      - id: "figure-ref"
        type: "plain_text"
        title: "结构图"
        body: "固定使用 3-5-md-01-pd-rate-structure.png。"
      - id: "term-notes"
        type: "bullet_list"
        title: "术语卡"
        items:
          - "PD 在前向通道显式增加零点。"
          - "测速反馈保留外环单位负反馈，并在对象输入端引入速度项反馈。"
          - "不能因为都能增大阻尼就把两者混同。"
      - id: "fixed-formulas"
        type: "formula_list"
        title: "固定公式"
        items:
          - "G_p(s)=4/[s(s+0.8)],\\ T_0(s)=4/[s^2+0.8s+4]"
          - "s^2+(2\\zeta\\omega_n+K_d\\omega_n^2)s+\\omega_n^2=0"
          - "s^2+(2\\zeta\\omega_n+K_t\\omega_n^2)s+\\omega_n^2=0"
    interaction_spec:
      interaction_kind: "binary_choice"
      student_task: "判断测速反馈是否在前向通道显式增加零点。"
      correct_answer: "B"
      options:
        A: "是，它和 PD 一样在前向通道显式增加零点"
        B: "否，它改变闭环分母一次项，但不在前向通道显式增加零点"
      answer_reveal: "teacher_toggle"
    teacher_controls:
      - "释放结构判断题"
      - "显示一句纠错"
    telemetry_spec:
      summary_fields: ["selectedOption", "resultState"]
      misconception_tags: ["rate_feedback_equals_forward_zero"]
    teacher_insight_spec:
      widgets: ["option_distribution", "structure_confusion_rate"]
      aggregation: "step_level"
    ai_context_spec:
      page_goal: "先守住结构差异，再进入阻尼公式。"
      allowed_scope: ["前向零点", "局部速度反馈", "双层结构"]
      forbidden_scope: ["只凭响应图像判断结构"]
      canonical_facts:
        - "测速反馈不在前向通道显式增加零点。"
    preview_contract:
      route_kind: "student_demo"
      demo_path: "/interactive-learning/courses/unit-3-5-zero-dynamic-improvement/student/demo?step=step-07"
      must_match_student_page: true
    acceptance_checks:
      - "结构图与术语卡必须先于判断按钮出现。"
      - "本页必须能独立读懂结构差别。"

  step-08:
    title: "阻尼工作区：由目标阻尼反求 $K_d$ 与 $K_t$"
    layout:
      template: "formula_workspace"
      regions:
        - { id: "formula", width: "full", order: 1 }
        - { id: "example", width: "full", order: 2 }
        - { id: "workspace", width: "full", order: 3 }
    modules:
      - { id: "damping-formula-card", region: "formula", kind: "formula-card", must_be_visible: true }
      - { id: "example-card", region: "example", kind: "example-card", must_be_visible: true }
      - { id: "fill-workspace", region: "workspace", kind: "worked-example-workspace", must_be_visible: true }
    content_blocks:
      - id: "formulas"
        type: "formula_list"
        title: "阻尼公式"
        items:
          - "\\zeta_{PD}=\\zeta+\\frac{1}{2}K_d\\omega_n"
          - "\\zeta_v=\\zeta+\\frac{1}{2}K_t\\omega_n"
          - "K_d=K_t=2(\\zeta^\\star-\\zeta)/\\omega_n"
      - id: "example"
        type: "plain_text"
        title: "固定例题"
        body: "取 \\omega_n=2、\\zeta=0.2、\\zeta^\\star=0.5。"
      - id: "derivation-chain"
        type: "plain_text"
        title: "等效阻尼推导链"
        body: "必须把特征方程改写成标准二阶形式，再推出 \\zeta_{PD}、\\zeta_v 与 K_d=K_t=0.3。"
    interaction_spec:
      interaction_kind: "worked_example_workspace"
      student_task: "填写 K_d=K_t 的数值，并写一句结构解释。"
      answer_reveal: "teacher_toggle"
      quality_gate: "解释句是否同时出现阻尼与零点。"
    teacher_controls:
