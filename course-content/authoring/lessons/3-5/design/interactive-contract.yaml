    preview_contract:
      route_kind: "student_demo"
      demo_path: "/interactive-learning/courses/unit-3-5-zero-dynamic-improvement/student/demo?step=step-12"
      must_match_student_page: true
    acceptance_checks:
      - "原则卡和场景矩阵必须先于拖放区出现。"
      - "页面必须保留需要再判边界一栏。"

