      aggregation: "step_level"
    ai_context_spec:
      page_goal: "把公式工作链和结构辨认绑在一起。"
      allowed_scope: ["阻尼比", "目标阻尼", "参数反求"]
      forbidden_scope: ["把公式练习变成脱离结构的纯算题"]
