  step-05:
    title: 建模与结构表达
    template: content_only
    lecture_section: §二·问题一~二
    preview:
      student: /class/1-1/5
      teacher: /class/1-1/5/teacher
    layout:
      regions:
      - order: 1
        id: header
      - order: 2
        id: content
    modules:
    - kind: layout.support
      region: header
      order: 1
      must_be_visible: true
      payload:
        title: 建模与结构表达
        subtitle: 先用一阶电机看清建模语言，再把结构表达迁移到船舶航向对象
        text: 先用一阶电机看清建模语言，再把结构表达迁移到船舶航向对象
      id: step-05-layout-support-01
    - kind: content.rich
      region: content
      order: 2
      must_be_visible: true
      payload:
        block_key: step5_intro
      id: step-05-content-rich-02
    - kind: content.formula
      region: content
      order: 3
      must_be_visible: true
      payload:
        block_key: step5_de
      id: step-05-content-formula-03
    - kind: content.rich
      region: content
      order: 4
      must_be_visible: true
      payload:
        block_key: step5_tf_motivation
      id: step-05-content-rich-04
    - kind: content.formula
      region: content
      order: 5
      must_be_visible: true
      payload:
        block_key: step5_tf
      id: step-05-content-formula-05
    - kind: content.formula
      region: content
      order: 6
      must_be_visible: true
      payload:
        block_key: step5_code
      id: step-05-content-formula-06
    - kind: content.figure
      region: content
      order: 7
      must_be_visible: true
      payload:
        src: ../media/processed/1-1-block-diagram-basic.png
        caption: 基本控制系统结构要素——比较点、决策环节、执行器、被控对象、传感器
      id: step-05-content-figure-07
    - kind: content.cardSet
      region: content
      order: 8
      must_be_visible: true
      payload:
        block_key: step5_roles
      id: step-05-content-cardset-08
    content_blocks:
      step5_intro:
        text: 这条船需要自动保持航向。风浪推偏它，海流带偏它。为了先看清建模语言，本页先用一阶电机作为最小模型例子：输入电压 u(t)，输出转速 y(t)。同一套“输入—执行—对象—输出—测量”的结构要素，随后迁移回船舶航向对象。
      step5_de:
        formula: \tau\dot{y}(t)+y(t)=Ku(t)
        symbols:
        - symbol: \tau
          meaning: 时间常数
        - symbol: K
          meaning: 增益
        - symbol: u(t)
          meaning: 输入电压
        - symbol: y(t)
          meaning: 输出转速
        explanation: 输入电压同时驱动了转速和转速的变化率——两者的贡献由 τ 决定权重。
      step5_tf_motivation:
        text: 微分方程直观，但多个环节串联时求解笨重。传递函数提供了等价的代数语言。
      step5_tf:
        formula: G(s)=\frac{Y(s)}{U(s)}=\frac{K}{\tau s+1}
        symbols:
        - symbol: s
          meaning: 复变量
        - symbol: Y(s)
          meaning: 输出在变换域中的表示
        - symbol: U(s)
          meaning: 输入在变换域中的表示
      step5_code:
        formula: 'K = 1;  tau = 0.5;

          G = tf(K, [tau 1]);   % G(s)=K/(tau*s+1)'
        is_code: true
      step5_roles:
        cards:
        - text: 决策环节——把目标要求转化为作用量
        - text: 执行器——把控制量变成物理作用，比如舵角、电压或阀门开度
        - text: 被控对象——被作用并产生输出的过程，比如船体、电机或炉温系统
        - text: 传感器——采集输出信息
        - text: 比较点——把目标量和测量量放到同一坐标中
        - text: 结构迁移——船舶航向对象的输入可以是舵角或推进控制量，输出可以是航向角或横向偏差；数学阶次会更高，但结构要素相同
    teacher_controls:
      open_browse: enabled
      release_activity: not_applicable
      teacher_step_reveal: not_applicable
      reveal_reference_answer: not_applicable
    student_default: all_visible
    interaction_spec:
      interaction_kind: none
      interaction_archetype: display
      student_task: 阅读本页证据，完成课堂观察。
