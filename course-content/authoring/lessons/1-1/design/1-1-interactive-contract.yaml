        text: 有了模型，第一件事是看看这个对象自己是什么脾气。工程上最常用的测试方法：给一个突然的输入，看输出怎么响应。
      step6_modal:
        formula: e^{\sigma t}\sin(\omega t)
        symbols:
        - symbol: \sigma
          meaning: 衰减/放大趋势（极点的实部）
        - symbol: \omega
          meaning: 摆动快慢（极点的虚部）
      step6_pole_link:
        text: σ 和 ω 来自传递函数分母中解出的极点——极点是系统行为最早的暴露者。极点在复平面上的位置，几乎决定了系统的全部主要动态特征。
      step6_step_code:
        formula: step(G);   % 给系统一个单位阶跃输入，观察输出随时间变化
        is_code: true
      step6_indicators:
        cards:
        - text: 超调量 Mp——响应冲过目标多少，代表系统的冒进程度
        - text: 调节时间 ts——多久之后稳定在目标附近，代表系统的利落程度
        - text: 上升时间 tr——起步有多快，代表系统的响应速度
      step6_stepinfo:
        text: MATLAB 可用 stepinfo(G) 从阶跃响应曲线中直接提取这些数值指标。Octave 的 control 包通常不提供 stepinfo，需要先画出阶跃响应，再由脚本读图计算。
