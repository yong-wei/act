      payload:
        src: ../media/processed/1-1-example-correction-triptych.png
        caption: 示例对象校正前后的三域对比——开环对象无法停在目标值上，加入比例反馈后闭环响应收敛
      id: step-13-content-figure-03
    - kind: content.rich
