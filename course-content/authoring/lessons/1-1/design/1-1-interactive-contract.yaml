        current: modeling
        stages:
        - id: modeling
          label: 写出模型
          status: current
        - id: structure
          label: 画出结构
          status: upcoming
        - id: time
          label: 读时域响应
          status: upcoming
        - id: score
          label: 提取指标
          status: upcoming
        - id: stability
          label: 判断稳定
          status: upcoming
        - id: root-locus
          label: 扫描增益影响
          status: upcoming
        - id: frequency
          label: 读频域响应
          status: upcoming
      id: step-04-content-stagemap-03
    - kind: content.cardSet
