      order: 4
      must_be_visible: true
      payload:
        block_key: step4_questions
      id: step-04-content-cardset-04
    content_blocks:
      step4_intro:
        text: 这条船需要保持航向，但在动手设计控制器之前，必须先完成开环诊断：对象怎么写、结构怎么画、响应怎么看、指标怎么读、稳定怎么判、参数影响怎么扫、频域证据怎么解释。
      step4_questions:
        cards:
