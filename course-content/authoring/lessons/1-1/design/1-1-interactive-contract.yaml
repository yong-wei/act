        explanation: 若系统持续测量输出，把测量结果送回比较端，再根据偏差修正动作，这是闭环控制。
      id: step-09-content-figure-04
    - kind: content.formula
      region: content
      order: 5
      must_be_visible: true
      payload:
        block_key: step9_error_formula
      id: step-09-content-formula-05
    - kind: content.rich
      region: content
      order: 6
      must_be_visible: true
      payload:
        block_key: step9_feedback_insight
      id: step-09-content-rich-06
    - kind: content.rich
      region: content
      order: 7
      must_be_visible: true
      payload:
        block_key: step9_p_def
      id: step-09-content-rich-07
    - kind: content.formula
      region: content
      order: 8
      must_be_visible: true
      payload:
        block_key: step9_C
      id: step-09-content-formula-08
    - kind: content.figure
      region: content
      order: 9
      must_be_visible: true
      payload:
        src: ../media/processed/1-1-closed-loop-block.png
        caption: 单位负反馈闭环系统——控制器 C(s) 在前向通道，对象 G(s) 紧随其后，反馈通道 H(s)=1
      id: step-09-content-figure-09
    - kind: content.rich
      region: content
      order: 10
      must_be_visible: true
      payload:
        block_key: step9_phi_motive
      id: step-09-content-rich-10
    - kind: content.formula
      region: content
      order: 11
      must_be_visible: true
      payload:
        block_key: step9_phi
      id: step-09-content-formula-11
    - kind: content.reveal
      region: content
      order: 12
      must_be_visible: true
      payload:
        block_key: step9_derivation
      id: step-09-content-reveal-12
    - kind: activity.panel
      region: activity
      order: 13
      must_be_visible: true
      payload:
        interaction_key: step9_quiz
      id: step-09-activity-panel-13
    content_blocks:
      step9_intro:
        text: 前七个问题完成了开环诊断。现在进入干预：如果系统太慢、不能抗扰或稳定裕度不足，就要把输出信息送回比较端，并用控制器改写闭环行为。
      step9_p_def:
        text: 最简单的控制器——误差大时用力修正，误差小时轻点修正。这就是比例控制。
      step9_C:
        formula: C(s)=K_p
        symbols:
        - symbol: K_p
          meaning: 比例增益
      step9_phi_motive:
        text: 把这个控制器串入回路，从参考输入 r(t) 到输出 y(t) 的闭环传递函数变为——
      step9_phi:
        formula: \Phi(s)=\frac{C(s)G(s)}{1+C(s)G(s)}
        symbols:
        - symbol: \Phi(s)
          meaning: 闭环传递函数
      step9_derivation:
        items:
        - layer: 1
          text: 代入 G(s)=1/(0.5s+1)，C(s)=K_p
        - layer: 2
          text: Φ(s)=K_p/(0.5s+1+K_p)
        - layer: 3
          text: 取 K_p=2，Φ(s)=2/(0.5s+3)=4/(s+6)
        - layer: 4
          text: 新系统的极点从原来的 -2 移到了 -6——响应变快，稳态值改变。一阶对象中没有超调；更复杂的二阶对象还会进一步出现振荡。
      step9_error_formula:
        formula: e(t)=r(t)-y_m(t)
        symbols:
        - symbol: r(t)
          meaning: 期望输出
        - symbol: y_m(t)
          meaning: 测量输出
        - symbol: e(t)
          meaning: 误差
      step9_feedback_insight:
        text: 反馈把持续比较并修正这个动作内建到系统工作逻辑里。修正的时机、力度或方向不恰当，闭环可能比开环更差，因此必须继续用时域、根轨迹和频域证据核对。
    interaction_spec:
      activity_cards:
      - id: step9_q1
        prompt: 当 K_p 进入闭环传递函数 Φ(s)=K_pG(s)/(1+K_pG(s)) 后，最直接需要重新观察哪一组证据？
        response_kind: choice.single
        options:
        - key: A
          text: 只看控制器名称是否改变
        - key: B
          text: 重新观察极点位置、时域响应和频域裕度是否同时改变
        - key: C
          text: 只看输入信号幅值是否变大
        - key: D
          text: 只看代码行数是否减少
        reference_answer: B
        submit_scope: per_card
        reveal_answer: 比例增益进入闭环分母后，极点、时域响应和频域裕度都可能改变，因此不能只停留在控制器定义。
      interaction_kind: activity_card_set
    teacher_controls:
      open_browse: enabled
      release_activity: teacher_controlled
      teacher_step_reveal: teacher_controlled
      reveal_reference_answer: per_card_after_submit
      answer_reveal_policy: per_card_after_submit
    student_default: content_visible_derivation_collapsed_quiz_locked
    telemetry_spec:
      summary_fields:
      - viewed
      misconception_tags: []
    teacher_insight_spec:
      widgets: []
    ai_context_spec:
      page_goal: 反馈与校正——从开环到闭环
      delivery_mode: hidden_page_context
    preview_contract:
      demo_path: /class/1-1/9
    acceptance_checks:
    - 页面对象、任务、证据和结论对学生自包含可读。
    - 模块 payload 与 content_blocks 能被 shared manifest runtime 消费。
    - 教师控制、遥测、AI 上下文与预览路径已显式给出。
    - 活动题必须检验 Kp 改写闭环证据链，而不是只复述比例控制定义。
    student_access:
      browse_default: open
      activity_default: locked_until_teacher_release
      reveal_default: collapsed_until_teacher_release
