      step8_freq_interpret:
        text: 慢节奏扰动，系统容易跟上。快节奏扰动，输出幅值削弱，相位滞后。margin 会在 Bode 图上标出增益裕度和相位裕度：裕度越小，增益继续提高或相位继续滞后时越接近失稳边界。频域回答的是“哪些频率的扰动会被放大，哪些会被抑制”，也回答“离振荡风险还有多远”。
