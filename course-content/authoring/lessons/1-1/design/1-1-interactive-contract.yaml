        - text: 问题二：怎样表达这条船内部的信息流？
        - text: 问题三：这条船被推了一下之后，会怎样运动？
        - text: 问题四：怎么给系统的表现打个分？
        - text: 问题五：这条船会不会失控？
        - text: 问题六：如果拧大增益，极点会往哪儿跑？
        - text: 问题七：这条船对不同节奏的扰动，态度一样吗？
