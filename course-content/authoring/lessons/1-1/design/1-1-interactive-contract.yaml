      order: 6
      must_be_visible: true
      payload:
        block_key: step13_milestone
        style: pullquote
      id: step-13-content-rich-06
    content_blocks:
      step13_correction_code:
        items:
        - layer: 1
          text: Kp2 = 2;  Phi2 = feedback(Kp2*G, 1);   % 构造闭环传递函数
        - layer: 2
          text: 'step(G, Phi2);    % 对比校正前后的时域响应

            rlocus(G);         % 用根轨迹解释闭环极点位置的变化

            bode(G, Kp2*G);    % 对比校正前后环路开环幅频曲线的变化'
      step13_figure_read:
        text: Kp=2 的比例反馈后，开环对象持续增长的响应被改写为收敛响应，出现约 4% 超调和轻微摆动。根轨迹揭示闭环极点离开实轴，频域图显示环路幅频曲线整体上移，也改变了穿越频率和稳定裕度。
      step13_full_script:
        items:
        - layer: 1
          text: 'G = tf(1, [1 2 0]);   % G(s)=1/(s(s+2))

            figure(1); step(G);     % 时域：阶跃响应'
        - layer: 2
          text: 'figure(2); rlocus(G);   % 复域：根轨迹

            figure(3); margin(G);   % 频域：Bode图+稳定裕度'
        - layer: 3
          text: 'isstable(G)              % 稳定性检查

            Kp2 = 2;  Phi2 = feedback(Kp2*G, 1);

            figure(4); step(G, Phi2);  % 校正前后时域对比'
        - layer: 4
          text: '% ===== 1-1 闪电速通：完整示例 =====

            % 一条简化船舵回路：舵角指令 -> 舵机惯性 -> 舵角积分 -> 实际舵角

            G = tf(1, [1 2 0]);           % G(s)=1/(s(s+2))


            % ---- 开环诊断 ----

            figure(1); step(G);           % 时域：阶跃响应——看过程

            figure(2); rlocus(G);         % 复域：根轨迹——看迁移

            figure(3); margin(G);         % 频域：Bode图+稳定裕度——看节律


            % ---- 稳定性检查 ----

            isstable(G)                   % 对开环对象判断稳定


            % ---- 闭环校正 ----

            Kp2 = 2;                      % 比例增益

            Phi2 = feedback(Kp2*G, 1);    % Kp=2 时的闭环传递函数 Phi(s)

            figure(4); step(G, Phi2);     % 时域：校正前后

            figure(5); rlocus(G);         % 根轨迹：极点迁移

            figure(6); bode(G, Kp2*G);    % 频域：环路增益变化'
      step13_milestone:
        text: 在过去的 90 分钟里，你走通了一个完整的控制设计闭环：用传递函数描述对象 → 从时域、根轨迹、频域三个角度诊断对象的行为 → 加入反馈和控制器改变系统的表现
          → 比较不同参数下的效果。后续三十二章的任务，是把这里的每一行代码背后的原理逐一展开。
    teacher_controls:
      open_browse: enabled
      release_activity: not_applicable
      teacher_step_reveal: teacher_controlled
      reveal_reference_answer: not_applicable
      reveal_owner: teacher
      reveal_mode: stepwise_per_reveal_module
      student_locked_until_released: true
