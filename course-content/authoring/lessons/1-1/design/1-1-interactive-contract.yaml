        - 闭环比例控制（Kp=2）
        rows:
        - - 阶跃响应
          - 可能存在稳态偏差，无修正机制
          - 偏差持续缩小，响应主动靠近目标
        - - 抗扰动能力
          - 扰动直接作用在输出上，无人修正
          - 扰动产生的偏差被反馈检测到，控制器自动补偿
        - - 极点位置
          - 固定（对象的固有极点）
          - 随 Kp 移动；一阶对象中通常沿实轴移动
        - - 根轨迹
          - 不存在——没有可调参数改变极点
          - Kp 从 0→∞，闭环极点沿固定路径迁移
        - - 环路开环 Bode 图
          - 固定
          - 增益提高后幅频曲线整体上移，穿越频率通常右移
        - - 稳定裕度
          - 由对象原始环路决定
          - 增益提高通常会改变穿越频率；相位裕度可能减小，需要用 margin 重新核对
      step10_cycle:
        text: 控制设计的核心循环：诊断 → 加控制器 → 重新诊断 → 比较效果 → 调整控制器 → 再次验证。这个循环你会走几十遍。
      step10_conflict:
        text: 响应速度和振荡倾向的此消彼长——后续工具（超前校正、PID、极点配置、优化设计）都在回答同一个问题：怎样在加快响应的同时控制住振荡。
