      id: step-07-content-figure-07
    content_blocks:
      step7_pole_recap:
        text: 回顾前面的模态公式——σ 和 ω 在复平面上对应的坐标就是极点。一个系统有几个极点，就有几种基本的运动方式。
      step7_stability:
        text: 全部极点落在左半平面（σ<0）→ 系统稳定，扰动引起的偏差会逐渐消失。任意极点跑到右半平面（σ>0）→ 对应模态随时间放大，系统失稳。
      step7_isstable:
        formula: isstable(G)   % 判断系统所有极点是否都位于稳定区域
        is_code: true
      step7_rlocus_motive:
        text: 稳定只是底线。调大增益 K，极点会往哪走？极点移动的方向，直接决定了响应是变快还是更振荡。
      step7_rlocus_code:
        formula: rlocus(G);   % 绘制极点随增益 K 变化的迁移路径
        is_code: true
      step7_routh_preview:
        text: 高阶系统直接求根困难。劳斯判据提供代数捷径——从特征方程的系数直接判断稳定性。先记住这个入口，再用根轨迹观察增益变化时极点如何移动。
