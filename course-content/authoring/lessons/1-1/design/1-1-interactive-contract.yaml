      activity_cards:
      - id: pre_q1
        prompt: 在“输入电压 u(t) → 电机 → 输出转速 y(t)”这个关系中，哪一个量是输出？
        response_kind: choice.single
        options:
        - key: A
          text: 输入电压 u(t)
        - key: B
          text: 输出转速 y(t)
        - key: C
          text: 时间常数 τ
        - key: D
          text: 增益 K
        reference_answer: B
        submit_scope: per_card
        explanation: 进入本课前只需要能识别输入和输出；后续传递函数会把这种输入-输出关系写成 G(s)。
      - id: pre_q2
        prompt: 如果一辆车只在上高速时打一次方向盘角度，之后不再调整，它能够一直保持在车道中心。
        response_kind: choice.binary
        options:
        - key: T
          text: 正确
        - key: F
          text: 错误
        reference_answer: F
        reveal_answer: 风、路面变化会让车逐渐偏离，需要持续修正
        submit_scope: per_card
      - id: pre_q3
        prompt: 一个量随时间变化的快慢，在数学中通常用什么来描述？
        response_kind: choice.single
        options:
        - key: A
          text: 这个量本身的大小
        - key: B
          text: 这个量的变化率（导数）
        - key: C
          text: 这个量的平方
        - key: D
          text: 这个量的平均值
        reference_answer: B
        submit_scope: per_card
      interaction_kind: activity_card_set
