      payload:
        src: ../media/processed/1-1-open-loop-block.png
        caption: 开环控制结构——输入指令直接进入控制动作，没有测量、比较和修正回路
        explanation: 若系统只按预设动作运行，不使用输出信息修正自己，这是开环控制。
