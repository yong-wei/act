# Isolated reverse-proxy path for the developer runtime gateway.
# Install next to the student site config; do not share the app upstream.

limit_req_zone $binary_remote_addr zone=developer_gateway:10m rate=30r/s;

map $http_authorization $developer_gateway_auth_present {
    default 0;
    "~*"    1;
}

log_format developer_gateway_anon '$remote_addr $request $status $body_bytes_sent auth=$developer_gateway_auth_present';

server {
    listen 443 ssl;
    server_name runtime-dev.adapt-learn.online;

    access_log /var/log/nginx/developer-gateway.access.log developer_gateway_anon;
    error_log  /var/log/nginx/developer-gateway.error.log warn;

    location / {
        limit_req zone=developer_gateway burst=20 nodelay;
        proxy_pass http://127.0.0.1:8787;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Act-Runtime-Lease $http_x_act_runtime_lease;
        proxy_set_header X-Act-Runtime-Transport $http_x_act_runtime_transport;
        proxy_set_header Authorization $http_authorization;
        proxy_hide_header Set-Cookie;
        proxy_intercept_errors off;
        # Query-string tokens are rejected by the gateway; do not rewrite them in.
    }
}
