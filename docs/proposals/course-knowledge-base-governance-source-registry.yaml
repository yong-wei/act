    item_kind: governance_contract
    identity_namespace: repository_path
    include:
      - docs/proposals/course-knowledge-base-governance-source-derivation-contract.md
      - docs/proposals/course-knowledge-base-governance-source-registry.yaml
      - docs/proposals/course-knowledge-base-rebuild-series.md
