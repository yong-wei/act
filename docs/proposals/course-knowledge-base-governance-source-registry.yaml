  - field_decoder_required

failure_rules:
  - unknown item_kind, identity_namespace, or source_field combinations fail only when they belong to one of the five declared readiness_inputs
  - mixed_path_node_ref without an explicit discriminator fails only for a LearningPath row admitted by the active path predicate
  - equal source_id values in different namespaces remain distinct
  - missing required sources fail only within the five declared readiness_inputs; optional missing readiness sources emit deterministic missing records
  - declared Prisma tables and fields used by active-knowledge-references must exist in the current DMMF
  - the LearningPath.pathPayload decoder is schema-aware and unknown ID-bearing fields fail closed only for admitted incomplete paths
  - every field_decoders json_decoder resolves to the bounded active-reference decoder contract and participates in its digest
  - a post-cutover new LearningFact without exactly one active knowledge revision fails that new write
  - historical facts, events, execution rows, derived state, lineage, decoder coverage, and writer discovery are rejected as out-of-scope inputs and produce no missing-input, unknown-shape, or readiness finding
