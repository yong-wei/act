  - id: knowledge-runtime-loaders
    item_kind: runtime_loader
    identity_namespace: repository_path
    include:
      - src/lib/knowledge-graph-source.ts
      - src/app/api/knowledge/nodes/route.ts
    missing: fail
database_snapshot:
  mode:
    allowed:
      - immutable_export
      - repeatable_read_read_only
  required_metadata:
    - snapshot_id
    - captured_at
    - dataset_watermarks
    - snapshot_proof
  proof_profiles:
    repeatable_read_read_only:
      required:
        - transaction_isolation
        - transaction_started_at
        - exported_snapshot_token
        - shared_snapshot_import_count
      consistency_rule: every query shares one transaction or imports the same exported snapshot token
    immutable_export:
      required:
        - export_object_id
        - generated_at
        - export_digest
      consistency_rule: every dataset is read from the same immutable export object and aggregate digest
  snapshot_id_rule: derive snapshot_id from the selected proof profile; caller-supplied labels are invalid
  repository_row_policy: no learner row content or row digest is committed

database_sources:
  - id: course-basis
    tables: [CourseBasis, CourseBasisDocument, CourseBasisDocumentVersion, CourseBasisSegment, CourseBasisProjection, CourseBasisReferenceLink]
    fields:
      CourseBasis: [id, courseIdentity, title, description, createdAt, updatedAt]
      CourseBasisDocument: [id, courseBasisId, title, kind, createdAt, updatedAt]
      CourseBasisDocumentVersion: [id, documentId, versionNumber, sourceType, sourceName, mimeType, contentHash, normalizedText, extractionState, extractionVersion, reviewState, retiredAt, createdAt]
      CourseBasisSegment: [id, versionId, orderIndex, stableAnchor, headingPath, pageNumber, paragraphNumber, text, contentHash]
      CourseBasisProjection: [id, versionId, segmentId, projectionKey, corpusSourceId, projectedAt]
      CourseBasisReferenceLink: [id, versionId, referenceType, referenceId, createdAt]
    observation_contracts:
      CourseBasisDocument.kind: { discriminators: [STANDARD, TEXTBOOK, OTHER], zero_observation: allow_if_table_empty }
      CourseBasisDocumentVersion.extractionVersion: { versions: [course-basis-extraction.v1], zero_observation: allow_if_table_empty }
      CourseBasisDocumentVersion.sourceType: { discriminators: [MARKDOWN, PLAIN_TEXT, PASTED_TEXT, SEARCHABLE_PDF], zero_observation: allow_if_table_empty }
      CourseBasisDocumentVersion.mimeType: { discriminators: [text/markdown, text/plain, application/pdf], zero_observation: allow_if_table_empty }
      CourseBasisDocumentVersion.extractionState: { discriminators: [EXTRACTED, UNSUPPORTED, FAILED], zero_observation: allow_if_table_empty }
      CourseBasisDocumentVersion.reviewState: { discriminators: [PENDING, CONFIRMED, REJECTED], zero_observation: allow_if_table_empty }
    item_kind: course_objective_source
    identity_namespace: course_basis
    privacy: non_learner
  - id: canonical-knowledge-projection
    tables: [KnowledgeNode, KnowledgeLink]
    fields:
      KnowledgeNode: [id, name, nodeType, description, bloomLevel, knowledgeDim, content, metadata, resources, tags, isActive]
      KnowledgeLink: [id, sourceId, targetId, relation, strength, metadata]
    json_selectors:
      KnowledgeNode.metadata:
        - $.chapter
        - $.chapterName
        - $.domain
    observation_contracts:
      KnowledgeNode.nodeType: { discriminators: [THEORY, CONCEPT, METHOD, SKILL, APPLICATION, ETHICS, SCENARIO], zero_observation: forbid }
      KnowledgeNode.isActive: { discriminators: ['true', 'false'], zero_observation: forbid }
      KnowledgeNode.metadata: { historical_shapes: [object], zero_observation: forbid }
      KnowledgeLink.relation: { discriminators: [applies_to, association, complements, contains, contrasts_with, cross_domain, defines, derives, describes_migration_of, determines, embodies, enables, example, explains, follows, generalizes, governs, implements, influences, informs, instance_of, leads_to, opposite, prerequisite, quantified_by, related, supports, uses, visualized_by, 建模基础, 引出机械建模, 引出电路建模, 机电类比, 电路应用, 非线性扩展], zero_observation: forbid }
    item_kind: knowledge_projection
    identity_namespace: canonical_knowledge_node
    privacy: non_learner
  - id: lesson-plan-arrangement
    tables: [LessonPlan]
    fields:
      LessonPlan: [id, title, description, isPublic, isPreset, presetKey, createdAt, updatedAt]
    observation_contracts:
      LessonPlan.isPublic: { discriminators: ['true', 'false'], zero_observation: forbid }
    item_kind: course_arrangement
    identity_namespace: lesson_plan
    privacy: non_learner
  - id: lesson-item-arrangement
    tables: [LessonItem]
    fields:
      LessonItem: [id, planId, itemType, resourceId, knowledgeNodeId, stage, order, duration, overrideConfig, createdAt]
    observation_contracts:
      LessonItem.itemType: { discriminators: [KNOWLEDGE_NODE, RESOURCE], zero_observation: forbid }
      LessonItem.stage: { discriminators: [BRIDGE_IN, OBJECTIVE, PARTICIPATORY, POST_ASSESSMENT, PRE_ASSESSMENT, SUMMARY], zero_observation: forbid }
    item_kind: lesson_item
    identity_namespace: lesson_item
    privacy: non_learner
  - id: teaching-resource-projection
    tables: [TeachingResource]
    fields:
      TeachingResource: [id, title, description, type, content, registryId, category, displayName, displayOrder, teacherOnly, config, aiHints, createdAt, updatedAt, knowledgeNodes]
    observation_contracts:
      TeachingResource.type: { discriminators: [ETHICS_SCENARIO, INTERACTIVE_COMP, SIMULATION, SIMULATION_APP, STATIC_MEDIA, STATIC_TEXT, VIDEO], zero_observation: forbid }
      TeachingResource.teacherOnly: { discriminators: ['true', 'false'], zero_observation: forbid }
    relation_observation_contracts:
      TeachingResource.knowledgeNodes: { join_table: _KnowledgeNodeToTeachingResource, owner_column: B, target_column: A }
    logical_selectors:
      - TeachingResource.knowledgeNodes[*].id
    item_kind: resource
    identity_namespace: teaching_resource
    privacy: non_learner
  - id: active-knowledge-references
    tables: [KnowledgeProgress, LearningPath, LearningNote]
    learner_identity_fields:
      KnowledgeProgress: userId
      LearningPath: userId
      LearningNote: userId
    fields:
      KnowledgeProgress: [nodeId]
      LearningPath: [id, userId, pathStatus, nodeIds, currentNodeId, entryNodeId, pathPayload]
      LearningNote: [nodeId]
    observation_contracts:
      LearningPath.pathStatus: { discriminators: [active, fallback, legacy, completed], zero_observation: forbid }
