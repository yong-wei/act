schema_version: course-knowledge-source-registry/v1
registry_id: course-knowledge-governance-stage-one
normalization_profile: course-knowledge-nfc-posix-lf/v1
algorithm_version: course-knowledge-inventory/v1

repository_codec_contract:
  schema_version: repository-input-codecs/v1
  unknown_codec: invalid
  codecs:
    - { id: markdown-utf8/v1, media_type: text/markdown, kind: text, include: ["**/*.md"] }
    - { id: json-utf8/v1, media_type: application/json, kind: text, include: ["**/*.json", "**/*.jsonl"] }
    - { id: yaml-utf8/v1, media_type: application/yaml, kind: text, include: ["**/*.yaml", "**/*.yml"] }
    - { id: source-utf8/v1, media_type: text/plain, kind: text, include: ["**/*.ts", "**/*.tsx", "**/*.js", "**/*.mjs", "**/*.cjs", "**/*.py", "**/*.sql", "**/*.txt", "**/*.csv", "**/*.html", "**/*.css", "**/*.svg"] }
    - { id: matlab-utf8/v1, media_type: text/x-matlab, kind: text, include: ["**/*.m"] }
    - { id: tex-utf8/v1, media_type: application/x-tex, kind: text, include: ["**/*.tex"] }
    - { id: png/v1, media_type: image/png, kind: binary, signature: png, include: ["**/*.png"] }
    - { id: pdf/v1, media_type: application/pdf, kind: binary, signature: pdf, include: ["**/*.pdf"] }
    - { id: jpeg/v1, media_type: image/jpeg, kind: binary, include: ["**/*.jpg", "**/*.jpeg"] }
    - { id: gif/v1, media_type: image/gif, kind: binary, include: ["**/*.gif"] }
    - { id: webp/v1, media_type: image/webp, kind: binary, include: ["**/*.webp"] }
    - { id: mp4/v1, media_type: video/mp4, kind: binary, include: ["**/*.mp4"] }
    - { id: webm/v1, media_type: video/webm, kind: binary, include: ["**/*.webm"] }
    - { id: audio/v1, media_type: audio/unknown, kind: binary, include: ["**/*.mp3", "**/*.wav", "**/*.ogg"] }
    - { id: m4a/v1, media_type: audio/mp4, kind: binary, include: ["**/*.m4a"] }
    - { id: ppm/v1, media_type: image/x-portable-pixmap, kind: binary, include: ["**/*.ppm"] }
    - { id: zip/v1, media_type: application/zip, kind: binary, include: ["**/*.zip"] }
    - { id: tex-build-artifact/v1, media_type: application/x-tex-build-artifact, kind: binary, disposition: invalid-unclassified, include: ["**/*.aux", "**/*.log"] }
    - { id: python-bytecode/v1, media_type: application/x-python-bytecode, kind: binary, disposition: invalid-unclassified, include: ["**/*.pyc"] }
    - { id: macos-desktop-metadata/v1, media_type: application/x-apple-ds-store, kind: binary, disposition: invalid-unclassified, include: ["**/.DS_Store"] }

anchor_record_contract:
  schema_version: course-scope-anchor/v1
  required_fields:
    - anchor_id
    - anchor_scope
    - anchor_type
    - course_id
    - module_id
    - lesson_id
    - source_locator
    - text_digest
  anchor_types:
    - formal_objective
    - necessary_prerequisite
    - explicit_extension
  anchor_scopes:
    course: { module_id: null, lesson_id: null }
    module: { module_id: required, lesson_id: null }
    lesson: { module_id: required, lesson_id: required }
  null_encoding: YAML null; empty strings and synthetic hierarchy IDs are invalid
  identity_rule: anchor_id is derived from anchor_type, course/module/lesson identities, source_locator, and text_digest
  stage_one_disposition: evidence_only

instructional_source_role_matrix:
  binding_content:
    sources:
      - { include: course-content/authoring/lessons/**/design/*-handout.md, exclude: course-content/authoring/lessons/**/design/*-teacher-handout.md, audience: student }
      - { include: course-content/authoring/lessons/**/design/*-teacher-handout.md, audience: teacher }
      - { include: course-content/authoring/knowledge/cards/nodes/*.md, audience: shared }
      - { include: course-content/authoring/lessons/**/media/processed/**, audience: student_or_declared }
      - { include: course-content/authoring/resources/**, audience: declared_required }
      - { derived: reconciled-actual-activity, audience: declared_required }
      - { derived: reconciled-actual-assessment, audience: declared_required }
    binding_candidate_eligible: true
  planning_evidence:
    sources:
      - course-content/authoring/lessons/**/design/*-boppps.md
      - course-content/authoring/lessons/**/design/*-interactive-page.md
      - course-content/authoring/lessons/**/design/*-interactive-contract.yaml
      - course-content/authoring/lessons/**/design/*-multimedia.md
      - course-content/authoring/knowledge/cards/lessons/**/sequence.json
    binding_candidate_eligible: false
    allowed_evidence: [objective, sequence, feedback, misconception, teacher_aggregation, teacher_progression]
  review_gate_evidence:
    sources:
      - course-content/authoring/lessons/**/design/*-interactive-design-acceptance.json
      - course-content/authoring/lessons/**/notes/interactive-implementation-acceptance.json
      - course-content/runtime/lessons/**/review/interactive-page-check.json
      - course-content/runtime/lessons/**/review/interactive-manifest-audit.json
      - course-content/runtime/lessons/**/review/*.json
    binding_candidate_eligible: false
  production_provenance:
    sources:
      - course-content/authoring/lessons/**/media/raw/**
    binding_candidate_eligible: false
  runtime_projection:
    sources:
      - course-content/runtime/lessons/**/lesson.json
      - course-content/runtime/lessons/**/interactive-manifest.json
      - course-content/runtime/lessons/**/media/**
      - course-content/runtime/lessons/**/review/**
      - course-content/runtime/knowledge/cards/nodes/**
    binding_candidate_eligible: false
    truth_role: projection_consistency_only
  reconciliation_rule: a reconciled activity or assessment becomes binding-candidate eligible only when authoring page, authoring contract, runtime manifest, and required review gates agree on step identity, interaction archetype, order, feedback, and progression semantics
  blocking_rule: source drift, a non-passing hard gate, repeated prompt identity, missing feedback semantics, or interaction degradation to a static image, single choice, or mechanical fill-in emits unresolved_or_blocked and forbids a formal binding candidate

interaction_semantics_contract:
  schema_version: interaction-binding-semantics/v1
  objective_refs:
    required_for_roles: [teaches, practices, assesses]
    optional_for_role: references
    resolver: inventoried formal objective or course-scope-anchor/v1 identity
    alignment_rule: every ref must resolve and the learner action, expected output, criterion, and candidate concept must be consistent with the referenced objective; disagreement is blocked
  role_semantics:
    teaches: { required_fields: [candidate_concept_ref, explanation_or_demonstration_locator], forbidden_fields: [scoring_rule] }
    practices: { required_fields: [candidate_concept_ref, learner_action, expected_output, completion_criterion] }
    assesses: { required_fields: [candidate_concept_ref, observable_response, assessment_criterion, scoring_rule, evidence_source] }
    references: { required_fields: [candidate_concept_ref, citation_locator], forbidden_claims: [instruction, practice, assessment] }
  feedback:
    required_fields: [trigger_state, learner_response_state, feedback_outcome, corrective_action, next_task_ref]
    allowed_outcomes: [correct, partial, incorrect, blocked, retry, teacher_review]
    missing_rule: unresolved_or_blocked
  teacher_progression:
    required_fields: [decision, condition, evidence_ref]
    allowed_decisions: [hold, release, retry, teacher_override]
    override_required_fields: [actor_role, reason, recorded_at]
    missing_rule: unresolved_or_blocked
  reconciliation_fields: [lesson_id, step_id, activity_id, assessment_id, objective_refs, candidate_concept_ref, instructional_role, interaction_archetype, sequence_position, learner_action, expected_output, observable_response, completion_criterion, assessment_criterion, scoring_rule, evidence_source, feedback, misconception_tags, teacher_aggregation, teacher_progression]
  sources: [authoring_interactive_page, authoring_interactive_contract, runtime_interactive_manifest, interactive_page_check, implementation_acceptance, manifest_audit]
  conflict_rule: any missing required field, unresolved reference, cross-source mismatch, or hard-gate failure emits unresolved_or_blocked and forbids a formal binding candidate
future_child_acceptance_profiles:
  semantic_block: { profile: semantic-block-governance/v1, phase_order: [semantic_profile, canonical_card, in_block_relation] }
  cross_identity: { profile: cross-identity-governance/v1, requires_all_endpoint_semantic_blocks: true }
  cross_relation: { profile: cross-relation-governance/v1, requires_all_endpoint_semantic_blocks: true, requires_cross_identity: true }
  resource_binding: { profile: resource-binding-governance/v1, requires_all_endpoint_semantic_blocks: true, requires_cross_identity: true }
  global_closeout: { profile: global-closeout-governance/v1, requires_all_governance_children: true }
  cutover: { profile: cutover-governance/v1, requires_global_closeout: true }

future_child_acceptance_profile_contract:
  semantic_profile_required_fields: [unique_semantic_name, strict_definition, semantic_boundary, near_neighbor_distinction, synonyms, scope_basis, domain_membership, foundational_concept_disposition]
  unknown_profile: fail

knowledge_truth_revision_contract:
  schema_version: knowledge-truth-revision/v1
  required_fields: [knowledge_revision_id, effective_at, canonical_identity_manifest_digest, definition_digest, relation_manifest_digest, resource_binding_manifest_digest]
  revision_id_rule: digest the normalized immutable truth inputs and effective timestamp; mutable labels and display names are not revision identities
  activation_rule: exactly one revision is active for fact generation at any instant; same-name maintenance creates a new immutable revision without candidate publication or agent review
  learning_fact_fields: [LearningFact.contextJson.knowledgeRevisionRef, LearningFact.contextJson.knowledgeRevisionRefs, LearningFact.contextJson.evidenceGovernance.knowledgeRevisionRef, LearningFact.contextJson.evidenceGovernance.knowledgeRevisionRefs]
  decoded_cardinality_rule: merge and deduplicate all declared learning_fact_fields; every fact must resolve to exactly one immutable knowledge_revision_id, while zero or multiple distinct revisions fail readiness
  producer_rule: every LearningFact producer must resolve and persist the active knowledge_revision_id atomically with fact generation; unknown or missing revision fails the producer readiness gate
  producer_source_prefixes: [adaptive-assessment, arena-official, control-correction-path, historical, interaction-log, learning-path, simulation-agent-evidence]
  historical_rule: pre-contract facts without provable revision bind to an immutable legacy-unversioned revision record tied to the governed source snapshot and remain explicitly uncertain; they must never be relabeled as the current revision
  cutover_rule: every affected fact resolves to one valid immutable revision or cutover fails

