      growth: { table: GrowthRecord, watermark: createdAt, version_fields: [], status_fields: [sourceSnapshotAt, expiresAt], database_audit_key: [userId, id], database_only_audit_fields: [sourceInputDigest, evidenceJson, description] }
      recommendation: { table: LearningRecommendation, watermark: createdAt, version_fields: [], status_fields: [isCompleted, completedAt, expiresAt], database_audit_key: [userId, id], database_only_audit_fields: [targetModule, description, reasoning] }
      arena_score: { table: ArenaSubmission, watermark: createdAt, version_fields: [], status_fields: [valid, submittedAt], database_audit_key: [userId, id] }
    item_kind: learner_dataset
    identity_namespace: learner_aggregate
    privacy: schema_count_deidentified_disposition_only
    aggregate_privacy:
      min_group_size: 5
      below_threshold: suppressed
      rare_categories: merge_to_other_or_suppress
      cross_dimension_rule: reject combinations whose resulting cell is below min_group_size
      prohibited_repository_fields: [userId, description, reasoning, payload, raw_row_digest, sourceInputDigest]
    reconciliation_contract:
      database_side_dispositions: [preserved, recomputed, expired, resolved, unresolved, blocked]
      required_invariants:
        - exactly one latest valid portrait snapshot per learner and target calculation lineage
        - canonical portrait remains seven-dimensional; legacy six-dimensional competency snapshots remain compatibility inputs only
        - split concept evidence is never duplicated without an explicit reviewed allocation
        - many-to-one concept merges deduplicate semantically identical evidence after identity mapping by authoritative sourceEventId or sourceLogId, event time, evidence role, source lineage, and canonical destination; canonical knowledge ID alone is never a deduplication key
        - no active risk, growth, recommendation, diagnosis, or class aggregate contains an unresolved retired knowledge reference
        - recommendations invalidated by a knowledge-boundary change are recomputed or expired
        - every class aggregate proves one compatible portrait/materialization version across its input population
        - unresolved legacy knowledge reference count is zero at cutover
        - authoritative source lineage and watermark are preserved for every recomputed record
      repository_output:
        content: only min-group-size-suppressed disposition counts and invariant pass/fail summaries
        reporting_contract:
          metric_semantics: migration_governance
          denominator: declared dataset population after eligibility and suppression rules
          window: immutable export or repeatable-read snapshot bounded by dataset watermarks
          required_context: [snapshot_id, dataset_watermarks, materialization_version, portrait_version]
          suppressed_meaning: the cell exists but its population is below the privacy threshold
          unknown_meaning: the disposition cannot be resolved from the governed snapshot
          forbidden_interpretation: counts and invariant results are not mastery, learning-gain, or risk-trend metrics

evidence_deduplication_contract:
  schema_version: many-to-one-evidence-deduplication/v1
  database_side_only: true
  source_identity_priority:
    - explicit versioned lineage discriminator from LearningFact.factType and contextJson evidence governance
    - LearningFact.sourceEventId
    - namespaced LearningFact.sourceLogId
    - LearningEvent.eventId
    - InteractionLog.clientEventId
  source_log_id_namespaces:
    simulation: { namespace: simulation_log, source_field: SimulationLog.id }
    question: { namespace: user_answer, source_field: UserAnswer.id }
    ai_intervention: { namespace: ai_intervention, source_field: AIIntervention.id }
    prompt_design: { namespace: prompt_assessment, source_field: PromptAssessment.id }
    interaction_materialized: { namespace: learning_event_payload, source_field: InteractionLog.id, proof: explicit context provenance or sourceEventId/clientEventId join }
    path_event_pattern: { namespace: path_event_key, fact_type_suffix: _recorded, relational_lookup: false }
    simulation_run_prefixed: { namespace: simulation_run, source_field: SimulationRun.id, value_prefix: 'SimulationRun:' }
    agent_tool_run_prefixed: { namespace: agent_tool_run, source_field: AgentToolRun.id, value_prefix: 'AgentToolRun:' }
    arena_official: { namespace: arena_submission, source_field: ArenaSubmission.id, proof: contextJson.arena.official and matching sourceEventId lineage }
    adaptive_assessment_prefixed: { namespace: adaptive_assessment_answer, source_field: AdaptiveAssessmentAnswer.id, value_prefix: 'adaptive-assessment:' }
  unknown_or_ambiguous_source_log_namespace: unresolved
  both_source_ids_rule: when sourceLogId and sourceEventId coexist, their namespace-specific lookup and governed event identity must resolve to the same event lineage; disagreement is blocked
  missing_source_identity_rule: evidence without a governed source identity is unresolved and is never auto-deduplicated by knowledge ID or timestamp alone
  authoritative_time_priority:
    materialized_fact: [LearningFact.startedAt]
    event_batch: [LearningEvent.occurredAt]
    interaction_log: [InteractionLog.clientEventAt, InteractionLog.createdAt]
  time_normalization: parse a valid timezone-bearing timestamp and normalize to UTC milliseconds; invalid timestamps are unresolved
  time_conflict_rule: the same governed source identity with conflicting normalized event time, evidence role, learner, or authoritative lineage is blocked rather than merged
  deduplication_key: [source_identity_namespace, governed_source_identity, normalized_event_time, learner_identity, evidence_role_or_fact_type, authoritative_lineage, canonical_destination]
  prohibited_shortcut: mapped canonical knowledge identity alone never establishes duplicate evidence

decoder_common_contract:
  schema_version: decoder-common/v1
  applies_to: every entry in decoder_contracts
  selector_language: JSONPath
  payload_version_selector: $.schemaVersion
  accepted_version_rule: explicit versions and database-observed legacy shape classes must be enumerated by the synthetic-history-payload-shapes/v1 fixture manifest
  missing_version_rule: accept only an exact enumerated legacy shape digest; otherwise fail
  required_fixture_profile: synthetic-history-payload-shapes/v1
  fixture_privacy_rule: repository fixtures are wholly synthetic and structurally equivalent; real payload validation runs only against a controlled database snapshot
  unknown_version: fail
  unknown_discriminator: unresolved_and_fail_readiness
  unknown_id_bearing_field: fail
  non_reference_unknown_fields: preserve_without_digesting_learner_content
  schema_digest_rule: digest normalized schema_source files, selectors, namespaces, joins, and failure rules

