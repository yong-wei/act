    item_kind: active_reference
    identity_namespace: field_decoder_required
    privacy: schema_count_aggregate_only
    inclusion_rule: include only progress, note, and LearningPath references where pathStatus != completed and a current business reader still reads or continues that path at cutover
    exclusion_rule: exclude completed LearningPath rows and every historical fact, event, execution, deviation, intervention, or derived-state row
    current_business_readers:
      - src/app/api/learning-paths/route-helpers.ts
      - src/app/api/learning-paths/latest/route.ts
      - src/app/api/learning-paths/[id]/journey/route.ts
    readiness_tables: [KnowledgeProgress, LearningPath, LearningNote]
    readiness_fields:
      KnowledgeProgress: [nodeId]
      LearningPath: [pathStatus, nodeIds, currentNodeId, entryNodeId, pathPayload]
      LearningNote: [nodeId]
    path_status_rule: include exactly when pathStatus != completed and at least one declared current_business_reader reads or continues the row; completed paths are excluded regardless of retained payloads
decoder_common_contract:
  schema_version: active-reference-decoder-common/v1
  applies_to: [learning-path-payload/v1]
  selector_language: JSONPath
  scope_rule: decode only LearningPath rows admitted by the closed active-path predicate
  unknown_id_bearing_field: fail_bounded_active_reference
  schema_digest_rule: digest normalized schema_source, selectors, namespaces, joins, and the active-path predicate

