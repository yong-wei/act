    required_future_disposition:
      - retire
      - authoring_workflow
      - projection_only
    static_discovery:
      roots:
        - src
        - scripts
        - course-content
      exclude:
        - '**/__tests__/**'
        - '**/*.test.*'
        - scripts/tests/**
      prisma_mutations:
        - KnowledgeNode
        - KnowledgeLink
        - LessonItem.knowledgeNodeId
        - TeachingResource.knowledgeNodes
        - LearningPath
        - LearningPathExecution
        - LearningPathDeviation
        - LearningPathIntervention
        - LearningFact
        - InteractionLog
        - LearningEventBatch
        - KnowledgeProgress
        - LearningNote
