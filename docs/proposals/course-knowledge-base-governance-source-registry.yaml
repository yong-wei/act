  - source_field: TeachingResource.knowledgeNodes
    item_kind: instructional_reference
    identity_namespace: canonical_knowledge_node
  - source_field: KnowledgeProgress.nodeId
    item_kind: active_reference
    identity_namespace: canonical_knowledge_node
  - source_field: LearningNote.nodeId
    item_kind: active_reference
    identity_namespace: canonical_knowledge_node
  - source_field: LearningPath.nodeIds
    item_kind: active_reference
