    missing: record
  - id: lesson-projection-producers
    item_kind: projection_producer
    identity_namespace: repository_path
    include:
      - course-content/scripts/review_lesson_content.py
      - course-content/scripts/export_runtime.py
    missing: fail
  - id: lesson-runtime-evidence
    item_kind: runtime_projection_evidence
    identity_namespace: course_runtime
    include:
      - course-content/runtime/lessons/**/lesson.json
      - course-content/runtime/lessons/**/*-handout.md
      - course-content/runtime/lessons/**/*-handout.pdf
      - course-content/runtime/lessons/**/interactive-manifest.json
      - course-content/runtime/lessons/**/graph-overlay.json
      - course-content/runtime/lessons/**/review/*-boppps.md
      - course-content/runtime/lessons/**/review/*.json
      - course-content/runtime/lessons/**/media/**
