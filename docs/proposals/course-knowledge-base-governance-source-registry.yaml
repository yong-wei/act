failure_rules:
  - unknown item_kind, identity_namespace, or source_field combination fails
  - mixed_path_node_ref without an explicit discriminator remains unresolved and cannot map to a canonical knowledge node
  - mixed_evidence_ref is allowed only for an enumerated non-knowledge discriminator; unknown discriminator values remain unresolved and fail readiness
  - equal source_id values in different namespaces remain distinct
  - missing required sources fail; optional missing sources emit deterministic missing records
  - every declared Prisma table and field must exist in the current DMMF; schema drift fails before inventory reads
  - JSON selectors and decoders are schema-aware; unknown payload shapes and discriminator values fail closed
  - every field_decoders json_decoder resolves to one decoder_contract whose schema source exists and participates in its digest
  - replayable event payloads cannot be replayed until every old knowledge reference is remapped or the producer is retired
  - a LearningFact without one resolvable immutable knowledge revision, or with more than one active revision, fails cutover readiness; legacy-unversioned records preserve uncertainty and never alias the current revision
  - static writer discovery and the direct-write registry must reconcile bidirectionally
