      class_aggregate: { table: ClassCompetencySnapshot, watermark: snapshotAt, version_fields: [materializationVersion], database_audit_key: [classId, snapshotAt], database_only_audit_fields: [aggregateJson, distributionJson, trendJson, riskSummaryJson, levelDistribution] }
