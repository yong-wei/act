<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>控制理论交互地图 - MVP</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --panel-bg: #1e293b;
            --text-primary: #f8fafc;
            --text-secondary: #94a3b8;
            --accent: #38bdf8;
            --success: #4ade80;
        }
        body { margin: 0; overflow: hidden; font-family: 'Segoe UI', system-ui, sans-serif; background: var(--bg-color); color: var(--text-primary); }
        
        /* 地图容器 */
        #map-container { width: 100vw; height: 100vh; position: relative; cursor: grab; }
        .node {
            position: absolute;
            width: 120px;
            height: 120px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            background: rgba(30, 41, 59, 0.8);
            border: 2px solid var(--text-secondary);
            cursor: pointer;
            transition: all 0.3s ease;
            font-weight: bold;
            font-size: 14px;
            backdrop-filter: blur(4px);
            user-select: none;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
        }
        .node:hover { transform: scale(1.1); border-color: var(--accent); z-index: 10; box-shadow: 0 0 15px var(--accent); }
        .node.active { border-color: var(--success); box-shadow: 0 0 20px var(--success); }

        /* 连接线 SVG */
        #connections { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; }
        line { stroke: #334155; stroke-width: 2; }

        /* 侧边栏 */
        #sidebar {
            position: fixed; top: 0; right: -450px; width: 400px; height: 100%;
            background: var(--panel-bg);
            box-shadow: -5px 0 15px rgba(0,0,0,0.5);
            transition: right 0.4s cubic-bezier(0.16, 1, 0.3, 1);
            padding: 20px; overflow-y: auto;
            border-left: 1px solid #334155;
            z-index: 100;
        }
        #sidebar.open { right: 0; }
        .close-btn { position: absolute; top: 15px; right: 20px; cursor: pointer; font-size: 24px; color: var(--text-secondary); }
        
        /* 仿真器样式 */
        .sim-container { background: #0f172a; border-radius: 8px; padding: 15px; margin-top: 20px; border: 1px solid #334155; }
        canvas#sim-canvas { width: 100%; height: 200px; background: #000; border-radius: 4px; }
        .controls { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 10px; margin-top: 15px; }
        .slider-group { text-align: center; }
        input[type=range] { width: 100%; accent-color: var(--accent); }
        .value-display { font-family: monospace; color: var(--accent); font-size: 12px; }

        h2 { margin-top: 0; border-bottom: 1px solid #334155; padding-bottom: 10px; }
        p { line-height: 1.6; color: var(--text-secondary); font-size: 14px; }
        .tag { display: inline-block; padding: 2px 8px; border-radius: 4px; background: #334155; font-size: 12px; margin-right: 5px; }
    </style>
</head>
<body>

    <svg id="connections"></svg>
    
    <div id="map-container">
        </div>

    <div id="sidebar">
        <div class="close-btn" onclick="closeSidebar()">&times;</div>
        <div id="sidebar-content">
            <h2 style="color: #64748b; margin-top: 50px; text-align: center;">点击节点探索<br>控制宇宙</h2>
        </div>
    </div>

    <script>
        // --- 数据定义 ---
        const nodes = [
            { id: 'sys', label: '系统分析\nSystem Analysis', x: 50, y: 50, type: 'category' },
            { id: 'model', label: '建模与仿真\nModeling', x: 70, y: 20, type: 'category' },
            { id: 'linear', label: '线性控制\nLinear Control', x: 30, y: 30, type: 'category' },
            { id: 'pid', label: 'PID控制\nPID Control', x: 20, y: 45, parent: 'linear', type: 'tech' },
            { id: 'lqr', label: 'LQR', x: 40, y: 15, parent: 'linear', type: 'tech' },
            { id: 'freq', label: '频域分析\nFrequency', x: 60, y: 70, parent: 'sys', type: 'tech' },
            { id: 'state', label: '状态空间\nState Space', x: 80, y: 40, parent: 'model', type: 'tech' }
        ];

        const links = [
            { from: 'sys', to: 'model' },
            { from: 'sys', to: 'linear' },
            { from: 'linear', to: 'pid' },
            { from: 'linear', to: 'lqr' },
            { from: 'sys', to: 'freq' },
            { from: 'model', to: 'state' }
        ];

        // --- 初始化地图 ---
        const container = document.getElementById('map-container');
        const svg = document.getElementById('connections');
        const width = window.innerWidth;
        const height = window.innerHeight;

        // 简单的坐标映射 (将 0-100 的坐标映射到屏幕)
        function mapX(x) { return (x / 100) * (width * 0.8) + width * 0.1; }
        function mapY(y) { return (y / 100) * (height * 0.8) + height * 0.1; }

        // 绘制连线
        links.forEach(link => {
            const n1 = nodes.find(n => n.id === link.from);
            const n2 = nodes.find(n => n.id === link.to);
            const line = document.createElementNS('http://www.w3.org/2000/svg', 'line');
            line.setAttribute('x1', mapX(n1.x));
            line.setAttribute('y1', mapY(n1.y));
            line.setAttribute('x2', mapX(n2.x));
            line.setAttribute('y2', mapY(n2.y));
            svg.appendChild(line);
        });

        // 绘制节点
        nodes.forEach(node => {
            const el = document.createElement('div');
            el.className = `node ${node.type}`;
            el.style.left = (mapX(node.x) - 60) + 'px'; // Center offset
            el.style.top = (mapY(node.y) - 60) + 'px';
            el.innerText = node.label;
            el.onclick = () => openNode(node);
            container.appendChild(el);
        });

        // --- 交互逻辑 ---
        function closeSidebar() {
            document.getElementById('sidebar').classList.remove('open');
            document.querySelectorAll('.node').forEach(n => n.classList.remove('active'));
        }

        function openNode(node) {
            const sidebar = document.getElementById('sidebar');
            const content = document.getElementById('sidebar-content');
            
            document.querySelectorAll('.node').forEach(n => n.classList.remove('active'));
            event.currentTarget.classList.add('active');

            let html = `<h2>${node.label.replace('\n', ' - ')}</h2>`;
            
            if (node.id === 'pid') {
                // PID 专属内容
                html += `
                    <p><span class="tag">经典控制</span> <span class="tag">SISO</span></p>
                    <p>比例-积分-微分控制器（PID控制器）是工业控制应用中最常见的反馈回路部件。</p>
                    <div class="sim-container">
                        <div style="display:flex; justify-content:space-between; margin-bottom:5px;">
                            <small>Step Response Simulation</small>
                            <small id="status" style="color:#4ade80">Running</small>
                        </div>
                        <canvas id="sim-canvas"></canvas>
                        <div class="controls">
                            <div class="slider-group">
                                <label>Kp</label>
                                <input type="range" min="0" max="5" step="0.1" value="1.0" id="kp">
                                <div class="value-display" id="val-kp">1.0</div>
                            </div>
                            <div class="slider-group">
                                <label>Ki</label>
                                <input type="range" min="0" max="2" step="0.01" value="0.0" id="ki">
                                <div class="value-display" id="val-ki">0.0</div>
                            </div>
                            <div class="slider-group">
                                <label>Kd</label>
                                <input type="range" min="0" max="5" step="0.1" value="0.5" id="kd">
                                <div class="value-display" id="val-kd">0.5</div>
                            </div>
                        </div>
                        <p style="font-size:12px; margin-top:10px;">试试看：增加 Ki 来消除稳态误差，增加 Kd 来抑制超调。</p>
                    </div>
                `;
                content.innerHTML = html;
                sidebar.classList.add('open');
                startPIDSim(); // 启动 PID 仿真
            } else {
                // 通用内容
                html += `<p>这是一个关于 ${node.label.split('\n')[0]} 的知识节点。</p>
                         <p>在完整版中，这里将展示详细的数学公式、代码示例以及该技术在工程中的实际应用案例。</p>`;
                content.innerHTML = html;
                sidebar.classList.add('open');
            }
        }

        // --- PID 仿真引擎 ---
        let simInterval;
        function startPIDSim() {
            if (simInterval) clearInterval(simInterval);
            
            const canvas = document.getElementById('sim-canvas');
            const ctx = canvas.getContext('2d');
            const width = canvas.width = canvas.offsetWidth;
            const height = canvas.height = canvas.offsetHeight;
            
            // 系统状态
            let setpoint = height / 2;
            let y = height - 20; // 当前位置
            let velocity = 0;
            let integral = 0;
            let lastError = 0;
            
            // 历史数据用于绘图
            let history = []; 
            let t = 0;

            // 绑定滑块
            const kpInput = document.getElementById('kp');
            const kiInput = document.getElementById('ki');
            const kdInput = document.getElementById('kd');

            // 更新显示值
            [kpInput, kiInput, kdInput].forEach(input => {
                input.oninput = () => document.getElementById(`val-${input.id}`).innerText = input.value;
            });

            simInterval = setInterval(() => {
                const Kp = parseFloat(kpInput.value);
                const Ki = parseFloat(kiInput.value);
                const Kd = parseFloat(kdInput.value);

                // 物理模型 (简单的二阶系统)
                const error = setpoint - y;
                integral += error * 0.1; 
                // 防止积分饱和
                if(integral > 100) integral = 100; 
                if(integral < -100) integral = -100;
                
                const derivative = (error - lastError) / 0.1;
                
                // PID 输出 (力)
                const output = Kp * error + Ki * integral + Kd * derivative;
                
                // 应用力到物体 (F=ma)
                velocity += output * 0.05; // 质量/惯性影响
                velocity *= 0.95; // 阻尼/摩擦
                y += velocity;

                lastError = error;

                // 记录历史
                history.push(y);
                if (history.length > width) history.shift();

                // 绘图
                ctx.clearRect(0, 0, width, height);
                
                // 绘制目标线
                ctx.strokeStyle = '#4ade80'; // Green
                ctx.setLineDash([5, 5]);
                ctx.beginPath();
                ctx.moveTo(0, setpoint);
                ctx.lineTo(width, setpoint);
                ctx.stroke();
                ctx.setLineDash([]);

                // 绘制响应曲线
                ctx.strokeStyle = '#38bdf8'; // Blue
                ctx.lineWidth = 2;
                ctx.beginPath();
                for (let i = 0; i < history.length; i++) {
                    ctx.lineTo(i, history[i]);
                }
                ctx.stroke();

                // 绘制当前小球
                ctx.fillStyle = '#f43f5e';
                ctx.beginPath();
                ctx.arc(history.length - 1, y, 6, 0, Math.PI * 2);
                ctx.fill();

            }, 20); // 50fps
        }
    </script>
</body>
</html>
