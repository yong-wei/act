[mcp_servers.chrome-devtools]
command = "npx"
args = ["chrome-devtools-mcp@latest"]

[mcp_servers.code-review-graph]
command = "code-review-graph"
args = ["serve"]

[mcp_servers.codegraph]
command = "codegraph"
args = [
    "serve",
    "--mcp",
]

