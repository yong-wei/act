# Project-level Codex subagent defaults.
# Keep this file small. Project facts and workflow rules belong in AGENTS.md.

[agents]
# Enough for a full branch review without uncontrolled fan-out.
max_threads = 6

# Root session may spawn direct children; child agents must not spawn grandchildren.
max_depth = 1

# Per-worker timeout for spawn_agents_on_csv or similar batch jobs.
job_max_runtime_seconds = 2400
